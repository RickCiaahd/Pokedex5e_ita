name: Probe Trainer Atlas 1.3.2 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/probe-v1.3.2-release.yml'

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Report current release runs
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh run list \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId,name,headBranch,headSha,status,conclusion,url \
            --jq '[.[] | select(.headBranch == "v1.3.2")]')
          body=$(printf '### Stato build release 1.3.2\n\n```json\n%s\n```' "$runs")
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${{ github.repository }}/issues/136/comments" \
            -f body="$body"
