name: Apply Battle Companion party picker

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/apply_battle_party_picker.py
      - .github/workflows/apply-battle-party-picker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply party picker
        run: python tool/apply_battle_party_picker.py

      - name: Format Battle Companion
        run: dart format lib/screens/battle/battle_screen.dart

      - name: Analyze source
        run: flutter analyze

      - name: Commit party picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/battle/battle_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sostituisci la barra squadra con un selettore Pokémon"
          git push origin HEAD:feature/compact-pokemon-detail-v2
