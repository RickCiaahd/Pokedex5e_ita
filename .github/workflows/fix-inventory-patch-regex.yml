name: Fix onboarding and inventory cart details

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/fix_inventory_patch_regex.py
      - .github/workflows/fix-inventory-patch-regex.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply fixes
        run: python tool/fix_inventory_patch_regex.py

      - name: Format
        run: dart format lib/screens/onboarding/first_launch_onboarding_screen.dart lib/screens/bag/bag_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Targeted tests
        run: |
          flutter test test/trainer_manual_identity_fields_test.dart
          flutter test test/battle_quick_item_service_test.dart

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/screens/onboarding/first_launch_onboarding_screen.dart \
            lib/screens/bag/bag_screen.dart
          git commit -m "Correggi completamento onboarding e carrello"
          git push origin HEAD:feature/compact-pokemon-detail-v2
