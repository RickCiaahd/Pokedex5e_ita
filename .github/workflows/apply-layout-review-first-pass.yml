name: Apply layout review first pass

on:
  push:
    branches:
      - polish/layout-shell-team

permissions:
  contents: write

concurrency:
  group: layout-review-first-pass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[layout-first-pass-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: polish/layout-shell-team
          fetch-depth: 0

      - name: Apply layout review
        run: python tool/apply_layout_review_first_pass.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/widgets/layout/responsive_content.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/profile/profiles_screen.dart \
            lib/screens/tools/encounter_library_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            test/responsive_content_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run responsive layout tests
        run: flutter test test/responsive_content_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit verified layout review
        run: |
          rm -f tool/apply_layout_review_first_pass.py .github/workflows/apply-layout-review-first-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Avvia la review responsiva del layout [layout-first-pass-applied]"
          git push origin HEAD:polish/layout-shell-team
