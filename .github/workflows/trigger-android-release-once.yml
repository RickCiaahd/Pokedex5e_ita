name: Trigger Android release once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/trigger-android-release-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/android-release.yml/dispatches \
            -f ref=main
