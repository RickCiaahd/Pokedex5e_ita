name: Run detail and form fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/evolution-form-detail-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/evolution-form-detail-sync
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Detect pending patch
        id: patch
        shell: bash
        run: |
          if test -f tool/apply_detail_form_fixes.py; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.patch.outputs.pending == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply targeted patch
        if: steps.patch.outputs.pending == 'true'
        shell: bash
        run: |
          set +e
          python tool/apply_detail_form_fixes.py 2>&1 | tee /tmp/detail-form-fix-error.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p docs
            cp /tmp/detail-form-fix-error.log docs/detail-form-fix-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/detail-form-fix-error.log
            git commit -m 'Registra errore applicazione correzioni forme'
            git push origin HEAD:fix/evolution-form-detail-sync
            exit "$status"
          fi
          rm -f \
            tool/apply_detail_form_fixes.py \
            .github/workflows/apply-detail-form-fixes.yml \
            .github/workflows/retry-detail-form-fixes.yml \
            docs/detail-form-fix-error.log

      - name: Format changed Dart files
        if: steps.patch.outputs.pending == 'true'
        run: |
          dart format \
            lib/screens/pokemon/pokemon_detail_screen.dart \
            lib/screens/pokemon/pokemon_detail_screen_legacy.dart \
            lib/repositories/evolution_repository.dart \
            test/evolution_repository_regression_test.dart

      - name: Install dependencies
        if: steps.patch.outputs.pending == 'true'
        run: flutter pub get

      - name: Analyze source
        if: steps.patch.outputs.pending == 'true'
        run: flutter analyze

      - name: Run focused regression tests
        if: steps.patch.outputs.pending == 'true'
        run: flutter test test/evolution_repository_regression_test.dart --reporter expanded

      - name: Commit and push fixes
        if: steps.patch.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregge evoluzioni, forme regionali e sprite squadra'
          git push origin HEAD:fix/evolution-form-detail-sync
