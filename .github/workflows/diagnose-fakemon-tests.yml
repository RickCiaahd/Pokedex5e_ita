name: Diagnose Fakemon advanced tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/fakemon-advanced'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-advanced
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run complete suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          flutter test --reporter expanded 2>&1 | tee fakemon-advanced-tests.log
          exit ${PIPESTATUS[0]}

      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fakemon-advanced-test-diagnostic
          path: fakemon-advanced-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
