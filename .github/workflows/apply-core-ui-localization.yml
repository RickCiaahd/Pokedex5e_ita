name: Apply core UI localization

on:
  push:
    branches:
      - feature/complete-ui-localization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-ui-localization
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-ui-localization
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply and validate localization
        shell: bash
        run: |
          set +e
          log=core-ui-localization.log
          : > "$log"

          run_step() {
            echo "" | tee -a "$log"
            echo "> $*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            return ${PIPESTATUS[0]}
          }

          python - <<'PY' >> "$log" 2>&1
          from pathlib import Path

          path = Path('tooling/apply_core_ui_localization.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "    new_tail + '}',\n",
              "    lambda _match: new_tail + '}',\n",
              1,
          )
          text = text.replace(
              "    new_type_block + '  static PokemonFormChoice? _formChoiceFromAssetPath',\n",
              "    lambda _match: new_type_block + '  static PokemonFormChoice? _formChoiceFromAssetPath',\n",
              1,
          )

          bad_import = '''text = add_import(
    text,
    "class TrainerUiLocalization {\\n",
    "import '../localization/game_catalog_locale.dart';\\n\\n",
)
'''
          good_import = '''if "import '../localization/game_catalog_locale.dart';" not in text:
    text = "import '../localization/game_catalog_locale.dart';\\n\\n" + text
'''
          if bad_import not in text:
              raise RuntimeError('Blocco import TrainerUiLocalization non trovato')
          text = text.replace(bad_import, good_import, 1)

          turn_marker = "text = replace_once(\n    text,\n    \"                  ? 'Nessun turno impostato.'"
          if turn_marker in text:
              start = text.index(turn_marker)
              end_marker = "    'turno corrente',\n)\n"
              end = text.index(end_marker, start) + len(end_marker)
              replacement = '''text = replace_once(
    text,
    "'Turno: ${currentEntry.name}'",
    "context.uiText('Turno: ${currentEntry.name}', 'Turn: ${currentEntry.name}')",
    'turno corrente',
)
'''
              text = text[:start] + replacement + text[end:]

          order_marker = "text = replace_once(\n    text,\n    \"              'Ordine e comandi"
          if order_marker in text:
              start = text.index(order_marker)
              end_marker = "    'ordine iniziativa',\n)\n"
              end = text.index(end_marker, start) + len(end_marker)
              replacement = '''text = replace_once(
    text,
    "'Ordine e comandi (${entries.length})'",
    "context.uiText('Ordine e comandi (${entries.length})', 'Order and commands (${entries.length})')",
    'ordine iniziativa',
)
'''
              text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
          status=$?

          if [ "$status" -eq 0 ]; then
            run_step python tooling/apply_core_ui_localization.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter pub get || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step dart format \
              lib/localization/ui_text.dart \
              lib/models/trainer_ui_localization.dart \
              lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
              lib/widgets/pokedex/pokemon_summary_dialog.dart \
              lib/screens/battle/battle_screen.dart \
              lib/screens/trainer/trainer_sheet_screen.dart \
              lib/screens/tools/tools_screen.dart \
              test/secondary_ui_localization_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter analyze || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter test test/secondary_ui_localization_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter test test/trainer_ui_localization_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter test test/localized_game_catalogs_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter test || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step flutter build apk --debug || status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp "$log" diagnostics/core-ui-localization-error.txt
            git add diagnostics/core-ui-localization-error.txt
            git commit -m "Registra l'errore della localizzazione UI [skip ci]" || true
            git push origin HEAD:feature/complete-ui-localization
            exit "$status"
          fi

          rm -f diagnostics/core-ui-localization-error.txt
          git add \
            lib/localization/ui_text.dart \
            lib/models/trainer_ui_localization.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            lib/widgets/pokedex/pokemon_summary_dialog.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/screens/tools/tools_screen.dart \
            test/secondary_ui_localization_test.dart
          git commit -m "Localizza le schermate principali rimaste [skip ci]"
          git push origin HEAD:feature/complete-ui-localization
