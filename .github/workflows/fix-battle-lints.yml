name: Fix Battle Companion lints

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-battle-lints.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix missing braces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/battle/battle_screen.dart')
          text = path.read_text(encoding='utf-8')

          replacements = {
              """      if (updatedHp != currentHp)\n        hpText = 'recupera ${updatedHp - currentHp} HP';\n""":
              """      if (updatedHp != currentHp) {\n        hpText = 'recupera ${updatedHp - currentHp} HP';\n      }\n""",
              """      if (a.isTrainerGroup != b.isTrainerGroup)\n        return a.isTrainerGroup ? -1 : 1;\n""":
              """      if (a.isTrainerGroup != b.isTrainerGroup) {\n        return a.isTrainerGroup ? -1 : 1;\n      }\n""",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected block not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format file
        run: dart format lib/screens/battle/battle_screen.dart

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-battle-lints.yml

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Battle Companion lint warnings"
          git push origin main
