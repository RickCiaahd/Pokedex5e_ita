name: Fix form assets and UI

on:
  push:
    paths:
      - '.github/workflows/fix-form-assets-ui.yml'

permissions:
  contents: write

jobs:
  fix-form-assets-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrections and capture diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          mkdir -p docs/diagnostics
          log='docs/diagnostics/form-assets-ui-fix.log'
          : > "$log"

          {
            old_zygarde='assets/textures/textures_webapp/pokemon/zygarde-50-forme'
            new_zygarde='assets/textures/textures_webapp/pokemon/zygarde'
            if [ -d "$old_zygarde" ]; then
              if [ -d "$new_zygarde" ]; then
                cp -a "$old_zygarde"/. "$new_zygarde"/
                rm -rf "$old_zygarde"
              else
                git mv "$old_zygarde" "$new_zygarde"
              fi
            fi
            sed -i 's#pokemon/zygarde-50-forme/#pokemon/zygarde/#g' pubspec.yaml

            aegislash='assets/textures/textures_webapp/pokemon/aegislash'
            mkdir -p "$aegislash"
            curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10026.png' \
              --output "$aegislash/main.png"
            curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/10026.png' \
              --output "$aegislash/main-shiny.png"
            curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/10026.png' \
              --output "$aegislash/sprite.png"
            curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/10026.png' \
              --output "$aegislash/sprite-shiny.png"

            python .github/scripts/fix_form_assets_ui.py
          } >> "$log" 2>&1
          status=$?
          echo "patch_status=$status" >> "$log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.patch.outputs.status }}'
          rm -f \
            .github/workflows/fix-form-assets-ui.yml \
            .github/workflows/trigger-form-assets-ui.yml
          if [ "$status" = '0' ]; then
            rm -f .github/scripts/fix_form_assets_ui.py
            rm -f docs/diagnostics/form-assets-ui-fix.log
            rmdir docs/diagnostics 2>/dev/null || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Applica correzione immagini e forme (stato $status)"
          git push origin HEAD:main
