name: Fix remaining lints once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Battle Companion lints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/battle/battle_screen.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "        if (move != null && slot.pokemonId != null) {\n          final basePokemon = data.pokemonById[slot.pokemonId!];",
                  "        if (move != null) {\n          final basePokemon = data.pokemonById[slot.pokemonId];",
              ),
              (
                  "                final details = <String>[\n                  if (effect != null) effect,",
                  "                final details = <String>[\n                  ?effect,",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Format touched Dart files
        run: dart format lib/screens/bag/bag_screen_actions.dart lib/screens/bag/bag_screen_item_use.dart lib/screens/battle/battle_screen.dart

      - name: Verify strict analyzer
        run: flutter analyze

      - name: Commit lint fixes
        shell: bash
        run: |
          if git diff --quiet -- lib/screens/bag/bag_screen_actions.dart lib/screens/bag/bag_screen_item_use.dart lib/screens/battle/battle_screen.dart; then
            echo "No lint fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/bag/bag_screen_actions.dart lib/screens/bag/bag_screen_item_use.dart lib/screens/battle/battle_screen.dart
          git commit -m "Risolvi i lint residui della PR compatta"
          git push origin HEAD:feature/compact-pokemon-detail-v2
