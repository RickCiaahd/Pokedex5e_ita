name: Apply targeted Pokemon transfers

on:
  push:
    branches:
      - feature/targeted-pokemon-team-transfer
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: targeted-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.title, '[targeted-transfer-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/targeted-pokemon-team-transfer
          fetch-depth: 0

      - name: Apply UI integration
        run: python tool/apply_targeted_transfer.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/pokemon_transfer_bundle.dart \
            lib/services/pokemon_transfer_service.dart \
            lib/screens/team/team_selection_screen.dart \
            test/pokemon_transfer_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified transfer feature
        run: |
          rm -f tool/apply_targeted_transfer.py .github/workflows/apply-targeted-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge trasferimenti mirati di Pokémon e squadre [targeted-transfer-applied]"
          git push origin HEAD:feature/targeted-pokemon-team-transfer
