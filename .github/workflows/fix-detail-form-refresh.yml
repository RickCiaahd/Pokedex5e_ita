name: Fix Pokemon detail form refresh

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-detail-form-refresh.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix stale Pokemon artwork after form changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/pokemon/pokemon_asset_image.dart')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "import '../../models/pokemon_form_preferences.dart';\n",
              '',
              1,
          )

          old_preferences = """    final effectiveFormName =
        formName ?? PokemonFormPreferences.formFor(pokemon.id);
    final effectiveGender =
        gender ?? PokemonFormPreferences.genderFor(pokemon.id);
    final effectiveShiny =
        isShiny ?? PokemonFormPreferences.shinyFor(pokemon.id);
"""
          new_preferences = """    final effectiveFormName = formName;
    final effectiveGender = gender;
    final effectiveShiny = isShiny ?? false;
"""
          if old_preferences not in text:
              raise SystemExit('Pokemon form preference block not found')
          text = text.replace(old_preferences, new_preferences, 1)

          old_image = """    Widget image = _AssetFallbackImage(
      assetPaths: PokemonAssetPaths.imageCandidates(
"""
          new_image = """    Widget image = _AssetFallbackImage(
      key: ValueKey<String>(
        '${pokemon.id}|${pokemon.assetSlug ?? ''}|${effectiveFormName ?? 'base'}|${effectiveGender ?? 'none'}|$effectiveShiny|$useLargeArtwork',
      ),
      assetPaths: PokemonAssetPaths.imageCandidates(
"""
          if old_image not in text:
              raise SystemExit('Pokemon asset image block not found')
          text = text.replace(old_image, new_image, 1)

          old_constructor = """  const _AssetFallbackImage({
    required this.assetPaths,
"""
          new_constructor = """  const _AssetFallbackImage({
    super.key,
    required this.assetPaths,
"""
          if old_constructor not in text:
              raise SystemExit('Asset fallback constructor not found')
          text = text.replace(old_constructor, new_constructor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed file
        run: dart format lib/widgets/pokemon/pokemon_asset_image.dart

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run Pokemon form tests
        run: flutter test test/pokemon_form_mechanics_test.dart test/pokemon_asset_paths_test.dart

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-detail-form-refresh.yml

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Pokemon artwork after form changes"
          git push origin main
