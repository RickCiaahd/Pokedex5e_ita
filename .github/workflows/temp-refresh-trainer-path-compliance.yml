name: Temporary refresh trainer path compliance

on:
  push:
    branches:
      - fix/trainer-path-english-descriptions
    paths:
      - .github/workflows/temp-refresh-trainer-path-compliance.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Generate the official compliance reports
        run: python tooling/generate_compliance_reports.py
      - name: Validate the generated reports
        run: python tooling/generate_compliance_reports.py --check
      - name: Commit only updated asset compliance reports
        run: |
          git add docs/compliance/asset-manifest.csv docs/compliance/asset-audit-summary.md
          if git diff --cached --quiet; then
            echo "No generated report changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh trainer path asset compliance reports"
          git push origin HEAD:fix/trainer-path-english-descriptions
