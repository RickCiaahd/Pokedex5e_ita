name: Apply onboarding asset skeleton

on:
  push:
    branches:
      - fix/onboarding-asset-skeleton
    paths:
      - '.github/workflows/apply-onboarding-asset-skeleton.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/onboarding-asset-skeleton
          fetch-depth: 0

      - name: Build clean onboarding skeleton
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/screens/onboarding/first_launch_onboarding_screen_impl.dart')
          target = Path('lib/screens/onboarding/first_launch_onboarding_screen.dart')
          text = source.read_text(encoding='utf-8')

          old_factors = '''    final compactCardFactor = switch (_step) {
      6 => .19,
      7 || 8 || 9 => .24,
      _ => .41,
    };'''
          new_factors = '''    final compactCardFactor = switch (_step) {
      6 => .46,
      7 => .42,
      8 || 9 => .54,
      _ => .55,
    };'''
          if text.count(old_factors) != 1:
              raise SystemExit('Fattori della card onboarding inattesi')
          text = text.replace(old_factors, new_factors, 1)

          def replace_section(value: str, start: str, end: str, replacement: str) -> str:
              start_index = value.index(start)
              end_index = value.index(end, start_index)
              return value[:start_index] + replacement.rstrip() + '\n\n' + value[end_index:]

