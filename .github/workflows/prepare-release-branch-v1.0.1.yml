name: Prepare release branch v1.0.1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-release-branch-v1.0.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    name: Update release/v1.0.1 metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release branch
        shell: bash
        run: |
          git fetch origin release/v1.0.1
          git checkout release/v1.0.1

          python3 - <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old in text:
                  file.write_text(text.replace(old, new), encoding='utf-8')

          replace_if_present('pubspec.yaml', 'version: 1.0.0+1', 'version: 1.0.1+2')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          text = text.replace(
              'Nessuna modifica successiva alla prima release.',
              'Nessuna modifica successiva alla release 1.0.1.',
              1,
          )
          text = text.replace(
              '## [1.0.0] - 2026-07-21',
              '## [1.0.1] - 2026-07-21',
              1,
          )
          historical = (
              '\n\n## [1.0.0]\n\n'
              'Tag storico creato durante lo sviluppo, precedente al consolidamento '
              'della localizzazione completa, delle forme e delle correzioni pre-release.\n'
          )
          if '\n## [1.0.0]\n' not in text:
              text = text.rstrip() + historical
          changelog.write_text(text.rstrip() + '\n', encoding='utf-8')

          replace_if_present(
              'docs/android-release.md',
              '- Versione iniziale: `1.0.0+1`',
              '- Versione corrente: `1.0.1+2`',
          )
          replace_if_present(
              'docs/android-release.md',
              'Creando un tag come `v1.0.0`',
              'Creando un tag come `v1.0.1`',
          )
          replace_if_present(
              'README.md',
              'per esempio `v1.0.0`',
              'per esempio `v1.0.1`',
          )
          replace_if_present(
              'docs/project-cleanup-audit.md',
              'release Android `1.0.0`',
              'release Android `1.0.1`',
          )
          PY

          if git diff --quiet; then
            echo 'Metadati release già aggiornati.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml CHANGELOG.md README.md docs/android-release.md docs/project-cleanup-audit.md
          git commit -m 'Prepara i metadati della release 1.0.1'
          git push origin HEAD:release/v1.0.1
