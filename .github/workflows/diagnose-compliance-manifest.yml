name: Refresh WebP pilot inventories

on:
  push:
    branches:
      - feature/webp-lossless-pilot
    paths:
      - '.github/workflows/diagnose-compliance-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-webp-pilot-inventories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: feature/webp-lossless-pilot
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate source inventories
        if: github.actor != 'github-actions[bot]'
        run: |
          test ! -e assets/data/GPL-3.0.txt
          test ! -e assets/data/NOTICE.txt
          python tooling/generate_compliance_reports.py
          python tooling/generate_asset_duplicates.py
          python tooling/generate_compliance_reports.py --check
          python tooling/generate_asset_duplicates.py --check
          git diff --check

      - name: Commit refreshed inventories
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/compliance/asset-manifest.csv \
            docs/compliance/asset-audit-summary.md \
            docs/performance/asset-duplicates.csv
          if git diff --cached --quiet; then
            echo 'Inventories are already current.'
            exit 0
          fi
          git commit -m 'Aggiorna gli inventari dopo il lotto WebP'
          git push origin HEAD:feature/webp-lossless-pilot
