name: Patch tour professor three-quarter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    name: Enlarge and crop tour professor
    if: github.event.pull_request.title == 'Mostra il Professore a tre quarti nei tour'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update professor layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/tour/guided_tour.dart')
          text = path.read_text(encoding='utf-8')

          old_width = '    final professorWidth = compact ? 82.0 : 116.0;'
          new_width = (
              '    final professorWidth = compact ? 112.0 : 168.0;\n'
              '    final professorHeight = compact ? 148.0 : 210.0;'
          )
          if text.count(old_width) != 1:
              raise SystemExit('La riga professorWidth non è stata trovata una sola volta.')
          text = text.replace(old_width, new_width, 1)

          start_marker = (
              '          SizedBox(\n'
              '            width: professorWidth,\n'
              '            height: compact ? 176 : 214,'
          )
          end_marker = '          Expanded('
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('L’inizio del blocco immagine del Professore non è stato trovato.')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('La fine del blocco immagine del Professore non è stata trovata.')

          replacement = (
              '          Transform.translate(\n'
              '            offset: const Offset(0, 8),\n'
              '            child: SizedBox(\n'
              '              width: professorWidth,\n'
              '              height: professorHeight,\n'
              '              child: ClipRect(\n'
              '                child: Image.asset(\n'
              '                  GuidedTourOverlay.professorAsset,\n'
              '                  fit: BoxFit.cover,\n'
              '                  alignment: Alignment.topCenter,\n'
              '                  errorBuilder: (_, _, _) => const Align(\n'
              '                    alignment: Alignment.bottomCenter,\n'
              '                    child: Icon(\n'
              '                      Icons.person,\n'
              '                      size: 78,\n'
              '                      color: Colors.white,\n'
              '                    ),\n'
              '                  ),\n'
              '                ),\n'
              '              ),\n'
              '            ),\n'
              '          ),\n'
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > test/guided_tour_professor_layout_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('il Professore del tour usa un ritaglio a tre quarti', () {
              final source = File(
                'lib/widgets/tour/guided_tour.dart',
              ).readAsStringSync();

              expect(source, contains('final professorWidth = compact ? 112.0 : 168.0;'));
              expect(source, contains('final professorHeight = compact ? 148.0 : 210.0;'));
              expect(source, contains('offset: const Offset(0, 8)'));
              expect(source, contains('fit: BoxFit.cover'));
              expect(source, contains('alignment: Alignment.topCenter'));
            });
          }
          DART

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: dart format lib/widgets/tour/guided_tour.dart test/guided_tour_professor_layout_test.dart

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/tour/guided_tour.dart test/guided_tour_professor_layout_test.dart
          git commit -m 'Mostra il Professore a tre quarti nei tour'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
