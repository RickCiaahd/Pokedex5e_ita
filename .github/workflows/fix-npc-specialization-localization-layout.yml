name: Fix NPC specialization localization and filter layout

on:
  push:
    branches:
      - fix/npc-specialization-localization-layout
    paths:
      - '.github/workflows/fix-npc-specialization-localization-layout.yml'

permissions:
  contents: write

concurrency:
  group: fix-npc-specialization-localization-layout
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/npc-specialization-localization-layout
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply UI corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Missing expected fragment in {path}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          encounter = Path('lib/screens/tools/encounter_generator_screen.dart')
          replace_once(
              encounter,
              'childrenPadding: const EdgeInsets.fromLTRB(16, 0, 16, 16),',
              'childrenPadding: const EdgeInsets.fromLTRB(16, 12, 16, 16),',
          )

          generator = Path('lib/screens/tools/npc_trainer_generator_screen.dart')
          replace_once(
              generator,
              "import '../../models/trainer_manual_options.dart';\n",
              "import '../../models/trainer_manual_options.dart';\nimport '../../models/trainer_ui_localization.dart';\n",
          )
          replace_once(
              generator,
              "  String get _specializationSummary {\n",
              "  List<String> get _localizedSpecializations {\n"
              "    final values = [..._specializations];\n"
              "    values.sort(\n"
              "      (a, b) => TrainerUiLocalization.specializationName(\n"
              "        a,\n"
              "      ).compareTo(TrainerUiLocalization.specializationName(b)),\n"
              "    );\n"
              "    return values;\n"
              "  }\n\n"
              "  String get _specializationSummary {\n",
          )
          replace_once(
              generator,
              "                          for (final specialization in _specializations)\n"
              "                            DropdownMenuItem(\n"
              "                              value: specialization,\n"
              "                              child: Text(specialization),\n"
              "                            ),",
              "                          for (final specialization in\n"
              "                              _localizedSpecializations)\n"
              "                            DropdownMenuItem(\n"
              "                              value: specialization,\n"
              "                              child: Text(\n"
              "                                TrainerUiLocalization.specializationName(\n"
              "                                  specialization,\n"
              "                                ),\n"
              "                              ),\n"
              "                            ),",
          )

          result = Path('lib/screens/tools/npc_trainer_result_screen.dart')
          replace_once(
              result,
              "import '../../models/trainer_manual_content.dart';\n",
              "import '../../models/trainer_manual_content.dart';\nimport '../../models/trainer_ui_localization.dart';\n",
          )
          replace_once(
              result,
              "  String _summaryText() {\n    final buffer = StringBuffer()",
              "  String _summaryText() {\n"
              "    final specializationLabels = _trainer.specializations\n"
              "        .map(TrainerUiLocalization.specializationName)\n"
              "        .join(', ');\n"
              "    final buffer = StringBuffer()",
          )
          replace_once(
              result,
              "          'Specializzazioni: ${_trainer.specializations.join(', ')}',\n"
              "          'Specializations: ${_trainer.specializations.join(', ')}',",
              "          'Specializzazioni: $specializationLabels',\n"
              "          'Specializations: $specializationLabels',",
          )
          replace_once(
              result,
              "  Widget build(BuildContext context) {\n    final colors = Theme.of(context).colorScheme;\n    return Card(\n      color: colors.primaryContainer,",
              "  Widget build(BuildContext context) {\n"
              "    final colors = Theme.of(context).colorScheme;\n"
              "    final specializationLabels = trainer.specializations\n"
              "        .map(TrainerUiLocalization.specializationName)\n"
              "        .join(' · ');\n"
              "    return Card(\n"
              "      color: colors.primaryContainer,",
          )
          replace_once(
              result,
              "                'Specializzazioni: ${trainer.specializations.join(' · ')}',\n"
              "                'Specializations: ${trainer.specializations.join(' · ')}',",
              "                'Specializzazioni: $specializationLabels',\n"
              "                'Specializations: $specializationLabels',",
          )

          library = Path('lib/screens/tools/npc_trainer_library_screen.dart')
          replace_once(
              library,
              "import '../../models/trainer_manual_options.dart';\n",
              "import '../../models/trainer_manual_options.dart';\nimport '../../models/trainer_ui_localization.dart';\n",
          )
          replace_once(
              library,
              "  Widget build(BuildContext context) {\n    return Card(\n      clipBehavior: Clip.antiAlias,",
              "  Widget build(BuildContext context) {\n"
              "    final specializationLabels = trainer.specializations\n"
              "        .map(TrainerUiLocalization.specializationName)\n"
              "        .join(', ');\n"
              "    return Card(\n"
              "      clipBehavior: Clip.antiAlias,",
          )
          replace_once(
              library,
              "'${context.usesItalianUi ? trainer.rank.label : trainer.rank.englishLabel} · Lv. ${trainer.trainerLevel} · ${trainer.specializations.join(', ')}',",
              "'${context.usesItalianUi ? trainer.rank.label : trainer.rank.englishLabel} · Lv. ${trainer.trainerLevel} · $specializationLabels',",
          )

          test = Path('test/npc_specialization_ui_localization_test.dart')
          test.write_text(
              """import 'dart:io';

import 'package:flutter_test/flutter_test.dart';
import 'package:pokedex_5e_ita/localization/game_catalog_locale.dart';
import 'package:pokedex_5e_ita/models/trainer_ui_localization.dart';

void main() {
  tearDown(() => GameCatalogLocale.setLanguageCode('it'));

  test('NPC specialization labels follow the selected language', () {
    GameCatalogLocale.setLanguageCode('it');
    expect(
      TrainerUiLocalization.specializationName('Bird Keeper'),
      'Avicoltore',
    );
    expect(
      TrainerUiLocalization.specializationName('Alchemist'),
      'Alchimista',
    );

    GameCatalogLocale.setLanguageCode('en');
    expect(
      TrainerUiLocalization.specializationName('Bird Keeper'),
      'Bird Keeper',
    );
  });

  test('NPC screens render specializations through the localization helper', () {
    for (final path in <String>[
      'lib/screens/tools/npc_trainer_generator_screen.dart',
      'lib/screens/tools/npc_trainer_result_screen.dart',
      'lib/screens/tools/npc_trainer_library_screen.dart',
    ]) {
      expect(
        File(path).readAsStringSync(),
        contains('TrainerUiLocalization.specializationName'),
        reason: path,
      );
    }
  });

  test('advanced encounter filters leave room for the floating label', () {
    final source = File(
      'lib/screens/tools/encounter_generator_screen.dart',
    ).readAsStringSync();
    expect(
      source,
      contains('childrenPadding: const EdgeInsets.fromLTRB(16, 12, 16, 16)'),
    );
  });
}
""",
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/tools/encounter_generator_screen.dart \
            lib/screens/tools/npc_trainer_generator_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            test/npc_specialization_ui_localization_test.dart

      - name: Analyze source
        run: flutter analyze

      - name: Run focused tests
        run: |
          flutter test test/trainer_ui_localization_test.dart --reporter expanded
          flutter test test/npc_specialization_ui_localization_test.dart --reporter expanded
          flutter test test/npc_trainer_generator_service_test.dart --reporter expanded

      - name: Publish verified correction
        shell: bash
        run: |
          rm -f .github/workflows/fix-npc-specialization-localization-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Localizza le specializzazioni PNG e corregge il filtro ambiente"
          git push origin HEAD:fix/npc-specialization-localization-layout
