name: Apply trainer identity follow-up

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/patch_trainer_identity_a.py
      - tool/patch_trainer_identity_b.py
      - tool/patch_trainer_identity_c.py
      - tool/patch_trainer_identity_d.py
      - .github/workflows/apply-trainer-identity-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply source changes
        run: |
          python tool/patch_trainer_identity_a.py
          python tool/patch_trainer_identity_b.py
          python tool/patch_trainer_identity_c.py
          python tool/patch_trainer_identity_d.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/onboarding/first_launch_onboarding_screen.dart \
            lib/models/trainer_ui_localization.dart \
            lib/screens/trainer/trainer_sheet_mobile.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            test/trainer_manual_identity_fields_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run targeted tests
        run: flutter test test/trainer_manual_identity_fields_test.dart

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/screens/onboarding/first_launch_onboarding_screen.dart \
            lib/models/trainer_ui_localization.dart \
            lib/screens/trainer/trainer_sheet_mobile.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            test/trainer_manual_identity_fields_test.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Show trainer age, background, and pack contents"
          git push origin HEAD:feature/compact-pokemon-detail-v2
