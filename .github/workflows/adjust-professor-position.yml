name: Adjust onboarding professor position

on:
  push:
    branches:
      - fix/professor-overlap-position
    paths:
      - '.github/workflows/adjust-professor-position.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/professor-overlap-position
          fetch-depth: 0

      - name: Move professor behind the dialogue card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/onboarding/first_launch_onboarding_screen.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """    final compactCardFactor = switch (_step) {
            6 => .46,
            7 => .42,
            8 || 9 => .54,
            _ => .55,
          };""",
                  """    final compactCardFactor = switch (_step) {
            6 => .46,
            7 => .36,
            8 || 9 => .50,
            _ => .48,
          };""",
              ),
              (
                  """        final proposedCardTop = constraints.maxHeight * compactCardTopFactor;
          final maximumCardTop = math.max(160.0, constraints.maxHeight - 140);
          final cardTop = math.min(
            maximumCardTop,
            math.max(190.0, proposedCardTop),
          );
          final horizontalInset = constraints.maxWidth < 760 ? 14.0 : 34.0;""",
                  """        final compact = constraints.maxWidth < 760;
          final proposedCardTop = constraints.maxHeight * compactCardTopFactor;
          final minimumCardTop = compact ? 170.0 : 210.0;
          final maximumCardTop = math.max(
            minimumCardTop,
            constraints.maxHeight - 140,
          );
          final cardTop = math.min(
            maximumCardTop,
            math.max(minimumCardTop, proposedCardTop),
          );
          final horizontalInset = compact ? 8.0 : 28.0;
          final professorInset = compact ? 4.0 : 72.0;
          final professorOverlap = compact
              ? math.min(220.0, math.max(132.0, cardTop * .48))
              : math.min(260.0, math.max(170.0, cardTop * .42));""",
              ),
              (
                  """                  Positioned(
            left: constraints.maxWidth < 760 ? 28 : 88,
            right: constraints.maxWidth < 760 ? 28 : 88,
            top: 8,
            height: cardTop + 78,
            child: const _ProfessorPortrait(),
          ),""",
                  """                  Positioned(
            left: professorInset,
            right: professorInset,
            top: compact ? 0 : 8,
            height: cardTop + professorOverlap,
            child: const _ProfessorPortrait(),
          ),""",
              ),
              (
                  """      fit: BoxFit.contain,
            alignment: Alignment.bottomCenter,""",
                  """      fit: BoxFit.cover,
            alignment: Alignment.topCenter,""",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Blocco atteso non trovato una sola volta: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit positioning changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/adjust-professor-position.yml
          git add lib/screens/onboarding/first_launch_onboarding_screen.dart
          git commit -m 'Posiziona il Professore dietro la card di dialogo'
          git push origin HEAD:fix/professor-overlap-position
