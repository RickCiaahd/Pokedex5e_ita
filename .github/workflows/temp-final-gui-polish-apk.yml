name: Apply final GUI polish and build APK once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-final-gui-polish-apk.yml

permissions:
  contents: write

jobs:
  polish-and-build:
    if: startsWith(github.event.head_commit.message, 'Applica rifinitura Home e Battle e crea APK')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Apply Home and Battle polish
        run: python3 tool/home_battle_final_polish_patch.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed screens
        run: dart format lib/screens/home/home_screen.dart lib/screens/battle/battle_screen.dart

      - name: Analyze revised GUI screens
        run: >-
          flutter analyze
          lib/screens/home/home_screen.dart
          lib/screens/pokedex/pokedex_screen.dart
          lib/screens/team/team_selection_screen.dart
          lib/screens/battle/battle_screen.dart

      - name: Remove one-shot files and commit polish
        shell: bash
        run: |
          rm -f tool/home_battle_final_polish_patch.py
          rm -f .github/workflows/temp-final-gui-polish-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rifinisci Home e comandi del Battle Companion"
          git push origin HEAD:feature/compact-pokemon-detail-v2

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Prepare artifact
        shell: bash
        run: |
          BUILD_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${BUILD_SHA::7}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/Pokedex5e-final-gui-test-${SHORT_SHA}.apk"
          {
            echo "Branch: feature/compact-pokemon-detail-v2"
            echo "Commit: ${BUILD_SHA}"
            echo "Flutter: 3.44.4"
            echo "Build: debug APK"
            echo "Includes: clickable Pokedex progress, compact Battle command bar, attributes before moves"
          } > dist/BUILD-INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5e-final-gui-test-apk
          path: dist/
          retention-days: 30

# retry after patch-script syntax fix
