name: Apply battle form switching

on:
  push:
    branches:
      - feature/battle-form-switching

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[battle-form-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/battle-form-switching
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply changes
        run: |
          sed -i 's/if count != 1:/if count < 1:/' tool/apply_battle_form_switching.py
          python tool/apply_battle_form_switching.py
          dart format \
            lib/models/battle_session.dart \
            lib/screens/battle/battle_screen.dart \
            lib/services/battle_form_change_service.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            test/battle_form_change_service_test.dart \
            test/battle_session_test.dart \
            test/pokemon_form_mechanics_test.dart

      - name: Commit generated changes
        run: |
          rm -f tool/apply_battle_form_switching.py
          rm -f .github/workflows/apply-battle-form-switching.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add battle form switching [battle-form-applied]"
          git push origin HEAD:feature/battle-form-switching
