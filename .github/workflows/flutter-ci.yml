name: Apply and verify Battle AC badge

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: battle-ac-badge-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply AC badge
        run: python tool/apply_ac_badge.py

      - name: Restore permanent workflow and remove helper
        run: |
          git show 44956cb105135baa996ad27ada085408fdae50a2:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          rm -f tool/apply_ac_badge.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart file
        run: dart format lib/screens/battle/battle_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified AC badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mostra la Classe Armatura accanto al nome"
          git push origin HEAD:main
