name: Move localization audit

on:
  push:
    branches:
      - translation/moves-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Compare move names
        run: python tool/audit_move_localization.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: move-localization-audit
          path: build/move_localization_audit/
          if-no-files-found: error
