name: Apply capture type badges row

on:
  push:
    branches:
      - fix/capture-type-badges-row
    paths:
      - '.github/workflows/apply-capture-type-badges-row.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-type-badges-row
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Patch capture card layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/capture/capture_pokemon_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_import = "import '../../widgets/pokemon/pokemon_asset_image.dart';\n"
          new_import = old_import + "import '../../widgets/pokemon/pokemon_type_badge_row.dart';\n"
          if "pokemon_type_badge_row.dart" not in text:
              if old_import not in text:
                  raise SystemExit('Import di riferimento non trovato')
              text = text.replace(old_import, new_import, 1)

          old_layout = """        subtitle: Wrap(
          spacing: 6,
          runSpacing: 4,
          crossAxisAlignment: WrapCrossAlignment.center,
          children: [
            Text(number),
            for (final type in pokemon.types)
              PokemonTypeBadge(type: type, height: 18),
          ],
        ),
"""
          new_layout = """        subtitle: Column(
          mainAxisSize: MainAxisSize.min,
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Text(number),
            const SizedBox(height: 4),
            PokemonTypeBadgeRow(types: pokemon.types),
          ],
        ),
"""
          if old_layout not in text:
              raise SystemExit('Layout precedente della card non trovato')
          text = text.replace(old_layout, new_layout, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify
        run: |
          dart format lib/screens/capture/capture_pokemon_screen.dart \
            lib/widgets/pokemon/pokemon_type_badge_row.dart \
            test/pokemon_type_badge_row_test.dart
          flutter pub get
          flutter analyze
          flutter test test/pokemon_type_badge_row_test.dart --reporter expanded
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-capture-type-badges-row.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/capture/capture_pokemon_screen.dart \
            lib/widgets/pokemon/pokemon_type_badge_row.dart \
            test/pokemon_type_badge_row_test.dart
          git commit -m 'Allinea i tipi nella schermata di cattura'
          git push origin HEAD:fix/capture-type-badges-row
