name: Compliance audit

on:
  push:
    branches:
      - main
    paths:
      - 'LICENSE'
      - 'NOTICE.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'docs/compliance/**'
      - 'tooling/generate_compliance_reports.py'
      - 'tooling/prepare_release_legal_assets.py'
      - 'test/legal_information_test.dart'
      - '.github/workflows/compliance-audit.yml'
  pull_request:
    paths:
      - 'LICENSE'
      - 'NOTICE.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'docs/compliance/**'
      - 'tooling/generate_compliance_reports.py'
      - 'tooling/prepare_release_legal_assets.py'
      - 'test/legal_information_test.dart'
      - '.github/workflows/compliance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify compliance reports and legal assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Require committed compliance reports
        run: python tooling/generate_compliance_reports.py --check

      - name: Verify complete GPLv3 text
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'END OF TERMS AND CONDITIONS' LICENSE
          grep -q 'How to Apply These Terms to Your New Programs' LICENSE

      - name: Regenerate and verify deterministic inventories
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py --check

      - name: Prepare and verify embedded legal assets
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Require a clean generated diff
        run: |
          git diff --check
          git diff --exit-code -- LICENSE NOTICE.md docs/compliance

      - name: Run legal information tests
        run: flutter test test/legal_information_test.dart --reporter expanded
