name: Capture status analyze

on:
  push:
    branches:
      - agent/status-assistance
    paths:
      - .github/workflows/capture-status-analyze.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/status-assistance
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture analyzer output
        run: flutter analyze > tooling/status_analyze.log 2>&1 || true

      - name: Commit log and remove temporary workflow
        run: |
          rm .github/workflows/capture-status-analyze.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/status_analyze.log .github/workflows/capture-status-analyze.yml
          git commit -m "Registra il log temporaneo dell'analisi status"
          git push origin HEAD:agent/status-assistance
