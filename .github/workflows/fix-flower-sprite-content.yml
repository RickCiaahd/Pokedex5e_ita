name: Fix flower sprite content

on:
  push:
    branches:
      - fix/floette-florges-form-sprites

permissions:
  contents: write

concurrency:
  group: fix-flower-sprite-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/floette-florges-form-sprites
          fetch-depth: 0

      - name: Download correct named Floette and Florges sprites
        shell: bash
        run: |
          set -euo pipefail
          root='assets/textures/sprites'
          mkdir -p "$root"

          download_pair() {
            local species_id="$1"
            local species_name="$2"
            local form_label="$3"
            local showdown_slug="$4"
            echo "${species_name} ${form_label} <- ${showdown_slug}"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://play.pokemonshowdown.com/sprites/gen5/${showdown_slug}.png" \
              -o "$root/${species_id}${species_name} ${form_label}.png"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://play.pokemonshowdown.com/sprites/gen5-shiny/${showdown_slug}.png" \
              -o "$root/${species_id}${species_name} ${form_label} Shiny.png"
          }

          download_pair 670 Floette 'Blue Flower' floette-blue
          download_pair 670 Floette 'Orange Flower' floette-orange
          download_pair 670 Floette 'White Flower' floette-white
          download_pair 670 Floette 'Yellow Flower' floette-yellow
          download_pair 670 Floette 'Eternal Flower' floette-eternal
          download_pair 671 Florges 'Blue Flower' florges-blue
          download_pair 671 Florges 'Orange Flower' florges-orange
          download_pair 671 Florges 'White Flower' florges-white
          download_pair 671 Florges 'Yellow Flower' florges-yellow

      - name: Validate sprite files and reject party-icon regression
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import struct

          root = Path('assets/textures/sprites')
          forms = {
              670: ('Floette', ['Blue Flower', 'Orange Flower', 'White Flower', 'Yellow Flower', 'Eternal Flower']),
              671: ('Florges', ['Blue Flower', 'Orange Flower', 'White Flower', 'Yellow Flower']),
          }
          hashes = set()
          for pokemon_id, (name, labels) in forms.items():
              for label in labels:
                  for shiny in (False, True):
                      suffix = ' Shiny' if shiny else ''
                      path = root / f'{pokemon_id}{name} {label}{suffix}.png'
                      data = path.read_bytes()
                      assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'Not a PNG: {path}'
                      width, height = struct.unpack('>II', data[16:24])
                      assert (width, height) != (40, 30), f'Wrong party icon slipped back in: {path}'
                      assert width >= 80 and height >= 80, f'Unexpected sprite canvas {width}x{height}: {path}'
                      assert len(data) > 100, f'Unexpectedly tiny sprite: {path}'
                      digest = hashlib.sha256(data).hexdigest()
                      assert digest not in hashes, f'Duplicate sprite content: {path}'
                      hashes.add(digest)
                      print(f'OK {path}: {width}x{height}, {len(data)} bytes, sha256={digest}')

      - name: Strengthen regression coverage for shiny compact sprites
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/deoxys_floette_form_regression_test.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "      final florgesSprite = 'assets/textures/sprites/671Florges $form.png';\n",
              "      final florgesSprite = 'assets/textures/sprites/671Florges $form.png';\n"
              "      final floetteShinySprite =\n"
              "          'assets/textures/sprites/670Floette $form Shiny.png';\n"
              "      final florgesShinySprite =\n"
              "          'assets/textures/sprites/671Florges $form Shiny.png';\n",
          )
          text = text.replace(
              "      expect(assets, contains(florgesSprite));\n",
              "      expect(assets, contains(florgesSprite));\n"
              "      expect(assets, contains(floetteShinySprite));\n"
              "      expect(assets, contains(florgesShinySprite));\n",
              1,
          )
          text = text.replace(
              "      expect(floetteShinyCompact, contains(floetteSprite));\n"
              "      expect(florgesShinyCompact, contains(florgesSprite));\n",
              "      expect(floetteShinyCompact, contains(floetteShinySprite));\n"
              "      expect(florgesShinyCompact, contains(florgesShinySprite));\n",
          )
          text = text.replace(
              "        floetteShinyCompact.indexOf(floetteSprite),\n",
              "        floetteShinyCompact.indexOf(floetteShinySprite),\n",
          )
          text = text.replace(
              "        florgesShinyCompact.indexOf(florgesSprite),\n",
              "        florgesShinyCompact.indexOf(florgesShinySprite),\n",
          )
          text = text.replace(
              "    const eternalSprite =\n"
              "        'assets/textures/sprites/670Floette Eternal Flower.png';\n",
              "    const eternalSprite =\n"
              "        'assets/textures/sprites/670Floette Eternal Flower.png';\n"
              "    const eternalShinySprite =\n"
              "        'assets/textures/sprites/670Floette Eternal Flower Shiny.png';\n",
          )
          text = text.replace(
              "    expect(assets, contains(eternalSprite));\n",
              "    expect(assets, contains(eternalSprite));\n"
              "    expect(assets, contains(eternalShinySprite));\n",
          )
          marker = "    expect(\n      eternalCompact.indexOf(eternalSprite),\n      lessThan(eternalCompact.indexOf(eternalArtwork)),\n    );\n"
          addition = marker + "    final eternalShinyCompact = PokemonAssetPaths.imageCandidates(\n      pokemon: floette,\n      useLargeArtwork: false,\n      formName: 'Eternal Flower',\n      isShiny: true,\n    );\n    expect(eternalShinyCompact, contains(eternalShinySprite));\n"
          if marker not in text:
              raise SystemExit('Expected Eternal Flower test marker not found')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format regression test
        run: dart format test/deoxys_floette_form_regression_test.dart

      - name: Regenerate compliance inventories
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py --check
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check
          git diff --check

      - name: Run flower form regression test
        run: flutter test test/deoxys_floette_form_regression_test.dart --reporter expanded

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Commit corrected sprites and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-flower-sprite-content.yml
          git add assets/textures/sprites test/deoxys_floette_form_regression_test.dart docs/compliance .github/workflows/fix-flower-sprite-content.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correggi gli sprite floreali di Floette e Florges'
          git push origin HEAD:fix/floette-florges-form-sprites

      - name: Build fresh debug APK
        run: flutter build apk --debug

      - name: Upload corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-floette-florges-corrected
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
