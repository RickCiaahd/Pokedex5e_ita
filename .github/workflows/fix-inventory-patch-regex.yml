name: Fix inventory patch regex

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/fix_inventory_patch_regex.py
      - .github/workflows/fix-inventory-patch-regex.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0
      - run: python tool/fix_inventory_patch_regex.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/apply_narrative_background_and_inventory_cart.py
          git commit -m "Correggi escaping dello script inventario"
          git push origin HEAD:feature/compact-pokemon-detail-v2
