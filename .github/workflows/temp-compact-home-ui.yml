name: Apply compact Home UI once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-compact-home-ui.yml
      - tool/compact_home_ui_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Apply compact Home patch
        run: python tool/compact_home_ui_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Home screen
        run: dart format lib/screens/home/home_screen.dart

      - name: Analyze Home screen
        run: flutter analyze lib/screens/home/home_screen.dart

      - name: Remove one-shot patch files
        run: |
          rm tool/compact_home_ui_patch.py
          rm .github/workflows/temp-compact-home-ui.yml

      - name: Commit compact Home UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home/home_screen.dart tool/compact_home_ui_patch.py .github/workflows/temp-compact-home-ui.yml
          git commit -m "Compatta la Home in un dashboard a griglia"
          git push origin HEAD:feature/compact-pokemon-detail-v2
