name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization_foundation:
    name: Apply localization foundation
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/app-localization-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: feature/app-localization-foundation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply prepared localization patch
        shell: bash
        run: |
          set +e
          python3 <<'PY' > /tmp/localization-foundation.log 2>&1
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/app-localization-foundation-patch.yml')
          text = workflow.read_text(encoding='utf-8')
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          start = text.index(marker_start) + len(marker_start)
          end = text.index(marker_end, start)
          raw_lines = text[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_lines
          ) + '\n'

          old = (
              "if old_tour not in home_text:\n"
              "    raise SystemExit('Blocco tour Home non trovato')\n"
              "home_text = home_text.replace(old_tour, new_tour, 1)\n"
          )
          new = (
              "tour_start = home_text.index(\n"
              "    '  List<HomeTourStepData> get _tourSteps'\n"
              ")\n"
              "tour_end = home_text.index('\\n\\n  @override', tour_start)\n"
              "home_text = (\n"
              "    home_text[:tour_start]\n"
              "    + new_tour.rstrip()\n"
              "    + home_text[tour_end:]\n"
              ")\n"
          )
          if old not in script:
              raise SystemExit('Sezione di patch del tour non trovata nello script')
          script = script.replace(old, new, 1)

          const_replacement = (
              "home_text = home_text.replace(\n"
              "    'const _HomeSectionTitle(', '_HomeSectionTitle('\n"
              ")\n"
          )
          if const_replacement not in script:
              const_replacement = (
                  "home_text = home_text.replace('const _HomeSectionTitle(', "
                  "'_HomeSectionTitle(')\n"
              )
          const_fix = const_replacement + (
              "home_text = home_text.replace(\n"
              "    'class _HomeSectionTitle extends StatelessWidget {\\n"
              "  _HomeSectionTitle(',\n"
              "    'class _HomeSectionTitle extends StatelessWidget {\\n"
              "  const _HomeSectionTitle(',\n"
              "    1,\n"
              ")\n"
          )
          if const_replacement not in script:
              raise SystemExit('Sostituzione const della Home non trovata nello script')
          script = script.replace(const_replacement, const_fix, 1)

          patch = Path('/tmp/apply_localization_foundation.py')
          patch.write_text(script, encoding='utf-8')
          subprocess.run(['python3', str(patch)], check=True)
          PY
          status=$?
          cat /tmp/localization-foundation.log
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/localization-foundation.log diagnostics/localization-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/localization-patch-error.txt
            git commit -m "Registra l'errore della base bilingue" || true
            git push origin HEAD:feature/app-localization-foundation
            exit "$status"
          fi

      - name: Resolve dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/app.dart \
            lib/main.dart \
            lib/localization/app_locale_controller.dart \
            lib/services/app_locale_service.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/home/home_screen.dart \
            lib/widgets/tour/professor_tour_panel.dart \
            lib/l10n/app_localizations.dart \
            lib/l10n/app_localizations_en.dart \
            lib/l10n/app_localizations_it.dart \
            test/app_locale_controller_test.dart \
            test/localization_assets_test.dart \
            test/android_release_config_test.dart

      - name: Validate localization foundation
        shell: bash
        run: |
          set +e
          log=/tmp/localization-validation.log
          : > "$log"

          run_check() {
            echo "" | tee -a "$log"
            echo "> $*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            return ${PIPESTATUS[0]}
          }

          status=0
          run_check flutter analyze || status=$?
          if [ "$status" -eq 0 ]; then
            run_check flutter test test/app_locale_controller_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check flutter test test/localization_assets_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check flutter test test/android_release_config_test.dart || status=$?
          fi

          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp "$log" diagnostics/localization-validation-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/localization-validation-error.txt
            git commit -m "Registra l'errore dei test bilingui" || true
            git push origin HEAD:feature/app-localization-foundation
            exit "$status"
          fi

      - name: Restore CI and publish branch
        shell: bash
        run: |
          rm -f diagnostics/localization-patch-error.txt
          rm -f diagnostics/localization-validation-error.txt
          rm -f .github/workflows/app-localization-foundation-patch.yml
          rm -f .github/workflows/app-localization-foundation-run.yml
          git checkout origin/main -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Introduce la base bilingue di Trainer Atlas 5e"
          git push origin HEAD:feature/app-localization-foundation

  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
