name: Diagnose Trainer Atlas 1.3.2 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-v1.3.2-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect release workflow diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          report='diagnostics/release-v1.3.2.txt'
          : > "$report"
          echo 'Trainer Atlas 1.3.2 release diagnostics' >> "$report"
          echo "Collected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$report"
          echo >> "$report"

          gh run list \
            --branch v1.3.2 \
            --limit 30 \
            --json databaseId,name,event,status,conclusion,headBranch,headSha,url \
            > /tmp/v132-runs.json

          cat /tmp/v132-runs.json >> "$report"
          echo >> "$report"

          mapfile -t run_ids < <(jq -r '.[] | select(.headBranch == "v1.3.2" and .headSha == "cfdf0a93bf082536f9a24d158cb026995772aa9b") | .databaseId' /tmp/v132-runs.json)
          for run_id in "${run_ids[@]}"; do
            echo >> "$report"
            echo "===== RUN $run_id =====" >> "$report"
            gh run view "$run_id" --json databaseId,name,event,status,conclusion,headBranch,headSha,url,jobs >> "$report" || true
            echo >> "$report"
            echo '----- FAILED LOGS -----' >> "$report"
            gh run view "$run_id" --log-failed >> "$report" 2>&1 || true
          done

      - name: Remove temporary diagnostic workflow
        run: git rm .github/workflows/diagnose-v1.3.2-release.yml

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/release-v1.3.2.txt
          git commit -m 'Registra diagnosi release 1.3.2'
          git push origin HEAD:main
