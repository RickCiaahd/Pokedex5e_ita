name: Verify eggs in team

on:
  push:
    branches:
      - agent/eggs-in-team-and-daycare

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/eggs-in-team-and-daycare

      - name: Apply syntax fix
        run: python .github/agent/fix_egg_team_syntax.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/breeding_egg.dart \
            lib/models/team_slot.dart \
            lib/repositories/team_repository.dart \
            lib/screens/breeding/breeding_screen.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/pc/pokemon_pc_screen.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/services/breeding_service.dart \
            test/breeding_service_test.dart \
            test/team_slot_egg_test.dart

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified changes
        run: |
          rm .github/agent/fix_egg_team_syntax.py
          rm .github/workflows/agent-verify-egg-team.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verifica e formatta le uova in squadra"
          git push origin HEAD:agent/eggs-in-team-and-daycare
