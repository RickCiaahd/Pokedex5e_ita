name: Repair release manifest 1.3.1

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.title == 'Publish Trainer Atlas 1.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore full asset manifest and set version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git show v1.3.0:pubspec.yaml > pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'version: 1.3.0+6'
          if text.count(old) != 1:
              raise SystemExit('Versione base inattesa nel manifest v1.3.0')
          path.write_text(text.replace(old, 'version: 1.3.1+7', 1), encoding='utf-8')
          PY

      - name: Commit repaired manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m 'Ripristina manifest asset e prepara release 1.3.1'
          git push origin HEAD:main
