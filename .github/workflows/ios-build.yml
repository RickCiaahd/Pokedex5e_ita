name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS release without code signing
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify compliance reports
        run: python3 tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python3 tooling/prepare_release_legal_assets.py
          python3 tooling/prepare_release_legal_assets.py --check

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned app bundle and IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          OUTPUT_DIR="build/ios/sideload"
          PAYLOAD_DIR="$OUTPUT_DIR/Payload"

          test -d "$APP_PATH"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$PAYLOAD_DIR"

          ditto "$APP_PATH" "$PAYLOAD_DIR/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$OUTPUT_DIR/Pokedex5eITA-iOS-unsigned-app.zip"

          cd "$OUTPUT_DIR"
          zip -qry "Pokedex5eITA-iOS-unsigned.ipa" Payload
          test -f "Pokedex5eITA-iOS-unsigned.ipa"

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-iOS-sideload
          path: |
            build/ios/sideload/Pokedex5eITA-iOS-unsigned.ipa
            build/ios/sideload/Pokedex5eITA-iOS-unsigned-app.zip
          if-no-files-found: error
          retention-days: 30
