name: Clean breeding diff

on:
  push:
    branches:
      - agent/breeding-eggs-core
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/breeding-eggs-core' || github.ref_name == 'agent/breeding-eggs-core'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/breeding-eggs-core
          fetch-depth: 0

      - name: Restore unrelated formatting changes
        run: |
          git fetch origin main
          git checkout origin/main -- \
            lib/app.dart \
            lib/models/bag_inventory_entry.dart \
            lib/models/evolution_data.dart \
            lib/models/move_data.dart \
            lib/models/pc_pokemon.dart \
            lib/models/pokemon_form_preferences.dart \
            lib/models/team_slot.dart \
            lib/models/trainer_progression.dart \
            lib/models/user_profile.dart \
            lib/repositories/ability_repository.dart \
            lib/repositories/item_repository.dart \
            lib/repositories/tm_repository.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/pc/pokemon_pc_screen.dart \
            lib/screens/pokemon/evolution_selector_sheet.dart \
            lib/screens/pokemon/pokemon_detail_screen_legacy.dart \
            lib/screens/tools/tools_screen.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/services/battle_status_rules.dart \
            lib/services/evolution_form_alias_service.dart \
            lib/services/evolution_service.dart \
            lib/services/master_battle_service.dart \
            lib/services/trainer_path_automation_service.dart \
            lib/services/trainer_path_passive_service.dart \
            lib/widgets/battle/battle_status_assistance_card.dart \
            lib/widgets/battle/pokemon_battle_attributes_card.dart \
            lib/widgets/trainer/trainer_path_automation_panel.dart \
            lib/widgets/trainer/trainer_path_passive_card.dart \
            test/battle_status_rules_test.dart \
            test/data_integrity_test.dart \
            test/evolution_form_alias_service_test.dart \
            test/navigation_and_percentage_test.dart \
            test/pokemon_battle_attributes_card_test.dart \
            test/trainer_path_automation_test.dart \
            test/trainer_path_passive_service_test.dart \
            test/trainer_path_passive_smoke_test.dart

      - name: Commit clean diff
        run: |
          rm .github/workflows/agent-clean-breeding-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mantiene la modifica allevamento focalizzata"
          git push origin HEAD:agent/breeding-eggs-core
