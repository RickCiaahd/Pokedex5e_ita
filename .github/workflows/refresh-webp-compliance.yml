name: Refresh WebP compliance inventory

on:
  push:
    branches:
      - feature/webp-lossless-batch-2
    paths:
      - '.github/workflows/refresh-webp-compliance.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-webp-compliance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/webp-lossless-batch-2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - name: Exclude generated release notices from source asset inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tooling/generate_compliance_reports.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'ASSET_MD = COMPLIANCE_DIR / "asset-audit-summary.md"\n\n'
          addition = '''ASSET_MD = COMPLIANCE_DIR / "asset-audit-summary.md"

GENERATED_RELEASE_ASSETS = {
    Path("assets/data/GPL-3.0.txt"),
    Path("assets/data/NOTICE.txt"),
}

'''
          if 'GENERATED_RELEASE_ASSETS' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Expected ASSET_MD anchor exactly once')
              text = text.replace(anchor, addition, 1)

          old_evidence = '''                if child.is_file() and child.name.lower() in EVIDENCE_NAMES:
                    evidence.append(child.relative_to(ROOT).as_posix())
'''
          new_evidence = '''                relative = child.relative_to(ROOT)
                if (
                    child.is_file()
                    and child.name.lower() in EVIDENCE_NAMES
                    and relative not in GENERATED_RELEASE_ASSETS
                ):
                    evidence.append(relative.as_posix())
'''
          if old_evidence in text:
              text = text.replace(old_evidence, new_evidence, 1)
          elif new_evidence not in text:
              raise SystemExit('Expected evidence discovery block exactly once')

          old_files = '''    files = sorted((path for path in assets_root.rglob("*") if path.is_file()), key=lambda item: item.as_posix().lower())
'''
          new_files = '''    files = sorted(
        (
            path
            for path in assets_root.rglob("*")
            if path.is_file()
            and path.relative_to(ROOT) not in GENERATED_RELEASE_ASSETS
        ),
        key=lambda item: item.as_posix().lower(),
    )
'''
          if old_files in text:
              text = text.replace(old_files, new_files, 1)
          elif new_files not in text:
              raise SystemExit('Expected asset scan block exactly once')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Regenerate deterministic reports
        run: |
          python -m py_compile tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py
          python tooling/generate_asset_duplicates.py
          python tooling/generate_compliance_reports.py --check
          python tooling/generate_asset_duplicates.py --check
          git diff --check
      - name: Prove generated legal files do not change the inventory
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check
          python tooling/generate_compliance_reports.py --check
          git status --short
      - name: Commit stable inventory
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/generate_compliance_reports.py \
            docs/compliance/asset-manifest.csv \
            docs/compliance/asset-audit-summary.md \
            docs/performance/asset-duplicates.csv
          if git diff --cached --quiet; then
            echo 'No compliance refresh was needed.'
            exit 1
          fi
          git commit -m 'Stabilizza l’inventario rispetto agli asset legali generati'
          git push origin HEAD:feature/webp-lossless-batch-2
