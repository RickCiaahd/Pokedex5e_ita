name: Build v1.1.0 now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v1.1.0-now.yml'

permissions:
  contents: write

jobs:
  android:
    name: Build signed Android 1.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: v1.1.0
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release and signing
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 1.1.0+4$' pubspec.yaml
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

      - name: Configure Android signing
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test test/data_integrity_test.dart --reporter expanded
          flutter test --reporter expanded

      - name: Build signed Android packages
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Prepare Android artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Pokedex5eITA-1.1.0.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Pokedex5eITA-1.1.0.aab
          sha256sum dist/Pokedex5eITA-1.1.0.apk dist/Pokedex5eITA-1.1.0.aab > dist/SHA256SUMS.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-Android-1.1.0
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Pokédex 5e ITA 1.1.0
          generate_release_notes: true
          files: dist/*

  windows:
    name: Build Windows x64 1.1.0
    runs-on: windows-latest
    timeout-minutes: 100

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: v1.1.0
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Validate release version
        shell: pwsh
        run: |
          if (-not (Select-String -Path 'pubspec.yaml' -Pattern '^version: 1\.1\.0\+4$')) {
            throw 'Versione release inattesa.'
          }

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze and test
        shell: pwsh
        run: |
          flutter analyze
          flutter test test/data_integrity_test.dart --reporter expanded
          flutter test --reporter expanded

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Prepare portable Windows package
        shell: pwsh
        run: |
          $source = 'build\windows\x64\runner\Release'
          $dist = 'dist'
          $packageName = 'Pokedex5eITA-1.1.0-Windows-x64'
          $staging = Join-Path $dist $packageName
          $zip = Join-Path $dist "$packageName.zip"
          $checksum = Join-Path $dist "$packageName-SHA256.txt"

          if (-not (Test-Path (Join-Path $source 'Pokedex5eITA.exe'))) {
            throw 'Pokedex5eITA.exe non trovato nella build release.'
          }

          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $staging -Recurse -Force
          @"
          Pokédex 5e ITA 1.1.0 — Windows x64

          1. Estrarre interamente questa cartella.
          2. Avviare Pokedex5eITA.exe.
          3. Conservare cartella data e DLL accanto all'eseguibile.

          Progetto amatoriale e non ufficiale.
          "@ | Set-Content -Path (Join-Path $staging 'LEGGIMI-WINDOWS.txt') -Encoding utf8

          Compress-Archive -Path $staging -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -Path $checksum -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-Windows-1.1.0
          path: |
            dist/*.zip
            dist/*-SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Pokédex 5e ITA 1.1.0
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*-SHA256.txt
