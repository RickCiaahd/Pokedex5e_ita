name: Apply WebP lossless pilot

on:
  push:
    branches:
      - feature/webp-lossless-pilot
    paths:
      - 'tooling/apply_webp_lossless_pilot.py'
      - '.github/workflows/apply-webp-lossless-pilot.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tooling/apply_webp_lossless_pilot.py'
      - '.github/workflows/apply-webp-lossless-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-webp-lossless-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    name: Convert, verify and build the lossless pilot
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: feature/webp-lossless-pilot
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate pilot utility
        run: |
          python -m py_compile tooling/apply_webp_lossless_pilot.py
          python tooling/apply_webp_lossless_pilot.py --self-test

      - name: Apply lossless WebP pilot
        if: github.actor != 'github-actions[bot]'
        run: python tooling/apply_webp_lossless_pilot.py --apply

      - name: Refresh compliance and duplicate inventories
        if: github.actor != 'github-actions[bot]'
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_asset_duplicates.py

      - name: Format generated Dart files
        run: >-
          dart format
          lib/widgets/pokemon/pokemon_asset_image.dart
          lib/widgets/pokemon/pokemon_asset_image_legacy.dart
          test/webp_lossless_pilot_test.dart

      - name: Verify pilot invariants
        run: |
          python tooling/apply_webp_lossless_pilot.py --check
          python tooling/repair_unreadable_pokemon_images.py --check-all
          python tooling/generate_compliance_reports.py --check
          python tooling/generate_asset_duplicates.py --check
          git diff --check

      - name: Analyze source
        run: flutter analyze

      - name: Run pilot tests on Flutter VM
        run: flutter test test/webp_lossless_pilot_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web release
        run: flutter build web --release

      - name: Upload visual and measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Atlas-WebP-lossless-pilot
          path: |
            build/reports/webp-lossless-pilot/
            docs/performance/webp-lossless-pilot.csv
            docs/performance/webp-lossless-pilot.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified pilot
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No pilot changes were produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Converte il lotto pilota in WebP lossless'
          git push origin HEAD:feature/webp-lossless-pilot
