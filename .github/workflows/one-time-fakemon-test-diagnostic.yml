name: One-time Fakemon test diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Fakemon branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run complete test suite
        shell: bash
        run: |
          flutter pub get
          set +e
          flutter test --reporter expanded > fakemon-full-test.log 2>&1
          cat fakemon-full-test.log
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: fakemon-full-test-log
          path: fakemon-full-test.log
