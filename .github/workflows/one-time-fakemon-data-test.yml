name: One-time Fakemon data test fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Fakemon branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-core
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize Hive in data test
        run: python3 .github/scripts/fix_data_integrity_hive.py

      - name: Validate targeted test
        run: |
          dart format test/data_integrity_test.dart
          flutter pub get
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit test correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_data_integrity_hive.py
          git add test/data_integrity_test.dart
          git commit -m 'Inizializza Hive nel test di integrità dati'
          git push origin feature/fakemon-core
