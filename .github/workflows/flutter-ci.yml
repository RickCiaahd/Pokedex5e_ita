name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python for move generator
        if: github.head_ref == 'translation/moves-651-830'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and integrate move localization 651-830
        if: github.head_ref == 'translation/moves-651-830'
        shell: bash
        run: |
          if [ ! -f tools/generate_move_localization_651_830.py ]; then
            echo 'Generator already completed.'
            exit 0
          fi
          python -m pip install deep-translator==1.11.4
          python tools/generate_move_localization_651_830.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/flutter-ci.yml
          rm -f tools/generate_move_localization_651_830.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Genera la base italiana delle mosse 651-830'
          git push origin HEAD:translation/moves-651-830

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
