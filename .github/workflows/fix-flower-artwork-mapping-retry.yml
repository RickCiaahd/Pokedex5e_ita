name: Fix flower artwork mapping retry

on:
  push:
    branches: [feature/compact-pokemon-detail-v2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Install correct named artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/textures/pokemons
          rm -f assets/textures/sprites/'670Floette Blue Flower.png' \
                assets/textures/sprites/'670Floette Orange Flower.png' \
                assets/textures/sprites/'670Floette White Flower.png' \
                assets/textures/sprites/'670Floette Yellow Flower.png' \
                assets/textures/sprites/'670Floette Blue Flower Shiny.png' \
                assets/textures/sprites/'670Floette Orange Flower Shiny.png' \
                assets/textures/sprites/'670Floette White Flower Shiny.png' \
                assets/textures/sprites/'670Floette Yellow Flower Shiny.png' \
                assets/textures/sprites/'671Florges Blue Flower.png' \
                assets/textures/sprites/'671Florges Orange Flower.png' \
                assets/textures/sprites/'671Florges White Flower.png' \
                assets/textures/sprites/'671Florges Yellow Flower.png' \
                assets/textures/sprites/'670Floette Eternal'*.png \
                assets/textures/pokemons/'670Floette Eternal'*.png

          get_art() {
            curl --fail --location --retry 3 --silent --show-error -A 'Mozilla/5.0' \
              "https://img.pokemondb.net/artwork/vector/$1.png" --output "$2"
          }
          get_art floette-blue 'assets/textures/pokemons/670Floette Blue Flower.png'
          get_art floette-orange 'assets/textures/pokemons/670Floette Orange Flower.png'
          get_art floette-white 'assets/textures/pokemons/670Floette White Flower.png'
          get_art floette-yellow 'assets/textures/pokemons/670Floette Yellow Flower.png'
          get_art florges-blue 'assets/textures/pokemons/671Florges Blue Flower.png'
          get_art florges-orange 'assets/textures/pokemons/671Florges Orange Flower.png'
          get_art florges-white 'assets/textures/pokemons/671Florges White Flower.png'
          get_art florges-yellow 'assets/textures/pokemons/671Florges Yellow Flower.png'
          curl --fail --location --retry 3 --silent --show-error -A 'Mozilla/5.0' \
            'https://archives.bulbagarden.net/media/upload/thumb/6/60/0670Floette-Eternal_ZA.png/600px-0670Floette-Eternal_ZA.png' \
            --output 'assets/textures/pokemons/670Floette Eternal Flower.png'

          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          files = sorted(Path('assets/textures/pokemons').glob('670Floette *Flower.png')) + sorted(Path('assets/textures/pokemons').glob('671Florges *Flower.png'))
          wanted = 9
          if len(files) != wanted:
              raise SystemExit(f'Expected {wanted} flower artwork files, got {len(files)}: {files}')
          hashes = set()
          for p in files:
              b = p.read_bytes()
              if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{p} is not PNG')
              w,h = struct.unpack('>II', b[16:24])
              if min(w,h) < 180 or max(w,h) < 250: raise SystemExit(f'{p} too small: {w}x{h}')
              sha = hashlib.sha256(b).hexdigest()
              if sha in hashes: raise SystemExit(f'duplicate artwork: {p}')
              hashes.add(sha)
              print(f'{p}: {w}x{h} {sha}')
          PY

      - name: Make flower choices canonical
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/widgets/pokemon/pokemon_asset_image.dart')
          s=p.read_text(encoding='utf-8')
          old="""    if (ItemDrivenPokemonForm.usesHeldItemForm(pokemon.id)) return const [];\n\n    final rawChoices = await legacy.PokemonAssetPaths.formChoices(pokemon);\n"""
          new="""    if (ItemDrivenPokemonForm.usesHeldItemForm(pokemon.id)) return const [];\n\n    final flowerChoices = _flowerFormChoices(pokemon.id);\n    if (flowerChoices != null) return flowerChoices;\n\n    final rawChoices = await legacy.PokemonAssetPaths.formChoices(pokemon);\n"""
          if s.count(old)!=1: raise SystemExit(f'formChoices marker count={s.count(old)}')
          s=s.replace(old,new,1)
          marker="""  static bool _isShinyAppearanceChoice({\n"""
          helper="""  static List<legacy.PokemonFormChoice>? _flowerFormChoices(int pokemonId) {\n    if (pokemonId == 670) {\n      return const <legacy.PokemonFormChoice>[\n        legacy.PokemonFormChoice(name: 'Base', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Blue Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Orange Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'White Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Yellow Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Eternal Flower', assetPath: ''),\n      ];\n    }\n    if (pokemonId == 671) {\n      return const <legacy.PokemonFormChoice>[\n        legacy.PokemonFormChoice(name: 'Base', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Blue Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Orange Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'White Flower', assetPath: ''),\n        legacy.PokemonFormChoice(name: 'Yellow Flower', assetPath: ''),\n      ];\n    }\n    return null;\n  }\n\n"""
          if s.count(marker)!=1: raise SystemExit(f'helper marker count={s.count(marker)}')
          p.write_text(s.replace(marker,helper+marker,1),encoding='utf-8')
          PY

      - name: Update regression
        shell: bash
        run: |
          cat > test/deoxys_floette_form_regression_test.dart <<'DART'
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:pokedex_5e_ita/repositories/pokemon_repository.dart';
          import 'package:pokedex_5e_ita/services/battle_form_change_service.dart';
          import 'package:pokedex_5e_ita/widgets/pokemon/pokemon_asset_image.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('Deoxys Speed Form follows the 5e Transformer rule', () async {
              final catalog = await PokemonRepository().getAllPokemon();
              final deoxys = catalog.firstWhere((pokemon) => pokemon.id == 386);
              final note = BattleFormChangeService.effectNote(deoxys, 'Speed');
              expect(note, contains('azione di attacco aggiuntiva ogni turno'));
              expect(note, contains('quell’attacco viene effettuato con svantaggio'));
              expect(note, contains('bersagli hanno vantaggio'));
              expect(note, isNot(contains('attacchi contro Deoxys hanno svantaggio')));
              expect(BattleFormChangeService.attackRollBonus(deoxys, 'Attack'), 5);
              expect(BattleFormChangeService.armorClassBonus(deoxys, 'Defense'), 3);
            });

            test('Floette and Florges have canonical flower choices only', () async {
              final catalog = await PokemonRepository().getAllPokemon();
              final floette = catalog.firstWhere((p) => p.id == 670);
              final florges = catalog.firstWhere((p) => p.id == 671);
              expect(
                (await PokemonAssetPaths.formChoices(floette)).map((e) => e.name).toList(),
                const ['Base','Blue Flower','Orange Flower','White Flower','Yellow Flower','Eternal Flower'],
              );
              expect(
                (await PokemonAssetPaths.formChoices(florges)).map((e) => e.name).toList(),
                const ['Base','Blue Flower','Orange Flower','White Flower','Yellow Flower'],
              );
            });

            testWidgets('Flower artwork bundle uses dedicated artwork, not bad sprites', (tester) async {
              final assets = (await AssetManifest.loadFromAssetBundle(rootBundle)).listAssets();
              const forms = ['Blue Flower','Orange Flower','White Flower','Yellow Flower'];
              for (final form in forms) {
                expect(assets, contains('assets/textures/pokemons/670Floette $form.png'));
                expect(assets, contains('assets/textures/pokemons/671Florges $form.png'));
                expect(assets, isNot(contains('assets/textures/sprites/670Floette $form.png')));
                expect(assets, isNot(contains('assets/textures/sprites/671Florges $form.png')));
              }
              expect(assets, contains('assets/textures/pokemons/670Floette Eternal Flower.png'));
            });
          }
          DART

      - run: dart format lib/widgets/pokemon/pokemon_asset_image.dart test/deoxys_floette_form_regression_test.dart
      - run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py --check
      - run: flutter test test/deoxys_floette_form_regression_test.dart
      - run: flutter analyze
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correggi mapping artwork floreali di Floette e Florges'
          git push origin HEAD:feature/compact-pokemon-detail-v2
