name: Fix Fakemon advanced regressions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/fakemon-advanced'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-advanced
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Detect pending fix
        id: fix
        shell: bash
        run: |
          if test -f tool/fix_fakemon_analyze.py; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.fix.outputs.pending == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply regression fixes
        if: steps.fix.outputs.pending == 'true'
        run: python tool/fix_fakemon_analyze.py

      - name: Remove temporary fix script
        if: steps.fix.outputs.pending == 'true'
        run: rm tool/fix_fakemon_analyze.py

      - name: Format changed Dart files
        if: steps.fix.outputs.pending == 'true'
        shell: bash
        run: |
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACMRT | grep '\.dart$' || true)
          if [ "${#dart_files[@]}" -gt 0 ]; then
            dart format "${dart_files[@]}"
          fi

      - name: Commit fixed snapshot
        if: steps.fix.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregge le regressioni dei Fakemon avanzati'
          git push origin HEAD:feature/fakemon-advanced

      - name: Install dependencies
        if: steps.fix.outputs.pending == 'true'
        run: flutter pub get

      - name: Analyze source
        if: steps.fix.outputs.pending == 'true'
        run: flutter analyze

      - name: Run focused Fakemon tests
        if: steps.fix.outputs.pending == 'true'
        run: flutter test test/fakemon_advanced_test.dart --reporter expanded

      - name: Run complete test suite
        if: steps.fix.outputs.pending == 'true'
        run: flutter test --reporter expanded
