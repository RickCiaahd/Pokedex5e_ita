name: Apply compact Bag layout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-compact-bag-layout
  cancel-in-progress: false

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply and format Bag layout
        run: |
          python tool/apply_bag_layout.py
          dart format lib/screens/bag/bag_screen.dart

      - name: Commit layout on prototype branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/bag/bag_screen.dart
          git commit -m "Riorganizza lo Zaino con azioni fisse in basso"
          git push origin HEAD:feature/compact-pokemon-detail-v2
