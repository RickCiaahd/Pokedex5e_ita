name: Retry finalize Italian form names

on:
  push:
    paths:
      - '.github/workflows/retry-finalize-italian-form-names.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate
        id: work
        shell: bash
        run: |
          set +e
          log='italian-form-names-validation.txt'
          : > "$log"
          {
            python <<'PY'
          import re
          from pathlib import Path

          service = Path('lib/services/battle_form_change_service.dart')
          text = service.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  static String normalizedChoiceName\(Pokemon pokemon, String\? formName\) \{.*?\n  \}\n\n  static int formSortWeight",
              re.DOTALL,
          )
          replacement = """  static String normalizedChoiceName(Pokemon pokemon, String? formName) {
            final key = canonicalFormKey(pokemon, formName);
            if (key == _defaultFormKey(pokemon)) return 'Base';
            if (pokemon.name == 'Darmanitan') {
              if (key == 'galarian-standard') return 'galar-standard';
              if (key == 'galarian-zen') return 'galar-zen';
            }
            return key;
          }

          static int formSortWeight"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'normalizedChoiceName replacements: {count}')

          replacements = {
              "return key == 'noice-face' ? 'Faccia Liquida' : 'Faccia Gelata';":
                  "return key == 'noice-face' ? 'Forma Liquefaccia' : 'Forma Gelofaccia';",
              "return key == 'hangry' ? 'Motivo Pancia Vuota' : 'Motivo Panciapiena';":
                  "return key == 'hangry' ? 'Motivo Panciavuota' : 'Motivo Panciapiena';",
              "l’abilità Modalità Zen.": "l’abilità Stato Zen.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing service text: {old}')
              text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          test = Path('test/battle_form_change_service_test.dart')
          test_text = test.read_text(encoding='utf-8')
          darmanitan_anchor = """    expect(
            BattleFormChangeService.canonicalFormKey(
              darmanitan,
              'Forma di Galar · Stato Zen',
            ),
            'galarian-zen',
          );
          """
          darmanitan_extra = darmanitan_anchor + """    expect(
            BattleFormChangeService.normalizedChoiceName(
              darmanitan,
              'Galarian Zen',
            ),
            'galar-zen',
          );
          """
          if darmanitan_anchor not in test_text:
              raise SystemExit('Darmanitan test anchor missing')
          test_text = test_text.replace(
              darmanitan_anchor,
              darmanitan_extra,
              1,
          )

          zygarde_anchor = """  test(
            'Zygarde uses Forma 50% as base and keeps all three stat profiles',
          """
          official_test = """  test('official Italian labels cover Eiscue and Morpeko forms', () async {
            final pokemon = await PokemonRepository().getAllPokemon();
            final eiscue = pokemon.firstWhere((entry) => entry.id == 875);
            final morpeko = pokemon.firstWhere((entry) => entry.id == 877);

            expect(
              BattleFormChangeService.formLabel(eiscue, 'Ice Face'),
              'Forma Gelofaccia',
            );
            expect(
              BattleFormChangeService.formLabel(eiscue, 'Noice Face'),
              'Forma Liquefaccia',
            );
            expect(
              BattleFormChangeService.formLabel(morpeko, 'Full Belly'),
              'Motivo Panciapiena',
            );
            expect(
              BattleFormChangeService.formLabel(morpeko, 'Hangry'),
              'Motivo Panciavuota',
            );
          });

          """
          if zygarde_anchor not in test_text:
              raise SystemExit('Zygarde test anchor missing')
          test_text = test_text.replace(
              zygarde_anchor,
              official_test + zygarde_anchor,
              1,
          )
          test.write_text(test_text, encoding='utf-8')
          PY

            dart format \
              lib/services/battle_form_change_service.dart \
              test/battle_form_change_service_test.dart
            flutter pub get
            flutter analyze
            flutter test test/battle_form_change_service_test.dart --reporter expanded
            flutter test test/battle_temporary_hp_service_test.dart --reporter expanded
          } >> "$log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.work.outputs.status }}'
          rm -f \
            .github/workflows/retry-finalize-italian-form-names.yml \
            .github/workflows/finalize-italian-form-names.yml
          if [ "$status" = '0' ]; then
            rm -f italian-form-names-validation.txt
            rm -f docs/diagnostics/official-form-names-validation.txt
            rmdir docs/diagnostics 2>/dev/null || true
          else
            mkdir -p docs/diagnostics
            mv italian-form-names-validation.txt docs/diagnostics/italian-form-names-validation.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Finalizza nomi italiani e asset delle forme (stato $status)"
          git push origin HEAD:main
