name: Apply breeder upgrade

on:
  push:
    branches:
      - feature/breeder-traits
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: breeder-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[breeder-upgrade-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/breeder-traits
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode and apply breeder upgrade
        run: |
          base64 -d tool/apply_breeder_upgrade.py.gz.b64 | gzip -d > /tmp/apply_breeder_upgrade.py
          python /tmp/apply_breeder_upgrade.py

      - name: Format Dart sources
        run: dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit generated changes
        run: |
          rm -f tool/apply_breeder_upgrade.py.gz.b64 .github/workflows/apply-breeder-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completa il percorso Pokémon Breeder [breeder-upgrade-applied]"
          git push origin HEAD:feature/breeder-traits
