name: One-time full move catalog

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-full-move-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-move-catalog-impl
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply feature patch
        run: python3 .github/scripts/patch_full_move_catalog.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/repositories/move_repository.dart \
            lib/screens/pokemon/pokemon_edit_screen.dart \
            test/full_move_catalog_test.dart

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-full-move-catalog.yml
          git rm .github/scripts/patch_full_move_catalog.py
          git add CHANGELOG.md lib test/full_move_catalog_test.dart
          git commit -m 'Aggiunge il catalogo completo delle mosse'
          git push origin feature/full-move-catalog-impl

# trigger implementation retry 2
