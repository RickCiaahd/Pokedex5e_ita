# Temporary layout application and APK verification
name: Build compact test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/build-compact-test-apk.yml
      - lib/screens/battle/battle_screen.dart
      - lib/widgets/battle/battle_environment_card.dart
      - lib/widgets/battle/pokemon_battle_attributes_card.dart
      - lib/screens/pokemon/pokemon_detail_screen_legacy.dart
      - lib/screens/trainer/trainer_sheet_screen.dart
      - lib/screens/trainer/trainer_sheet_mobile.dart
      - lib/screens/onboarding/first_launch_onboarding_screen.dart
      - lib/screens/bag/bag_screen.dart
      - lib/services/profile_creation_service.dart
      - lib/repositories/bag_inventory_repository.dart
      - lib/repositories/item_repository.dart
      - lib/models/trainer_starting_equipment.dart

permissions:
  contents: write

concurrency:
  group: compact-test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Apply Bag layout and build Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply compact Bag layout
        run: |
          python tool/apply_bag_layout.py
          dart format lib/screens/bag/bag_screen.dart

      - name: Commit Bag layout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Bag layout already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/bag/bag_screen.dart
          git commit -m "Riorganizza lo Zaino con azioni fisse in basso"
          git push origin HEAD:feature/compact-pokemon-detail-v2

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Bag screen
        run: flutter analyze lib/screens/bag/bag_screen.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare downloadable file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/Pokedex5e-compact-test-${SHORT_SHA}.apk"
          printf 'Branch: %s\nCommit: %s\nBuild type: debug APK\n' "feature/compact-pokemon-detail-v2" "$(git rev-parse HEAD)" > dist/BUILD-INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5e-compact-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
