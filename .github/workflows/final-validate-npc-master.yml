# Final validation for the NPC library and Master fight.
name: Final validate NPC master fight

on:
  push:
    branches:
      - feat/npc-library-master-fight
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/npc-library-master-fight
          fetch-depth: 0

      - name: Apply final fixes and cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model = Path('lib/models/master_battle_session.dart')
          source = model.read_text(encoding='utf-8')
          source = source.replace(
              '    while (active.length > safeLimit) active.remove(active.last);\n',
              '    while (active.length > safeLimit) {\n      active.remove(active.last);\n    }\n',
              1,
          )
          model.write_text(source, encoding='utf-8')

          battle = Path('lib/screens/battle/npc_battle_screen.dart')
          source = battle.read_text(encoding='utf-8')
          source = source.replace('    final pokemon = generated.pokemon;\n', '', 1)
          old_details = '''    final damage = move?.damageForLevel(level)?.label;
    final details = [
      if (move != null) move!.type,
      if (damage != null) damage,
      if (move != null && move!.range != '-') move!.range,
      if (move != null && move!.save != null) 'TS ${move!.save}',
    ].join(' · ');
'''
          new_details = '''    final damage = move?.damageForLevel(level)?.label;
    final details = <String?>[
      move?.type,
      damage,
      move?.range == '-' ? null : move?.range,
      move?.save == null ? null : 'TS ${move!.save}',
    ].whereType<String>().join(' · ');
'''
          if old_details in source:
              source = source.replace(old_details, new_details, 1)
          source = source.replace(
              '  late Set<String> _volatile = {...widget.volatile};\n',
              '  late final Set<String> _volatile = {...widget.volatile};\n',
              1,
          )
          source = source.replace(
              '            items: const [\n'
              "              DropdownMenuItem<String?>(value: null, child: Text('Nessuno')),\n"
              '              for (final status in _nonVolatileStatuses)\n'
              '                DropdownMenuItem<String?>(value: status, child: Text(status)),\n'
              '            ],\n',
              '            items: [\n'
              "              const DropdownMenuItem<String?>(value: null, child: Text('Nessuno')),\n"
              '              for (final status in _nonVolatileStatuses)\n'
              '                DropdownMenuItem<String?>(value: status, child: Text(status)),\n'
              '            ],\n',
              1,
          )
          battle.write_text(source, encoding='utf-8')

          library = Path('lib/screens/tools/npc_trainer_library_screen.dart')
          source = library.read_text(encoding='utf-8')
          source = source.replace(
              "import '../../models/master_battle_session.dart';\n",
              '',
              1,
          )
          source = source.replace(
              '      if (replace != true) return;\n    }\n\n    final activeCounts = await showDialog<Map<String, int>>(\n',
              '      if (replace != true) return;\n      if (!mounted) return;\n    }\n\n    final activeCounts = await showDialog<Map<String, int>>(\n',
              1,
          )
          library.write_text(source, encoding='utf-8')

          for relative in [
              'tool/npc-master-analyze.txt',
              'tool/npc-master-tests.txt',
              'tool/npc-master-full-tests.txt',
              '.github/workflows/final-validate-npc-master.yml',
          ]:
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/models/master_battle_session.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: flutter test test/npc_library_master_battle_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize NPC library and multi-trainer master fight" || true
          git push origin feat/npc-library-master-fight
