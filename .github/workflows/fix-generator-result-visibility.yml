name: Fix generator result visibility

on:
  push:
    branches:
      - fix/generator-result-visibility
    paths:
      - '.github/workflows/fix-generator-result-visibility.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/generator-result-visibility
          fetch-depth: 0

      - name: Apply visibility fix
        run: python3 tool/apply_generator_result_visibility_fix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format generator screen
        run: dart format lib/screens/tools/pokemon_generator_screen.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run generator tests
        run: |
          flutter test test/pokemon_generator_service_test.dart
          flutter test test/pokemon_generator_multi_select_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Remove temporary files
        run: |
          rm -f tool/apply_generator_result_visibility_fix.py
          rm -f .github/workflows/fix-generator-result-visibility.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep generated Pokémon results visible"
          git push origin fix/generator-result-visibility
