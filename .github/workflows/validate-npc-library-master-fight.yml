name: Validate NPC library and master fight

on:
  push:
    branches:
      - feat/npc-library-master-fight
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/npc-library-master-fight
          fetch-depth: 0

      - name: Normalize patch anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = Path('lib/services/profile_backup_service.dart')
          text = target.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)_savedEncounterRepository =\n'
              r'(?P<continuation>\s*)savedEncounterRepository \?\? SavedEncounterRepository\(\);$'
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('Profile backup initializer not found')
          indent = match.group('indent')
          continuation = match.group('continuation')
          replacement = (
              f'{indent}_savedEncounterRepository =\n'
              f'{continuation}savedEncounterRepository ?? SavedEncounterRepository(),\n'
              f'{indent}_savedNpcTrainerRepository =\n'
              f'{continuation}savedNpcTrainerRepository ?? SavedNpcTrainerRepository(),\n'
              f'{indent}_masterBattleSessionRepository = masterBattleSessionRepository ??\n'
              f'{continuation}MasterBattleSessionRepository();'
          )
          target.write_text(pattern.sub(replacement, text, count=1), encoding='utf-8')

          patch = Path('tool/apply_npc_library_master_fight.py')
          source = patch.read_text(encoding='utf-8')
          marker = "'backup service initializer',"
          marker_index = source.index(marker)
          block_start = source.rfind('source = replace_once(', 0, marker_index)
          block_end = source.index('source = replace_once(', marker_index + len(marker))
          source = source[:block_start] + '# initializer patched by workflow\n' + source[block_end:]
          patch.write_text(source, encoding='utf-8')
          PY

      - name: Apply integration
        run: python3 tool/apply_npc_library_master_fight.py

      - name: Remove temporary automation
        run: |
          rm tool/apply_npc_library_master_fight.py
          rm .github/workflows/validate-npc-library-master-fight.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/database/hive_boxes.dart \
            lib/models/saved_npc_trainer.dart \
            lib/models/master_battle_session.dart \
            lib/models/profile_backup.dart \
            lib/repositories/saved_npc_trainer_repository.dart \
            lib/repositories/master_battle_session_repository.dart \
            lib/services/saved_npc_trainer_mapper_service.dart \
            lib/services/master_battle_service.dart \
            lib/services/profile_backup_service.dart \
            lib/screens/tools/tools_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/profile/profiles_screen.dart \
            test/npc_library_master_battle_test.dart

      - name: Check diff
        run: git diff --check

      - name: Commit formatted implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply NPC library and multi-trainer master fight"
          git push origin feat/npc-library-master-fight

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee npc-master-analyze.txt

      - name: Upload analyze diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-master-analyze
          path: npc-master-analyze.txt

      - name: Stop after analyze failure
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run NPC library and fight tests
        run: flutter test test/npc_library_master_battle_test.dart

      - name: Run full test suite
        run: flutter test
