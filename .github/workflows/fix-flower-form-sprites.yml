name: Fix Floette and Florges form sprites

on:
  push:
    branches:
      - fix/floette-florges-form-sprites

permissions:
  contents: write

concurrency:
  group: fix-flower-form-sprites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/floette-florges-form-sprites
          fetch-depth: 0

      - name: Download canonical 40x30 form icons
        shell: bash
        run: |
          set -euo pipefail
          root='assets/textures/sprites'
          base='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-vii/icons'
          mkdir -p "$root"

          download_icon() {
            local form_id="$1"
            local target="$2"
            curl -fsSL --retry 3 --retry-delay 2 \
              "$base/${form_id}.png" \
              -o "$root/$target"
          }

          # PokeAPI form IDs for the non-red flower forms.
          download_icon 10109 '670Floette Blue Flower.png'
          download_icon 10108 '670Floette Orange Flower.png'
          download_icon 10110 '670Floette White Flower.png'
          download_icon 10107 '670Floette Yellow Flower.png'
          download_icon 10061 '670Floette Eternal Flower.png'
          download_icon 10113 '671Florges Blue Flower.png'
          download_icon 10112 '671Florges Orange Flower.png'
          download_icon 10114 '671Florges White Flower.png'
          download_icon 10111 '671Florges Yellow Flower.png'

      - name: Validate downloaded compact PNG icons
        shell: python
        run: |
          from pathlib import Path
          import struct

          root = Path('assets/textures/sprites')

          def png_size(path: Path):
              data = path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'Not a PNG: {path}'
              width, height = struct.unpack('>II', data[16:24])
              return width, height

          expected = {
              670: png_size(root / '670Floette.png'),
              671: png_size(root / '671Florges.png'),
          }
          forms = {
              670: ('Floette', ['Blue Flower', 'Orange Flower', 'White Flower', 'Yellow Flower', 'Eternal Flower']),
              671: ('Florges', ['Blue Flower', 'Orange Flower', 'White Flower', 'Yellow Flower']),
          }
          for pokemon_id, (name, labels) in forms.items():
              assert expected[pokemon_id] == (40, 30), (
                  f'Unexpected base icon size for {name}: {expected[pokemon_id]}'
              )
              for label in labels:
                  path = root / f'{pokemon_id}{name} {label}.png'
                  size = png_size(path)
                  assert size == expected[pokemon_id], (
                      f'{path} has {size}, expected compact icon size {expected[pokemon_id]}'
                  )
                  assert path.stat().st_size < 20_000, f'Unexpectedly large icon: {path}'
                  print(f'OK {path}: {size[0]}x{size[1]}, {path.stat().st_size} bytes')

      - name: Update flower sprite regression coverage
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/deoxys_floette_form_regression_test.dart')
          text = path.read_text(encoding='utf-8')
          marker = "  testWidgets('Flower artwork bundle uses dedicated artwork, not bad sprites', ("
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Expected flower regression test was not found')

          replacement = r'''  testWidgets('Flower forms keep dedicated artwork and compact sprites', (
            tester,
          ) async {
            final catalog = await PokemonRepository().getAllPokemon();
            final floette = catalog.firstWhere((p) => p.id == 670);
            final florges = catalog.firstWhere((p) => p.id == 671);
            final assets = (await AssetManifest.loadFromAssetBundle(
              rootBundle,
            )).listAssets();
            const forms = [
              'Blue Flower',
              'Orange Flower',
              'White Flower',
              'Yellow Flower',
            ];
            for (final form in forms) {
              final floetteArtwork =
                  'assets/textures/pokemons/670Floette $form.png';
              final florgesArtwork =
                  'assets/textures/pokemons/671Florges $form.png';
              final floetteShinyArtwork =
                  'assets/textures/pokemons/670Floette $form Shiny.png';
              final florgesShinyArtwork =
                  'assets/textures/pokemons/671Florges $form Shiny.png';
              final floetteSprite =
                  'assets/textures/sprites/670Floette $form.png';
              final florgesSprite =
                  'assets/textures/sprites/671Florges $form.png';

              expect(assets, contains(floetteArtwork));
              expect(assets, contains(florgesArtwork));
              expect(assets, contains(floetteShinyArtwork));
              expect(assets, contains(florgesShinyArtwork));
              expect(assets, contains(floetteSprite));
              expect(assets, contains(florgesSprite));

              final floetteCompact = PokemonAssetPaths.imageCandidates(
                pokemon: floette,
                useLargeArtwork: false,
                formName: form,
              );
              final florgesCompact = PokemonAssetPaths.imageCandidates(
                pokemon: florges,
                useLargeArtwork: false,
                formName: form,
              );
              final floetteShinyCompact = PokemonAssetPaths.imageCandidates(
                pokemon: floette,
                useLargeArtwork: false,
                formName: form,
                isShiny: true,
              );
              final florgesShinyCompact = PokemonAssetPaths.imageCandidates(
                pokemon: florges,
                useLargeArtwork: false,
                formName: form,
                isShiny: true,
              );
              final floetteShinyArtworkCandidates =
                  PokemonAssetPaths.imageCandidates(
                    pokemon: floette,
                    useLargeArtwork: true,
                    formName: form,
                    isShiny: true,
                  );
              final florgesShinyArtworkCandidates =
                  PokemonAssetPaths.imageCandidates(
                    pokemon: florges,
                    useLargeArtwork: true,
                    formName: form,
                    isShiny: true,
                  );

              expect(floetteCompact, contains(floetteSprite));
              expect(florgesCompact, contains(florgesSprite));
              expect(floetteShinyCompact, contains(floetteSprite));
              expect(florgesShinyCompact, contains(florgesSprite));
              expect(
                floetteCompact.indexOf(floetteSprite),
                lessThan(floetteCompact.indexOf(floetteArtwork)),
              );
              expect(
                florgesCompact.indexOf(florgesSprite),
                lessThan(florgesCompact.indexOf(florgesArtwork)),
              );
              expect(
                floetteShinyCompact.indexOf(floetteSprite),
                lessThan(floetteShinyCompact.indexOf(floetteShinyArtwork)),
              );
              expect(
                florgesShinyCompact.indexOf(florgesSprite),
                lessThan(florgesShinyCompact.indexOf(florgesShinyArtwork)),
              );
              expect(
                floetteShinyArtworkCandidates,
                contains(floetteShinyArtwork),
              );
              expect(
                florgesShinyArtworkCandidates,
                contains(florgesShinyArtwork),
              );
            }

            const eternalArtwork =
                'assets/textures/pokemons/670Floette Eternal Flower.png';
            const eternalSprite =
                'assets/textures/sprites/670Floette Eternal Flower.png';
            expect(assets, contains(eternalArtwork));
            expect(assets, contains(eternalSprite));
            final eternalCompact = PokemonAssetPaths.imageCandidates(
              pokemon: floette,
              useLargeArtwork: false,
              formName: 'Eternal Flower',
            );
            expect(eternalCompact, contains(eternalSprite));
            expect(
              eternalCompact.indexOf(eternalSprite),
              lessThan(eternalCompact.indexOf(eternalArtwork)),
            );
          });
        }
'''
          path.write_text(text[:start] + replacement, encoding='utf-8')

      - name: Regenerate compliance inventories
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py --check
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format regression test
        run: dart format test/deoxys_floette_form_regression_test.dart

      - name: Run flower form regression test
        run: flutter test test/deoxys_floette_form_regression_test.dart --reporter expanded

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Commit verified fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-flower-form-sprites.yml
          git add assets/textures/sprites test/deoxys_floette_form_regression_test.dart docs/compliance assets/legal .github/workflows/fix-flower-form-sprites.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ripristina gli sprite delle forme floreali'
          git push origin HEAD:fix/floette-florges-form-sprites
