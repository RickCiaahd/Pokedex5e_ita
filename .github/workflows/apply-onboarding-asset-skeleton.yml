class _LaboratorySkeletonPainter extends CustomPainter {
  const _LaboratorySkeletonPainter();

  @override
  void paint(Canvas canvas, Size size) {
    final windowPaint = Paint()..color = const Color(0xFFDCE8E6);
    final wood = Paint()..color = const Color(0xFFC7B8A9);
    final plant = Paint()..color = const Color(0xFFB8CDA9);

    final window = Rect.fromLTWH(
      size.width * .05,
      size.height * .10,
      size.width * .34,
      size.height * .40,
    );
    canvas.drawRRect(
      RRect.fromRectAndRadius(window, const Radius.circular(10)),
      windowPaint,
    );
    canvas.drawRect(
      Rect.fromLTWH(window.center.dx - 2, window.top, 4, window.height),
      wood,
    );
    canvas.drawRect(
      Rect.fromLTWH(window.left, window.center.dy - 2, window.width, 4),
      wood,
    );

    for (var index = 0; index < 4; index++) {
      final y = size.height * (.18 + index * .10);
      canvas.drawRect(
        Rect.fromLTWH(size.width * .72, y, size.width * .22, 4),
        wood,
      );
      canvas.drawRRect(
        RRect.fromRectAndRadius(
          Rect.fromLTWH(size.width * .76, y - 22, size.width * .06, 22),
          const Radius.circular(3),
        ),
        plant,
      );
    }

    canvas.drawRect(
      Rect.fromLTWH(0, size.height * .78, size.width, size.height * .22),
      Paint()..color = const Color(0xFFE0D1C3),
    );
  }

  @override
  bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
}
