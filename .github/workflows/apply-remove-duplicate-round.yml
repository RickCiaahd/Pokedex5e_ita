name: Apply duplicate round removal

on:
  push:
    branches:
      - agent/remove-duplicate-round-control
    paths:
      - tooling/apply_remove_duplicate_round.py
      - .github/workflows/apply-remove-duplicate-round.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-duplicate-round-control
          fetch-depth: 0

      - name: Apply changes
        run: python tooling/apply_remove_duplicate_round.py

      - name: Remove temporary files and commit
        run: |
          rm tooling/apply_remove_duplicate_round.py
          rm .github/workflows/apply-remove-duplicate-round.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rimuove il controllo Nuovo round duplicato"
          git push origin HEAD:agent/remove-duplicate-round-control
