name: Apply eggs in team

on:
  push:
    branches:
      - agent/eggs-in-team-and-daycare
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/eggs-in-team-and-daycare' || github.ref_name == 'agent/eggs-in-team-and-daycare'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/eggs-in-team-and-daycare

      - name: Normalize patch script
        run: python .github/agent/fix_apply_eggs_script.py

      - name: Apply changes
        run: |
          set -o pipefail
          python .github/agent/apply_eggs_in_team.py 2>&1 | tee apply-eggs.log

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-eggs-log
          path: apply-eggs.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit generated changes
        run: |
          rm .github/agent/apply_eggs_in_team.py
          rm .github/agent/fix_apply_eggs_script.py
          rm .github/workflows/agent-apply-eggs-in-team.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge le uova come entità della squadra"
          git push origin HEAD:agent/eggs-in-team-and-daycare
