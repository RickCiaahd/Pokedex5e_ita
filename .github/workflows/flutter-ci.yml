name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  position_professor:
    name: Position professor behind dialogue
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Posiziona il Professore come nel mockup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Adjust professor and card overlap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/onboarding/first_launch_onboarding_screen.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """    final compactCardFactor = switch (_step) {
            6 => .46,
            7 => .42,
            8 || 9 => .54,
            _ => .55,
          };""",
                  """    final compactCardFactor = switch (_step) {
            6 => .46,
            7 => .36,
            8 || 9 => .50,
            _ => .48,
          };""",
              ),
              (
                  """        final proposedCardTop = constraints.maxHeight * compactCardTopFactor;
          final maximumCardTop = math.max(160.0, constraints.maxHeight - 140);
          final cardTop = math.min(
            maximumCardTop,
            math.max(190.0, proposedCardTop),
          );
          final horizontalInset = constraints.maxWidth < 760 ? 14.0 : 34.0;""",
                  """        final compact = constraints.maxWidth < 760;
          final proposedCardTop = constraints.maxHeight * compactCardTopFactor;
          final minimumCardTop = compact ? 170.0 : 210.0;
          final maximumCardTop = math.max(
            minimumCardTop,
            constraints.maxHeight - 140,
          );
          final cardTop = math.min(
            maximumCardTop,
            math.max(minimumCardTop, proposedCardTop),
          );
          final horizontalInset = compact ? 8.0 : 28.0;
          final professorInset = compact ? 4.0 : 72.0;
          final professorOverlap = compact
              ? math.min(220.0, math.max(132.0, cardTop * .48))
              : math.min(260.0, math.max(170.0, cardTop * .42));""",
              ),
              (
                  """                  Positioned(
            left: constraints.maxWidth < 760 ? 28 : 88,
            right: constraints.maxWidth < 760 ? 28 : 88,
            top: 8,
            height: cardTop + 78,
            child: const _ProfessorPortrait(),
          ),""",
                  """                  Positioned(
            left: professorInset,
            right: professorInset,
            top: compact ? 0 : 8,
            height: cardTop + professorOverlap,
            child: const _ProfessorPortrait(),
          ),""",
              ),
              (
                  """      fit: BoxFit.contain,
            alignment: Alignment.bottomCenter,""",
                  """      fit: BoxFit.cover,
            alignment: Alignment.topCenter,""",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Blocco atteso non trovato una sola volta: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/screens/onboarding/first_launch_onboarding_screen.dart
          rm -f .github/workflows/adjust-professor-position.yml

      - name: Commit positioning changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Posiziona il Professore dietro la card di dialogo'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
