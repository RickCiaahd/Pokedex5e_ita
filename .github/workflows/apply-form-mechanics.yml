name: Apply mechanical Pokemon forms

on:
  push:
    branches:
      - feat/form-mechanics
    paths:
      - .github/workflows/apply-form-mechanics.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply screen and test migration
        run: python3 tool/apply_form_mechanics_screens.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/pokemon.dart \
            lib/repositories/pokemon_repository.dart \
            lib/widgets/pokemon/pokemon_asset_image.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/pokemon/pokemon_detail_screen.dart \
            lib/screens/pokemon/pokemon_edit_screen.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/bag/bag_screen.dart \
            test/pokemon_form_mechanics_test.dart

      - name: Check generated diff
        run: git diff --check

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run form mechanics tests
        run: flutter test test/pokemon_form_mechanics_test.dart test/pokemon_asset_paths_test.dart

      - name: Remove temporary automation files
        run: |
          rm tool/apply_form_mechanics_screens.py
          rm .github/workflows/apply-form-mechanics.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mechanical Pokemon form support"
          git push origin feat/form-mechanics
