name: Apply compact header follow-up

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/apply-compact-header-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Apply compact header follow-up
        run: python tool/apply_compact_header_followup.py

      - name: Validate patch
        run: git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokemon/pokemon_detail_screen_legacy.dart
          git commit -m "Rifinisci metriche ed evoluzione nella scheda compatta"
          git push origin HEAD:feature/compact-pokemon-detail-v2
