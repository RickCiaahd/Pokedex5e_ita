name: Check release prerequisites

on:
  push:
    paths:
      - '.github/workflows/check-release-prerequisites.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record prerequisite status
        shell: bash
        run: |
          rm -f .github/workflows/check-release-prerequisites.yml
          missing=0
          {
            echo '# Stato preflight release 1.0.0'
            echo
            echo 'Prerequisiti mancanti o non validi:'
            echo
            if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
              echo '- ANDROID_KEYSTORE_BASE64'
              missing=1
            fi
            if [ -z "$ANDROID_STORE_PASSWORD" ]; then
              echo '- ANDROID_STORE_PASSWORD'
              missing=1
            fi
            if [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo '- ANDROID_KEY_PASSWORD'
              missing=1
            fi
            if [ -z "$ANDROID_KEY_ALIAS" ]; then
              echo '- ANDROID_KEY_ALIAS'
              missing=1
            fi
            VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
            if [ "$VERSION" != '1.0.0' ]; then
              echo "- versione pubspec inattesa: $VERSION"
              missing=1
            fi
            if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
              echo '- il tag v1.0.0 esiste già'
              missing=1
            fi
            if [ "$missing" -eq 0 ]; then
              echo '- nessuno'
            fi
            echo
            echo 'Configurare gli eventuali secret indicati seguendo docs/android-release.md.'
          } > docs/release-preflight-status.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if [ "$missing" -eq 0 ]; then
            rm -f docs/release-preflight-status.md
            git add -A
            git commit -m 'Avvia la release GitHub 1.0.0'
            git tag -a v1.0.0 -m 'Pokédex 5e ITA 1.0.0'
            git push origin HEAD:main
            git push origin v1.0.0
          else
            git commit -m 'Dettaglia i prerequisiti mancanti della release 1.0.0'
            git push origin HEAD:main
          fi
