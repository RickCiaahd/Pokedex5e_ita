name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  apply_guided_submenu_tours:
    name: Apply guided submenu tours
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Aggiunge i tour guidati ai principali sottomenu'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair patch script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tooling/apply_guided_submenu_tours.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              trainer,
              """  final TextEditingController nameController;
          """,
              """  final GlobalKey progressionKey;
            final TextEditingController nameController;
          """,
          )'''
          new = '''replace_once(
              trainer,
              """  final TextEditingController nameController;
            final TextEditingController moneyController;
            final String race;
            final String raceDescription;
            final Pokemon? selectedStarter;
            final String startingPack;
            final int trainerLevel;
            final String trainerPath;
          """,
              """  final GlobalKey progressionKey;
            final TextEditingController nameController;
            final TextEditingController moneyController;
            final String race;
            final String raceDescription;
            final Pokemon? selectedStarter;
            final String startingPack;
            final int trainerLevel;
            final String trainerPath;
          """,
          )'''
          if old not in text:
              raise SystemExit('Blocco di correzione dello script non trovato.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply submenu tour integration
        shell: bash
        run: |
          set -o pipefail
          python3 tooling/apply_guided_submenu_tours.py 2>&1 | tee guided-tour-apply.log

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-tour-apply-log
          path: guided-tour-apply.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aggiunge i tour guidati ai principali sottomenu'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
