name: Apply localized onboarding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out onboarding branch
        uses: actions/checkout@v4
        with:
          ref: feature/localized-onboarding
          fetch-depth: 0

      - name: Apply onboarding localization and capture diagnostics
        shell: bash
        run: |
          set +e
          python tooling/apply_localized_onboarding.py > onboarding_apply_error.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add onboarding_apply_error.log
            git commit -m "Registra errore localizzazione onboarding [skip ci]"
            git push origin HEAD:feature/localized-onboarding
          fi
          cat onboarding_apply_error.log
          exit "$status"
