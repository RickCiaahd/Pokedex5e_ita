name: Bootstrap Fakemon phase 7 from PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and apply phase 7 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase7-fakemon-integration.yml').read_text()
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n      - uses: subosito/flutter-action@v2', start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/apply-phase7.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-phase7.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/repositories/move_repository.dart \
            lib/services/custom_pokemon_runtime_registry.dart \
            lib/models/custom_pokemon_definition.dart \
            lib/models/breeding_species_data.dart \
            lib/services/custom_pokemon_transfer_service.dart \
            lib/services/embedded_custom_pokemon_transfer_service.dart \
            lib/screens/pokemon/custom_pokemon_library_screen.dart \
            lib/screens/tools/pokemon_generator_screen.dart \
            lib/widgets/tools/generated_pokemon_batch_card.dart \
            lib/screens/tools/encounter_result_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/battle/battle_screen.dart \
            test/fakemon_phase7_integration_test.dart

      - name: Commit phase 7 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase7-fakemon-integration.yml
          git rm .github/workflows/phase7-pr-bootstrap.yml
          git add .
          git commit -m "Completa integrazione Fakemon nei flussi di gioco"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
