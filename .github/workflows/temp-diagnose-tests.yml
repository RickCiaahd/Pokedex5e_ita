name: Diagnose failing Flutter tests

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-diagnose-tests.yml

permissions:
  contents: read

jobs:
  diagnose-tests:
    if: github.event.head_commit.message == 'Diagnose failing Flutter tests'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Diagnose test files individually
        id: diagnose
        shell: bash
        run: |
          set +e
          failed=0
          total=0
          : > test-failures.txt
          : > failed-files.txt

          while IFS= read -r file; do
            total=$((total+1))
            echo "[$total] $file"
            tmp="$(mktemp)"
            flutter test "$file" --reporter expanded >"$tmp" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=$((failed+1))
              echo "$file" >> failed-files.txt
              {
                echo "===== FAILED: $file ====="
                tail -n 300 "$tmp"
                echo
              } >> test-failures.txt
            fi
            rm -f "$tmp"
          done < <(find test -type f -name '*_test.dart' | sort)

          {
            echo "TOTAL_TEST_FILES=$total"
            echo "FAILED_COUNT=$failed"
            echo "FAILED_FILES:"
            cat failed-files.txt
          } >> test-failures.txt

          echo "$failed" > failed-count.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-failures
          path: |
            test-failures.txt
            failed-files.txt
            failed-count.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when tests failed
        shell: bash
        run: |
          failed="$(cat failed-count.txt)"
          echo "Failed test files: $failed"
          test "$failed" -eq 0
