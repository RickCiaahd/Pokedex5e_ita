name: Apply compact Pokedex UI once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-compact-pokedex-ui.yml
      - tool/compact_pokedex_and_team_hp_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Apply Pokedex and team HP patch
        run: python tool/compact_pokedex_and_team_hp_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed screens
        run: dart format lib/screens/pokedex/pokedex_screen.dart lib/screens/team/team_selection_screen.dart

      - name: Analyze changed screens
        run: flutter analyze lib/screens/pokedex/pokedex_screen.dart lib/screens/team/team_selection_screen.dart

      - name: Remove one-shot patch files
        run: |
          rm tool/compact_pokedex_and_team_hp_patch.py
          rm .github/workflows/temp-compact-pokedex-ui.yml

      - name: Commit compact Pokedex UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokedex/pokedex_screen.dart lib/screens/team/team_selection_screen.dart tool/compact_pokedex_and_team_hp_patch.py .github/workflows/temp-compact-pokedex-ui.yml
          git commit -m "Compatta i filtri Pokédex e colora i PF squadra"
          git push origin HEAD:feature/compact-pokemon-detail-v2
