name: Compliance audit

on:
  pull_request:
    paths:
      - '.github/workflows/compliance-audit.yml'
      - '.github/apply_ability_grid.py'

permissions:
  contents: write

concurrency:
  group: compliance-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-trainer-layout:
    if: github.event.pull_request.head.ref == 'release/1.4.0-beta1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.4.0-beta1
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply and verify the 2x3 ability grid
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply_ability_grid.py
          dart format lib/screens/trainer/trainer_sheet_screen.dart
          flutter pub get
          flutter analyze lib/screens/trainer/trainer_sheet_screen.dart

      - name: Restore permanent workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply_ability_grid.py
          rm -f .github/.ability-grid-trigger
          rm -f .github/workflows/apply-trainer-ability-grid.yml
          rm -f .github/workflows/apply-trainer-ability-grid-v2.yml

          git fetch origin main
          git show origin/main:.github/workflows/compliance-audit.yml > .github/workflows/compliance-audit.yml
          git show origin/main:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/trainer/trainer_sheet_screen.dart .github/
          git commit -m 'Disponi le caratteristiche su due righe e tre colonne'
          git push origin HEAD:release/1.4.0-beta1
