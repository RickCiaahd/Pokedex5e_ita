name: Apply trainer ability grid fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-trainer-ability-grid.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'release/1.4.0-beta1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.4.0-beta1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply two-row, three-column ability layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/trainer/trainer_sheet_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import '../../widgets/layout/responsive_content.dart';\n"
          if import_line not in text:
              raise SystemExit('Expected responsive_content import was not found.')
          text = text.replace(import_line, '', 1)

          selected_skills = """    final selectedSkills = [
              ...TrainerManualOptions.fixedSkillProficiencies,
              ...skillProficiencies,
            ];
          """
          selected_skills_replacement = """    final selectedSkills = [
              ...TrainerManualOptions.fixedSkillProficiencies,
              ...skillProficiencies,
            ];
            final abilityEntries = UserProfile.defaultAbilityScores.entries.toList();
          """
          if text.count(selected_skills) != 1:
              raise SystemExit('Could not identify the selectedSkills block exactly once.')
          text = text.replace(selected_skills, selected_skills_replacement, 1)

          old_grid = """        Wrap(
              spacing: 8,
              runSpacing: 8,
              children: [
                for (final entry in UserProfile.defaultAbilityScores.entries)
                  _AbilityScoreTile(
                    label: TrainerUiLocalization.abilityAbbreviation(entry.key),
                    score: abilityScores[entry.key] ?? entry.value,
                    onDecrease: () => onAbilityScoreChanged(entry.key, -1),
                    onIncrease: () => onAbilityScoreChanged(entry.key, 1),
                  ),
              ],
            ),
          """
          new_grid = """        Column(
              children: [
                for (var row = 0; row < 2; row++) ...[
                  Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      for (var column = 0; column < 3; column++) ...[
                        if (column > 0) const SizedBox(width: 8),
                        Expanded(
                          child: _AbilityScoreTile(
                            label: TrainerUiLocalization.abilityAbbreviation(
                              abilityEntries[(row * 3) + column].key,
                            ),
                            score:
                                abilityScores[abilityEntries[(row * 3) + column].key] ??
                                abilityEntries[(row * 3) + column].value,
                            onDecrease: () => onAbilityScoreChanged(
                              abilityEntries[(row * 3) + column].key,
                              -1,
                            ),
                            onIncrease: () => onAbilityScoreChanged(
                              abilityEntries[(row * 3) + column].key,
                              1,
                            ),
                          ),
                        ),
                      ],
                    ],
                  ),
                  if (row == 0) const SizedBox(height: 8),
                ],
              ],
            ),
          """
          if text.count(old_grid) != 1:
              raise SystemExit('Could not identify the current ability Wrap exactly once.')
          text = text.replace(old_grid, new_grid, 1)

          old_width = """      child: SizedBox(
                width: textScaleAwareValue(
                  context,
                  normal: 104,
                  enlarged: 116,
                ),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 8),
          """
          new_width = """      child: SizedBox(
                width: double.infinity,
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 2, vertical: 8),
          """
          if text.count(old_width) != 1:
              raise SystemExit('Could not identify the ability tile width block exactly once.')
          text = text.replace(old_width, new_width, 1)

          old_button = """                  IconButton(
                        visualDensity: Theme.of(context).visualDensity,
                        tooltip: context.uiText(
          """
          new_button = """                  IconButton(
                        padding: EdgeInsets.zero,
                        constraints: const BoxConstraints.tightFor(
                          width: 36,
                          height: 40,
                        ),
                        visualDensity: VisualDensity.compact,
                        tooltip: context.uiText(
          """
          if text.count(old_button) < 2:
              raise SystemExit('Expected both ability score IconButtons were not found.')
          text = text.replace(old_button, new_button, 2)

          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/screens/trainer/trainer_sheet_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze updated trainer sheet
        run: flutter analyze lib/screens/trainer/trainer_sheet_screen.dart

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-trainer-ability-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/trainer/trainer_sheet_screen.dart .github/workflows/apply-trainer-ability-grid.yml
          git commit -m 'Disponi le caratteristiche su due righe e tre colonne'
          git push origin HEAD:release/1.4.0-beta1
