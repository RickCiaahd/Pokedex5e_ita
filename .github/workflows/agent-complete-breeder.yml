name: Fix complete Pokemon Breeder

on:
  push:
    branches:
      - agent/complete-pokemon-breeder
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/complete-pokemon-breeder' || github.ref_name == 'agent/complete-pokemon-breeder'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-pokemon-breeder

      - name: Remove unused helper and restore permanent CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          screen = Path('lib/screens/breeding/breeding_screen.dart')
          text = screen.read_text(encoding='utf-8')
          pattern = (
              r'\n  Future<void> _updateEgg\('
              r'_BreedingScreenData data, BreedingEgg egg\) async \{'
              r'.*?\n  \}\n'
          )
          updated, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'Helper _updateEgg: atteso 1 match, trovati {count}')
          screen.write_text(updated, encoding='utf-8')

          Path('.github/workflows/flutter-ci.yml').write_text('''name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded
''', encoding='utf-8')
          PY

      - name: Commit final fixes
        run: |
          rm .github/workflows/agent-complete-breeder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregge l'analisi del Pokémon Breeder"
          git push origin HEAD:agent/complete-pokemon-breeder
