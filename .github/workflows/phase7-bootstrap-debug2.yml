name: Finalize Fakemon phase 7 bootstrap

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply flexible phase 7 patch
        id: patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase7-fakemon-integration.yml').read_text()
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n      - uses: subosito/flutter-action@v2', start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'
          original = (
              "def replace_once(path, old, new):\n"
              "    file = Path(path)\n"
              "    text = file.read_text()\n"
              "    count = text.count(old)\n"
              "    if count != 1:\n"
              "        raise RuntimeError(f\"{path}: expected one occurrence, found {count}\\n--- OLD ---\\n{old}\")\n"
              "    file.write_text(text.replace(old, new, 1))\n"
          )
          flexible = (
              "import textwrap\n"
              "\n"
              "def _shift_after_first(value, amount):\n"
              "    lines = value.splitlines(keepends=True)\n"
              "    if len(lines) <= 1:\n"
              "        return value\n"
              "    shifted = [lines[0]]\n"
              "    for line in lines[1:]:\n"
              "        prefix = len(line) - len(line.lstrip(' '))\n"
              "        remove = min(amount, prefix)\n"
              "        shifted.append(line[remove:])\n"
              "    return ''.join(shifted)\n"
              "\n"
              "def _fuzzy_replace(text, old, new):\n"
              "    old_lines = old.splitlines()\n"
              "    while old_lines and not old_lines[0].strip():\n"
              "        old_lines.pop(0)\n"
              "    while old_lines and not old_lines[-1].strip():\n"
              "        old_lines.pop()\n"
              "    if not old_lines:\n"
              "        return None\n"
              "    text_lines = text.splitlines(keepends=True)\n"
              "    matches = []\n"
              "    for start in range(0, len(text_lines) - len(old_lines) + 1):\n"
              "        chunk = text_lines[start:start + len(old_lines)]\n"
              "        if all(chunk[index].strip() == old_lines[index].strip() for index in range(len(old_lines))):\n"
              "            matches.append(start)\n"
              "    if len(matches) != 1:\n"
              "        return None\n"
              "    start = matches[0]\n"
              "    end = start + len(old_lines)\n"
              "    indent = len(text_lines[start]) - len(text_lines[start].lstrip(' '))\n"
              "    normalized = textwrap.dedent(new).strip('\\n')\n"
              "    replacement = '\\n'.join((' ' * indent + line if line else '') for line in normalized.splitlines())\n"
              "    if text_lines[end - 1].endswith('\\n'):\n"
              "        replacement += '\\n'\n"
              "    return ''.join(text_lines[:start]) + replacement + ''.join(text_lines[end:])\n"
              "\n"
              "def replace_once(path, old, new):\n"
              "    file = Path(path)\n"
              "    text = file.read_text()\n"
              "    if path == 'lib/screens/tools/pokemon_generator_screen.dart':\n"
              "        print(f'{path}: deferred-complete-generator')\n"
              "        return\n"
              "    candidates = [(old, new, 'exact')]\n"
              "    for amount in range(1, 13):\n"
              "        candidates.append((_shift_after_first(old, amount), _shift_after_first(new, amount), f'shift-after-first-{amount}'))\n"
              "    for candidate_old, candidate_new, label in candidates:\n"
              "        count = text.count(candidate_old)\n"
              "        if count == 1:\n"
              "            print(f'{path}: {label}')\n"
              "            file.write_text(text.replace(candidate_old, candidate_new, 1))\n"
              "            return\n"
              "    fuzzy = _fuzzy_replace(text, old, new)\n"
              "    if fuzzy is not None:\n"
              "        print(f'{path}: fuzzy-lines')\n"
              "        file.write_text(fuzzy)\n"
              "        return\n"
              "    raise RuntimeError(f\"{path}: no unique flexible occurrence found\\n--- OLD ---\\n{old}\")\n"
          )
          if original not in script:
              raise RuntimeError('Unable to replace the bootstrap helper.')
          Path('/tmp/apply-phase7.sh').write_text(script.replace(original, flexible, 1))
          PY
          set +e
          bash /tmp/apply-phase7.sh > .github/phase7-final-bootstrap.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            set +e
            python3 <<'PY' >> .github/phase7-final-bootstrap.txt 2>&1
          from pathlib import Path
          path = Path('lib/screens/tools/pokemon_generator_screen.dart')
          text = path.read_text()

          old = "      final moves = await _moveRepository.getMoves(generated.selectedMoves);"
          new = """      final moves = await _moveRepository.getMovesByPokemon({
                generated.basePokemon.id: generated.selectedMoves,
              });"""
          if text.count(old) != 1:
              raise RuntimeError('Single generator move lookup not found uniquely.')
          text = text.replace(old, new, 1)

          old = """  Future<Map<String, MoveData?>> _loadGeneratedMoves(
              Iterable<GeneratedPokemon> generated,
            ) {
              final references = <String>{
                for (final pokemon in generated) ...pokemon.selectedMoves,
              };
              return _moveRepository.getMoves(references);
            }
          """
          new = """  Future<Map<String, MoveData?>> _loadGeneratedMoves(
              Iterable<GeneratedPokemon> generated,
            ) {
              final referencesByPokemon = <int, Set<String>>{};
              for (final pokemon in generated) {
                referencesByPokemon
                    .putIfAbsent(pokemon.basePokemon.id, () => <String>{})
                    .addAll(pokemon.selectedMoves);
              }
              return _moveRepository.getMovesByPokemon(referencesByPokemon);
            }
          """
          if text.count(old) != 1:
              raise RuntimeError('Batch generator move loader not found uniquely.')
          text = text.replace(old, new, 1)

          old = "_generatedMoves[reference]?.id ?? reference"
          new = """_generatedMoves[
                    MoveRepository.contextualKey(
                      generated.basePokemon.id,
                      reference,
                    )
                  ]?.id ??
                  reference"""
          if text.count(old) != 2:
              raise RuntimeError(f'Expected two generated move references, found {text.count(old)}.')
          text = text.replace(old, new)

          old = "                      move: moves[reference],"
          new = """                      move: moves[
                        MoveRepository.contextualKey(
                          generated.basePokemon.id,
                          reference,
                        )
                      ],"""
          if text.count(old) != 1:
              raise RuntimeError('Generated move chip lookup not found uniquely.')
          text = text.replace(old, new, 1)
          path.write_text(text)
          print('pokemon_generator_screen.dart: supplemental contextual patch')
          PY
            supplemental_status=$?
            set -e
            if [ "$supplemental_status" -ne 0 ]; then
              status=$supplemental_status
            fi
          fi
          echo "exit_status=$status" >> .github/phase7-final-bootstrap.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.patch.outputs.status == '0'
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        if: steps.patch.outputs.status == '0'
        run: |
          dart format \
            lib/repositories/move_repository.dart \
            lib/services/custom_pokemon_runtime_registry.dart \
            lib/models/custom_pokemon_definition.dart \
            lib/models/breeding_species_data.dart \
            lib/services/custom_pokemon_transfer_service.dart \
            lib/services/embedded_custom_pokemon_transfer_service.dart \
            lib/screens/pokemon/custom_pokemon_library_screen.dart \
            lib/screens/tools/pokemon_generator_screen.dart \
            lib/widgets/tools/generated_pokemon_batch_card.dart \
            lib/screens/tools/encounter_result_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/battle/battle_screen.dart \
            test/fakemon_phase7_integration_test.dart

      - name: Commit implementation
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/phase7-bootstrap.txt .github/phase7-flex-bootstrap.txt .github/phase7-final-bootstrap.txt .github/phase7-trigger.txt .github/phase7-trigger2.txt phase7-bootstrap.log
          git rm .github/workflows/phase7-fakemon-integration.yml
          git rm .github/workflows/phase7-pr-bootstrap.yml
          git rm .github/workflows/phase7-bootstrap-debug.yml
          git rm .github/workflows/phase7-bootstrap-debug2.yml
          git rm .github/workflows/phase7-bootstrap-flex.yml
          git rm .github/workflows/phase7-bootstrap-flex2.yml
          git add .
          git commit -m "Completa integrazione Fakemon nei flussi di gioco"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Persist failure diagnostics
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/phase7-final-bootstrap.txt
          git commit -m "Registra diagnostica finale fase 7"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
