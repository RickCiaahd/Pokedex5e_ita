name: Apply English UI residual fixes round 4

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-english-ui-round4.yml'
      - 'tooling/apply_english_ui_residuals_round4.py'
      - 'tooling/audit_english_ui_residuals_round4.py'
      - 'tooling/english_ui_round4_translations.json'

permissions:
  contents: write

concurrency:
  group: apply-english-ui-round4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/english-ui-residuals-round3'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/english-ui-residuals-round3
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exclude canonical internal keys from translation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tooling/english_ui_round4_translations.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for file_name in (
              'lib/screens/onboarding/first_launch_onboarding_screen.dart',
              'lib/screens/trainer/trainer_sheet_screen.dart',
          ):
              data.get(file_name, {}).pop('Origine 5e approvata dal DM', None)
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate and apply prepared corrections
        run: |
          python -m py_compile tooling/apply_english_ui_residuals_round4.py
          python -m py_compile tooling/audit_english_ui_residuals_round4.py
          python tooling/apply_english_ui_residuals_round4.py

      - name: Repair transformed Dart contexts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          team_path = Path('lib/screens/team/team_selection_screen.dart')
          team = team_path.read_text(encoding='utf-8')
          replacements = {
              "\n                      uiTextForLanguage('$replacedName": "\n                      + uiTextForLanguage('$replacedName",
              "\n            '${replaced > 0 ?": "\n            + '${replaced > 0 ?",
              "\n            uiTextForLanguage('Le uova": "\n            + uiTextForLanguage('Le uova",
              "\n            '${overflow > 0 ?": "\n            + '${overflow > 0 ?",
          }
          for old, new in replacements.items():
              if old not in team:
                  raise RuntimeError(f'Expected team concatenation fragment not found: {old!r}')
              team = team.replace(old, new, 1)
          team_path.write_text(team, encoding='utf-8')

          npc_path = Path('lib/screens/battle/npc_battle_screen.dart')
          npc = npc_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"^(    if \([^\n]+\)) return (uiTextForLanguage\('Allenatore PNG', [^\n]+\));$",
              re.MULTILINE,
          )
          npc, count = pattern.subn(r"\1 {\n      return \2;\n    }", npc)
          if count != 3:
              raise RuntimeError(f'Expected 3 NPC initiative returns, found {count}')
          npc_path.write_text(npc, encoding='utf-8')

          custom_path = Path('lib/screens/pokemon/custom_pokemon_library_screen.dart')
          custom = custom_path.read_text(encoding='utf-8')
          custom = custom.replace(
              '    if (line.isEmpty) continue;',
              '    if (line.isEmpty) {\n      continue;\n    }',
              1,
          )
          separator_pattern = re.compile(
              r"    if \(separator <= 0\) throw (FormatException\([^\n]+\));"
          )
          custom, separator_count = separator_pattern.subn(
              r"    if (separator <= 0) {\n      throw \1;\n    }",
              custom,
              count=1,
          )
          if separator_count != 1:
              raise RuntimeError('Expected custom move separator guard not found')
          custom_path.write_text(custom, encoding='utf-8')

          legacy_path = Path('lib/screens/pokemon/pokemon_detail_screen_legacy.dart')
          legacy = legacy_path.read_text(encoding='utf-8')
          if 'const _InfoCard(' not in legacy:
              raise RuntimeError('Expected const legacy InfoCard not found')
          legacy_path.write_text(
              legacy.replace('const _InfoCard(', '_InfoCard(', 1),
              encoding='utf-8',
          )

          wild_path = Path('lib/widgets/battle/wild_master_fight_launcher.dart')
          wild = wild_path.read_text(encoding='utf-8')
          if 'throw const FormatException(' not in wild:
              raise RuntimeError('Expected const wild FormatException not found')
          wild_path.write_text(
              wild.replace('throw const FormatException(', 'throw FormatException(', 1),
              encoding='utf-8',
          )

          config = json.loads(
              Path('tooling/english_ui_round4_translations.json').read_text(encoding='utf-8')
          )
          for file_name in config:
              path = Path(file_name)
              source = path.read_text(encoding='utf-8')
              source = source.replace('=> const [', '=> [')
              source = re.sub(r'=> const <[^>]+>\[', '=> [', source)
              source = source.replace('const SnackBar(', 'SnackBar(')
              path.write_text(source, encoding='utf-8')
          PY

      - name: Resolve dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Apply safe analyzer fixes
        run: dart fix --apply

      - name: Format changed Dart sources
        shell: bash
        run: |
          set +e
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACM | grep '\.dart$' || true)
          if ((${#dart_files[@]})); then
            dart format "${dart_files[@]}" 2>&1 | tee /tmp/english-ui-round4-format.log
            status=${PIPESTATUS[0]}
          else
            status=0
          fi
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-round4-format.log diagnostics/english-ui-round4-format-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-round4-format-error.txt
            git commit -m "Registra errore formattazione del quarto audit inglese" || true
            git push origin HEAD:fix/english-ui-residuals-round3
            exit "$status"
          fi

      - name: Analyze source
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/english-ui-round4-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-round4-analyze.log diagnostics/english-ui-round4-analyze-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-round4-analyze-error.txt
            git commit -m "Registra errore analisi del quarto audit inglese" || true
            git push origin HEAD:fix/english-ui-residuals-round3
            exit "$status"
          fi

      - name: Run focused localization test
        run: flutter test test/english_ui_residuals_round4_test.dart --reporter expanded

      - name: Run complete test suite
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/english-ui-round4-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-round4-test.log diagnostics/english-ui-round4-test-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-round4-test-error.txt
            git commit -m "Registra errore test del quarto audit inglese" || true
            git push origin HEAD:fix/english-ui-residuals-round3
            exit "$status"
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Run refined post-fix localization audit
        shell: bash
        run: |
          set +e
          python tooling/audit_english_ui_residuals_round4.py
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-residuals-round4.json diagnostics/english-ui-residuals-round4.md
            git commit -m "Registra residui del quarto audit inglese" || true
            git push origin HEAD:fix/english-ui-residuals-round3
            exit "$status"
          fi

      - name: Upload post-fix audit
        uses: actions/upload-artifact@v4
        with:
          name: english-ui-round4-post-fix-audit
          path: diagnostics/english-ui-residuals-round4.*
          retention-days: 14

      - name: Remove temporary workflow files
        shell: bash
        run: |
          rm -f tooling/.english_ui_round4_applied
          rm -f tooling/apply_english_ui_residuals_round4.py
          rm -f tooling/audit_english_ui_residuals_round4.py
          rm -f tooling/english_ui_round4_translations.json
          rm -f diagnostics/english-ui-residuals-round4.json
          rm -f diagnostics/english-ui-residuals-round4.md
          rm -f diagnostics/english-ui-round4-format-error.txt
          rm -f diagnostics/english-ui-round4-analyze-error.txt
          rm -f diagnostics/english-ui-round4-test-error.txt
          rm -f .github/workflows/apply-english-ui-round4.yml

      - name: Commit verified correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Completa il controllo generale della UI inglese"
          git push origin HEAD:fix/english-ui-residuals-round3
