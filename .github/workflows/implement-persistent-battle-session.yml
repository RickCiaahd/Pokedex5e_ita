name: Implement persistent battle session

on:
  push:
    branches:
      - feat/persistent-battle-session
    paths:
      - '.github/workflows/implement-persistent-battle-session.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/persistent-battle-session
          fetch-depth: 0

      - name: Apply implementation patch
        run: python3 tool/apply_battle_session_patch.py

      - name: Remove temporary implementation files
        run: |
          rm -f tool/apply_battle_session_patch.py
          rm -f .github/workflows/implement-persistent-battle-session.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/database/hive_boxes.dart \
            lib/models/battle_session.dart \
            lib/repositories/battle_session_repository.dart \
            lib/services/battle_quick_item_service.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/home/home_screen.dart \
            test/battle_session_test.dart \
            test/battle_quick_item_service_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run battle session tests
        run: |
          flutter test test/battle_session_test.dart
          flutter test test/battle_quick_item_service_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist Battle Companion sessions and restore quick bag"
          git push origin feat/persistent-battle-session
