name: Prepare Trainer Atlas 1.3.2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-v1.3.2.yml'

permissions:
  contents: write

concurrency:
  group: prepare-v1.3.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.head_ref == 'release/v1.3.2'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.3.2
          fetch-depth: 0

      - name: Bump application version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'version: 1.3.1+7'
          new = 'version: 1.3.2+8'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r} entry')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary preparation workflow
        run: git rm .github/workflows/prepare-v1.3.2.yml

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git diff --cached --check
          git commit -m 'Aggiorna versione a 1.3.2+8'
          git push origin HEAD:release/v1.3.2
