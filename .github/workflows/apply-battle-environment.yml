name: Apply battle environment upgrade

on:
  push:
    branches:
      - feature/battle-environment
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: battle-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.title, '[environment-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/battle-environment
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode and apply environment upgrade
        run: |
          base64 -d tool/apply_battle_environment.py.gz.b64 | gzip -d > /tmp/apply_battle_environment.py
          python /tmp/apply_battle_environment.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/battle_environment.dart \
            lib/models/battle_session.dart \
            lib/services/battle_environment_service.dart \
            lib/services/trainer_path_passive_service.dart \
            lib/widgets/battle/battle_environment_card.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/pokemon/pokemon_edit_screen.dart \
            lib/widgets/breeding/breeder_trait_dialogs.dart \
            test/battle_environment_service_test.dart \
            test/battle_session_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: dart run tool/validate_data.dart

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified environment upgrade
        run: |
          rm -f tool/apply_battle_environment.py.gz.b64 .github/workflows/apply-battle-environment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge meteo e terreno al Battle Companion [environment-applied]"
          git push origin HEAD:feature/battle-environment
