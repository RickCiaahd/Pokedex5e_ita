name: Finalize Floette and Florges form sprites

on:
  push:
    branches:
      - fix/floette-florges-form-sprites

permissions:
  contents: write

concurrency:
  group: fix-flower-form-sprites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/floette-florges-form-sprites
          fetch-depth: 0

      - name: Download canonical 40x30 form icons
        shell: bash
        run: |
          set -euo pipefail
          root='assets/textures/sprites'
          base='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-vii/icons'
          mkdir -p "$root"
          download_icon() {
            curl -fsSL --retry 3 --retry-delay 2 "$base/$1.png" -o "$root/$2"
          }
          download_icon 10109 '670Floette Blue Flower.png'
          download_icon 10108 '670Floette Orange Flower.png'
          download_icon 10110 '670Floette White Flower.png'
          download_icon 10107 '670Floette Yellow Flower.png'
          download_icon 10061 '670Floette Eternal Flower.png'
          download_icon 10113 '671Florges Blue Flower.png'
          download_icon 10112 '671Florges Orange Flower.png'
          download_icon 10114 '671Florges White Flower.png'
          download_icon 10111 '671Florges Yellow Flower.png'

      - name: Validate downloaded compact PNG icons
        shell: python
        run: |
          from pathlib import Path
          import struct
          root = Path('assets/textures/sprites')
          names = [
              '670Floette Blue Flower.png',
              '670Floette Orange Flower.png',
              '670Floette White Flower.png',
              '670Floette Yellow Flower.png',
              '670Floette Eternal Flower.png',
              '671Florges Blue Flower.png',
              '671Florges Orange Flower.png',
              '671Florges White Flower.png',
              '671Florges Yellow Flower.png',
          ]
          for name in names:
              path = root / name
              data = path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'Not a PNG: {path}'
              size = struct.unpack('>II', data[16:24])
              assert size == (40, 30), f'{path} has {size}, expected (40, 30)'
              assert path.stat().st_size < 20_000, f'Unexpectedly large icon: {path}'
              print(f'OK {path}: 40x30, {path.stat().st_size} bytes')

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate compliance inventories
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py --check
          git diff --check

      - name: Commit verified fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-flower-form-sprites.yml
          git add -A assets/textures/sprites docs/compliance .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ripristina gli sprite delle forme floreali'
          git push origin HEAD:fix/floette-florges-form-sprites
