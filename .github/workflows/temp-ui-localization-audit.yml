name: Audit UI localization once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-ui-localization-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Run UI string audit
        run: python tooling/audit_ui_strings.py

      - name: Print audit report
        run: cat build/ui-localization-audit/audit.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ui-localization-audit
          path: build/ui-localization-audit/
          retention-days: 7

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-ui-localization-audit.yml
          git commit -m "Rimuovi audit temporaneo localizzazione UI"
          git push origin HEAD:feature/compact-pokemon-detail-v2
