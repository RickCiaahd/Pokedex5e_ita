name: Refresh branding compliance reports

on:
  push:
    branches:
      - agent/trainer-atlas-branding
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/trainer-atlas-branding
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate compliance reports
        run: python tooling/generate_compliance_reports.py

      - name: Remove one-shot files
        run: |
          rm .github/workflows/refresh-branding-compliance.yml
          rm -f tooling/refresh_branding_compliance.trigger

      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiorna i report di conformità del branding"
          git push origin HEAD:agent/trainer-atlas-branding
