name: Validate NPC trainer generator

on:
  push:
    branches:
      - feat/npc-trainer-generator
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/npc-trainer-generator
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/generated_npc_trainer.dart \
            lib/services/npc_trainer_generator_service.dart \
            lib/screens/tools/npc_trainer_generator_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/tools/tools_screen.dart \
            test/npc_trainer_generator_service_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run NPC trainer tests
        run: flutter test test/npc_trainer_generator_service_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          rm .github/workflows/validate-npc-trainer-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NPC trainer generator"
          git push origin feat/npc-trainer-generator
