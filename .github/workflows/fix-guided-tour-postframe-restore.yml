name: Fix guided tour post-frame restoration

on:
  push:
    branches:
      - fix/guided-tour-postframe-restore
    paths:
      - '.github/workflows/fix-guided-tour-postframe-restore.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/guided-tour-postframe-restore
          fetch-depth: 0

      - name: Restore the scroll after the tour overlay is removed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/tour/guided_tour.dart')
          text = path.read_text(encoding='utf-8')
          old = '''  void _finishTour() {
            if (scrollController.hasClients) {
              final position = scrollController.position;
              if (position.hasContentDimensions) {
                final target = position.minScrollExtent;
                if ((position.pixels - target).abs() > .5) {
                  try {
                    position.jumpTo(target);
                  } catch (error) {
                    debugPrint(
                      'Impossibile ripristinare lo scorrimento del tour: $error',
                    );
                  }
                }
              }
            }

            controller.finish();
          }'''
          new = '''  void _finishTour() {
            // Interrompe l’eventuale animazione avviata da ensureVisible. Se il
            // tour viene chiuso mentre quella animazione è ancora attiva, può
            // riportare la pagina in fondo dopo il primo jumpTo.
            if (scrollController.hasClients) {
              try {
                final position = scrollController.position;
                position.jumpTo(position.pixels);
              } catch (error) {
                debugPrint(
                  'Impossibile interrompere lo scorrimento del tour: $error',
                );
              }
            }

            controller.finish();

            // La chiusura del tour rimuove anche il padding inferiore aggiunto
            // dalle schermate. Il ripristino va quindi eseguito dopo il rebuild,
            // quando le nuove dimensioni dello scroll sono già disponibili.
            WidgetsBinding.instance.addPostFrameCallback((_) {
              _restoreScrollToStart();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _restoreScrollToStart();
              });
            });
          }

          void _restoreScrollToStart() {
            if (!scrollController.hasClients) return;

            final position = scrollController.position;
            if (!position.hasContentDimensions) return;

            final target = position.minScrollExtent;
            if ((position.pixels - target).abs() <= .5) return;

            try {
              position.jumpTo(target);
            } catch (error) {
              debugPrint(
                'Impossibile ripristinare lo scorrimento del tour: $error',
              );
            }
          }'''

          if text.count(old) != 1:
              raise SystemExit('Il metodo _finishTour atteso non è stato trovato una sola volta.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Strengthen regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/guided_tour_scroll_restoration_test.dart')
          text = path.read_text(encoding='utf-8')
          old = '''    tourController.start();
            await tester.pumpAndSettle();

            expect(scrollController.offset, greaterThan(0));
            expect(find.text('HO CAPITO'), findsOneWidget);

            await tester.tap(find.text('HO CAPITO'));
            await tester.pump();

            expect(tourController.isVisible, isFalse);
            expect(
              scrollController.offset,
              closeTo(scrollController.position.minScrollExtent, .1),
            );'''
          new = '''    tourController.start();
            await tester.pump();
            await tester.pump(const Duration(milliseconds: 80));

            expect(find.text('HO CAPITO'), findsOneWidget);

            // Chiude il tour mentre lo scorrimento automatico verso l’ultima
            // sezione può essere ancora in corso.
            await tester.tap(find.text('HO CAPITO'));
            await tester.pump();
            await tester.pump();
            await tester.pumpAndSettle();

            expect(tourController.isVisible, isFalse);
            expect(
              scrollController.offset,
              closeTo(scrollController.position.minScrollExtent, .1),
            );'''

          if text.count(old) != 1:
              raise SystemExit('Il blocco del test di regressione non è stato trovato una sola volta.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: dart format lib/widgets/tour/guided_tour.dart test/guided_tour_scroll_restoration_test.dart

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-guided-tour-postframe-restore.yml
          git add lib/widgets/tour/guided_tour.dart test/guided_tour_scroll_restoration_test.dart
          git commit -m 'Ripristina lo scroll dopo la chiusura del tour'
          git push origin HEAD:fix/guided-tour-postframe-restore
