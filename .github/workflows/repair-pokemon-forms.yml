name: Repair Pokemon forms

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-pokemon-forms.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 tool/repair_pokemon_forms.py

      - name: Check generated diff
        run: git diff --check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Remove temporary files
        run: |
          rm tool/repair_pokemon_forms.py
          rm .github/workflows/repair-pokemon-forms.yml

      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Pokemon form previews and validate build"
          git push origin main
