name: Publish v1.0.0

on:
  push:
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Create the v1.0.0 tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release prerequisites
        shell: bash
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          test "$VERSION" = "1.0.0" || (echo "Versione pubspec inattesa: $VERSION" && exit 1)
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 non configurato" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "ANDROID_STORE_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS non configurato" && exit 1)
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            echo "Il tag v1.0.0 esiste già"
            exit 1
          fi

      - name: Remove one-shot workflow and create tag
        shell: bash
        run: |
          rm -f .github/workflows/publish-v1.0.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avvia la release GitHub 1.0.0'
          git tag -a v1.0.0 -m 'Pokédex 5e ITA 1.0.0'
          git push origin HEAD:main
          git push origin v1.0.0
