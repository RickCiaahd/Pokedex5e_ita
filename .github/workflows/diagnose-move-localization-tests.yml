name: Diagnose move localization tests

on:
  push:
    branches:
      - translation/moves-251-450
    paths:
      - '.github/workflows/diagnose-move-localization-tests.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/moves-251-450
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run tests and save diagnostics
        shell: bash
        run: |
          set -o pipefail
          flutter pub get
          mkdir -p .diagnostics
          flutter test > .diagnostics/move-localization-test.log 2>&1 || true
          rm .github/workflows/diagnose-move-localization-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Registra la diagnostica dei test delle mosse'
          git push origin HEAD:translation/moves-251-450
