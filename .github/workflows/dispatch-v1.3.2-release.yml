name: Dispatch Trainer Atlas 1.3.2 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-v1.3.2-release.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-v1.3.2-release
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch Android and Windows releases on v1.3.2
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --ref v1.3.2
          gh workflow run windows-release.yml --ref v1.3.2

      - name: Find and wait for release runs
        id: packages
        shell: bash
        run: |
          set +e

          find_run() {
            local workflow="$1"
            local run_id=''
            for _ in $(seq 1 60); do
              run_id=$(gh run list \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,headBranch \
                --jq '.[] | select(.headBranch == "v1.3.2") | .databaseId' \
                | head -n 1)
              if [ -n "$run_id" ]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          android_run=$(find_run android-release.yml)
          android_find_status=$?
          windows_run=$(find_run windows-release.yml)
          windows_find_status=$?

          mkdir -p diagnostics
          report='diagnostics/release-v1.3.2.txt'
          : > "$report"
          echo 'Trainer Atlas 1.3.2 dispatched release diagnostics' >> "$report"
          echo "Collected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$report"
          echo "Android run: ${android_run:-not found}" >> "$report"
          echo "Windows run: ${windows_run:-not found}" >> "$report"

          status=0
          if [ "$android_find_status" -ne 0 ] || [ "$windows_find_status" -ne 0 ]; then
            status=1
          fi

          if [ -n "$android_run" ]; then
            gh run watch "$android_run" --exit-status
            android_status=$?
            echo "Android status: $android_status" >> "$report"
            gh run view "$android_run" --json databaseId,name,status,conclusion,headBranch,headSha,url,jobs >> "$report" 2>&1 || true
            gh run view "$android_run" --log-failed >> "$report" 2>&1 || true
            if [ "$android_status" -ne 0 ]; then status=$android_status; fi
          fi

          if [ -n "$windows_run" ]; then
            gh run watch "$windows_run" --exit-status
            windows_status=$?
            echo "Windows status: $windows_status" >> "$report"
            gh run view "$windows_run" --json databaseId,name,status,conclusion,headBranch,headSha,url,jobs >> "$report" 2>&1 || true
            gh run view "$windows_run" --log-failed >> "$report" 2>&1 || true
            if [ "$windows_status" -ne 0 ]; then status=$windows_status; fi
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove temporary dispatcher and update diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/dispatch-v1.3.2-release.yml
          if [ '${{ steps.packages.outputs.status }}' = '0' ]; then
            git rm -f diagnostics/release-v1.3.2.txt
          else
            git add diagnostics/release-v1.3.2.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.packages.outputs.status }}' = '0' ]; then
            git commit -m 'Completa release 1.3.2'
          else
            git commit -m 'Registra errore build release 1.3.2'
          fi
          git push origin HEAD:main

      - name: Fail if a release build failed
        if: steps.packages.outputs.status != '0'
        run: exit 1
