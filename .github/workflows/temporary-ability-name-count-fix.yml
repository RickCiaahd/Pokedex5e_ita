name: Temporary ability name set diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/ability-names
          fetch-depth: 0
      - name: Compare reference and source sets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path('assets/data_webapp/abilities.json').read_text(encoding='utf-8')
          )['items']
          reference = json.loads(
              Path('assets/data/ability_names_it_official.json').read_text(encoding='utf-8')
          )
          source_ids = {item['id'] for item in source}
          reference_ids = set(reference['items'])
          declared_unmatched = {
              'air-slash', 'blizzard', 'drifter',
              'form-change-arceus', 'form-change-cherrim',
              'form-change-giratina', 'form-change-hoopa',
              'form-change-keldeo', 'form-change-kyurem',
              'form-change-meloetta', 'form-change-necrozma',
              'form-change-ogerpon', 'form-change-oricorio',
              'form-change-rotom', 'form-change-shaymin',
              'form-change-terapagos', 'form-change-ultra-necrozma',
              'hydro-pump', 'leaf-storm', 'overheat',
              'paper-thin', 'transformer',
          }
          expected = source_ids - declared_unmatched
          diagnostic = {
              'sourceCount': len(source_ids),
              'referenceCount': len(reference_ids),
              'declaredUnmatchedCount': len(declared_unmatched),
              'referenceOutsideSource': sorted(reference_ids - source_ids),
              'sourceWithoutReference': sorted(source_ids - reference_ids),
              'unexpectedReferenceEntries': sorted(reference_ids - expected),
              'expectedEntriesMissing': sorted(expected - reference_ids),
              'declaredUnmatchedWithReference': sorted(
                  declared_unmatched & reference_ids
              ),
              'undeclaredUnmatched': sorted(
                  (source_ids - reference_ids) - declared_unmatched
              ),
          }
          path = Path('docs/translation/ability-name-set-diagnostic.json')
          path.write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(diagnostic, ensure_ascii=False, indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/translation/ability-name-set-diagnostic.json
          git commit -m "Registra la diagnostica dei nomi abilità"
          git push origin HEAD:translation/ability-names
