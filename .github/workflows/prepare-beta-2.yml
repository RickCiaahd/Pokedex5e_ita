name: Prepare beta 2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-beta-2.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.repository == 'RickCiaahd/Pokedex5e_ita' &&
      github.event.pull_request.head.ref == 'release/1.4.0-beta1' &&
      github.actor == 'RickCiaahd'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.4.0-beta1
          fetch-depth: 0

      - name: Bump beta version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'version: 1.4.0+9'
          new = 'version: 1.4.0+10'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r} entry.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fxq 'version: 1.4.0+10' pubspec.yaml
          git diff --check

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m 'Prepara la beta interna 2 con version code 10'
          git push origin HEAD:release/1.4.0-beta1
