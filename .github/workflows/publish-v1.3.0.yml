name: Publish v1.3.0

# Workflow temporaneo: prepara la versione, crea il tag e poi si rimuove.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.3.0 >/dev/null; then
            echo 'Il tag v1.3.0 esiste già.' >&2
            exit 1
          fi
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test "$version" = '1.2.0+5'

      - name: Prepare release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          old_version = 'version: 1.2.0+5'
          old_description = 'description: "Companion non ufficiale in italiano per campagne Pokémon 5e."'
          if text.count(old_version) != 1:
              raise SystemExit('Versione di partenza inattesa in pubspec.yaml')
          if text.count(old_description) != 1:
              raise SystemExit('Descrizione di partenza inattesa in pubspec.yaml')
          text = text.replace(old_version, 'version: 1.3.0+6', 1)
          text = text.replace(
              old_description,
              'description: "Trainer Atlas, companion non ufficiale in italiano per campagne con creature tascabili in 5e."',
              1,
          )
          pubspec.write_text(text, encoding='utf-8')

          windows_workflow = Path('.github/workflows/windows-release.yml')
          workflow_text = windows_workflow.read_text(encoding='utf-8')
          old_release_name = 'name: Pokédex 5e ITA '
          old_readme_title = 'Pokédex 5e ITA $version — Windows x64'
          if workflow_text.count(old_release_name) != 1:
              raise SystemExit('Nome release Windows inatteso')
          if workflow_text.count(old_readme_title) != 1:
              raise SystemExit('Titolo README Windows inatteso')
          workflow_text = workflow_text.replace(
              old_release_name,
              'name: Trainer Atlas ',
              1,
          )
          workflow_text = workflow_text.replace(
              old_readme_title,
              'Trainer Atlas $version — Windows x64',
              1,
          )
          windows_workflow.write_text(workflow_text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v1.3.0.yml
          git add pubspec.yaml .github/workflows/windows-release.yml
          git commit -m 'Prepara la release 1.3.0'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.3.0 '${{ steps.release.outputs.sha }}' -m 'Trainer Atlas 1.3.0'
          git push origin v1.3.0
