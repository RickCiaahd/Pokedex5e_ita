name: Verify Fakemon 1.2.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-fakemon-1.2.0.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/fakemon-forms-localization-1.2.0
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification and save report
        id: verification
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          analyze_status=$?
          flutter test test/fakemon_advanced_test.dart --reporter expanded > /tmp/fakemon-tests.log 2>&1
          fakemon_status=$?
          flutter test test/evolution_repository_regression_test.dart --reporter expanded > /tmp/evolution-tests.log 2>&1
          evolution_status=$?
          flutter test test/item_localization_integrity_test.dart --reporter expanded > /tmp/localization-tests.log 2>&1
          localization_status=$?
          flutter test --reporter expanded > /tmp/full-tests.log 2>&1
          full_status=$?
          flutter build apk --debug > /tmp/android-build.log 2>&1
          android_status=$?
          set -e

          mkdir -p docs
          {
            echo '# Verifica Fakemon 1.2.0'
            echo
            echo "- flutter analyze: $analyze_status"
            echo "- fakemon_advanced_test: $fakemon_status"
            echo "- evolution_repository_regression_test: $evolution_status"
            echo "- item_localization_integrity_test: $localization_status"
            echo "- suite completa: $full_status"
            echo "- build APK debug: $android_status"
            echo
            echo '## Analisi'
            echo '```text'
            cat /tmp/analyze.log
            echo '```'
            echo
            echo '## Test Fakemon'
            echo '```text'
            tail -n 120 /tmp/fakemon-tests.log
            echo '```'
            echo
            echo '## Test evoluzioni'
            echo '```text'
            tail -n 120 /tmp/evolution-tests.log
            echo '```'
            echo
            echo '## Test localizzazione'
            echo '```text'
            tail -n 120 /tmp/localization-tests.log
            echo '```'
            echo
            echo '## Suite completa'
            echo '```text'
            tail -n 160 /tmp/full-tests.log
            echo '```'
            echo
            echo '## Build Android debug'
            echo '```text'
            tail -n 100 /tmp/android-build.log
            echo '```'
          } > docs/fakemon-1.2.0-verification.md

          echo "failed=$((analyze_status || fakemon_status || evolution_status || localization_status || full_status || android_status))" >> "$GITHUB_OUTPUT"

      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fakemon-1.2.0-verification.md
          git commit -m 'Registra la verifica completa Fakemon 1.2.0'
          git push origin HEAD:release/fakemon-forms-localization-1.2.0

      - name: Fail when verification failed
        if: steps.verification.outputs.failed != '0'
        run: exit 1
