name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Validate signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 non configurato" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "ANDROID_STORE_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS non configurato" && exit 1)

      - name: Configure Android signing
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Verify compliance reports
        run: python tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION_FULL=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          echo "full=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p dist
          BASENAME="TrainerAtlas5e-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${BASENAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${BASENAME}.aab"
          cp LICENSE dist/LICENSE
          cp NOTICE.md dist/NOTICE.md

          keytool -printcert -jarfile "dist/${BASENAME}.aab" > dist/SIGNING-CERTIFICATE.txt

          cat > dist/RELEASE-METADATA.txt <<EOF
          App: Trainer Atlas 5e
          Application ID: io.github.rickciaahd.traineratlas
          Version: ${{ steps.version.outputs.name }}
          Version code: ${{ steps.version.outputs.code }}
          Commit: ${{ github.sha }}
          Release shrinking: disabled by default
          EOF

          sha256sum \
            dist/*.apk \
            dist/*.aab \
            dist/LICENSE \
            dist/NOTICE.md \
            dist/SIGNING-CERTIFICATE.txt \
            dist/RELEASE-METADATA.txt \
            > dist/SHA256SUMS.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrainerAtlas5e-Android-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
