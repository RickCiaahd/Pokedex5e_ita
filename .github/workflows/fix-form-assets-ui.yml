name: Fix form assets and UI

on:
  push:
    paths:
      - '.github/workflows/fix-form-assets-ui.yml'

permissions:
  contents: write

jobs:
  fix-form-assets-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize texture folders and artwork
        shell: bash
        run: |
          set -euo pipefail

          old_zygarde='assets/textures/textures_webapp/pokemon/zygarde-50-forme'
          new_zygarde='assets/textures/textures_webapp/pokemon/zygarde'
          if [ -d "$old_zygarde" ]; then
            if [ -d "$new_zygarde" ]; then
              cp -a "$old_zygarde"/. "$new_zygarde"/
              rm -rf "$old_zygarde"
            else
              git mv "$old_zygarde" "$new_zygarde"
            fi
          fi
          sed -i 's#pokemon/zygarde-50-forme/#pokemon/zygarde/#g' pubspec.yaml

          aegislash='assets/textures/textures_webapp/pokemon/aegislash'
          mkdir -p "$aegislash"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10026.png' \
            --output "$aegislash/main.png"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/10026.png' \
            --output "$aegislash/main-shiny.png"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/10026.png' \
            --output "$aegislash/sprite.png"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/10026.png' \
            --output "$aegislash/sprite-shiny.png"

      - name: Patch form selectors and image resolution
        run: python .github/scripts/fix_form_assets_ui.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            lib/screens/pokemon/pokemon_edit_screen.dart \
            lib/screens/pokemon/pokemon_detail_screen_legacy.dart
          flutter pub get
          flutter analyze
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/fix-form-assets-ui.yml \
            .github/workflows/trigger-form-assets-ui.yml \
            .github/scripts/fix_form_assets_ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregge immagini e selettori delle forme alternative'
          git push origin HEAD:main
