name: Apply native content sharing

on:
  push:
    branches:
      - feature/native-content-sharing
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: native-content-sharing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[native-sharing-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-content-sharing
          fetch-depth: 0

      - name: Align patch sources
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          old = "Dalla schermata Squadra è inoltre possibile esportare e importare singoli Pokémon o una formazione completa senza sostituire l'intero profilo; i Pokémon rimpiazzati e gli eventuali esuberi vengono conservati nel PC. Le librerie del Master supportano file portabili per incontri e Allenatori PNG, mentre il Fight del Master può produrre un riepilogo testuale con round, iniziativa, PF, status e PP. L'importazione crea sempre una nuova copia, evitando di sovrascrivere contenuti già presenti.\n"
          new = "Dalla schermata Squadra è inoltre possibile esportare e importare singoli Pokémon o una formazione completa senza sostituire l’intero profilo; i Pokémon rimpiazzati e gli eventuali esuberi vengono conservati nel PC. Le librerie del Master supportano file portabili per incontri e Allenatori PNG, mentre il Fight del Master può produrre un riepilogo testuale con round, iniziativa, PF, status e PP.\n"
          if readme_text.count(old) != 1:
              raise SystemExit(f'README source occurrence count: {readme_text.count(old)}')
          readme.write_text(readme_text.replace(old, new), encoding='utf-8')

          script = Path('tool/apply_native_content_sharing.py')
          script_text = script.read_text(encoding='utf-8')
          dependency = "  file_picker: ^11.0.2\\n  share_plus: ^13.2.0\\n"
          compatible = "  file_picker: ^10.3.10\\n  share_plus: ^12.0.2\\n"
          if script_text.count(dependency) != 1:
              raise SystemExit(
                  f'dependency occurrence count: {script_text.count(dependency)}'
              )
          script.write_text(
              script_text.replace(dependency, compatible),
              encoding='utf-8',
          )
          PY

      - name: Apply native sharing integration
        run: |
          set +e
          python tool/apply_native_content_sharing.py > patch-output.log 2>&1
          code=$?
          echo "$code" > patch-exit-code.txt
          cat patch-output.log
          exit 0

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sharing-patch-diagnostics
          path: |
            patch-output.log
            patch-exit-code.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on patch failure
        run: |
          code=$(cat patch-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Patch script failed with code $code"
            exit "$code"
          fi

      - name: Adapt file picker calls
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for path in Path('lib').rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(
                  'FilePicker.pickFiles(',
                  'FilePicker.platform.pickFiles(',
              ).replace(
                  'FilePicker.saveFile(',
                  'FilePicker.platform.saveFile(',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          if changed == 0:
              raise SystemExit('Nessuna chiamata FilePicker adattata')
          print(f'Adattati {changed} file Dart a file_picker 10.3.10')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/native_share_service.dart \
            lib/screens/profile/profiles_screen.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/tools/encounter_library_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            test/native_share_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run native sharing tests
        run: flutter test test/native_share_service_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: |
          set +e
          flutter build apk --debug --verbose > android-build.log 2>&1
          code=$?
          echo "$code" > android-build-exit-code.txt
          tail -n 250 android-build.log
          exit 0

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sharing-android-build-diagnostics
          path: |
            android-build.log
            android-build-exit-code.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on Android build failure
        run: |
          code=$(cat android-build-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Android build failed with code $code"
            exit "$code"
          fi

      - name: Commit verified native sharing
        run: |
          rm -f tool/apply_native_content_sharing.py .github/workflows/apply-native-content-sharing.yml patch-output.log patch-exit-code.txt android-build.log android-build-exit-code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge la condivisione nativa dei contenuti [native-sharing-applied]"
          git push origin HEAD:feature/native-content-sharing
