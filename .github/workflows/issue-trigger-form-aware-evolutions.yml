name: Issue-triggered form-aware evolution migration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  migrate-and-validate:
    if: github.event.issue.title == '[automation] Apply form-aware evolutions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/form-aware-evolutions
          fetch-depth: 0

      - name: Connect evolution UI to resolved forms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path('lib/screens/pokemon/pokemon_detail_screen.dart')
          detail = detail_path.read_text(encoding='utf-8')

          old_by_name = """  Pokemon? _pokemonByName(String name) {
            final targetKey = _referenceKey(name);

            for (final pokemon in widget.allPokemon) {
              if (pokemon.name == name || _referenceKey(pokemon.name) == targetKey) {
                return pokemon;
              }
            }

            return null;
          }

"""
          if old_by_name not in detail:
              raise SystemExit('Expected _pokemonByName block not found')
          detail = detail.replace(old_by_name, '', 1)

          old_current_evolution = """  EvolutionData? _evolutionForCurrentPokemon() {
            return _evolutionForPokemon(_pokemon, _evolutions);
          }

"""
          new_current_evolution = old_current_evolution + """  EvolutionTarget? _evolutionTargetFor(EvolutionEligibility choice) {
            final slot = _teamSlot;
            if (slot == null) return null;

            return _evolutionService.resolveTarget(
              option: choice.option,
              currentPokemon: _pokemon,
              slot: slot,
              catalog: widget.allPokemon,
            );
          }

"""
          if old_current_evolution not in detail:
              raise SystemExit('Evolution current Pokemon block not found')
          detail = detail.replace(old_current_evolution, new_current_evolution, 1)

          old_available = """    return _evolutionChoices
                .where(
                  (choice) =>
                      choice.isAvailable &&
                      _pokemonByName(choice.option.toName) != null,
                )
                .toList(growable: false);
"""
          new_available = """    return _evolutionChoices
                .where(
                  (choice) =>
                      choice.isAvailable && _evolutionTargetFor(choice) != null,
                )
                .toList(growable: false);
"""
          if old_available not in detail:
              raise SystemExit('Available evolution choices block not found')
          detail = detail.replace(old_available, new_available, 1)

          old_sheet = """      builder: (_) => EvolutionSelectorSheet(
                currentPokemon: _pokemon,
                choices: choices,
                pokemonByName: _pokemonByName,
              ),
"""
          new_sheet = """      builder: (_) => EvolutionSelectorSheet(
                currentPokemon: _pokemon,
                choices: choices,
                targetForChoice: _evolutionTargetFor,
              ),
"""
          if old_sheet not in detail:
              raise SystemExit('Evolution selector sheet block not found')
          detail = detail.replace(old_sheet, new_sheet, 1)

          old_target_lookup = """    final evolvedPokemon = _pokemonByName(selected.option.toName);
            if (evolvedPokemon == null) {
              _showMessage(
                '${selected.option.toName} non è presente nel catalogo attuale.',
              );
              return null;
            }

"""
          new_target_lookup = """    final target = _evolutionService.resolveTarget(
              option: selected.option,
              currentPokemon: _pokemon,
              slot: slot,
              catalog: widget.allPokemon,
            );
            if (target == null) {
              _showMessage(
                '${selected.option.toName} non è presente nel catalogo attuale.',
              );
              return null;
            }
            final evolvedBasePokemon = target.basePokemon;
            final evolvedPokemon = target.pokemon;

"""
          if old_target_lookup not in detail:
              raise SystemExit('Evolution target lookup block not found')
          detail = detail.replace(old_target_lookup, new_target_lookup, 1)

          old_updated_slot = """    final updatedSlot = slot.copyWith(
              pokemonId: evolvedPokemon.id,
              currentHp: wasFullHp
"""
          new_updated_slot = """    final updatedSlot = slot.copyWith(
              pokemonId: evolvedBasePokemon.id,
              formName: target.formName,
              currentHp: wasFullHp
"""
          if old_updated_slot not in detail:
              raise SystemExit('Updated evolution slot block not found')
          detail = detail.replace(old_updated_slot, new_updated_slot, 1)

          old_state = """    setState(() {
              _basePokemon = evolvedPokemon;
              _pokemon = evolvedPokemon;
              _teamSlot = updatedSlot;
              _replaceTeamSlot(updatedSlot);
              _isLoading = true;
              _message = '$oldName si è evoluto in ${selected.option.toName}!';
            });
"""
          new_state = """    setState(() {
              _basePokemon = evolvedBasePokemon;
              _pokemon = evolvedPokemon;
              _teamSlot = updatedSlot;
              _replaceTeamSlot(updatedSlot);
              _isLoading = true;
              _message = '$oldName si è evoluto in ${target.displayName}!';
            });
"""
          if old_state not in detail:
              raise SystemExit('Evolution setState block not found')
          detail = detail.replace(old_state, new_state, 1)
          detail_path.write_text(detail, encoding='utf-8')

          assets_path = Path('lib/widgets/pokemon/pokemon_asset_image.dart')
          assets = assets_path.read_text(encoding='utf-8')
          old_asset_loop = """    for (final assetPath in assetIndex.sortedPaths) {
              if (!assetPath.endsWith('.png')) continue;
              if (!prefixes.any(
"""
          new_asset_loop = """    for (final assetPath in assetIndex.sortedPaths) {
              if (!assetPath.endsWith('.png')) continue;
              if (assetPath.contains('/pokemon_transforms/')) continue;
              if (!prefixes.any(
"""
          if old_asset_loop not in assets:
              raise SystemExit('Permanent form asset loop not found')
          assets = assets.replace(old_asset_loop, new_asset_loop, 1)
          assets_path.write_text(assets, encoding='utf-8')
          PY

      - name: Remove branch-local workflow
        run: rm -f .github/workflows/apply-form-aware-evolutions.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/evolution_service.dart \
            lib/screens/pokemon/evolution_selector_sheet.dart \
            lib/screens/pokemon/pokemon_detail_screen.dart \
            lib/widgets/pokemon/pokemon_asset_image.dart \
            test/evolution_form_resolution_test.dart

      - name: Check generated diff
        run: git diff --check

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run evolution and form tests
        run: |
          flutter test \
            test/evolution_form_resolution_test.dart \
            test/pokemon_form_mechanics_test.dart \
            test/pokemon_asset_paths_test.dart

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add form-aware Pokemon evolutions"
          git push origin feat/form-aware-evolutions
