name: Apply egg sprite

on:
  push:
    branches:
      - agent/use-egg-sprite

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/use-egg-sprite

      - name: Apply sprite integration
        run: python .github/agent/apply_egg_sprite.py

      - name: Remove temporary automation
        run: |
          rm .github/agent/apply_egg_sprite.py
          rm .github/workflows/agent-use-egg-sprite.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/widgets/pokemon/egg_asset_image.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/pc/pokemon_pc_screen.dart \
            lib/screens/breeding/breeding_screen.dart \
            test/egg_asset_image_test.dart

      - name: Analyze source
        run: flutter analyze

      - name: Run egg sprite test
        run: flutter test test/egg_asset_image_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Usa lo sprite personalizzato dell'uovo"
          git push origin HEAD:agent/use-egg-sprite
