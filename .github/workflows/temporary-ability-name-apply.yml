name: Temporary ability name detail integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/ability-names
          fetch-depth: 0
      - run: python tool/temporary_patch_ability_names.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokemon/pokemon_detail_screen_legacy.dart
          git commit -m "Mostra i nomi italiani delle abilità nella scheda Pokémon"
          git push origin HEAD:translation/ability-names
