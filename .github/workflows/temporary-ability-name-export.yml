name: Temporary ability name export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Compare official Italian names
        shell: bash
        run: |
          mkdir -p generated
          python - <<'PY'
          import csv
          import io
          import json
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          source_path = Path('assets/data_webapp/abilities.json')
          wiki_url = 'https://wiki.pokemoncentral.it/Abilit%C3%A0'
          abilities_url = 'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/abilities.csv'
          names_url = 'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/ability_names.csv'

          session = requests.Session()
          session.headers['User-Agent'] = 'Pokedex5eITA ability-name audit'

          def get(url):
              response = session.get(url, timeout=60)
              response.raise_for_status()
              return response.text

          official_by_identifier = {
              row['identifier']: int(row['id'])
              for row in csv.DictReader(io.StringIO(get(abilities_url)))
              if row['is_main_series'] == '1'
          }

          italian_by_number = {}
          for row in csv.DictReader(io.StringIO(get(names_url))):
              if row['local_language_id'] == '8':
                  italian_by_number[int(row['ability_id'])] = row['name'].strip()

          soup = BeautifulSoup(get(wiki_url), 'html.parser')
          heading = soup.find(id='Elenco_delle_abilità') or soup.find(id='Elenco_delle_abilit.C3.A0')
          if heading is None:
              raise RuntimeError('Sezione Elenco delle abilità non trovata.')
          table = heading.find_next('table')
          if table is None:
              raise RuntimeError('Tabella delle abilità non trovata.')

          wiki_by_number = {}
          for row in table.find_all('tr'):
              cells = row.find_all(['th', 'td'])
              if len(cells) < 2:
                  continue
              number = cells[0].get_text(' ', strip=True)
              if number.isdigit():
                  wiki_by_number[int(number)] = cells[1].get_text(' ', strip=True)

          if len(wiki_by_number) < 250:
              raise RuntimeError(f'Tabella incompleta: {len(wiki_by_number)} nomi.')

          mismatches = []
          for number, wiki_name in sorted(wiki_by_number.items()):
              pokeapi_name = italian_by_number.get(number)
              if pokeapi_name and pokeapi_name != wiki_name:
                  mismatches.append({
                      'number': number,
                      'pokeapi': pokeapi_name,
                      'pokemonCentral': wiki_name,
                  })
          if mismatches:
              raise RuntimeError('Nomi discordanti: ' + json.dumps(mismatches[:20], ensure_ascii=False))

          source_items = json.loads(source_path.read_text(encoding='utf-8'))['items']
          aliases = {
              'as-one': 'as-one-glastrier',
              'zen-mode-galarian': 'zen-mode',
          }

          matched = {}
          unmatched = []
          for item in source_items:
              source_id = item['id']
              lookup_id = aliases.get(source_id, source_id)
              number = official_by_identifier.get(lookup_id)
              official_name = wiki_by_number.get(number) if number is not None else None
              if official_name:
                  matched[source_id] = {
                      'officialNumber': number,
                      'sourceName': item['name'],
                      'name': official_name,
                  }
              else:
                  unmatched.append({
                      'id': source_id,
                      'name': item['name'],
                      'deprecated': item.get('deprecated') is True,
                  })

          output = {
              'locale': 'it',
              'source': wiki_url,
              'crossReference': [abilities_url, names_url],
              'catalogCount': len(source_items),
              'matchedCount': len(matched),
              'unmatchedCount': len(unmatched),
              'items': matched,
          }
          Path('generated/ability_names_it_official.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          report = [
              '# Audit dei nomi italiani delle abilità',
              '',
              f'- Voci nel catalogo 5e: **{len(source_items)}**',
              f'- Abilità ufficiali riconosciute: **{len(matched)}**',
              f'- Voci senza corrispondenza ufficiale: **{len(unmatched)}**',
              '- Fonte italiana: Pokémon Central Wiki, pagina Abilità.',
              '- PokeAPI è usata soltanto per collegare l’ID inglese al numero ufficiale; ogni nome italiano viene verificato contro Pokémon Central.',
              '',
              '## Voci senza corrispondenza ufficiale',
              '',
          ]
          for item in unmatched:
              suffix = ' — deprecata' if item['deprecated'] else ''
              report.append(f"- `{item['id']}` — {item['name']}{suffix}")
          Path('generated/ability-name-audit.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(f'Matched: {len(matched)}; unmatched: {len(unmatched)}')
          PY

      - name: Upload generated reference
        uses: actions/upload-artifact@v4
        with:
          name: ability-name-audit
          path: generated
          if-no-files-found: error
          retention-days: 2
