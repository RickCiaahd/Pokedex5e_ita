name: Fix guided tour scroll restoration

on:
  push:
    branches:
      - fix/guided-tour-restore-scroll
    paths:
      - '.github/workflows/fix-guided-tour-scroll.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/guided-tour-restore-scroll
          fetch-depth: 0

      - name: Restore scroll before closing a tour
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/tour/guided_tour.dart')
          text = path.read_text(encoding='utf-8')
          old = '''class GuidedTourLayer extends StatelessWidget {
            const GuidedTourLayer({
              super.key,
              required this.controller,
              required this.steps,
              required this.scrollController,
            });

            final GuidedTourController controller;
            final List<GuidedTourStepData> steps;
            final ScrollController scrollController;

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: controller,
                builder: (context, _) {
                  if (!controller.isVisible || steps.isEmpty) {
                    return const SizedBox.shrink();
                  }

                  final safeIndex = controller.stepIndex.clamp(0, steps.length - 1);
                  return Positioned.fill(
                    child: GuidedTourOverlay(
                      step: steps[safeIndex],
                      stepIndex: safeIndex,
                      totalSteps: steps.length,
                      scrollController: scrollController,
                      onBack: safeIndex == 0 ? null : controller.previous,
                      onNext: () {
                        controller.next(steps.length);
                      },
                      onSkip: () {
                        controller.finish();
                      },
                    ),
                  );
                },
              );
            }
          }'''
          new = '''class GuidedTourLayer extends StatelessWidget {
            const GuidedTourLayer({
              super.key,
              required this.controller,
              required this.steps,
              required this.scrollController,
            });

            final GuidedTourController controller;
            final List<GuidedTourStepData> steps;
            final ScrollController scrollController;

            void _finishTour() {
              if (scrollController.hasClients) {
                final position = scrollController.position;
                if (position.hasContentDimensions) {
                  final target = position.minScrollExtent;
                  if ((position.pixels - target).abs() > .5) {
                    try {
                      position.jumpTo(target);
                    } catch (error) {
                      debugPrint(
                        'Impossibile ripristinare lo scorrimento del tour: $error',
                      );
                    }
                  }
                }
              }

              controller.finish();
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: controller,
                builder: (context, _) {
                  if (!controller.isVisible || steps.isEmpty) {
                    return const SizedBox.shrink();
                  }

                  final safeIndex = controller.stepIndex.clamp(0, steps.length - 1);
                  return Positioned.fill(
                    child: GuidedTourOverlay(
                      step: steps[safeIndex],
                      stepIndex: safeIndex,
                      totalSteps: steps.length,
                      scrollController: scrollController,
                      onBack: safeIndex == 0 ? null : controller.previous,
                      onNext: () {
                        if (safeIndex == steps.length - 1) {
                          _finishTour();
                          return;
                        }
                        controller.next(steps.length);
                      },
                      onSkip: _finishTour,
                    ),
                  );
                },
              );
            }
          }'''

          if text.count(old) != 1:
              raise SystemExit('Il blocco GuidedTourLayer atteso non è stato trovato una sola volta.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > test/guided_tour_scroll_restoration_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          import 'package:pokedex_5e_ita/services/guided_tour_service.dart';
          import 'package:pokedex_5e_ita/widgets/tour/guided_tour.dart';

          class _FakeGuidedTourService extends GuidedTourService {
            @override
            Future<bool> shouldShowTour(String tourId) async => false;

            @override
            Future<void> markTourCompleted(String tourId) async {}
          }

          void main() {
            testWidgets(
              'chiudendo l’ultima tappa il contenuto torna all’inizio',
              (tester) async {
                await tester.binding.setSurfaceSize(const Size(500, 800));
                addTearDown(() => tester.binding.setSurfaceSize(null));

                final targetKey = GlobalKey();
                final scrollController = ScrollController();
                final tourController = GuidedTourController(
                  tourId: 'test_tour',
                  service: _FakeGuidedTourService(),
                );
                addTearDown(scrollController.dispose);
                addTearDown(tourController.dispose);

                await tester.pumpWidget(
                  MaterialApp(
                    home: Scaffold(
                      body: Stack(
                        children: [
                          Positioned.fill(
                            child: ListView(
                              controller: scrollController,
                              children: [
                                const SizedBox(height: 1100),
                                Container(
                                  key: targetKey,
                                  height: 120,
                                  color: Colors.orange,
                                ),
                                const SizedBox(height: 300),
                              ],
                            ),
                          ),
                          GuidedTourLayer(
                            controller: tourController,
                            steps: [
                              GuidedTourStepData(
                                targetKey: targetKey,
                                icon: Icons.info_outline,
                                title: 'Ultima tappa',
                                description: 'Descrizione conclusiva del tour.',
                                fallbackScrollFraction: 1,
                              ),
                            ],
                            scrollController: scrollController,
                          ),
                        ],
                      ),
                    ),
                  ),
                );

                tourController.start();
                await tester.pumpAndSettle();

                expect(scrollController.offset, greaterThan(0));
                expect(find.text('HO CAPITO'), findsOneWidget);

                await tester.tap(find.text('HO CAPITO'));
                await tester.pump();

                expect(tourController.isVisible, isFalse);
                expect(
                  scrollController.offset,
                  closeTo(scrollController.position.minScrollExtent, .1),
                );
              },
            );
          }
          DART

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: dart format lib/widgets/tour/guided_tour.dart test/guided_tour_scroll_restoration_test.dart

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-guided-tour-scroll.yml
          git add lib/widgets/tour/guided_tour.dart test/guided_tour_scroll_restoration_test.dart
          git commit -m 'Ripristina la schermata al termine dei tour guidati'
          git push origin HEAD:fix/guided-tour-restore-scroll
