name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Repair starter selection flow
        if: (github.head_ref == 'improve/onboarding-starter-selection' || github.ref_name == 'improve/onboarding-starter-selection') && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python tooling/repair_onboarding_starter_selection.py
          dart format \
            lib/screens/onboarding/first_launch_onboarding_screen.dart \
            lib/models/trainer_origin_name_localization.dart \
            test/trainer_origin_name_localization_test.dart
          git rm tooling/repair_onboarding_starter_selection.py
          git checkout origin/main -- .github/workflows/flutter-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregge il flusso della scelta starter'
          git push origin HEAD:improve/onboarding-starter-selection

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify compliance reports
        run: python tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
