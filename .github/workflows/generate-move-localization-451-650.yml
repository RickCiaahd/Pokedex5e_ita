name: Generate move localization 451-650

on:
  push:
    branches:
      - translation/moves-451-650
    paths:
      - '.github/workflows/generate-move-localization-451-650.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out translation branch
        uses: actions/checkout@v4
        with:
          ref: translation/moves-451-650
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install translator
        run: python -m pip install deep-translator==1.11.4

      - name: Generate Italian overlays
        run: python tools/generate_move_localization_451_650.py

      - name: Commit generated catalogs
        shell: bash
        run: |
          rm tools/generate_move_localization_451_650.py
          rm .github/workflows/generate-move-localization-451-650.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Genera la base italiana delle mosse 451-650'
          git push origin HEAD:translation/moves-451-650
