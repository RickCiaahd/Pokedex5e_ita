name: Final form check

on:
  push:
    paths:
      - '.github/workflows/final-form-check.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix repository-backed support test and validate
        id: checks
        shell: bash
        run: |
          set +e
          log='final-form-check.txt'
          : > "$log"
          (
            set -e
            sed -i "/      'Necrozma',/d; /      'Ogerpon',/d" \
              test/battle_form_change_service_test.dart
            dart format test/battle_form_change_service_test.dart
            flutter pub get
            flutter analyze
            flutter test test/battle_form_change_service_test.dart --reporter expanded
            flutter test test/battle_temporary_hp_service_test.dart --reporter expanded
            flutter test test/ability_localization_integrity_test.dart --reporter expanded
            flutter test test/data_integrity_test.dart --reporter expanded
          ) >> "$log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.checks.outputs.status }}'
          rm -f .github/workflows/final-form-check.yml
          rm -f docs/diagnostics/retry-final-form-validation.txt
          rmdir docs/diagnostics 2>/dev/null || true
          if [ "$status" = '0' ]; then
            rm -f final-form-check.txt
          else
            mkdir -p docs/diagnostics
            mv final-form-check.txt docs/diagnostics/final-form-check.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Conferma correzioni finali delle forme (stato $status)"
          git push origin HEAD:main
