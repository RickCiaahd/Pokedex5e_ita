name: Apply tour montage PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    name: Apply professor montage and scrollbar fix
    if: github.event.pull_request.title == 'Allinea il Professore al montaggio e corregge lo scroll web'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          workflow = Path(
              '.github/workflows/apply-tour-montage-scrollbar-fix.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise SystemExit('Script incorporato non trovato.')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'tour_montage_patch.py', 'exec'))
          PY

      - name: Remove temporary branch workflows
        run: |
          rm -f .github/workflows/apply-tour-montage-scrollbar-fix.yml
          rm -f .github/workflows/bootstrap-tour-montage.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format \
            lib/app.dart \
            lib/widgets/home/home_tour_overlay.dart \
            lib/widgets/tour/guided_tour.dart \
            lib/widgets/tour/professor_tour_panel.dart \
            test/guided_tour_professor_layout_test.dart

      - name: Run focused tests
        run: |
          flutter pub get
          flutter test test/guided_tour_professor_layout_test.dart --reporter expanded
          flutter test test/guided_tour_stack_layout_test.dart --reporter expanded
          flutter test test/guided_tour_scroll_restoration_test.dart --reporter expanded

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allinea il Professore al montaggio e stabilizza lo scroll web'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
