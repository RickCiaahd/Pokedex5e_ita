name: pokedex_5e_ita
description: "Trainer Atlas, companion non ufficiale in italiano per campagne con creature tascabili in 5e."
publish_to: 'none'

version: 1.3.1+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  scrollable_positioned_list: ^0.3.8
  file_picker: ^10.3.10
  share_plus: ^12.0.2

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/pokemon/
    - assets/data/moves/
    - assets/data_webapp/
    - assets/textures/gui/
    - assets/textures/gui/border/
    - assets/textures/gui/btn/
    - assets/textures/gui/icon/
    - assets/textures/gui/status/
    - assets/textures/pokemons/
    - assets/textures/sprites/
    - assets/textures/trainers/
    - assets/textures/type_names/
    - assets/textures/textures_by_type/
