name: Apply trainer path passives

on:
  push:
    branches:
      - agent/trainer-path-passives
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/trainer-path-passives' || github.ref_name == 'agent/trainer-path-passives'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/trainer-path-passives

      - name: Normalize patch script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/apply_trainer_path_passives.py')
          text = path.read_text(encoding='utf-8')
          marker = '# Changelog.'
          if marker not in text:
              raise RuntimeError('Sezione changelog non trovata nello script')
          text = text.split(marker, 1)[0] + r'''# Changelog.
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          passive_line = '- applicazione automatica dei bonus passivi principali dei Trainer Path a caratteristiche, PF, tiri per colpire, danni, STAB, tiri salvezza e Lealtà.'
          if passive_line not in text:
              anchor = '- selettori persistenti per le scelte specifiche di Researcher, Ace Trainer, Hobbyist, Type Master e Ranger.'
              if anchor not in text:
                  raise RuntimeError('Riga Trainer Path non trovata nel changelog')
              text = text.replace(anchor, anchor + '\n' + passive_line, 1)
          text = text.replace('- applicazione automatica dei bonus passivi del Trainer Path alle statistiche interessate;\n', '')
          path.write_text(text, encoding='utf-8')
          '''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply changes
        run: |
          set -o pipefail
          python .github/agent/apply_trainer_path_passives.py 2>&1 | tee patch.log

      - name: Normalize generated Dart
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('lib/services/trainer_path_passive_service.dart')
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              "final constitutionModifier = ((attributes['CON'] ?? 10) - 10) ~/ 2;",
              "final constitutionModifier = (((attributes['CON'] ?? 10) - 10) / 2).floor();",
          )
          service.write_text(text, encoding='utf-8')

          test = Path('test/trainer_path_passive_service_test.dart')
          text = test.read_text(encoding='utf-8').replace('      eggMoves: [],\n', '')
          test.write_text(text, encoding='utf-8')
          PY

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-path-passive-patch-log
          path: patch.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit generated changes
        run: |
          rm .github/agent/apply_trainer_path_passives.py
          rm .github/workflows/agent-trainer-path-passives.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Applica i bonus passivi dei Trainer Path"
          git push origin HEAD:agent/trainer-path-passives
