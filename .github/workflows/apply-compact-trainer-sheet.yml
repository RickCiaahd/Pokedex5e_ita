name: Apply compact Trainer Sheet

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/apply_compact_trainer_sheet.py
      - .github/workflows/apply-compact-trainer-sheet.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply compact Trainer Sheet
        run: python tool/apply_compact_trainer_sheet.py

      - name: Format changed Dart files
        run: |
          dart format lib/screens/trainer/trainer_sheet_screen.dart
          dart format lib/screens/trainer/trainer_sheet_mobile.dart

      - name: Analyze source
        run: flutter analyze

      - name: Commit compact Trainer Sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/trainer/trainer_sheet_screen.dart lib/screens/trainer/trainer_sheet_mobile.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Riorganizza la scheda allenatore su smartphone"
          git push origin HEAD:feature/compact-pokemon-detail-v2
