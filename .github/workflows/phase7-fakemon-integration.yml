name: Apply Fakemon phase 7 integration

on:
  push:
    branches:
      - feature/issue-61-fakemon-phase-7

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-61-fakemon-phase-7
          fetch-depth: 0

      - name: Apply phase 7 changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count}\n--- OLD ---\n{old}")
              file.write_text(text.replace(old, new, 1))

          def write(path, content):
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

          # Species-aware move lookup. A plain move-name map cannot represent two
          # Fakemon that use the same local name with different definitions.
          replace_once(
              'lib/repositories/move_repository.dart',
              """  Future<Map<String, MoveData?>> getMoves(
              Iterable<String> names, {
              int? pokemonId,
            }) async {
              final result = <String, MoveData?>{};

              for (final name in names) {
                result[name] = await getMove(name, pokemonId: pokemonId);
              }

              return result;
            }

            """,
              """  Future<Map<String, MoveData?>> getMoves(
              Iterable<String> names, {
              int? pokemonId,
            }) async {
              final result = <String, MoveData?>{};

              for (final name in names) {
                result[name] = await getMove(name, pokemonId: pokemonId);
              }

              return result;
            }

            static String contextualKey(int pokemonId, String reference) {
              return '$pokemonId:${MoveData.referenceKey(reference)}';
            }

            Future<Map<String, MoveData?>> getMovesByPokemon(
              Map<int, Iterable<String>> referencesByPokemon,
            ) async {
              final result = <String, MoveData?>{};
              for (final entry in referencesByPokemon.entries) {
                for (final reference in entry.value) {
                  result[contextualKey(entry.key, reference)] = await getMove(
                    reference,
                    pokemonId: entry.key,
                  );
                }
              }
              return result;
            }

            """,
          )

          replace_once(
              'lib/services/custom_pokemon_runtime_registry.dart',
              """  static CustomPokemonDefinition? definitionFor(int pokemonId) {
                return _definitions[pokemonId];
              }

            """,
              """  static CustomPokemonDefinition? definitionFor(int pokemonId) {
                return _definitions[pokemonId];
              }

              static Iterable<CustomPokemonDefinition> get definitions {
                return _definitions.values;
              }

            """,
          )

          # Optional breeding metadata is additive and keeps old .p5fakemon files valid.
          replace_once(
              'lib/models/custom_pokemon_definition.dart',
              """    required this.tmMoves,
                required this.eggMoves,
                required this.hitDice,
            """,
              """    required this.tmMoves,
                required this.eggMoves,
                this.eggGroups = const [],
                this.baseSpeciesId,
                required this.hitDice,
            """,
          )
          replace_once(
              'lib/models/custom_pokemon_definition.dart',
              """  final List<int> tmMoves;
              final List<String> eggMoves;
              final int hitDice;
            """,
              """  final List<int> tmMoves;
              final List<String> eggMoves;
              final List<String> eggGroups;
              final int? baseSpeciesId;
              final int hitDice;
            """,
          )
          replace_once(
              'lib/models/custom_pokemon_definition.dart',
              """      tmMoves: _intList(json['tmMoves']),
                  eggMoves: _stringList(json['eggMoves']),
                  hitDice: _readInt(json['hitDice']),
            """,
              """      tmMoves: _intList(json['tmMoves']),
                  eggMoves: _stringList(json['eggMoves']),
                  eggGroups: _stringList(json['eggGroups']),
                  baseSpeciesId: _nullableInt(json['baseSpeciesId']),
                  hitDice: _readInt(json['hitDice']),
            """,
          )
          replace_once(
              'lib/models/custom_pokemon_definition.dart',
              """      'tmMoves': tmMoves,
                  'eggMoves': eggMoves,
                  'hitDice': hitDice,
            """,
              """      'tmMoves': tmMoves,
                  'eggMoves': eggMoves,
                  'eggGroups': eggGroups,
                  if (baseSpeciesId != null) 'baseSpeciesId': baseSpeciesId,
                  'hitDice': hitDice,
            """,
          )
          replace_once(
              'lib/models/custom_pokemon_definition.dart',
              """    if (armorClass <= 0 ||
            """,
              """    if (eggGroups.length > 2 ||
                    eggGroups.any((group) => group.trim().isEmpty) ||
                    eggGroups.map((group) => group.trim().toLowerCase()).toSet().length !=
                        eggGroups.length) {
                  throw const FormatException(
                    'Un Fakemon può avere al massimo due Gruppi Uova distinti.',
                  );
                }
                if (baseSpeciesId != null && baseSpeciesId! <= 0) {
                  throw const FormatException('ID della specie base non valido.');
                }
                if (armorClass <= 0 ||
            """,
          )

          # Breeding data combines the static table with runtime Fakemon metadata.
          replace_once(
              'lib/models/breeding_species_data.dart',
              """import 'package:flutter/services.dart';

            """,
              """import 'package:flutter/services.dart';

            import '../services/custom_pokemon_runtime_registry.dart';
            import 'custom_pokemon_definition.dart';

            """,
          )
          replace_once(
              'lib/models/breeding_species_data.dart',
              """  Future<Map<int, BreedingSpeciesData>> load() async {
                final cached = _cache;
                if (cached != null) return Map<int, BreedingSpeciesData>.from(cached);

                final source = await rootBundle.loadString(
                  'assets/data/breeding_species.json',
                );
                final decoded = Map<String, dynamic>.from(jsonDecode(source));
                final items = Map<String, dynamic>.from(decoded['items'] ?? const {});
                final result = <int, BreedingSpeciesData>{};
                for (final entry in items.entries) {
                  final id = int.tryParse(entry.key);
                  if (id == null || entry.value is! Map) continue;
                  result[id] = BreedingSpeciesData.fromJson(
                    id,
                    Map<String, dynamic>.from(entry.value as Map),
                  );
                }
                _cache = result;
                return Map<int, BreedingSpeciesData>.from(result);
              }
            """,
              """  Future<Map<int, BreedingSpeciesData>> load() async {
                var cached = _cache;
                if (cached == null) {
                  final source = await rootBundle.loadString(
                    'assets/data/breeding_species.json',
                  );
                  final decoded = Map<String, dynamic>.from(jsonDecode(source));
                  final items = Map<String, dynamic>.from(decoded['items'] ?? const {});
                  final result = <int, BreedingSpeciesData>{};
                  for (final entry in items.entries) {
                    final id = int.tryParse(entry.key);
                    if (id == null || entry.value is! Map) continue;
                    result[id] = BreedingSpeciesData.fromJson(
                      id,
                      Map<String, dynamic>.from(entry.value as Map),
                    );
                  }
                  _cache = result;
                  cached = result;
                }

                return mergeCustomDefinitions(
                  cached,
                  CustomPokemonRuntimeRegistry.definitions,
                );
              }

              static Map<int, BreedingSpeciesData> mergeCustomDefinitions(
                Map<int, BreedingSpeciesData> base,
                Iterable<CustomPokemonDefinition> definitions,
              ) {
                final result = Map<int, BreedingSpeciesData>.from(base);
                for (final definition in definitions) {
                  if (definition.eggGroups.isEmpty) continue;
                  result[definition.pokemonId] = BreedingSpeciesData(
                    speciesId: definition.pokemonId,
                    eggGroups: List<String>.unmodifiable(definition.eggGroups),
                    baseSpeciesId:
                        definition.baseSpeciesId ?? definition.pokemonId,
                    isBaby: false,
                    isLegendary: false,
                    isMythical: false,
                  );
                }
                return result;
              }
            """,
          )

          # Preserve breeding lineage when a Fakemon ID is remapped on import.
          replace_once(
              'lib/services/custom_pokemon_transfer_service.dart',
              """      tmMoves: List<int>.from(source.tmMoves),
                  eggMoves: List<String>.from(source.eggMoves),
                  hitDice: source.hitDice,
            """,
              """      tmMoves: List<int>.from(source.tmMoves),
