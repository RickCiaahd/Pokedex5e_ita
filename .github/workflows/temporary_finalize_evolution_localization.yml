name: Temporary finalize evolution localization

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/item-evolution
      - name: Update changelog
        run: python tool/temporary_patch_evolution_localization.py
      - name: Remove temporary files
        run: rm tool/temporary_extract_evolution_items.py tool/temporary_patch_evolution_localization.py .github/workflows/evolution_catalog_audit.yml .github/workflows/temporary_finalize_evolution_localization.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: translation/item-evolution
          commit_message: Finalizza i controlli degli oggetti evolutivi
