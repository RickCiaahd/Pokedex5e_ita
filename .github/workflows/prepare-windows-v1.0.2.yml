name: Prepare Windows v1.0.2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-windows-v1.0.2.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/windows-v1.0.2'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update application version and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'version: 1.0.1+2'
          new = 'version: 1.0.2+3'
          if old not in text:
              raise SystemExit(f'Versione attesa non trovata: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/prepare-windows-v1.0.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m 'Aggiorna la versione applicativa a 1.0.2'
          git push origin "HEAD:${{ github.head_ref }}"
