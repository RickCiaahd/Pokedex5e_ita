name: Snapshot Trainer Atlas 1.3.2 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snapshot-v1.3.2-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect current release state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          report='diagnostics/release-v1.3.2-live.txt'
          : > "$report"
          echo 'Trainer Atlas 1.3.2 current release state' >> "$report"
          echo "Collected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$report"
          echo >> "$report"
          echo '===== WORKFLOW_DISPATCH RUNS FOR v1.3.2 =====' >> "$report"
          gh api "/repos/${{ github.repository }}/actions/runs?event=workflow_dispatch&per_page=100" \
            | jq '{workflow_runs: [.workflow_runs[] | select(.head_branch == "v1.3.2") | {id, name, status, conclusion, head_branch, head_sha, html_url, created_at, updated_at}]}' \
            >> "$report"
          echo >> "$report"
          echo '===== RELEASE =====' >> "$report"
          gh api "/repos/${{ github.repository }}/releases/tags/v1.3.2" \
            | jq '{id, tag_name, name, draft, prerelease, html_url, published_at, assets: [.assets[] | {id, name, size, state, browser_download_url}]}' \
            >> "$report" 2>&1 || true

      - name: Remove temporary probes
        shell: bash
        run: |
          git rm .github/workflows/snapshot-v1.3.2-release.yml
          git rm -f .github/workflows/probe-v1.3.2-release.yml || true

      - name: Commit current state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/release-v1.3.2-live.txt
          git commit -m 'Registra stato live release 1.3.2'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
