name: Apply compact Pokémon detail

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/apply_compact_pokemon_detail.py
      - .github/workflows/apply-compact-pokemon-detail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply compact layout
        run: python tool/apply_compact_pokemon_detail.py

      - name: Format changed Dart source
        run: dart format lib/screens/pokemon/pokemon_detail_screen_legacy.dart

      - name: Validate patch
        run: |
          git diff --check
          grep -q "class _CompactMoveTile" lib/screens/pokemon/pokemon_detail_screen_legacy.dart
          grep -q "class _MoveDetailsSheet" lib/screens/pokemon/pokemon_detail_screen_legacy.dart
          grep -q "compact && accessibleTextScaleRatio" lib/screens/pokemon/pokemon_detail_screen_legacy.dart

      - name: Commit final source and remove one-shot files
        run: |
          rm tool/apply_compact_pokemon_detail.py
          rm .github/workflows/apply-compact-pokemon-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokemon/pokemon_detail_screen_legacy.dart tool/apply_compact_pokemon_detail.py .github/workflows/apply-compact-pokemon-detail.yml
          git commit -m "Compact Pokémon detail layout and move cards"
          git push origin HEAD:feature/compact-pokemon-detail-v2
