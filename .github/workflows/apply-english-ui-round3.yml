name: Apply English UI residual fixes round 3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-english-ui-round3.yml'
      - 'tooling/apply_english_ui_residuals_round3.py'
      - 'tooling/english_ui_round3_translations.json'

permissions:
  contents: write

concurrency:
  group: apply-english-ui-round3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/english-ui-residuals-round3'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/english-ui-residuals-round3
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair generated script source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tooling/apply_english_ui_residuals_round3.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          repaired = False
          for index, line in enumerate(lines):
              if '"label: Text(formLabel ?? context.uiText' not in line:
                  continue
              lines[index] = """            "label: Text(formLabel ?? context.uiText('Forma', 'Form')),",
          """
              if index + 1 < len(lines) and lines[index + 1].strip() == '",':
                  del lines[index + 1]
              repaired = True
              break
          if not repaired:
              raise RuntimeError('Broken Form replacement line not found')
          path.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Validate and apply prepared corrections
        run: |
          python -m py_compile tooling/apply_english_ui_residuals_round3.py
          python tooling/apply_english_ui_residuals_round3.py

      - name: Repair transformed source and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          breeding_path = Path('lib/screens/breeding/breeding_screen.dart')
          breeding = breeding_path.read_text(encoding='utf-8')
          old = '"""placed in team slot ${freeSlot!.slotIndex + 1}"""'
          new = '"""placed in team slot ${freeSlot.slotIndex + 1}"""'
          if old not in breeding:
              raise RuntimeError('Expected English freeSlot expression not found')
          breeding_path.write_text(breeding.replace(old, new, 1), encoding='utf-8')

          test_path = Path('test/navigation_and_percentage_test.dart')
          test_source = test_path.read_text(encoding='utf-8')
          old_finder = "find.byTooltip('Indietro')"
          new_finder = "find.byTooltip('Back')"
          if old_finder not in test_source:
              raise RuntimeError('Expected Italian back tooltip finder not found')
          test_path.write_text(
              test_source.replace(old_finder, new_finder, 1),
              encoding='utf-8',
          )
          PY

      - name: Resolve dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format changed Dart sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACM | grep '\.dart$' || true)
          if ((${#dart_files[@]})); then
            dart format "${dart_files[@]}"
          fi

      - name: Analyze source
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/english-ui-round3-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-round3-analyze.log diagnostics/english-ui-round3-analyze-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-round3-analyze-error.txt
            git commit -m "Registra errore analisi del terzo audit inglese" || true
            git push origin HEAD:fix/english-ui-residuals-round3
            exit "$status"
          fi

      - name: Run focused localization test
        run: flutter test test/english_ui_residuals_round3_test.dart --reporter expanded

      - name: Run complete test suite
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/english-ui-round3-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-round3-test.log diagnostics/english-ui-round3-test-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-round3-test-error.txt
            git commit -m "Registra errore test del terzo audit inglese" || true
            git push origin HEAD:fix/english-ui-residuals-round3
            exit "$status"
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Run post-fix localization audit
        run: python tooling/audit_english_ui_residuals_round3.py

      - name: Upload post-fix audit
        uses: actions/upload-artifact@v4
        with:
          name: english-ui-round3-post-fix-audit
          path: diagnostics/english-ui-residuals-round3.*
          retention-days: 14

      - name: Remove temporary transfer and workflow files
        shell: bash
        run: |
          rm -f tooling/.english_ui_round3_applied
          rm -f tooling/apply_english_ui_residuals_round3.py
          rm -f tooling/english_ui_round3_translations.json
          rm -f tooling/audit_english_ui_residuals_round3.py
          rm -f diagnostics/english-ui-residuals-round3.json
          rm -f diagnostics/english-ui-residuals-round3.md
          rm -f diagnostics/english-ui-round3-analyze-error.txt
          rm -f diagnostics/english-ui-round3-test-error.txt
          rm -f .github/workflows/audit-english-ui-round3.yml
          rm -f .github/workflows/apply-english-ui-round3.yml

      - name: Commit verified correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Completa il terzo audit dei residui italiani nella UI inglese"
          git push origin HEAD:fix/english-ui-residuals-round3
