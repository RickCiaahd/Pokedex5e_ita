name: Apply WebP lossless batch 2

on:
  push:
    branches:
      - feature/webp-lossless-batch-2
    paths:
      - 'tooling/manage_webp_lossless_batches.py'
      - '.github/workflows/apply-webp-lossless-batch-2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tooling/manage_webp_lossless_batches.py'
      - '.github/workflows/apply-webp-lossless-batch-2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-webp-lossless-batch-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Scan all remaining PNGs and apply a safe batch
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/webp-lossless-batch-2
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable bounded parallel scan
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tooling/manage_webp_lossless_batches.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import argparse\n',
              'import argparse\nfrom concurrent.futures import ProcessPoolExecutor\nfrom functools import partial\n',
              1,
          )
          old = '''def scan(min_bytes: int, min_percent: float) -> list[Entry]:
              result: list[Entry] = []
              for index, path in enumerate(png_files(), 1):
                  result.append(inspect(path, min_bytes, min_percent))
                  if index % 250 == 0:
                      print(f'Inspected {index} remaining PNG files')
              return result
          '''
          new = '''def scan(min_bytes: int, min_percent: float) -> list[Entry]:
              paths = png_files()
              worker = partial(inspect, min_bytes=min_bytes, min_percent=min_percent)
              result: list[Entry] = []
              with ProcessPoolExecutor(max_workers=4) as executor:
                  for index, item in enumerate(
                      executor.map(worker, paths, chunksize=16),
                      1,
                  ):
                      result.append(item)
                      if index % 250 == 0:
                          print(f'Inspected {index} remaining PNG files')
              return result
          '''
          if old not in text:
              raise SystemExit('Expected the serial scan implementation exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Validate migration utility
        run: |
          python -m py_compile tooling/manage_webp_lossless_batches.py
          python tooling/manage_webp_lossless_batches.py --self-test

      - name: Scan every remaining PNG and apply the highest-value block
        if: github.actor != 'github-actions[bot]'
        run: >-
          python tooling/manage_webp_lossless_batches.py
          --apply
          --batch-label batch-2
          --batch-size 150
          --min-saved-bytes 4096
          --min-saved-percent 5

      - name: Refresh legal assets and inventories
        if: github.actor != 'github-actions[bot]'
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/generate_compliance_reports.py
          python tooling/generate_asset_duplicates.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Verify image and report invariants
        run: |
          python tooling/manage_webp_lossless_batches.py --check
          python tooling/apply_webp_lossless_pilot.py --check
          python tooling/repair_unreadable_pokemon_images.py --check-all
          python tooling/prepare_release_legal_assets.py --check
          python tooling/generate_compliance_reports.py --check
          python tooling/generate_asset_duplicates.py --check
          git diff --check

      - name: Analyze source
        run: flutter analyze

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web release
        run: flutter build web --release

      - name: Upload migration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Atlas-WebP-lossless-batch-2
          path: |
            docs/performance/webp-lossless-candidates.csv
            docs/performance/webp-lossless-conversions.csv
            docs/performance/webp-lossless-migration.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified batch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No eligible image was converted.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Converte il secondo lotto in WebP lossless'
          git push origin HEAD:feature/webp-lossless-batch-2
