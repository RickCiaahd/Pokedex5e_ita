name: Build compact team test APK

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-build-team-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    if: startsWith(github.event.head_commit.message, 'Build test APK')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze team screen
        run: flutter analyze lib/screens/team/team_selection_screen.dart

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BRANCH_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${BRANCH_SHA::7}"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/Pokedex5e-team-test-${SHORT_SHA}.apk"
          printf 'Branch: feature/compact-pokemon-detail-v2\nCommit: %s\nBuild type: debug APK\n' "$BRANCH_SHA" > dist/BUILD-INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5e-team-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
