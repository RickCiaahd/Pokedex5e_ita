name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish_v130:
    name: Publish Trainer Atlas 1.3.0
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Publish Trainer Atlas 1.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = 'Abilita pubblicazione 1.3.0 da pull request'
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.3.0 >/dev/null; then
            echo 'Il tag v1.3.0 esiste già.' >&2
            exit 1
          fi
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test "$version" = '1.2.0+5'

      - name: Prepare release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          old_version = 'version: 1.2.0+5'
          old_description = 'description: "Companion non ufficiale in italiano per campagne Pokémon 5e."'
          if text.count(old_version) != 1:
              raise SystemExit('Versione di partenza inattesa in pubspec.yaml')
          if text.count(old_description) != 1:
              raise SystemExit('Descrizione di partenza inattesa in pubspec.yaml')
          text = text.replace(old_version, 'version: 1.3.0+6', 1)
          text = text.replace(
              old_description,
              'description: "Trainer Atlas, companion non ufficiale in italiano per campagne con creature tascabili in 5e."',
              1,
          )
          pubspec.write_text(text, encoding='utf-8')

          windows_workflow = Path('.github/workflows/windows-release.yml')
          workflow_text = windows_workflow.read_text(encoding='utf-8')
          old_release_name = 'name: Pokédex 5e ITA '
          old_readme_title = 'Pokédex 5e ITA $version — Windows x64'
          if workflow_text.count(old_release_name) != 1:
              raise SystemExit('Nome release Windows inatteso')
          if workflow_text.count(old_readme_title) != 1:
              raise SystemExit('Titolo README Windows inatteso')
          workflow_text = workflow_text.replace(old_release_name, 'name: Trainer Atlas ', 1)
          workflow_text = workflow_text.replace(
              old_readme_title,
              'Trainer Atlas $version — Windows x64',
              1,
          )
          windows_workflow.write_text(workflow_text, encoding='utf-8')
          PY

          git show 4a4d5958e3e6cebf095046622382328b8794b05d:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          git rm .github/workflows/publish-v1.3.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml .github/workflows/flutter-ci.yml .github/workflows/windows-release.yml
          git commit -m 'Prepara la release 1.3.0'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.3.0 '${{ steps.release.outputs.sha }}' -m 'Trainer Atlas 1.3.0'
          git push origin v1.3.0
