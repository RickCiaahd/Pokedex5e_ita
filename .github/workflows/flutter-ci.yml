name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply capture type badges layout
        if: (github.head_ref == 'fix/capture-type-badges-row' || github.ref_name == 'fix/capture-type-badges-row') && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/capture/capture_pokemon_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_import = "import '../../widgets/pokemon/pokemon_asset_image.dart';\n"
          new_import = old_import + "import '../../widgets/pokemon/pokemon_type_badge_row.dart';\n"
          if "pokemon_type_badge_row.dart" not in text:
              if old_import not in text:
                  raise SystemExit('Import di riferimento non trovato')
              text = text.replace(old_import, new_import, 1)

          old_layout = """        subtitle: Wrap(
          spacing: 6,
          runSpacing: 4,
          crossAxisAlignment: WrapCrossAlignment.center,
          children: [
            Text(number),
            for (final type in pokemon.types)
              PokemonTypeBadge(type: type, height: 18),
          ],
        ),
"""
          new_layout = """        subtitle: Column(
          mainAxisSize: MainAxisSize.min,
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Text(number),
            const SizedBox(height: 4),
            PokemonTypeBadgeRow(types: pokemon.types),
          ],
        ),
"""
          if old_layout not in text:
              raise SystemExit('Layout precedente della card non trovato')
          text = text.replace(old_layout, new_layout, 1)
          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/screens/capture/capture_pokemon_screen.dart \
            lib/widgets/pokemon/pokemon_type_badge_row.dart \
            test/pokemon_type_badge_row_test.dart
          git rm .github/workflows/apply-capture-type-badges-row.yml
          git checkout origin/main -- .github/workflows/flutter-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allinea i tipi nella schermata di cattura'
          git push origin HEAD:fix/capture-type-badges-row

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify compliance reports
        run: python tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
