name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  apply_structural_tour_fix:
    name: Keep tour layer positioned
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Corregge definitivamente le schermate vuote dopo i tour'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Keep GuidedTourLayer positioned when hidden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('lib/widgets/tour/guided_tour.dart')
          text = path.read_text(encoding='utf-8')
          replacement = '''  @override
            Widget build(BuildContext context) {
              return Positioned.fill(
                child: AnimatedBuilder(
                  animation: controller,
                  builder: (context, _) {
                    if (!controller.isVisible || steps.isEmpty) {
                      return const IgnorePointer(child: SizedBox.shrink());
                    }

                    final safeIndex = controller.stepIndex.clamp(
                      0,
                      steps.length - 1,
                    );
                    return GuidedTourOverlay(
                      step: steps[safeIndex],
                      stepIndex: safeIndex,
                      totalSteps: steps.length,
                      scrollController: scrollController,
                      onBack: safeIndex == 0 ? null : controller.previous,
                      onNext: () {
                        if (safeIndex == steps.length - 1) {
                          _finishTour();
                          return;
                        }
                        controller.next(steps.length);
                      },
                      onSkip: _finishTour,
                    );
                  },
                ),
              );
            }
          }

          class GuidedTourOverlay'''

          updated, count = re.subn(
              r'  @override\n  Widget build\(BuildContext context\) \{\n    return AnimatedBuilder\(.*?\n  \}\n\}\n\nclass GuidedTourOverlay',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Il build di GuidedTourLayer non è stato sostituito una sola volta.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Add stack regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > test/guided_tour_stack_layout_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          import 'package:pokedex_5e_ita/services/guided_tour_service.dart';
          import 'package:pokedex_5e_ita/widgets/tour/guided_tour.dart';

          class _FakeGuidedTourService extends GuidedTourService {
            @override
            Future<bool> shouldShowTour(String tourId) async => false;

            @override
            Future<void> markTourCompleted(String tourId) async {}
          }

          void main() {
            testWidgets(
              'chiudendo il tour lo Stack mantiene le dimensioni della schermata',
              (tester) async {
                await tester.binding.setSurfaceSize(const Size(500, 800));
                addTearDown(() => tester.binding.setSurfaceSize(null));

                final contentKey = GlobalKey();
                final targetKey = GlobalKey();
                final scrollController = ScrollController();
                final tourController = GuidedTourController(
                  tourId: 'stack_test',
                  service: _FakeGuidedTourService(),
                );
                addTearDown(scrollController.dispose);
                addTearDown(tourController.dispose);

                tourController.start();
                await tester.pumpWidget(
                  MaterialApp(
                    home: Scaffold(
                      body: Align(
                        alignment: Alignment.topLeft,
                        child: Stack(
                          children: [
                            Positioned.fill(
                              child: ListView(
                                key: contentKey,
                                controller: scrollController,
                                children: [
                                  Container(
                                    key: targetKey,
                                    height: 120,
                                    color: Colors.orange,
                                  ),
                                ],
                              ),
                            ),
                            GuidedTourLayer(
                              controller: tourController,
                              steps: [
                                GuidedTourStepData(
                                  targetKey: targetKey,
                                  icon: Icons.info_outline,
                                  title: 'Tour',
                                  description: 'Descrizione.',
                                ),
                              ],
                              scrollController: scrollController,
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                );
                await tester.pump();

                expect(tester.getSize(find.byKey(contentKey)).height, greaterThan(0));

                await tourController.finish();
                await tester.pumpAndSettle();

                expect(tourController.isVisible, isFalse);
                expect(tester.getSize(find.byKey(contentKey)).height, greaterThan(0));
              },
            );
          }
          DART

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: dart format lib/widgets/tour/guided_tour.dart test/guided_tour_stack_layout_test.dart

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/tour/guided_tour.dart test/guided_tour_stack_layout_test.dart
          git commit -m 'Mantiene il layer del tour posizionato nello Stack'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
