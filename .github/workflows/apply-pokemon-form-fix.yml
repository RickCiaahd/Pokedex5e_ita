name: Apply Pokemon form fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pokemon-form-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply asset resolver changes
        run: python3 tool/patch_pokemon_asset.py

      - name: Apply screen preview changes
        run: python3 tool/patch_pokemon_screens.py

      - name: Check generated diff
        run: git diff --check

      - name: Remove temporary patch files
        run: |
          rm tool/patch_pokemon_asset.py
          rm tool/patch_pokemon_screens.py
          rm .github/workflows/apply-pokemon-form-fix.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Pokemon gender forms and asset resolution"
          git push origin main
