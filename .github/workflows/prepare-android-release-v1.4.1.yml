name: Prepare Android release 1.4.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-android-release-v1.4.1.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: Bump version and dispatch Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version to 1.4.1+15
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version: 1.4.0+14' pubspec.yaml
          sed -i 's/^version: 1\.4\.0+14$/version: 1.4.1+15/' pubspec.yaml
          grep -Fxq 'version: 1.4.1+15' pubspec.yaml

      - name: Commit version bump directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m 'chore: bump version to 1.4.1+15'
          git push origin HEAD:main

      - name: Launch Android release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-release.yml --ref main
          echo 'Android release dispatched on main.'
