name: Held item audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python tool/temporary_extract_held_items.py
      - run: python tool/temporary_compare_held_names.py
      - uses: actions/upload-artifact@v4
        with:
          name: held-items-audit
          path: |
            held-items-audit.json
            held-items-pokemoncentral.json
