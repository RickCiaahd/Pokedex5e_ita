name: Apply native content sharing

on:
  push:
    branches:
      - feature/native-content-sharing
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: native-content-sharing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[native-sharing-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-content-sharing
          fetch-depth: 0

      - name: Align README patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = "Dalla schermata Squadra è inoltre possibile esportare e importare singoli Pokémon o una formazione completa senza sostituire l'intero profilo; i Pokémon rimpiazzati e gli eventuali esuberi vengono conservati nel PC. Le librerie del Master supportano file portabili per incontri e Allenatori PNG, mentre il Fight del Master può produrre un riepilogo testuale con round, iniziativa, PF, status e PP. L'importazione crea sempre una nuova copia, evitando di sovrascrivere contenuti già presenti.\n"
          new = "Dalla schermata Squadra è inoltre possibile esportare e importare singoli Pokémon o una formazione completa senza sostituire l’intero profilo; i Pokémon rimpiazzati e gli eventuali esuberi vengono conservati nel PC. Le librerie del Master supportano file portabili per incontri e Allenatori PNG, mentre il Fight del Master può produrre un riepilogo testuale con round, iniziativa, PF, status e PP.\n"
          if text.count(old) != 1:
              raise SystemExit(f'README source occurrence count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply native sharing integration
        run: |
          set +e
          python tool/apply_native_content_sharing.py > patch-output.log 2>&1
          code=$?
          echo "$code" > patch-exit-code.txt
          cat patch-output.log
          exit 0

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sharing-patch-diagnostics
          path: |
            patch-output.log
            patch-exit-code.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on patch failure
        run: |
          code=$(cat patch-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Patch script failed with code $code"
            exit "$code"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/native_share_service.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/tools/encounter_library_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            test/native_share_service_test.dart

      - name: Install dependencies
        run: |
          set +e
          flutter pub get > pub-get.log 2>&1
          code=$?
          echo "$code" > pub-get-exit-code.txt
          cat pub-get.log
          exit 0

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sharing-pub-get-diagnostics
          path: |
            pub-get.log
            pub-get-exit-code.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on dependency failure
        run: |
          code=$(cat pub-get-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "flutter pub get failed with code $code"
            exit "$code"
          fi

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run native sharing tests
        run: flutter test test/native_share_service_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit verified native sharing
        run: |
          rm -f tool/apply_native_content_sharing.py .github/workflows/apply-native-content-sharing.yml patch-output.log patch-exit-code.txt pub-get.log pub-get-exit-code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge la condivisione nativa dei contenuti [native-sharing-applied]"
          git push origin HEAD:feature/native-content-sharing
