name: Publish v1.1.0 tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.1.0.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify, clean and publish tag
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 1.1.0+4$' pubspec.yaml
          if git rev-parse 'refs/tags/v1.1.0' >/dev/null 2>&1; then
            echo 'Il tag v1.1.0 esiste già.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v1.1.0.yml
          git commit -m 'Rimuove il workflow temporaneo della release 1.1.0'
          git tag -a v1.1.0 -m 'Pokédex 5e ITA 1.1.0'
          git push origin HEAD:main
          git push origin v1.1.0
