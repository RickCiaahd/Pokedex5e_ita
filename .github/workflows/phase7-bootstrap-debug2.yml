name: Finalize Fakemon phase 7 bootstrap

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply flexible phase 7 patch
        id: patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase7-fakemon-integration.yml').read_text()
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('\n      - uses: subosito/flutter-action@v2', start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'
          original = (
              "def replace_once(path, old, new):\n"
              "    file = Path(path)\n"
              "    text = file.read_text()\n"
              "    count = text.count(old)\n"
              "    if count != 1:\n"
              "        raise RuntimeError(f\"{path}: expected one occurrence, found {count}\\n--- OLD ---\\n{old}\")\n"
              "    file.write_text(text.replace(old, new, 1))\n"
          )
          flexible = (
              "import textwrap\n"
              "\n"
              "def _shift_after_first(value, amount):\n"
              "    lines = value.splitlines(keepends=True)\n"
              "    if len(lines) <= 1:\n"
              "        return value\n"
              "    shifted = [lines[0]]\n"
              "    for line in lines[1:]:\n"
              "        prefix = len(line) - len(line.lstrip(' '))\n"
              "        remove = min(amount, prefix)\n"
              "        shifted.append(line[remove:])\n"
              "    return ''.join(shifted)\n"
              "\n"
              "def _fuzzy_replace(text, old, new):\n"
              "    old_lines = old.splitlines()\n"
              "    while old_lines and not old_lines[0].strip():\n"
              "        old_lines.pop(0)\n"
              "    while old_lines and not old_lines[-1].strip():\n"
              "        old_lines.pop()\n"
              "    if not old_lines:\n"
              "        return None\n"
              "    text_lines = text.splitlines(keepends=True)\n"
              "    matches = []\n"
              "    for start in range(0, len(text_lines) - len(old_lines) + 1):\n"
              "        chunk = text_lines[start:start + len(old_lines)]\n"
              "        if all(chunk[index].strip() == old_lines[index].strip() for index in range(len(old_lines))):\n"
              "            matches.append(start)\n"
              "    if len(matches) != 1:\n"
              "        return None\n"
              "    start = matches[0]\n"
              "    end = start + len(old_lines)\n"
              "    indent = len(text_lines[start]) - len(text_lines[start].lstrip(' '))\n"
              "    normalized = textwrap.dedent(new).strip('\\n')\n"
              "    replacement = '\\n'.join((' ' * indent + line if line else '') for line in normalized.splitlines())\n"
              "    if text_lines[end - 1].endswith('\\n'):\n"
              "        replacement += '\\n'\n"
              "    return ''.join(text_lines[:start]) + replacement + ''.join(text_lines[end:])\n"
              "\n"
              "def replace_once(path, old, new):\n"
              "    file = Path(path)\n"
              "    text = file.read_text()\n"
              "    deferred = {\n"
              "        'lib/screens/tools/pokemon_generator_screen.dart',\n"
              "        'lib/screens/battle/battle_screen.dart',\n"
              "    }\n"
              "    if path in deferred:\n"
              "        print(f'{path}: deferred-complete-screen')\n"
              "        return\n"
              "    candidates = [(old, new, 'exact')]\n"
              "    for amount in range(1, 13):\n"
              "        candidates.append((_shift_after_first(old, amount), _shift_after_first(new, amount), f'shift-after-first-{amount}'))\n"
              "    for candidate_old, candidate_new, label in candidates:\n"
              "        count = text.count(candidate_old)\n"
              "        if count == 1:\n"
              "            print(f'{path}: {label}')\n"
              "            file.write_text(text.replace(candidate_old, candidate_new, 1))\n"
              "            return\n"
              "    fuzzy = _fuzzy_replace(text, old, new)\n"
              "    if fuzzy is not None:\n"
              "        print(f'{path}: fuzzy-lines')\n"
              "        file.write_text(fuzzy)\n"
              "        return\n"
              "    raise RuntimeError(f\"{path}: no unique flexible occurrence found\\n--- OLD ---\\n{old}\")\n"
          )
          if original not in script:
              raise RuntimeError('Unable to replace the bootstrap helper.')
          Path('/tmp/apply-phase7.sh').write_text(script.replace(original, flexible, 1))
          PY
          set +e
          bash /tmp/apply-phase7.sh > .github/phase7-final-bootstrap.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            set +e
            python3 <<'PY' >> .github/phase7-final-bootstrap.txt 2>&1
          from pathlib import Path

          def replace_exact(text, old, new, label, expected=1):
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new, expected)

          generator_path = Path('lib/screens/tools/pokemon_generator_screen.dart')
          text = generator_path.read_text()
          text = replace_exact(
              text,
              "      final moves = await _moveRepository.getMoves(generated.selectedMoves);",
              "      final moves = await _moveRepository.getMovesByPokemon({\n        generated.basePokemon.id: generated.selectedMoves,\n      });",
              'single generator move lookup',
          )
          old = (
              "  Future<Map<String, MoveData?>> _loadGeneratedMoves(\n"
              "    Iterable<GeneratedPokemon> generated,\n"
              "  ) {\n"
              "    final references = <String>{\n"
              "      for (final pokemon in generated) ...pokemon.selectedMoves,\n"
              "    };\n"
              "    return _moveRepository.getMoves(references);\n"
              "  }\n"
          )
          new = (
              "  Future<Map<String, MoveData?>> _loadGeneratedMoves(\n"
              "    Iterable<GeneratedPokemon> generated,\n"
              "  ) {\n"
              "    final referencesByPokemon = <int, Set<String>>{};\n"
              "    for (final pokemon in generated) {\n"
              "      referencesByPokemon\n"
              "          .putIfAbsent(pokemon.basePokemon.id, () => <String>{})\n"
              "          .addAll(pokemon.selectedMoves);\n"
              "    }\n"
              "    return _moveRepository.getMovesByPokemon(referencesByPokemon);\n"
              "  }\n"
          )
          text = replace_exact(text, old, new, 'batch generator move loader')
          old = "_generatedMoves[reference]?.id ?? reference"
          new = (
              "_generatedMoves[\n"
              "              MoveRepository.contextualKey(\n"
              "                generated.basePokemon.id,\n"
              "                reference,\n"
              "              )\n"
              "            ]?.id ??\n"
              "            reference"
          )
          text = replace_exact(text, old, new, 'generated persisted move references', expected=2)
          text = replace_exact(
              text,
              "                      move: moves[reference],",
              "                      move: moves[\n                        MoveRepository.contextualKey(\n                          generated.basePokemon.id,\n                          reference,\n                        )\n                      ],",
              'generated move chip lookup',
          )
          generator_path.write_text(text)
          print('pokemon_generator_screen.dart: supplemental contextual patch')

          battle_path = Path('lib/screens/battle/battle_screen.dart')
          text = battle_path.read_text()
          text = replace_exact(
              text,
              "import '../../services/custom_pokemon_runtime_registry.dart';\n",
              '',
              'remove obsolete runtime registry import',
          )
          old = (
              "    final moveReferences = <String>{'Struggle'};\n"
              "\n"
              "    for (final slot in team) {\n"
              "      final pokemonId = slot.pokemonId;\n"
              "      if (pokemonId == null) continue;\n"
              "      final pokemon = pokemonById[pokemonId];\n"
              "      if (pokemon == null) continue;\n"
              "      moveReferences.addAll(_movesForSlot(slot, pokemon));\n"
              "    }\n"
              "\n"
              "    final moves = await _moveRepository.getMoves(moveReferences);\n"
              "    for (final slot in team) {\n"
              "      final pokemonId = slot.pokemonId;\n"
              "      if (pokemonId == null) continue;\n"
              "      final pokemon = pokemonById[pokemonId];\n"
              "      if (pokemon == null) continue;\n"
              "      for (final reference in _movesForSlot(slot, pokemon)) {\n"
              "        final localMove = CustomPokemonRuntimeRegistry.moveFor(\n"
              "          pokemonId,\n"
              "          reference,\n"
              "        );\n"
              "        if (localMove != null) moves[reference] = localMove;\n"
              "      }\n"
              "    }\n"
          )
          new = (
              "    final referencesByPokemon = <int, Set<String>>{};\n"
              "    for (final slot in team) {\n"
              "      final pokemonId = slot.pokemonId;\n"
              "      if (pokemonId == null) continue;\n"
              "      final pokemon = pokemonById[pokemonId];\n"
              "      if (pokemon == null) continue;\n"
              "      referencesByPokemon\n"
              "          .putIfAbsent(pokemonId, () => <String>{'Struggle'})\n"
              "          .addAll(_movesForSlot(slot, pokemon));\n"
              "    }\n"
              "    final moves = await _moveRepository.getMovesByPokemon(\n"
              "      referencesByPokemon,\n"
              "    );\n"
          )
          text = replace_exact(text, old, new, 'battle move loading')
          old = (
              "  bool _hasNoPpLeft(\n"
              "    TeamSlot slot,\n"
              "    List<String> moveReferences,\n"
              "    Map<String, MoveData?> moves,\n"
              "  ) {\n"
              "    final trackableMoves = moveReferences\n"
              "        .where((reference) => _maxPpFor(moves[reference]) > 0)\n"
              "        .toList(growable: false);\n"
              "\n"
              "    return trackableMoves.isNotEmpty &&\n"
              "        trackableMoves.every((reference) {\n"
              "          return _remainingPp(slot, reference, moves[reference]) <= 0;\n"
              "        });\n"
              "  }\n"
          )
          new = (
              "  bool _hasNoPpLeft(\n"
              "    TeamSlot slot,\n"
              "    List<String> moveReferences,\n"
              "    Map<String, MoveData?> moves,\n"
              "  ) {\n"
              "    final pokemonId = slot.pokemonId;\n"
              "    if (pokemonId == null) return false;\n"
              "    MoveData? resolve(String reference) =>\n"
              "        moves[MoveRepository.contextualKey(pokemonId, reference)];\n"
              "    final trackableMoves = moveReferences\n"
              "        .where((reference) => _maxPpFor(resolve(reference)) > 0)\n"
              "        .toList(growable: false);\n"
              "\n"
              "    return trackableMoves.isNotEmpty &&\n"
              "        trackableMoves.every((reference) {\n"
              "          return _remainingPp(slot, reference, resolve(reference)) <= 0;\n"
              "        });\n"
              "  }\n"
          )
          text = replace_exact(text, old, new, 'battle no PP check')
          text = replace_exact(
              text,
              "            final heldItem = data.heldItemFor(activeSlot);",
              "            MoveData? moveForActive(String reference) => data.moves[\n                  MoveRepository.contextualKey(activeSlot.pokemonId!, reference)\n                ];\n            final heldItem = data.heldItemFor(activeSlot);",
              'active battle move resolver',
          )
          text = replace_exact(
              text,
              "                    _StruggleWarning(move: data.moves['Struggle']),",
              "                    _StruggleWarning(move: moveForActive('Struggle')) ,",
              'battle Struggle lookup',
          )
          text = replace_exact(
              text,
              'data.moves[reference]',
              'moveForActive(reference)',
              'active battle move lookups',
              expected=7,
          )
          battle_path.write_text(text)
          print('battle_screen.dart: supplemental contextual patch')
          PY
            supplemental_status=$?
            set -e
            if [ "$supplemental_status" -ne 0 ]; then
              status=$supplemental_status
            fi
          fi
          echo "exit_status=$status" >> .github/phase7-final-bootstrap.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.patch.outputs.status == '0'
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        if: steps.patch.outputs.status == '0'
        run: |
          dart format \
            lib/repositories/move_repository.dart \
            lib/services/custom_pokemon_runtime_registry.dart \
            lib/models/custom_pokemon_definition.dart \
            lib/models/breeding_species_data.dart \
            lib/services/custom_pokemon_transfer_service.dart \
            lib/services/embedded_custom_pokemon_transfer_service.dart \
            lib/screens/pokemon/custom_pokemon_library_screen.dart \
            lib/screens/tools/pokemon_generator_screen.dart \
            lib/widgets/tools/generated_pokemon_batch_card.dart \
            lib/screens/tools/encounter_result_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/battle/battle_screen.dart \
            test/fakemon_phase7_integration_test.dart

      - name: Commit implementation
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/phase7-bootstrap.txt .github/phase7-flex-bootstrap.txt .github/phase7-final-bootstrap.txt .github/phase7-trigger.txt .github/phase7-trigger2.txt phase7-bootstrap.log
          git rm .github/workflows/phase7-fakemon-integration.yml
          git rm .github/workflows/phase7-pr-bootstrap.yml
          git rm .github/workflows/phase7-bootstrap-debug.yml
          git rm .github/workflows/phase7-bootstrap-debug2.yml
          git rm .github/workflows/phase7-bootstrap-flex.yml
          git rm .github/workflows/phase7-bootstrap-flex2.yml
          git add .
          git commit -m "Completa integrazione Fakemon nei flussi di gioco"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Persist failure diagnostics
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/phase7-final-bootstrap.txt
          git commit -m "Registra diagnostica finale fase 7"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
