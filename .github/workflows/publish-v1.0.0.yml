name: Publish v1.0.0

on:
  push:
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Create the v1.0.0 tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check release prerequisites
        id: preflight
        shell: bash
        run: |
          missing=()
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          [ "$VERSION" = "1.0.0" ] || missing+=("pubspec-version-$VERSION")
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_STORE_PASSWORD" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            missing+=("tag-v1.0.0-already-exists")
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          else
            printf -v joined '%s, ' "${missing[@]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${joined%, }" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release tag
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          rm -f .github/workflows/publish-v1.0.0.yml
          rm -f docs/release-preflight-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avvia la release GitHub 1.0.0'
          git tag -a v1.0.0 -m 'Pokédex 5e ITA 1.0.0'
          git push origin HEAD:main
          git push origin v1.0.0

      - name: Record blocked release
        if: steps.preflight.outputs.ready != 'true'
        shell: bash
        run: |
          rm -f .github/workflows/publish-v1.0.0.yml
          cat > docs/release-preflight-status.md <<EOF
          # Stato preflight release 1.0.0

          La pubblicazione automatica è stata bloccata perché mancano o non sono validi questi prerequisiti:

          `${{ steps.preflight.outputs.missing }}`

          Configurare i secret indicati seguendo `docs/android-release.md`, quindi rimuovere questo file prima di riprovare.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Registra il blocco della release GitHub 1.0.0'
          git push origin HEAD:main
