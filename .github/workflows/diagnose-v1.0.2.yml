name: Diagnose v1.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-v1.0.2.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record current release status
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG_SHA=$(git rev-list -n 1 v1.0.2)

          gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release.yml --commit "$TAG_SHA" --limit 5 --json databaseId,status,conclusion,url,createdAt,updatedAt > windows-status.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow android-release.yml --commit "$TAG_SHA" --limit 5 --json databaseId,status,conclusion,url,createdAt,updatedAt > android-status.json

          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" --json name,tagName,url,assets > release-status.json 2>/dev/null; then
            release_exists=yes
          else
            echo '{}' > release-status.json
            release_exists=no
          fi

          {
            echo '# Stato diagnostico release 1.0.2'
            echo
            echo "Generato il $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "- Tag SHA: \`$TAG_SHA\`"
            echo "- GitHub Release esistente: **$release_exists**"
            echo
            echo '## Workflow Windows'
            echo '```json'
            jq . windows-status.json
            echo '```'
            echo
            echo '## Workflow Android'
            echo '```json'
            jq . android-status.json
            echo '```'
            echo
            echo '## Release'
            echo '```json'
            jq . release-status.json
            echo '```'
          } > docs/release-v1.0.2-current-status.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-v1.0.2.yml
          git add docs/release-v1.0.2-current-status.md
          git commit -m 'Registra lo stato diagnostico della release 1.0.2'
          git push origin HEAD:main
