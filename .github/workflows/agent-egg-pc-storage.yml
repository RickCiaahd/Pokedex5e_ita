name: Apply egg PC storage and layout

on:
  push:
    branches:
      - agent/egg-pc-storage-and-layout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/egg-pc-storage-and-layout' || github.ref_name == 'agent/egg-pc-storage-and-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/egg-pc-storage-and-layout

      - name: Normalize patch replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/apply_egg_pc_storage.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          def replace_block(marker_text, replacement):
              marker = next(
                  index
                  for index, line in enumerate(lines)
                  if marker_text in line
              )
              start = marker
              while start >= 0 and lines[start] != 'text = replace_once(':
                  start -= 1
              end = marker + 1
              if start < 0 or end >= len(lines) or lines[end] != ')':
                  raise RuntimeError(f'Blocco non riconosciuto: {marker_text}')
              lines[start:end + 1] = replacement

          replace_block(
              "'move egg to daycare flags',",
              [
                  "old_daycare_copy = '''      egg.copyWith(isInDayCare: true, carriedEntireIncubation: false),'''",
                  "new_daycare_copy = '''      egg.copyWith(",
                  "        isInDayCare: true,",
                  "        isInPc: false,",
                  "        carriedEntireIncubation: false,",
                  "      ),'''",
                  "if text.count(old_daycare_copy) != 2:",
                  "    raise RuntimeError(",
                  "        f'move egg to daycare flags: attesi 2 match, trovati {text.count(old_daycare_copy)}'",
                  "    )",
                  "text = text.replace(old_daycare_copy, new_daycare_copy)",
              ],
          )

          replace_block(
              "'pass move to pc callback',",
              [
                  "old_callback = 'onMoveToDayCare: () => _moveEggToDayCare(data, egg),\\n'",
                  "new_callback = (",
                  "    old_callback",
                  "    + '                       onMoveToPc: () => _moveEggToPc(data, egg),\\n'",
                  ")",
                  "if text.count(old_callback) != 1:",
                  "    raise RuntimeError(",
                  "        f'pass move to pc callback: atteso 1 match, trovati {text.count(old_callback)}'",
                  "    )",
                  "text = text.replace(old_callback, new_callback, 1)",
              ],
          )

          replace_block(
              "'pc toolbar egg counts',",
              [
                  "old_toolbar_counts = (",
                  "    'storedCount: filteredPcPokemon.length,\\n'",
                  "    '                       totalCount: _pcPokemon.length,'",
                  ")",
                  "new_toolbar_counts = (",
                  "    'storedCount: filteredCount,\\n'",
                  "    '                       totalCount: storedCount,'",
                  ")",
                  "if text.count(old_toolbar_counts) != 1:",
                  "    raise RuntimeError(",
                  "        f'pc toolbar egg counts: atteso 1 match, trovati {text.count(old_toolbar_counts)}'",
                  "    )",
                  "text = text.replace(old_toolbar_counts, new_toolbar_counts, 1)",
              ],
          )

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Apply changes
        run: |
          set -o pipefail
          python .github/agent/apply_egg_pc_storage.py 2>&1 | tee patch.log

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egg-pc-storage-patch-log
          path: patch.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit generated changes
        run: |
          rm .github/agent/apply_egg_pc_storage.py
          rm .github/workflows/agent-egg-pc-storage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge deposito uova nel PC e corregge il layout"
          git push origin HEAD:agent/egg-pc-storage-and-layout
