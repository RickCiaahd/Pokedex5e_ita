name: Analyzer diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer and capture output
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyzer.log
          status=${PIPESTATUS[0]}
          echo "$status" > analyzer-status.txt
          exit 0

      - name: Upload analyzer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-diagnostic
          path: |
            analyzer.log
            analyzer-status.txt
          if-no-files-found: error
          retention-days: 3
