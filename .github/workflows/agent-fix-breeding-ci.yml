name: Fix breeding CI

on:
  push:
    branches:
      - agent/breeding-eggs-core
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/breeding-eggs-core' || github.ref_name == 'agent/breeding-eggs-core'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/breeding-eggs-core

      - name: Apply analyzer fixes and restore CI
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('lib/services/breeding_service.dart')
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              'final base = d100Rolls.reduce(max);',
              'final base = d100Rolls.reduce((first, second) => first >= second ? first : second);',
              1,
          )
          text = text.replace(
              'base + incubatorRolls.fold(0, (sum, value) => sum + value);',
              'base + incubatorRolls.fold<int>(0, (sum, value) => sum + value);',
              1,
          )
          text = text.replace(
              'incubationRemaining: max(0, egg.incubationRemaining - reduction),',
              'incubationRemaining: (egg.incubationRemaining - reduction).clamp(0, egg.hatchTime).toInt(),',
              1,
          )
          service.write_text(text, encoding='utf-8')

          screen = Path('lib/screens/breeding/breeding_screen.dart')
          text = screen.read_text(encoding='utf-8')
          text = text.replace(
              '      value: candidates.any((candidate) => candidate.key == value)',
              '      initialValue: candidates.any((candidate) => candidate.key == value)',
              1,
          )
          text = text.replace(
              '              value: egg.incubator,',
              '              initialValue: egg.incubator,',
              1,
          )
          screen.write_text(text, encoding='utf-8')

          Path('.github/workflows/flutter-ci.yml').write_text('''name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded
''', encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          rm .github/workflows/agent-fix-breeding-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregge calcoli e selettori dell'allevamento"
          git push origin HEAD:agent/breeding-eggs-core
