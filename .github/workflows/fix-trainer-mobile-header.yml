name: Fix Trainer mobile header

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/fix_trainer_mobile_header.py
      - .github/workflows/fix-trainer-mobile-header.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply header fix
        run: python tool/fix_trainer_mobile_header.py

      - name: Format file
        run: dart format lib/screens/trainer/trainer_sheet_mobile.dart

      - name: Analyze source
        run: flutter analyze

      - name: Commit header fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/trainer/trainer_sheet_mobile.dart
          git commit -m "Correggi l'intestazione mobile della scheda allenatore"
          git push origin HEAD:feature/compact-pokemon-detail-v2
