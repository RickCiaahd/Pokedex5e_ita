name: Finalize NPC master fight

on:
  push:
    branches:
      - feat/npc-library-master-fight
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/npc-library-master-fight
          fetch-depth: 0

      - name: Apply final cleanup
        run: python3 tool/finalize_npc_master.py

      - name: Remove temporary files
        run: |
          rm tool/finalize_npc_master.py
          rm .github/workflows/finalize-npc-master.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/models/master_battle_session.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: flutter test test/npc_library_master_battle_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize NPC library and multi-trainer master fight" || true
          git push origin feat/npc-library-master-fight
