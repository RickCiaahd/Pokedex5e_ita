name: Fix eggs in team

on:
  push:
    branches:
      - agent/eggs-in-team-and-daycare

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/eggs-in-team-and-daycare

      - name: Apply final fixes
        run: python .github/agent/fix_egg_team_generated.py

      - name: Commit fixes
        run: |
          rm .github/agent/fix_egg_team_generated.py
          rm .github/workflows/agent-fix-egg-team.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rifinisce le uova come entità della squadra"
          git push origin HEAD:agent/eggs-in-team-and-daycare
