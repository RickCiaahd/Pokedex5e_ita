name: Complete UI localization

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tooling/**'
      - '.github/workflows/audit-ui-localization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-ui-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply_and_validate:
    if: github.head_ref == 'feature/complete-ui-localization' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-ui-localization
          fetch-depth: 0

      - name: Detect application state
        id: state
        shell: bash
        run: |
          if grep -q "static Map<String, String> get abilityLabels" lib/models/trainer_ui_localization.dart; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild patch and capture status
        if: steps.state.outputs.already_applied == 'false'
        shell: bash
        run: |
          set +e
          mkdir -p patch-diagnostics
          cat tooling/patches/complete-ui.patch.gz.b64.part* | tr -d '\r\n\t ' > patch-diagnostics/complete-ui.patch.gz.b64
          sha256sum patch-diagnostics/complete-ui.patch.gz.b64 | tee patch-diagnostics/checksums.txt
          base64 --decode patch-diagnostics/complete-ui.patch.gz.b64 | gzip --decompress > patch-diagnostics/complete-ui.patch
          status=$?
          if [ "$status" -eq 0 ]; then
            sha256sum patch-diagnostics/complete-ui.patch | tee -a patch-diagnostics/checksums.txt
            git apply --check patch-diagnostics/complete-ui.patch
            status=$?
          fi
          echo "$status" > patch-diagnostics/status.txt
          exit 0

      - name: Upload patch diagnostics
        if: steps.state.outputs.already_applied == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: complete-ui-patch-diagnostics
          path: patch-diagnostics
          retention-days: 7

      - name: Stop when patch reconstruction failed
        if: steps.state.outputs.already_applied == 'false'
        run: test "$(cat patch-diagnostics/status.txt)" = "0"

      - name: Apply reconstructed patch
        if: steps.state.outputs.already_applied == 'false'
        run: git apply patch-diagnostics/complete-ui.patch

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format migrated sources
        run: |
          dart format \
            lib/localization/ui_text.dart \
            lib/models/trainer_ui_localization.dart \
            lib/screens/bag/bag_screen.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/pc/pokemon_pc_screen.dart \
            lib/screens/pokedex/pokedex_screen.dart \
            lib/screens/profile/profiles_screen.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/tools/tools_screen.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/widgets/pokedex/pokemon_summary_dialog.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            test/navigation_ui_localization_test.dart \
            test/secondary_ui_localization_test.dart \
            test/trainer_ui_localization_test.dart

      - name: Analyze source
        run: flutter analyze

      - name: Run targeted localization tests
        run: |
          flutter test test/secondary_ui_localization_test.dart
          flutter test test/navigation_ui_localization_test.dart
          flutter test test/trainer_ui_localization_test.dart
          flutter test test/localized_game_catalogs_test.dart

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Run post-migration UI audit
        run: python tooling/audit_ui_strings.py

      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-localization-audit
          path: build/ui-localization-audit
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish migrated sources
        if: steps.state.outputs.already_applied == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/models/trainer_ui_localization.dart \
            lib/screens/bag/bag_screen.dart \
            lib/screens/battle/battle_screen.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/pc/pokemon_pc_screen.dart \
            lib/screens/pokedex/pokedex_screen.dart \
            lib/screens/profile/profiles_screen.dart \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/tools/tools_screen.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/widgets/pokedex/pokemon_summary_dialog.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            test/navigation_ui_localization_test.dart \
            test/secondary_ui_localization_test.dart \
            test/trainer_ui_localization_test.dart
          git commit -m "Completa la localizzazione delle schermate principali [skip ci]"
          git push origin HEAD:feature/complete-ui-localization
