name: One-time Fakemon integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Fakemon branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-core
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply final corrections
        run: python3 .github/scripts/fix_fakemon_analysis.py

      - name: Format and analyze Fakemon source
        run: |
          dart format \
            lib/screens/pokemon/custom_pokemon_library_screen.dart \
            test/custom_pokemon_definition_test.dart
          flutter pub get
          flutter analyze

      - name: Commit final corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_fakemon_analysis.py
          git add -A
          git commit -m 'Corregge e valida l’editor Fakemon'
          git push origin feature/fakemon-core
