name: Diagnose NPC master fight

on:
  push:
    branches:
      - feat/npc-library-master-fight
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/npc-library-master-fight
          fetch-depth: 0

      - name: Apply obvious import fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              'lib/services/master_battle_service.dart': (
                  "import '../models/battle_session.dart';\n",
                  "import '../models/battle_session.dart';\nimport '../models/generated_npc_trainer.dart';\n",
              ),
              'lib/screens/tools/npc_trainer_library_screen.dart': (
                  "import '../../models/bag_item.dart';\n",
                  "import '../../models/bag_item.dart';\nimport '../../models/generated_npc_trainer.dart';\n",
              ),
          }
          for filename, (old, new) in fixes.items():
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              if new not in source:
                  if source.count(old) != 1:
                      raise SystemExit(f'{filename}: import anchor not found')
                  source = source.replace(old, new, 1)
                  path.write_text(source, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format imports
        run: |
          dart format \
            lib/services/master_battle_service.dart \
            lib/screens/tools/npc_trainer_library_screen.dart

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee tool/npc-master-analyze.txt

      - name: Run focused tests
        id: focused_tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test test/npc_library_master_battle_test.dart 2>&1 | tee tool/npc-master-tests.txt

      - name: Run full suite
        id: full_tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee tool/npc-master-full-tests.txt

      - name: Commit diagnostics and fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose NPC master fight implementation"
          git push origin feat/npc-library-master-fight

      - name: Report validation failure
        if: steps.analyze.outcome == 'failure' || steps.focused_tests.outcome == 'failure' || steps.full_tests.outcome == 'failure'
        run: exit 1
