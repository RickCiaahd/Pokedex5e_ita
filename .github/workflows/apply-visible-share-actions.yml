name: Apply visible share actions

on:
  push:
    branches:
      - fix/visible-share-actions

permissions:
  contents: write

concurrency:
  group: visible-share-actions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[visible-share-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/visible-share-actions
          fetch-depth: 0

      - name: Apply visible share actions
        run: python tool/apply_visible_share_actions.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format \
            lib/screens/team/team_selection_screen.dart \
            lib/screens/tools/encounter_library_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit verified UI fix
        run: |
          rm -f tool/apply_visible_share_actions.py .github/workflows/apply-visible-share-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rende visibili le azioni di condivisione [visible-share-applied]"
          git push origin HEAD:fix/visible-share-actions
