name: Apply tour montage PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    name: Apply professor montage and scrollbar fix
    if: github.event.pull_request.title == 'Allinea il Professore al montaggio e corregge lo scroll web'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute patch script
        shell: bash
        run: |
          set -o pipefail
          python3 tooling/apply_tour_montage_scrollbar.py 2>&1 | tee tour-montage-patch.log

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-montage-patch-log
          path: tour-montage-patch.log
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary files
        run: |
          rm -f .github/workflows/apply-tour-montage-scrollbar-fix.yml
          rm -f .github/workflows/bootstrap-tour-montage.yml
          rm -f .github/tour-montage-pr-trigger.txt
          rm -f tooling/apply_tour_montage_scrollbar.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format \
            lib/app.dart \
            lib/widgets/home/home_tour_overlay.dart \
            lib/widgets/tour/guided_tour.dart \
            lib/widgets/tour/professor_tour_panel.dart \
            test/guided_tour_professor_layout_test.dart

      - name: Run focused tests
        run: |
          flutter pub get
          flutter test test/guided_tour_professor_layout_test.dart --reporter expanded
          flutter test test/guided_tour_stack_layout_test.dart --reporter expanded
          flutter test test/guided_tour_scroll_restoration_test.dart --reporter expanded

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allinea il Professore al montaggio e stabilizza lo scroll web'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
