name: Apply capture form Pokédex migration

on:
  push:
    branches:
      - feat/form-aware-pokedex
    paths:
      - '.github/workflows/apply-capture-form-pokedex.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply capture form migration
        run: python3 tool/apply_capture_form_pokedex.py

      - name: Remove temporary migration files
        run: |
          rm tool/apply_capture_form_pokedex.py
          rm .github/workflows/apply-capture-form-pokedex.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/pokedex_entry.dart \
            lib/repositories/pokedex_repositry.dart \
            lib/repositories/pokemon_pc_repository.dart \
            lib/repositories/team_repository.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/pokedex/pokedex_screen.dart \
            lib/screens/pokemon/pokemon_detail_screen.dart \
            lib/services/pokedex_form_catalog.dart \
            lib/services/pokedex_ownership_service.dart \
            lib/widgets/pokedex/pokemon_summary_dialog.dart \
            lib/widgets/pokedex/pokemon_tile.dart \
            test/pokedex_forms_test.dart \
            test/pokemon_asset_paths_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: |
          flutter test \
            test/pokedex_forms_test.dart \
            test/pokemon_asset_paths_test.dart \
            test/pokemon_form_mechanics_test.dart \
            test/evolution_form_alias_service_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic form-aware Pokédex tracking"
          git push origin feat/form-aware-pokedex
