name: Apply WebP lossless pilot

on:
  push:
    branches:
      - feature/webp-lossless-pilot
    paths:
      - 'tooling/apply_webp_lossless_pilot.py'
      - '.github/workflows/apply-webp-lossless-pilot.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tooling/apply_webp_lossless_pilot.py'
      - '.github/workflows/apply-webp-lossless-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-webp-lossless-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Convert, verify and build the lossless pilot
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: feature/webp-lossless-pilot
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate pilot utility
        run: |
          python -m py_compile tooling/apply_webp_lossless_pilot.py
          python tooling/apply_webp_lossless_pilot.py --self-test

      - name: Prepare deterministic pilot sources
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tooling/apply_webp_lossless_pilot.py')
          text = path.read_text(encoding='utf-8')

          old_pilot = (
              'assets/textures/textures_webapp/pokemon/'
              'minior-core-blue/sprite-shiny.png'
          )
          new_pilot = (
              'assets/textures/textures_webapp/pokemon/'
              'alolan-rattata/sprite-shiny.png'
          )
          if text.count(old_pilot) != 1:
              raise SystemExit('Expected the Minior pilot entry exactly once')
          text = text.replace(old_pilot, new_pilot, 1)

          pattern = re.compile(
              r'    if TEST_PATH\.read_text\(encoding="utf-8"\) != test_source\(\):\n'
              r'        raise RuntimeError\("WebP pilot test is missing or stale"\)\n'
          )
          replacement = (
              '    if not TEST_PATH.is_file():\n'
              '        raise RuntimeError("WebP pilot test is missing")\n'
              '    test = TEST_PATH.read_text(encoding="utf-8")\n'
              '    for marker in (\n'
              '        "const _pilotWebpAssets",\n'
              '        "WebP is preferred before PNG",\n'
              '    ):\n'
              '        if marker not in test:\n'
              '            raise RuntimeError(\n'
              '                f"WebP pilot test is missing marker: {marker}"\n'
              '            )\n'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one formatting-sensitive check, found {count}')

          text = text.replace("import 'dart:ui' as ui;\n\n", '', 1)
          decode_pattern = re.compile(
              r"\n  testWidgets\('Flutter decodes every pilot WebP asset'.*?\n  \}\}\);\n",
              re.DOTALL,
          )
          text, decode_count = decode_pattern.subn('\n', text, count=1)
          if decode_count != 1:
              raise SystemExit(f'Expected one host decoder test, found {decode_count}')

          path.write_text(text, encoding='utf-8', newline='\n')

          existing_test = Path('test/pokemon_asset_paths_test.dart')
          test_text = existing_test.read_text(encoding='utf-8')
          converted_expectations = (
              'assets/textures/textures_webapp/pokemon/abomasnow/main-shiny',
              'assets/textures/textures_webapp/pokemon/alolan-rattata/main-shiny',
              'assets/textures/textures_webapp/pokemon/dusk-mane-necrozma/main-shiny',
          )
          for prefix in converted_expectations:
              test_text = test_text.replace(f'{prefix}.png', f'{prefix}.webp')
          existing_test.write_text(test_text, encoding='utf-8', newline='\n')
          PY

      - name: Apply lossless WebP pilot
        if: github.actor != 'github-actions[bot]'
        run: python tooling/apply_webp_lossless_pilot.py --apply

      - name: Refresh legal assets and inventories
        if: github.actor != 'github-actions[bot]'
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check
          python tooling/generate_compliance_reports.py
          python tooling/generate_asset_duplicates.py

      - name: Format generated Dart files
        run: >-
          dart format
          lib/widgets/pokemon/pokemon_asset_image.dart
          lib/widgets/pokemon/pokemon_asset_image_legacy.dart
          test/pokemon_asset_paths_test.dart
          test/webp_lossless_pilot_test.dart

      - name: Verify pilot invariants
        run: |
          python tooling/apply_webp_lossless_pilot.py --check
          python tooling/repair_unreadable_pokemon_images.py --check-all
          python tooling/prepare_release_legal_assets.py --check
          python tooling/generate_compliance_reports.py --check
          python tooling/generate_asset_duplicates.py --check
          git diff --check

      - name: Analyze source
        run: flutter analyze

      - name: Run pilot tests on Flutter VM
        run: flutter test test/webp_lossless_pilot_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web release
        run: flutter build web --release

      - name: Upload visual and measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Atlas-WebP-lossless-pilot
          path: |
            build/reports/webp-lossless-pilot/
            docs/performance/webp-lossless-pilot.csv
            docs/performance/webp-lossless-pilot.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified pilot
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No pilot changes were produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Converte il lotto pilota in WebP lossless'
          git push origin HEAD:feature/webp-lossless-pilot
