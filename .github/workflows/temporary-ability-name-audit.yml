name: Temporary ability name audit

on:
  push:
    branches:
      - translation/ability-names

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/ability-names
          fetch-depth: 0

      - name: Install parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Compare and apply official Italian names
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          SOURCE_PATH = Path('assets/data_webapp/abilities.json')
          WIKI_URL = 'https://wiki.pokemoncentral.it/Abilit%C3%A0'
          ABILITIES_URL = 'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/abilities.csv'
          NAMES_URL = 'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/ability_names.csv'

          session = requests.Session()
          session.headers['User-Agent'] = 'Pokedex5eITA translation audit'

          def get(url):
              response = session.get(url, timeout=60)
              response.raise_for_status()
              return response.text

          ability_rows = list(csv.DictReader(io.StringIO(get(ABILITIES_URL))))
          official_by_identifier = {
              row['identifier']: int(row['id'])
              for row in ability_rows
              if row['is_main_series'] == '1'
          }

          italian_by_number = {}
          for row in csv.DictReader(io.StringIO(get(NAMES_URL))):
              if row['local_language_id'] == '8':
                  italian_by_number[int(row['ability_id'])] = row['name'].strip()

          soup = BeautifulSoup(get(WIKI_URL), 'html.parser')
          heading = soup.find(id='Elenco_delle_abilità') or soup.find(id='Elenco_delle_abilit.C3.A0')
          if heading is None:
              raise RuntimeError('Sezione Elenco delle abilità non trovata su Pokémon Central.')
          table = heading.find_parent().find_next('table') if heading.find_parent() else heading.find_next('table')
          if table is None:
              table = heading.find_next('table')
          if table is None:
              raise RuntimeError('Tabella delle abilità non trovata su Pokémon Central.')

          wiki_by_number = {}
          for row in table.find_all('tr'):
              cells = row.find_all(['th', 'td'])
              if len(cells) < 2:
                  continue
              number = cells[0].get_text(' ', strip=True)
              if not number.isdigit():
                  continue
              name = cells[1].get_text(' ', strip=True)
              wiki_by_number[int(number)] = name

          if len(wiki_by_number) < 250:
              raise RuntimeError(f'Tabella Pokémon Central incompleta: {len(wiki_by_number)} nomi.')

          mismatches = []
          for number, wiki_name in sorted(wiki_by_number.items()):
              pokeapi_name = italian_by_number.get(number)
              if pokeapi_name and pokeapi_name != wiki_name:
                  mismatches.append((number, pokeapi_name, wiki_name))
          if mismatches:
              preview = '\n'.join(f'#{n}: PokeAPI={p!r}, Wiki={w!r}' for n, p, w in mismatches[:20])
              raise RuntimeError('Nomi italiani non coincidenti con Pokémon Central:\n' + preview)

          source_items = json.loads(SOURCE_PATH.read_text(encoding='utf-8'))['items']
          aliases = {
              'as-one': 'as-one-glastrier',
              'zen-mode-galarian': 'zen-mode',
          }
          matched = {}
          unmatched = []
          for item in source_items:
              source_id = item['id']
              lookup_id = aliases.get(source_id, source_id)
              number = official_by_identifier.get(lookup_id)
              official_name = wiki_by_number.get(number) if number is not None else None
              if official_name:
                  matched[source_id] = {
                      'officialNumber': number,
                      'sourceName': item['name'],
                      'name': official_name,
                  }
              else:
                  unmatched.append({
                      'id': source_id,
                      'name': item['name'],
                      'deprecated': item.get('deprecated') is True,
                  })

          localization_paths = sorted(Path('assets/data').glob('ability_localization_it_*.json'))
          localized_ids = set()
          for path in localization_paths:
              document = json.loads(path.read_text(encoding='utf-8'))
              for source_id, localized in document['items'].items():
                  localized_ids.add(source_id)
                  if source_id in matched:
                      localized['name'] = matched[source_id]['name']
                  else:
                      localized.pop('name', None)
              path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          source_ids = {item['id'] for item in source_items}
          if localized_ids != source_ids:
              missing = sorted(source_ids - localized_ids)
              extra = sorted(localized_ids - source_ids)
              raise RuntimeError(f'Cataloghi non allineati. Mancanti={missing}, extra={extra}')

          reference = {
              'source': WIKI_URL,
              'crossReference': [ABILITIES_URL, NAMES_URL],
              'matchedCount': len(matched),
              'unmatchedCount': len(unmatched),
              'items': matched,
          }
          reference_path = Path('docs/translation/ability-names-it-official.json')
          reference_path.write_text(json.dumps(reference, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report = [
              '# Audit dei nomi italiani delle abilità',
              '',
              f'- Abilità nel catalogo 5e: **{len(source_items)}**',
              f'- Corrispondenze con abilità ufficiali: **{len(matched)}**',
              f'- Voci personalizzate, varianti o deprecate senza corrispondenza: **{len(unmatched)}**',
              '- Fonte italiana: Pokémon Central Wiki, pagina Abilità.',
              '',
              '## Voci senza corrispondenza ufficiale',
              '',
          ]
          for item in unmatched:
              suffix = ' — deprecata' if item['deprecated'] else ''
              report.append(f"- `{item['id']}` — {item['name']}{suffix}")
          Path('docs/translation/ability-name-audit.md').write_text('\n'.join(report) + '\n', encoding='utf-8')

          print(f'Matched: {len(matched)}; unmatched: {len(unmatched)}')
          PY

      - name: Commit generated audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ability_localization_it_*.json docs/translation/ability-names-it-official.json docs/translation/ability-name-audit.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Assegna i nomi italiani ufficiali alle abilità"
          git push origin HEAD:translation/ability-names
