name: Validate NPC library and master fight

on:
  push:
    branches:
      - feat/npc-library-master-fight
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/npc-library-master-fight
          fetch-depth: 0

      - name: Apply integration
        id: integration
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tool/apply_npc_library_master_fight.py 2>&1 | tee npc-integration.txt

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-integration
          path: npc-integration.txt

      - name: Stop after integration failure
        if: steps.integration.outcome == 'failure'
        run: exit 1

      - name: Remove temporary automation
        run: |
          rm tool/apply_npc_library_master_fight.py
          rm .github/workflows/validate-npc-library-master-fight.yml
          rm npc-integration.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/database/hive_boxes.dart \
            lib/models/saved_npc_trainer.dart \
            lib/models/master_battle_session.dart \
            lib/models/profile_backup.dart \
            lib/repositories/saved_npc_trainer_repository.dart \
            lib/repositories/master_battle_session_repository.dart \
            lib/services/saved_npc_trainer_mapper_service.dart \
            lib/services/master_battle_service.dart \
            lib/services/profile_backup_service.dart \
            lib/screens/tools/tools_screen.dart \
            lib/screens/tools/npc_trainer_result_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/profile/profiles_screen.dart \
            test/npc_library_master_battle_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run NPC library and fight tests
        run: flutter test test/npc_library_master_battle_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NPC library and multi-trainer master fight"
          git push origin feat/npc-library-master-fight
