                  eggGroups: List<String>.from(source.eggGroups),
                  baseSpeciesId: source.baseSpeciesId == source.pokemonId
                      ? pokemonId
                      : source.baseSpeciesId,
                  hitDice: source.hitDice,
            """,
          )
          replace_once(
              'lib/services/embedded_custom_pokemon_transfer_service.dart',
              """    var installed = 0;
                var updated = 0;
                var remapped = 0;

            """,
              """    var installed = 0;
                var updated = 0;
                var remapped = 0;
                final installedDefinitions = <CustomPokemonDefinition>[];

            """,
          )
          replace_once(
              'lib/services/embedded_custom_pokemon_transfer_service.dart',
