name: Apply English UI residual fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-english-ui-residuals.yml'
      - 'tooling/english_ui_residuals.patch.b64.part*'
      - 'tooling/english_ui_syntax_repair.patch'
      - 'tooling/english_ui_context_repair.patch'
      - 'tooling/english_ui_async_locale_repair.patch'

permissions:
  contents: write

concurrency:
  group: english-ui-residuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/english-ui-residuals'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/english-ui-residuals
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild and apply prepared patches
        shell: bash
        run: |
          set -euo pipefail
          cat tooling/english_ui_residuals.patch.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/english-ui-residuals.patch
          git apply --check /tmp/english-ui-residuals.patch
          git apply --whitespace=fix /tmp/english-ui-residuals.patch
          git apply --check tooling/english_ui_syntax_repair.patch
          git apply --whitespace=fix tooling/english_ui_syntax_repair.patch
          git apply --check tooling/english_ui_context_repair.patch
          git apply --whitespace=fix tooling/english_ui_context_repair.patch

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'lib/screens/tools/encounter_library_screen.dart': [
                  ('  Future<void> _startFight', '  String _copyName'),
              ],
              'lib/screens/tools/npc_trainer_library_screen.dart': [
                  ('  Future<CampaignTransferBundle?> _pickTransferFile', '  String _copyName'),
              ],
              'lib/screens/tools/pokemon_generator_screen.dart': [
                  ('  Future<void> _addGeneratedToCollection', '  TeamSlot? _firstFreeUnlockedSlot'),
              ],
          }
          for file_name, spans in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for start_marker, end_marker in spans:
                  start = text.index(start_marker)
                  end = text.index(end_marker, start)
                  chunk = text[start:end]
                  if 'context.uiText(' not in chunk:
                      raise SystemExit(
                          f'No context.uiText calls found in {file_name} between markers'
                      )
                  chunk = chunk.replace('context.uiText(', 'uiTextForLanguage(')
                  text = text[:start] + chunk + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Resolve dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format changed Dart sources
        shell: bash
        run: |
          set +e
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACM | grep '\.dart$' || true)
          : > /tmp/english-ui-format.log
          if ((${#dart_files[@]})); then
            dart format "${dart_files[@]}" 2>&1 | tee /tmp/english-ui-format.log
            status=${PIPESTATUS[0]}
          else
            status=0
          fi
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-format.log diagnostics/english-ui-format-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-format-error.txt
            git commit -m "Registra l'errore di formattazione della UI inglese" || true
            git push origin HEAD:fix/english-ui-residuals
            exit "$status"
          fi

      - name: Analyze source
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/english-ui-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-analyze.log diagnostics/english-ui-analyze-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-analyze-error.txt
            git commit -m "Registra l'errore di analisi della UI inglese" || true
            git push origin HEAD:fix/english-ui-residuals
            exit "$status"
          fi

      - name: Run focused localization tests
        shell: bash
        run: |
          set +e
          : > /tmp/english-ui-focused-tests.log
          status=0
          for test_file in \
            test/english_ui_residuals_test.dart \
            test/secondary_ui_localization_test.dart \
            test/pokemon_battle_attributes_card_test.dart
          do
            echo "===== $test_file =====" | tee -a /tmp/english-ui-focused-tests.log
            flutter test "$test_file" --reporter expanded 2>&1 \
              | tee -a /tmp/english-ui-focused-tests.log
            current=${PIPESTATUS[0]}
            if [ "$current" -ne 0 ]; then
              status=$current
              break
            fi
          done
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-focused-tests.log diagnostics/english-ui-focused-test-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-focused-test-error.txt
            git commit -m "Registra l'errore dei test della UI inglese" || true
            git push origin HEAD:fix/english-ui-residuals
            exit "$status"
          fi

      - name: Run complete test suite
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/english-ui-full-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/english-ui-full-tests.log diagnostics/english-ui-full-test-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/english-ui-full-test-error.txt
            git commit -m "Registra l'errore della suite della UI inglese" || true
            git push origin HEAD:fix/english-ui-residuals
            exit "$status"
          fi

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Remove temporary transfer files
        shell: bash
        run: |
          rm -f tooling/english_ui_residuals.patch.b64.part*
          rm -f tooling/english_ui_syntax_repair.patch
          rm -f tooling/english_ui_context_repair.patch
          rm -f tooling/english_ui_async_locale_repair.patch
          rm -f .github/workflows/export-english-ui-snapshot.yml
          rm -f .github/workflows/apply-english-ui-residuals.yml
          rm -f diagnostics/english-ui-format-error.txt
          rm -f diagnostics/english-ui-analyze-error.txt
          rm -f diagnostics/english-ui-focused-test-error.txt
          rm -f diagnostics/english-ui-full-test-error.txt

      - name: Commit verified correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Corregge i residui italiani nell’interfaccia inglese"
          git push origin HEAD:fix/english-ui-residuals
