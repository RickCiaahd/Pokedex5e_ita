name: Finalize encounter tabs and forms fix

on:
  push:
    branches:
      - fix/encounter-tabs-and-forms
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/encounter-tabs-and-forms
          fetch-depth: 0

      - name: Apply final compile fix
        run: python3 tool/finalize_encounter_forms_fix.py

      - name: Remove temporary files
        run: |
          rm tool/finalize_encounter_forms_fix.py
          rm .github/workflows/finalize-encounter-tabs-forms-fix.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/screens/tools/encounter_generator_screen.dart \
            lib/screens/tools/encounter_collection_editor_screen.dart

      - name: Analyze
        run: flutter analyze

      - name: Run encounter tests
        run: flutter test test/encounter_generator_service_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize encounter tabs and exact form selection"
          git push origin fix/encounter-tabs-and-forms
