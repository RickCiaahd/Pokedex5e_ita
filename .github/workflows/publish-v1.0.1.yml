name: Publish v1.0.1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.1.yml'

permissions:
  contents: write

concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Android v1.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: b373c3d8abe1dfd069313ff5e1c2412cada44d52
      RELEASE_TAG: v1.0.1
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate release prerequisites
        shell: bash
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          test "$VERSION" = "1.0.1+2" || (echo "Versione pubspec inattesa: $VERSION" && exit 1)
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 non configurato" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "ANDROID_STORE_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS non configurato" && exit 1)

          EXISTING=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ -n "$EXISTING" ]; then
            echo "Il tag $RELEASE_TAG esiste già"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android signing
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed release app bundle
        run: flutter build appbundle --release

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Pokedex5eITA-1.0.1.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Pokedex5eITA-1.0.1.aab
          sha256sum dist/Pokedex5eITA-1.0.1.apk dist/Pokedex5eITA-1.0.1.aab > dist/SHA256SUMS.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-Android-1.0.1
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Create annotated release tag
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m 'Pokédex 5e ITA 1.0.1'
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Pokédex 5e ITA 1.0.1
          generate_release_notes: true
          files: dist/*
