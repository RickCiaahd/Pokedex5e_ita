                      .putIfAbsent(pokemonId, () => <String>{'Struggle'})
                      .addAll(slot.selectedMoves);
                }
                final moves = await _moveRepository.getMovesByPokemon(
                  referencesByPokemon,
                );
            """,
          )
          replace_once(
              'lib/screens/battle/battle_screen.dart',
              """  bool _hasNoPpLeft(
                TeamSlot slot,
