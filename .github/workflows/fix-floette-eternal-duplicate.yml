name: Fix Floette Eternal Flower duplicate

on:
  push:
    branches: [feature/compact-pokemon-detail-v2]
    paths:
      - '.github/workflows/fix-floette-eternal-duplicate.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Canonicalize Floette Eternal Flower identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pokemon = Path('lib/models/pokemon.dart')
          source = pokemon.read_text(encoding='utf-8')
          needle = "    switch (normalized) {\n"
          block = (
              "    // The web catalog calls the unreleased AZ Floette form `eternal`,\n"
              "    // while the legacy/asset catalog calls it `Eternal Flower`.\n"
              "    // Treat both spellings as one persisted identity so the Pokédex\n"
              "    // never exposes two cards for the same form.\n"
              "    if (normalizedSpecies == 'floette' &&\n"
              "        (normalized == 'eternal' || normalized == 'eternal flower')) {\n"
              "      normalized = 'eternal flower';\n"
              "    }\n\n"
          )
          if source.count(needle) != 1:
              raise SystemExit(f'pokemon.dart switch marker count={source.count(needle)}')
          pokemon.write_text(source.replace(needle, block + needle, 1), encoding='utf-8')

          test = Path('test/deoxys_floette_form_regression_test.dart')
          source = test.read_text(encoding='utf-8')
          import_marker = "import 'package:flutter_test/flutter_test.dart';\n"
          import_line = "import 'package:pokedex_5e_ita/models/pokedex_entry.dart';\n"
          if import_line not in source:
              if source.count(import_marker) != 1:
                  raise SystemExit('test import marker not unique')
              source = source.replace(import_marker, import_marker + import_line, 1)

          marker = "    final florges = catalog.firstWhere((p) => p.id == 671);\n"
          assertions = (
              "\n"
              "    expect(\n"
              "      PokedexEntry.formKey('Eternal', speciesName: floette.name),\n"
              "      'eternal-flower',\n"
              "    );\n"
              "    expect(\n"
              "      PokedexEntry.formKey('Eternal Flower', speciesName: floette.name),\n"
              "      'eternal-flower',\n"
              "    );\n"
              "    expect(\n"
              "      floette.formDefinitions.where(\n"
              "        (definition) =>\n"
              "            PokedexEntry.formKey(\n"
              "              definition.displayName,\n"
              "              speciesName: floette.name,\n"
              "            ) ==\n"
              "            'eternal-flower',\n"
              "      ),\n"
              "      hasLength(1),\n"
              "    );\n"
          )
          if source.count(marker) != 1:
              raise SystemExit(f'test marker count={source.count(marker)}')
          test.write_text(source.replace(marker, marker + assertions, 1), encoding='utf-8')
          PY

      - run: dart format lib/models/pokemon.dart test/deoxys_floette_form_regression_test.dart
      - run: flutter test test/deoxys_floette_form_regression_test.dart
      - run: flutter analyze

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-floette-eternal-duplicate.yml
          git add -A
          git commit -m 'Deduplica Fiore Eterno di Floette'
          git push origin HEAD:feature/compact-pokemon-detail-v2
