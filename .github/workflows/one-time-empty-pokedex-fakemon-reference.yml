name: One-time empty Pokedex Fakemon reference fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-backup-safe-delete
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply correction
        run: python3 .github/scripts/fix_empty_pokedex_fakemon_reference.py

      - name: Format and validate
        run: |
          dart format \
            lib/models/profile_backup.dart \
            lib/services/custom_pokemon_reference_service.dart \
            test/fakemon_backup_safe_delete_test.dart
          flutter pub get
          flutter analyze
          flutter test test/fakemon_backup_safe_delete_test.dart --reporter expanded

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_empty_pokedex_fakemon_reference.py
          git add lib test/fakemon_backup_safe_delete_test.dart
          git commit -m 'Ignora i riferimenti Pokédex vuoti dei Fakemon'
          git push origin feature/fakemon-backup-safe-delete
