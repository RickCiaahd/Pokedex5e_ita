name: Apply Italian UI fix

on:
  push:
    branches:
      - fix/italian-pokemon-trainer-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/italian-pokemon-trainer-ui
          fetch-depth: 0

      - name: Apply translations and responsive fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          helper = r'''class TrainerUiLocalization {
            const TrainerUiLocalization._();

            static const Map<String, String> abilityLabels = {
              'STR': 'FOR',
              'DEX': 'DES',
              'CON': 'COS',
              'INT': 'INT',
              'WIS': 'SAG',
              'CHA': 'CAR',
              'AC': 'CA',
              'HP': 'PF',
              'DC': 'CD',
            };

            static const Map<String, String> skillLabels = {
              'Acrobatics': 'Acrobazia',
              'Animal Handling': 'Addestrare Animali',
              'Arcana': 'Arcano',
              'Athletics': 'Atletica',
              'Deception': 'Inganno',
              'History': 'Storia',
              'Insight': 'Intuizione',
              'Intimidation': 'Intimidire',
              'Investigation': 'Indagare',
              'Medicine': 'Medicina',
              'Nature': 'Natura',
              'Perception': 'Percezione',
              'Performance': 'Intrattenere',
              'Persuasion': 'Persuasione',
              'Religion': 'Religione',
              'Sleight of Hand': 'Rapidità di Mano',
              'Stealth': 'Furtività',
              'Survival': 'Sopravvivenza',
            };

            static const Map<String, String> startingPackLabels = {
              "Dungeoneer's pack": 'Dotazione da Avventuriero',
              "Explorer's pack": 'Dotazione da Esploratore',
              "Filcher's pack": 'Dotazione da Borseggiatore',
            };

            static const Map<String, String> specializationLabels = {
              'Bird Keeper': 'Avicoltore',
              'Bug Maniac': 'Insettologo',
              'Camper': 'Campeggiatore',
              'Dragon Tamer': 'Domadraghi',
              'Engineer': 'Meccanico',
              'Martial Artist': 'Esperto Lotta',
              'Mountaineer': 'Montanaro',
              'Mystic': 'Mistico',
              'Steel Worker': "Lavoratore dell'Acciaio",
              'Psychic': 'Sensitivo',
              'Swimmer': 'Nuotatore',
              'Charmer': 'Ammaliatore',
              'Shadow': 'Ombra',
              'Alchemist': 'Alchimista',
              'Team Player': 'Giocatore di Squadra',
              'Ice Skater': 'Pattinatore su Ghiaccio',
              'Pyromaniac': 'Brandifuoco',
              'Gardener': 'Giardiniere',
            };

            static const Map<String, String> trainerPathLabels = {
              'Ace Trainer': 'Fantallenatore',
              'Hobbyist': 'Appassionato',
              'Poké Mentor': 'Mentore Pokémon',
              'Pokéchef': 'Pokéchef',
              'Researcher': 'Ricercatore',
              'Pokémon Collector': 'Collezionista Pokémon',
              'Nurse': 'Infermiera',
              'Commander': 'Comandante',
              'Type Master': 'Maestro dei Tipi',
              'Grunt': 'Recluta',
              'Tactician': 'Stratega',
              'Ranger': 'Pokémon Ranger',
              'Guru': 'Guru',
              'Pokémon Breeder': 'Allevapokémon',
            };

            static const Map<String, String> featureLabels = {
              'Ace Trainer': 'Fantallenatore',
              'Battle Master': 'Maestro della Lotta',
              'Max Potential': 'Massimo Potenziale',
              'Rapid Switching': 'Cambio Rapido',
              'Hobbyist': 'Appassionato',
              'Versatile': 'Versatile',
              'Many Faces': 'Mille Volti',
              'Skill Switch': 'Cambio di Talento',
              'Poké Mentor': 'Mentore Pokémon',
              'Tutor': 'Tutor',
              'Guided Practice': 'Pratica Guidata',
              'Master Teacher': 'Maestro Insegnante',
              'Pokéchef': 'Pokéchef',
              'Edible Treat': 'Leccornia Curativa',
              'Cheerleader': 'Incitatore',
              'Researcher': 'Ricercatore',
              'Analyst': 'Analista',
              'Evolutionary Expert': 'Esperto di Evoluzione',
              'Professor': 'Professore',
              'Pokémon Collector': 'Collezionista Pokémon',
              "Gotta Catch 'Em All": 'Acchiappali Tutti',
              'Catching Expert': 'Esperto di Cattura',
              'Disciplined Strikes': 'Colpi Controllati',
              'Nurse': 'Infermiera',
              'Pure Heart': 'Cuore Puro',
              'Healing Spirit': 'Spirito Curativo',
              'Joy': 'Gioia',
              'Commander': 'Comandante',
              'Follow Me': 'Sonoqui',
              "Show Me What You've Got": 'Fammi Vedere Cosa Sai Fare',
              "We're a Team": 'Siamo una Squadra',
              'Type Master': 'Maestro dei Tipi',
              'Drawing Power': 'Attingere Potere',
              'Storing Power': 'Accumulo di Potere',
              'Releasing Power': 'Scatenare il Potere',
              'Sabotage': 'Sabotaggio',
              'And Make It Double': 'E Raddoppiate i Guai',
              'Surrender Now': 'Arrendetevi Subito',
              'Prepare to Fight': 'Preparatevi a Combattere',
              'Tactician': 'Stratega',
              'Directed Strike': 'Colpo Guidato',
              'Raise Your Defenses': 'Alza le Difese',
              'Not This Time': 'Non Stavolta',
              'Ranger': 'Pokémon Ranger',
              'Deep Connection': 'Legame Profondo',
              'Strong Bond': 'Legame Forte',
              'Best Friends': 'Migliori Amici',
              'Guru': 'Guru',
              'Mind': 'Mente',
              'Body': 'Corpo',
              'Spirit': 'Spirito',
              'Pokémon Breeder': 'Allevapokémon',
              'Tender Love and Care': 'Cure Premurose',
              'Good Genes': 'Buoni Geni',
              'Master of Traits': 'Maestro dei Tratti',
            };

            static String abilityAbbreviation(String value) {
              return abilityLabels[value.trim().toUpperCase()] ?? value;
            }

            static String skillName(String value) => skillLabels[value] ?? value;

            static String startingPackName(String value) {
              return startingPackLabels[value] ?? value;
            }

            static String specializationName(String value) {
              return specializationLabels[value] ?? value;
            }

            static String trainerPathName(String value) {
              return trainerPathLabels[value] ?? value;
            }

            static String featureName(String value) {
              return featureLabels[value] ?? trainerPathName(value);
            }

            static String optionLabel(String value) {
              final parts = value.split(' · ');
              if (parts.length == 3 && parts[1].startsWith('Lv ')) {
                return '${trainerPathName(parts[0])} · Liv. ${parts[1].substring(3)} · ${featureName(parts[2])}';
              }
              final ability = abilityLabels[value.toUpperCase()];
              if (ability != null) return ability;
              final specialization = specializationLabels[value];
              if (specialization != null) return specialization;
              return visibleText(value);
            }

            static String visibleText(String value) {
              var result = value;
              const phraseReplacements = <String, String>{
                'Trainer Path': 'Percorso Allenatore',
                'Shadow Points': 'Punti Ombra',
                'Tactical Points': 'Punti Tattici',
                'Ability Score Improvement': 'Aumento di Caratteristica',
                'Control Upgrade': 'Aumento del Controllo',
                'Master Trainer': 'Maestro Allenatore',
                "Trainer's Resolve": "Determinazione dell'Allenatore",
                'Pokémon Tracker': 'Ricercatore Pokémon',
                'Additional Feats': 'Talenti Aggiuntivi',
                'Egg Moves': 'Mosse Uovo',
                'Egg Move': 'Mossa Uovo',
                'Speak with Animals': 'Parlare con gli Animali',
                'Copy Meowth': 'Copia Meowth',
                'level up': 'aumento di livello',
                'stat block': 'blocco statistiche',
                'Pokecenter': 'Centro Pokémon',
                'Pokemon': 'Pokémon',
                'Loyalty': 'Lealtà',
                'Loyal': 'Leale',
                'Disloyal': 'Sleale',
                'Indifferent': 'Indifferente',
                'feature': 'privilegio',
                'path': 'percorso',
                'item': 'oggetto',
                'tier': 'grado',
                'treat': 'leccornia',
              };
              for (final entry in phraseReplacements.entries) {
                result = result.replaceAll(entry.key, entry.value);
              }
              for (final entry in skillLabels.entries) {
                result = result.replaceAll(entry.key, entry.value);
              }
              for (final entry in abilityLabels.entries) {
                result = result.replaceAll(
                  RegExp('\\b${RegExp.escape(entry.key)}\\b'),
                  entry.value,
                );
              }
              result = result.replaceAll(
                RegExp(r'\b(\d+)\s*ft\b', caseSensitive: false),
                r'$1 piedi',
              );
              return result;
            }
          }
          '''
          Path('lib/models/trainer_ui_localization.dart').write_text(helper, encoding='utf-8')

          # Pokémon detail screen.
          path = Path('lib/screens/pokemon/pokemon_detail_screen_legacy.dart')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "import '../../models/team_slot.dart';\nimport '../../models/user_profile.dart';",
              "import '../../models/team_slot.dart';\nimport '../../models/trainer_ui_localization.dart';\nimport '../../models/user_profile.dart';",
              'pokemon import',
          )
          text = replace_once(
              text,
              "    required this.name,\n    required this.shortLabel,",
              "    required this.name,\n    required this.displayName,\n    required this.shortLabel,",
              'status constructor',
          )
          text = replace_once(
              text,
              "  final String name;\n  final String shortLabel;",
              "  final String name;\n  final String displayName;\n  final String shortLabel;",
              'status fields',
          )
          status_block = r'''const _statusEffectInfos = [
            _StatusEffectInfo(
              name: 'Asleep',
              displayName: 'Addormentato',
              shortLabel: 'SLP',
              description:
                  'È incapacitato e trattenuto e ha svantaggio a tutti i tiri salvezza. Dura tre round. Quando subisce un movimento forzato e alla fine di ciascun suo turno, tira 1d20: con 11 o più la condizione termina.',
              assetCandidates: [
                'assets/textures/gui/status/sleep_down.png',
                'assets/textures/gui/status/sleep_up.png',
              ],
            ),
            _StatusEffectInfo(
              name: 'Burned',
              displayName: 'Scottato',
              shortLabel: 'BRN',
              description:
                  'Tira due volte tutti i dadi di danno e usa il risultato inferiore. Finché non viene curato o perde i sensi, subisce danni pari al proprio bonus di competenza alla fine di ciascun turno. I Pokémon di tipo Fuoco sono immuni.',
              assetCandidates: [
                'assets/textures/gui/status/burn_down.png',
                'assets/textures/gui/status/burn_up.png',
              ],
            ),
            _StatusEffectInfo(
              name: 'Confused',
              displayName: 'Confuso',
              shortLabel: 'CNF',
              description:
                  "Non può effettuare reazioni. Dura tre round. All'inizio del suo turno tira 1d8 per determinarne il comportamento; con 8 la condizione termina.",
              assetCandidates: [
                'assets/textures/gui/status/confuse_down.png',
                'assets/textures/gui/status/confuse_up.png',
              ],
            ),
            _StatusEffectInfo(
              name: 'Flinched',
              displayName: 'Tentennamento',
              shortLabel: 'FLN',
              description:
                  'Ha svantaggio a tutti i tiri per colpire, alle prove di caratteristica e ai tiri salvezza fino alla fine del suo prossimo turno. È mostrato solo come riferimento e non può essere selezionato manualmente.',
              assetCandidates: [],
            ),
            _StatusEffectInfo(
              name: 'Frozen',
              displayName: 'Congelato',
              shortLabel: 'FRZ',
              description:
                  'È incapacitato e trattenuto. La condizione termina se si libera, subisce danni di tipo Fuoco o viene colpito da una mossa che può provocare Scottatura. I Pokémon di tipo Ghiaccio sono immuni.',
              assetCandidates: [
                'assets/textures/gui/status/frozen_down.png',
                'assets/textures/gui/status/frozen_up.png',
              ],
            ),
            _StatusEffectInfo(
              name: 'Paralyzed',
              displayName: 'Paralizzato',
              shortLabel: 'PAR',
              description:
                  'Ha svantaggio ai tiri salvezza su FOR e DES e si muove a velocità dimezzata. All’inizio del suo turno tira 1d4: con 1 è incapacitato e trattenuto fino all’inizio del turno successivo. I Pokémon di tipo Elettro sono immuni.',
              assetCandidates: [
                'assets/textures/gui/status/paralyze_down.png',
                'assets/textures/gui/status/paralyze_up.png',
              ],
            ),
            _StatusEffectInfo(
              name: 'Poisoned',
              displayName: 'Avvelenato',
              shortLabel: 'PSN',
              description:
                  'Ha svantaggio a tutte le prove di caratteristica e ai tiri per colpire. Finché non viene curato o perde i sensi, subisce danni pari al proprio bonus di competenza alla fine di ciascun turno. I Pokémon di tipo Veleno e Acciaio sono immuni.',
              assetCandidates: [
                'assets/textures/gui/status/poisoned_down.png',
                'assets/textures/gui/status/poisoned_up.png',
              ],
            ),
          ];'''
          text, count = re.subn(
              r"const _statusEffectInfos = \[.*?\n\];",
              status_block,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'status block: expected 1 replacement, found {count}')
          replacements = [
              ("if (heldItem == null || heldItem.trim().isEmpty) return 'NONE';", "if (heldItem == null || heldItem.trim().isEmpty) return 'NESSUNO';", 'held item none'),
              ("'ADD STATUS EFFECT'", "'AGGIUNGI STATUS'", 'status picker title'),
              ("title: Text(info.name.toUpperCase()),", "title: Text(info.displayName.toUpperCase()),", 'status display name'),
              ("title: const Text('FLINCHED'),", "title: Text(_statusEffectInfoByName['Flinched']!.displayName.toUpperCase()),", 'flinched name'),
              ("title: const Text('REMOVE ALL STATUS EFFECTS'),", "title: const Text('RIMUOVI TUTTI GLI STATUS'),", 'remove statuses'),
              ("const labels = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];", "const labels = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];", 'ability labels technical'),
              ("title: const Text('Aumento Ability Score'),", "title: const Text('Aumento di Caratteristica'),", 'ability score title'),
              ("title: Text(label),", "title: Text(TrainerUiLocalization.abilityAbbreviation(label)),", 'ability picker label'),
              ("parts.add('DC: ${8 + proficiency + moveModifier}');", "parts.add('CD: ${8 + proficiency + moveModifier}');", 'move dc'),
              ("Tab(text: 'FEATURES'),", "Tab(text: 'PRIVILEGI'),", 'features tab'),
              ("Tab(text: 'TRAITS'),", "Tab(text: 'TRATTI'),", 'traits tab'),
              ("child: _MetricBox(label: 'Lv.', value: '$level'),", "child: _MetricBox(label: 'Liv.', value: '$level'),", 'level metric'),
              ("child: _MetricBox(label: 'AC:', value: '$armorClass'),", "child: _MetricBox(label: 'CA:', value: '$armorClass'),", 'armor metric'),
              ("child: _PanelButton(label: 'ITEM: $heldItemLabel'),", "child: _PanelButton(label: 'STRUMENTO: $heldItemLabel'),", 'item label'),
              ("'HP: $currentHp/$maxHp'", "'PF: $currentHp/$maxHp'", 'hp display'),
              ("label: entry.key,\n                score: entry.value,", "label: TrainerUiLocalization.abilityAbbreviation(entry.key),\n                score: entry.value,", 'fight stat labels'),
              ("'SAVING THROWS'", "'TIRI SALVEZZA'", 'saving throws title'),
              ("'+ ADD STATUS EFFECTS'", "'+ AGGIUNGI STATUS'", 'status button'),
              ("title: 'Moveset',", "title: 'Mosse equipaggiate',", 'moveset title'),
              ("label: entry.key,\n                    score: entry.value,", "label: TrainerUiLocalization.abilityAbbreviation(entry.key),\n                    score: entry.value,", 'traits stat labels'),
              ("value: slot?.nature ?? 'No Nature'", "value: slot?.nature ?? 'Nessuna natura'", 'nature fallback'),
              ("label: 'Shiny',", "label: 'Cromatico',", 'shiny label'),
              ("title: const Text('Modifica HP'),", "title: const Text('Modifica PF'),", 'hp dialog title'),
              ("labelText: 'HP',", "labelText: 'PF',", 'hp dialog label'),
          ]
          for old, new, label in replacements:
              if old == new:
                  if old not in text:
                      raise SystemExit(f'{label}: expected source token not found')
                  continue
              text = replace_once(text, old, new, label)
          loyalty_old = """        Expanded(child: _PanelButton(label: 'LEALTÀ: ${_signed(loyalty)}')),"""
          loyalty_new = """        Expanded(
              child: Container(
                height: 38,
                alignment: Alignment.center,
                decoration: BoxDecoration(
                  color: Colors.white,
                  borderRadius: BorderRadius.circular(8),
                  border: Border.all(
                    color: Theme.of(context).colorScheme.outlineVariant,
                  ),
                ),
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Text(
                      'LEALTÀ',
                      style: Theme.of(context).textTheme.labelSmall?.copyWith(
                        fontWeight: FontWeight.w800,
                        height: 1,
                      ),
                    ),
                    Text(
                      _signed(loyalty),
                      style: Theme.of(context).textTheme.titleMedium?.copyWith(
                        fontWeight: FontWeight.w900,
                        height: 1,
                      ),
                    ),
                  ],
                ),
              ),
            ),"""
          text = replace_once(text, loyalty_old, loyalty_new, 'responsive loyalty')
          path.write_text(text, encoding='utf-8')

          # Trainer sheet.
          path = Path('lib/screens/trainer/trainer_sheet_screen.dart')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "import '../../models/trainer_manual_options.dart';\nimport '../../models/trainer_progression.dart';",
              "import '../../models/trainer_manual_options.dart';\nimport '../../models/trainer_progression.dart';\nimport '../../models/trainer_ui_localization.dart';",
              'trainer import',
          )
          text = replace_once(
              text,
              "for (final origin in _trainerOrigins) origin.name: origin.description,",
              "for (final origin in _trainerOrigins)\n        origin.name: TrainerUiLocalization.visibleText(origin.description),",
              'origin descriptions',
          )
          text = replace_once(
              text,
              "path.name: path.featureForLevel(2)?.description ?? '',",
              "path.name: TrainerUiLocalization.visibleText(\n          path.featureForLevel(2)?.description ?? '',\n        ),",
              'path descriptions',
          )
          text = replace_once(
              text,
              "selected: _startingPack,\n      ),",
              "selected: _startingPack,\n        displayNames: TrainerUiLocalization.startingPackLabels,\n      ),",
              'starting pack picker labels',
          )
          text = replace_once(
              text,
              "title: 'Trainer Path',\n        options: [for (final path in _trainerPaths) path.name],\n        selected: _trainerPath,\n        descriptions: _trainerPathDescriptions,",
              "title: 'Percorso Allenatore',\n        options: [for (final path in _trainerPaths) path.name],\n        selected: _trainerPath,\n        descriptions: _trainerPathDescriptions,\n        displayNames: TrainerUiLocalization.trainerPathLabels,",
              'trainer path picker',
          )
          text = replace_once(
              text,
              "title: const Text('Cambiare Trainer Path?'),\n          content: Text(\n            'Passerai da $savedPath a $selected. Le risorse consumate e le scelte specifiche del vecchio path verranno azzerate.',\n          ),",
              "title: const Text('Cambiare Percorso Allenatore?'),\n          content: Text(\n            'Passerai da ${TrainerUiLocalization.trainerPathName(savedPath)} a ${TrainerUiLocalization.trainerPathName(selected)}. Le risorse consumate e le scelte specifiche del vecchio percorso verranno azzerate.',\n          ),",
              'path change dialog',
          )
          text = replace_once(text, "child: const Text('CAMBIA TRAINER PATH'),", "child: const Text('CAMBIA PERCORSO'),", 'path change button')
          text = replace_once(
              text,
              "descriptions: TrainerManualOptions.specializationNotes,\n      ),",
              "descriptions: {\n          for (final entry in TrainerManualOptions.specializationNotes.entries)\n            entry.key: TrainerUiLocalization.visibleText(entry.value),\n        },\n        displayNames: TrainerUiLocalization.specializationLabels,\n      ),",
              'specialization picker labels',
          )
          trainer_replacements = [
              ("title: 'TRAINER',", "title: 'ALLENATORE',", 'trainer title'),
              ("trailing: 'LEVEL $trainerLevel',", "trailing: 'LIVELLO $trainerLevel',", 'trainer level heading'),
              ("label: 'Prof',", "label: 'Bonus competenza',", 'proficiency label'),
              ("label: entry.key,\n                score: abilityScores[entry.key] ?? entry.value,", "label: TrainerUiLocalization.abilityAbbreviation(entry.key),\n                score: abilityScores[entry.key] ?? entry.value,", 'trainer ability labels'),
              ("value: startingPack.isEmpty ? 'Scegli' : startingPack,", "value: startingPack.isEmpty\n                      ? 'Scegli'\n                      : TrainerUiLocalization.startingPackName(startingPack),", 'starting pack display'),
              ("label: 'Velocita',\n              value: '$speed ft',", "label: 'Velocità',\n              value: '$speed piedi',", 'speed display'),
              ("title: 'ABILITIES',", "title: 'ABILITÀ',", 'abilities panel'),
              ("title: '${skill.name} (${skill.ability})',", "title: '${TrainerUiLocalization.skillName(skill.name)} (${TrainerUiLocalization.abilityAbbreviation(skill.ability)})',", 'skill display'),
              ("title: 'SAVING THROWS',", "title: 'TIRI SALVEZZA',", 'trainer saves panel'),
              ("title: ability,", "title: TrainerUiLocalization.abilityAbbreviation(ability),", 'save ability display'),
              ("const Text('Spunta le competenze nella sezione Abilities.')", "const Text('Spunta le competenze nella sezione Abilità.')", 'selected skills hint'),
              ("'${skill.name} (${skill.ability})'", "'${TrainerUiLocalization.skillName(skill.name)} (${TrainerUiLocalization.abilityAbbreviation(skill.ability)})'", 'selected skill display'),
              ("title: 'Specialization',", "title: 'Specializzazione',", 'specialization title 1'),
              ("title: 'Trainer Path',", "title: 'Percorso Allenatore',", 'progression path title'),
              ("value: trainerPath.isEmpty ? 'Scegli trainer path' : trainerPath,", "value: trainerPath.isEmpty\n              ? 'Scegli percorso'\n              : TrainerUiLocalization.trainerPathName(trainerPath),", 'progression path value'),
              ("? 'Tocca per scegliere dal pool dei path.'\n              : _trainerPathFeatureFor(2)?.description ?? '',", "? 'Tocca per scegliere tra i percorsi disponibili.'\n              : TrainerUiLocalization.visibleText(\n                  _trainerPathFeatureFor(2)?.description ?? '',\n                ),", 'progression path detail'),
              ("value: feature?.title ??", "value: feature == null\n                ?", 'feature value start'),
          ]
          # Apply straightforward replacements before the feature block rewrite.
          for old, new, label in trainer_replacements[:-1]:
              text = replace_once(text, old, new, label)
          # Two further Specialization occurrences.
          for index in (2, 3):
              text = replace_once(text, "title: 'Specialization',", "title: 'Specializzazione',", f'specialization title {index}')
          feature_old = """            value: feature?.title ??
                (trainerPath.isEmpty
                    ? 'Path non scelto'
                    : 'Feature non trovata'),
            detail: feature?.description ??
                'Scegli il path al livello 2 per vedere la feature automatica.',"""
          feature_new = """            value: feature == null
                ? (trainerPath.isEmpty
                      ? 'Percorso non scelto'
                      : 'Privilegio non trovato')
                : TrainerUiLocalization.featureName(feature.title),
            detail: feature == null
                ? 'Scegli il percorso al livello 2 per vedere il privilegio automatico.'
                : TrainerUiLocalization.visibleText(feature.description),"""
          text = replace_once(text, feature_old, feature_new, 'progression feature block')
          text = replace_once(text, "trailing: 'LEVEL $trainerLevel',", "trailing: 'LIVELLO $trainerLevel',", 'progression level heading')
          text = replace_once(
              text,
              "return index < specializations.length ? specializations[index] : '';",
              "return index < specializations.length ? specializations[index] : '';",
              'specialization technical value',
          )
          text = replace_once(
              text,
              "return TrainerManualOptions.specializationNotes[specialization] ?? '';",
              "return TrainerUiLocalization.visibleText(\n        TrainerManualOptions.specializationNotes[specialization] ?? '',\n      );",
              'specialization detail',
          )
          # Localize specialization values in each progression box without changing storage.
          text = text.replace(
              ": _specializationAt(0),",
              ": TrainerUiLocalization.specializationName(_specializationAt(0)),",
              1,
          )
          text = text.replace(
              ": _specializationAt(1),",
              ": TrainerUiLocalization.specializationName(_specializationAt(1)),",
              1,
          )
          text = text.replace(
              ": _specializationAt(2),",
              ": TrainerUiLocalization.specializationName(_specializationAt(2)),",
              1,
          )
          # Generic picker display labels preserve technical values returned to storage.
          text = replace_once(
              text,
              "    this.descriptions = const {},\n  });",
              "    this.descriptions = const {},\n    this.displayNames = const {},\n  });",
              'picker constructor',
          )
          text = replace_once(
              text,
              "  final Map<String, String> descriptions;",
              "  final Map<String, String> descriptions;\n  final Map<String, String> displayNames;",
              'picker display field',
          )
          text = replace_once(
              text,
              "title: option,\n                    subtitle: description,",
              "title: displayNames[option] ?? option,\n                    subtitle: TrainerUiLocalization.visibleText(description),",
              'picker display title',
          )
          path.write_text(text, encoding='utf-8')

          # Trainer Path automation panel.
          path = Path('lib/widgets/trainer/trainer_path_automation_panel.dart')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "import '../../services/trainer_path_automation_service.dart';",
              "import '../../models/trainer_ui_localization.dart';\nimport '../../services/trainer_path_automation_service.dart';",
              'automation import',
          )
          automation_replacements = [
              ("'GESTIONE TRAINER PATH'", "'GESTIONE PERCORSO ALLENATORE'", 'automation title'),
              ("trainerPath,\n", "TrainerUiLocalization.trainerPathName(trainerPath),\n", 'automation path name'),
              ("prima di considerare il path configurato.", "prima di considerare il percorso configurato.", 'automation path wording'),
              ("A questo livello il path non ha ancora risorse numeriche da consumare.", "A questo livello il percorso non ha ancora risorse numeriche da consumare.", 'automation empty wording'),
              ("'Lv ${definition.featureLevel} · ${definition.featureTitle}'", "'Liv. ${definition.featureLevel} · ${TrainerUiLocalization.featureName(definition.featureTitle)}'", 'choice feature label'),
              ("helperText: definition.description,", "helperText: TrainerUiLocalization.visibleText(definition.description),", 'choice description'),
              (": definition.label,", ": TrainerUiLocalization.visibleText(definition.label),", 'choice hint'),
              ("DropdownMenuItem(value: option, child: Text(option))", "DropdownMenuItem(\n                value: option,\n                child: Text(TrainerUiLocalization.optionLabel(option)),\n              )", 'choice options'),
              ("definition.label,\n", "TrainerUiLocalization.visibleText(definition.label),\n", 'resource label'),
              ("'Lv ${definition.featureLevel} · ${definition.featureTitle} · ${definition.resetLabel}'", "'Liv. ${definition.featureLevel} · ${TrainerUiLocalization.featureName(definition.featureTitle)} · ${definition.resetLabel}'", 'resource feature label'),
          ]
          for old, new, label in automation_replacements:
              text = replace_once(text, old, new, label)
          path.write_text(text, encoding='utf-8')

          test = r'''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:pokedex_5e_ita/models/trainer_ui_localization.dart';

          void main() {
            test('caratteristiche e abilità vengono mostrate in italiano', () {
              expect(TrainerUiLocalization.abilityAbbreviation('STR'), 'FOR');
              expect(TrainerUiLocalization.abilityAbbreviation('DEX'), 'DES');
              expect(TrainerUiLocalization.abilityAbbreviation('CON'), 'COS');
              expect(TrainerUiLocalization.abilityAbbreviation('WIS'), 'SAG');
              expect(TrainerUiLocalization.abilityAbbreviation('CHA'), 'CAR');
              expect(TrainerUiLocalization.skillName('Animal Handling'), 'Addestrare Animali');
              expect(TrainerUiLocalization.skillName('Sleight of Hand'), 'Rapidità di Mano');
            });

            test('nomi tecnici di percorsi e specializzazioni hanno etichette italiane', () {
              expect(TrainerUiLocalization.trainerPathName('Ace Trainer'), 'Fantallenatore');
              expect(TrainerUiLocalization.trainerPathName('Grunt'), 'Recluta');
              expect(TrainerUiLocalization.specializationName('Bird Keeper'), 'Avicoltore');
              expect(TrainerUiLocalization.specializationName('Bug Maniac'), 'Insettologo');
              expect(TrainerUiLocalization.specializationName('Engineer'), 'Meccanico');
              expect(TrainerUiLocalization.featureName('Rapid Switching'), 'Cambio Rapido');
              expect(TrainerUiLocalization.featureName('Follow Me'), 'Sonoqui');
            });

            test('la UI non reintroduce le principali etichette inglesi', () {
              final pokemonDetail = File(
                'lib/screens/pokemon/pokemon_detail_screen_legacy.dart',
              ).readAsStringSync();
              final trainerSheet = File(
                'lib/screens/trainer/trainer_sheet_screen.dart',
              ).readAsStringSync();

              expect(pokemonDetail, contains("Tab(text: 'PRIVILEGI')"));
              expect(pokemonDetail, contains("Tab(text: 'TRATTI')"));
              expect(pokemonDetail, contains("'TIRI SALVEZZA'"));
              expect(pokemonDetail, contains("'+ AGGIUNGI STATUS'"));
              expect(pokemonDetail, contains("'LEALTÀ'"));
              expect(trainerSheet, contains("title: 'ALLENATORE'"));
              expect(trainerSheet, contains("title: 'ABILITÀ'"));
              expect(trainerSheet, contains("title: 'TIRI SALVEZZA'"));
              expect(trainerSheet, contains("title: 'AVANZAMENTO'"));
            });
          }
          '''
          Path('test/trainer_ui_localization_test.dart').write_text(test, encoding='utf-8')
          PY

          dart format \
            lib/models/trainer_ui_localization.dart \
            lib/screens/pokemon/pokemon_detail_screen_legacy.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/widgets/trainer/trainer_path_automation_panel.dart \
            test/trainer_ui_localization_test.dart

