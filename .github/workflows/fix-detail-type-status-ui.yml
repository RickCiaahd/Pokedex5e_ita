name: Fix detail type and status UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply detail UI fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/screens/pokemon/pokemon_detail_screen.dart')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block:\n{old}')
              text = text.replace(old, new, 1)

          replacements = {
              "      'assets/textures/gui/status/sleep_up.png',\n      'assets/textures/gui/status/sleep_down.png',":
              "      'assets/textures/gui/status/sleep_down.png',\n      'assets/textures/gui/status/sleep_up.png',",
              "      'assets/textures/gui/status/burn_up.png',\n      'assets/textures/gui/status/burn_down.png',":
              "      'assets/textures/gui/status/burn_down.png',\n      'assets/textures/gui/status/burn_up.png',",
              "      'assets/textures/gui/status/confuse_up.png',\n      'assets/textures/gui/status/confuse_down.png',":
              "      'assets/textures/gui/status/confuse_down.png',\n      'assets/textures/gui/status/confuse_up.png',",
              "      'assets/textures/gui/status/frozen_up.png',\n      'assets/textures/gui/status/frozen_down.png',":
              "      'assets/textures/gui/status/frozen_down.png',\n      'assets/textures/gui/status/frozen_up.png',",
              "      'assets/textures/gui/status/paralyze_up.png',\n      'assets/textures/gui/status/paralyze_down.png',":
              "      'assets/textures/gui/status/paralyze_down.png',\n      'assets/textures/gui/status/paralyze_up.png',",
              "      'assets/textures/gui/status/poisoned_up.png',\n      'assets/textures/gui/status/poisoned_down.png',":
              "      'assets/textures/gui/status/poisoned_down.png',\n      'assets/textures/gui/status/poisoned_up.png',",
          }
          for old, new in replacements.items():
              replace_once(old, new)

          replace_once("""    assetCandidates: [
      'assets/textures/gui/status/fln.png',
      'assets/textures/gui/status/FLN.png',
      'assets/textures/gui/status/flinched.png',
      'assets/textures/gui/status/Flinched.png',
      'assets/textures/gui/status/flinch.png',
      'assets/textures/gui/status/Flinch.png',
      'assets/textures/gui/status/status_fln.png',
      'assets/textures/gui/status/status_flinch.png',
      'assets/textures/gui/status/status_flinched.png',
      'assets/textures/gui/status/fln.webp',
      'assets/textures/gui/status/FLN.webp',
    ],""", """    assetCandidates: [],""")

          replace_once("""    final itemLabel = heldItem == null || heldItem!.trim().isEmpty
        ? 'NONE'
        : heldItem!.toUpperCase();

    return Padding(""", """    final itemLabel = heldItem == null || heldItem!.trim().isEmpty
        ? 'NONE'
        : heldItem!.toUpperCase();
    final visibleTypes = pokemon.types.take(2).toList();

    return Padding(""")

          replace_once("""                    const SizedBox(height: 6),
                    _LoyaltyRow(),""", """                    const SizedBox(height: 6),
                    if (visibleTypes.isNotEmpty) ...[
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          for (final type in visibleTypes) ...[
                            PokemonTypeBadge(type: type, height: 20),
                            if (type != visibleTypes.last)
                              const SizedBox(width: 6),
                          ],
                        ],
                      ),
                      const SizedBox(height: 6),
                    ],
                    _LoyaltyRow(),""")

          replace_once("""        height: 36,
        alignment: Alignment.center,
        padding: const EdgeInsets.symmetric(horizontal: 8),""", """        height: 42,
        alignment: Alignment.center,
        padding: const EdgeInsets.symmetric(horizontal: 8),""")

          replace_once("""                      size: 24,
                    ),""", """                      size: 32,
                    ),""")

          replace_once("""    if (statusInfo == null) {
      return const SizedBox.shrink();
    }

    return _StatusAssetIcon(""", """    if (statusInfo == null) {
      return const SizedBox.shrink();
    }
    if (statusInfo.assetCandidates.isEmpty) {
      return _StatusFallbackLabel(label: statusInfo.shortLabel, size: size);
    }

    return _StatusAssetIcon(""")

          path.write_text(text)
          PY
          rm -f .github/workflows/fix-detail-type-status-ui.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokemon/pokemon_detail_screen.dart .github/workflows/fix-detail-type-status-ui.yml
          git commit -m "Fix detail type badges and status icons"
          git push
