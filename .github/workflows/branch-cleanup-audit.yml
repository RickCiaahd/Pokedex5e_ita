name: Branch cleanup audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/branch-cleanup-trigger'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-cleanup-audit.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-cleanup-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Classify remote branches safely
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main with all history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build conservative branch report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' | sort -u > open_pr_branches.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null) | [.head.ref, .head.sha] | @tsv' \
            | sort -u > merged_pr_heads.txt

          : > delete_candidates.txt
          : > kept_branches.txt

          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "HEAD" || "$branch" == "main" ]] && continue

            if grep -Fxq "$branch" open_pr_branches.txt; then
              printf '%s\t%s\n' "$branch" 'PR aperta' >> kept_branches.txt
              continue
            fi

            encoded_branch=$(jq -rn --arg value "$branch" '$value|@uri')
            protected=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.protected' 2>/dev/null || printf 'unknown')
            if [[ "$protected" != "false" ]]; then
              printf '%s\t%s\n' "$branch" 'protetto o stato non verificabile' >> kept_branches.txt
              continue
            fi

            branch_sha=$(git rev-parse "origin/$branch")

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              printf '%s\t%s\n' "$branch" 'interamente contenuto in main' >> delete_candidates.txt
              continue
            fi

            if awk -F '\t' -v branch="$branch" -v sha="$branch_sha" '$1 == branch && $2 == sha { found=1 } END { exit !found }' merged_pr_heads.txt; then
              printf '%s\t%s\n' "$branch" 'testa identica a una PR già integrata' >> delete_candidates.txt
              continue
            fi

            cherry_output=$(git cherry origin/main "origin/$branch" || true)
            if [[ -n "$cherry_output" ]] && ! grep -q '^+' <<<"$cherry_output"; then
              printf '%s\t%s\n' "$branch" 'commit equivalenti già presenti in main' >> delete_candidates.txt
              continue
            fi

            printf '%s\t%s\n' "$branch" 'contiene modifiche non dimostrate come integrate' >> kept_branches.txt
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)

          delete_count=$(wc -l < delete_candidates.txt | tr -d ' ')
          keep_count=$(wc -l < kept_branches.txt | tr -d ' ')
          total_count=$((delete_count + keep_count + 1))

          {
            echo '# Report pulizia branch'
            echo
            echo "- Branch remoti totali rilevati: **$total_count**"
            echo "- Eliminabili con criterio conservativo: **$delete_count**"
            echo "- Conservati o da verificare: **$keep_count**"
            echo
            echo '## Eliminabili automaticamente'
            if [[ -s delete_candidates.txt ]]; then
              while IFS=$'\t' read -r branch reason; do
                echo "- \`$branch\` — $reason"
              done < delete_candidates.txt
            else
              echo '- Nessuno'
            fi
            echo
            echo '## Conservati'
            if [[ -s kept_branches.txt ]]; then
              while IFS=$'\t' read -r branch reason; do
                echo "- \`$branch\` — $reason"
              done < kept_branches.txt
            else
              echo '- Nessuno'
            fi
          } | tee branch-cleanup-report.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-audit-v2
          path: |
            branch-cleanup-report.md
            delete_candidates.txt
            kept_branches.txt
            merged_pr_heads.txt
          if-no-files-found: error
          retention-days: 14

      - name: Show summary
        shell: bash
        run: cat branch-cleanup-report.md >> "$GITHUB_STEP_SUMMARY"
