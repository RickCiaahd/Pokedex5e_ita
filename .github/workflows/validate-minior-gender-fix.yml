name: Validate Minior and gender fixes

on:
  push:
    paths:
      - '.github/workflows/validate-minior-gender-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/widgets/pokemon/pokemon_asset_image.dart \
            lib/widgets/pokemon/pokemon_gender_asset_paths.dart \
            lib/widgets/pokemon/pokemon_minior_asset_paths.dart \
            test/minior_color_forms_test.dart \
            test/pokemon_gender_asset_paths_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: |
          flutter test test/minior_color_forms_test.dart --reporter expanded
          flutter test test/pokemon_gender_asset_paths_test.dart --reporter expanded
          flutter test test/pokemon_asset_paths_test.dart --reporter expanded
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit validated result
        run: |
          rm -f .github/workflows/validate-minior-gender-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Conferma Minior e le varianti legate al sesso'
          git push origin HEAD:main
