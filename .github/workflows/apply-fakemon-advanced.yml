name: Apply Fakemon advanced feature

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/fakemon-advanced'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fakemon-advanced
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Detect pending integration
        id: patch
        shell: bash
        run: |
          if test -f tool/run_fakemon_advanced_core.py; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.patch.outputs.pending == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply core integration
        if: steps.patch.outputs.pending == 'true'
        run: python tool/run_fakemon_advanced_core.py

      - name: Apply editor and transfer integration
        if: steps.patch.outputs.pending == 'true'
        run: python tool/apply_fakemon_advanced_ui.py

      - name: Apply gameplay integration
        if: steps.patch.outputs.pending == 'true'
        shell: bash
        run: |
          set +e
          python tool/run_fakemon_advanced_gameplay.py 2>&1 | tee /tmp/fakemon-advanced-error.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p docs
            cp /tmp/fakemon-advanced-error.log docs/fakemon-advanced-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/fakemon-advanced-error.log
            git commit -m 'Registra errore integrazione Fakemon avanzati'
            git push origin HEAD:feature/fakemon-advanced
            exit "$status"
          fi

      - name: Remove temporary patch scripts
        if: steps.patch.outputs.pending == 'true'
        run: |
          rm -f \
            tool/apply_fakemon_advanced_core.py \
            tool/run_fakemon_advanced_core.py \
            tool/apply_fakemon_advanced_ui.py \
            tool/apply_fakemon_advanced_gameplay.py \
            tool/run_fakemon_advanced_gameplay.py \
            docs/fakemon-advanced-error.log

      - name: Format changed Dart files
        if: steps.patch.outputs.pending == 'true'
        shell: bash
        run: |
          mapfile -t dart_files < <(git diff --name-only --diff-filter=ACMRT | grep '\.dart$' || true)
          if [ "${#dart_files[@]}" -gt 0 ]; then
            dart format "${dart_files[@]}"
          fi

      - name: Install dependencies
        if: steps.patch.outputs.pending == 'true'
        run: flutter pub get

      - name: Analyze source
        if: steps.patch.outputs.pending == 'true'
        run: flutter analyze

      - name: Run focused Fakemon tests
        if: steps.patch.outputs.pending == 'true'
        run: flutter test test/fakemon_advanced_test.dart --reporter expanded

      - name: Run complete test suite
        if: steps.patch.outputs.pending == 'true'
        run: flutter test --reporter expanded

      - name: Commit and push feature
        if: steps.patch.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aggiunge evoluzioni, forme e contenuti segreti Fakemon'
          git push origin HEAD:feature/fakemon-advanced
