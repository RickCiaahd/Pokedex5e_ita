name: Fix home tour lints

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.title == 'Aggiunge il tour guidato dei menu della Home'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guard target contexts after async gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lib/screens/home/home_screen.dart'): (
                  """    final targetContext = _tourSteps[_tourStepIndex].targetKey.currentContext;
    if (targetContext != null) {
      await Scrollable.ensureVisible(""",
                  """    final targetContext = _tourSteps[_tourStepIndex].targetKey.currentContext;
    if (targetContext != null && targetContext.mounted) {
      await Scrollable.ensureVisible(""",
              ),
              Path('lib/widgets/home/home_tour_overlay.dart'): (
                  """    if (targetContext != null) {
      await Scrollable.ensureVisible(""",
                  """    if (targetContext != null && targetContext.mounted) {
      await Scrollable.ensureVisible(""",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Blocco inatteso in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/fix-home-tour-lints.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregge i lint asincroni del tour della Home'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
