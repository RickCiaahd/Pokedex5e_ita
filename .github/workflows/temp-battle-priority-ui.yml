name: Apply Battle Companion priority UI once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-battle-priority-ui.yml

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Applica e verifica la gerarchia')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Apply Battle Companion priority patch
        run: python tool/compact_battle_priority_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Battle Companion
        run: dart format lib/screens/battle/battle_screen.dart

      - name: Analyze Battle Companion
        run: flutter analyze lib/screens/battle/battle_screen.dart

      - name: Remove one-shot patch files
        run: rm -f tool/compact_battle_priority_patch.py .github/workflows/temp-battle-priority-ui.yml

      - name: Commit Battle Companion priority UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Porta le mosse in primo piano nel Battle Companion'
          git push origin HEAD:feature/compact-pokemon-detail-v2
