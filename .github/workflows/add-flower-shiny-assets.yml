name: Add flower shiny assets

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - '.github/workflows/add-flower-shiny-assets.yml'

permissions:
  contents: write

jobs:
  add-assets-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Download shiny flower artwork
        shell: bash
        run: |
          set -euo pipefail
          root='assets/textures/pokemons'
          mkdir -p "$root"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/floette-blue.png'   -o "$root/670Floette Blue Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/floette-orange.png' -o "$root/670Floette Orange Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/floette-white.png'  -o "$root/670Floette White Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/floette-yellow.png' -o "$root/670Floette Yellow Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/florges-blue.png'   -o "$root/671Florges Blue Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/florges-orange.png' -o "$root/671Florges Orange Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/florges-white.png'  -o "$root/671Florges White Flower Shiny.png"
          curl -fsSL --retry 3 'https://play.pokemonshowdown.com/sprites/home-shiny/florges-yellow.png' -o "$root/671Florges Yellow Flower Shiny.png"

          python - <<'PY'
          from pathlib import Path
          expected = [
              '670Floette Blue Flower Shiny.png',
              '670Floette Orange Flower Shiny.png',
              '670Floette White Flower Shiny.png',
              '670Floette Yellow Flower Shiny.png',
              '671Florges Blue Flower Shiny.png',
              '671Florges Orange Flower Shiny.png',
              '671Florges White Flower Shiny.png',
              '671Florges Yellow Flower Shiny.png',
          ]
          for name in expected:
              path = Path('assets/textures/pokemons') / name
              data = path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{name}: not a PNG'
              assert len(data) > 10_000, f'{name}: suspiciously small ({len(data)} bytes)'
              width = int.from_bytes(data[16:20], 'big')
              height = int.from_bytes(data[20:24], 'big')
              assert width > 0 and height > 0, f'{name}: invalid dimensions'
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Add flower shiny regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('test/deoxys_floette_form_regression_test.dart')
          text = path.read_text(encoding='utf-8')

          marker = """  testWidgets('Flower artwork bundle uses dedicated artwork, not bad sprites', (\n    tester,\n  ) async {\n    final assets = (await AssetManifest.loadFromAssetBundle(\n"""
          replacement = """  testWidgets('Flower artwork bundle uses dedicated artwork, not bad sprites', (\n    tester,\n  ) async {\n    final catalog = await PokemonRepository().getAllPokemon();\n    final floette = catalog.firstWhere((p) => p.id == 670);\n    final florges = catalog.firstWhere((p) => p.id == 671);\n    final assets = (await AssetManifest.loadFromAssetBundle(\n"""
          if marker not in text:
              raise SystemExit('Could not find flower artwork test marker')
          text = text.replace(marker, replacement, 1)

          marker = """      expect(assets, contains('assets/textures/pokemons/671Florges $form.png'));\n      expect(\n"""
          replacement = """      expect(assets, contains('assets/textures/pokemons/671Florges $form.png'));\n      expect(\n        assets,\n        contains('assets/textures/pokemons/670Floette $form Shiny.png'),\n      );\n      expect(\n        assets,\n        contains('assets/textures/pokemons/671Florges $form Shiny.png'),\n      );\n      expect(\n        PokemonAssetPaths.imageCandidates(\n          pokemon: floette,\n          useLargeArtwork: true,\n          formName: form,\n          isShiny: true,\n        ),\n        contains('assets/textures/pokemons/670Floette $form Shiny.png'),\n      );\n      expect(\n        PokemonAssetPaths.imageCandidates(\n          pokemon: florges,\n          useLargeArtwork: true,\n          formName: form,\n          isShiny: true,\n        ),\n        contains('assets/textures/pokemons/671Florges $form Shiny.png'),\n      );\n      expect(\n"""
          if marker not in text:
              raise SystemExit('Could not find flower asset assertions marker')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart test
        run: dart format test/deoxys_floette_form_regression_test.dart

      - name: Regenerate compliance inventories
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/prepare_release_legal_assets.py
          python tooling/generate_compliance_reports.py --check
          python tooling/prepare_release_legal_assets.py --check

      - name: Run flower regression test
        run: flutter test test/deoxys_floette_form_regression_test.dart --reporter expanded

      - name: Analyze project
        run: flutter analyze

      - name: Commit permanent changes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-flower-shiny-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Aggiungi le forme floreali shiny di Floette e Florges'
          git push origin HEAD:feature/compact-pokemon-detail-v2

      - name: Build debug APK for device testing
        run: flutter build apk --debug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/pokedex-5e-ita-flower-shiny-test.apk
          sha256sum dist/pokedex-5e-ita-flower-shiny-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-5e-ita-flower-shiny-test
          path: dist/pokedex-5e-ita-flower-shiny-test.apk
          if-no-files-found: error
          retention-days: 14
