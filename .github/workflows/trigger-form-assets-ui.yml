name: Trigger form asset fix

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger the form correction workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# Triggered after Flutter CI %s\n' '${{ github.event.workflow_run.id }}' >> .github/workflows/fix-form-assets-ui.yml
          rm -f .github/workflows/trigger-form-assets-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avvia la correzione automatica delle forme'
          git push origin HEAD:main
