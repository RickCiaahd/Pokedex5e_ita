name: Apply Pokedex Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-pokedex-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Pokemon detail HP bar
        run: |
          python3 <<'PY'
          from pathlib import Path

          detail_path = Path('lib/screens/pokemon/pokemon_detail_screen.dart')
          content = detail_path.read_text(encoding='utf-8')

          old_hp_bar = """child: LinearProgressIndicator(
                              value: hpProgress,
                              minHeight: 16,
                              backgroundColor: Theme.of(context)
                                  .colorScheme
                                  .surfaceContainerHighest,
                            ),"""
          new_hp_bar = """child: LinearProgressIndicator(
                              value: hpProgress,
                              minHeight: 16,
                              valueColor: AlwaysStoppedAnimation<Color>(
                                _hpProgressColor(hpProgress),
                              ),
                              backgroundColor: Theme.of(context)
                                  .colorScheme
                                  .surfaceContainerHighest,
                            ),"""

          if old_hp_bar not in content:
              raise RuntimeError('HP bar block not found; refusing to patch blindly.')
          content = content.replace(old_hp_bar, new_hp_bar, 1)

          helper_marker = '\nclass _InlineDetailMessage extends StatelessWidget {'
          helper = """
Color _hpProgressColor(double value) {
  if (value <= 0.25) return Colors.red;
  if (value <= 0.5) return Colors.amber;
  return Colors.green;
}

"""
          if '_hpProgressColor' not in content:
              if helper_marker not in content:
                  raise RuntimeError('Inline detail marker not found; refusing to patch blindly.')
              content = content.replace(
                  helper_marker,
                  '\n' + helper + 'class _InlineDetailMessage extends StatelessWidget {',
                  1,
              )

          detail_path.write_text(content, encoding='utf-8')

          workflow_path = Path('.github/workflows/apply-pokedex-patch.yml')
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokemon/pokemon_detail_screen.dart .github/workflows/apply-pokedex-patch.yml
          git commit -m "Restore colored Pokemon HP bar"
          git push
