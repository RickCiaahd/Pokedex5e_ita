name: Apply localized onboarding

on:
  pull_request:
    branches:
      - main

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out onboarding files
        uses: actions/checkout@v4
        with:
          ref: feature/localized-onboarding
          fetch-depth: 1
          show-progress: false
          sparse-checkout: |
            tooling
            lib/screens/onboarding
            lib/l10n
            test

      - name: Capture onboarding localization result
        shell: bash
        run: |
          set +e
          python tooling/apply_localized_onboarding.py > onboarding_apply_error.log 2>&1
          echo "$?" > onboarding_apply_status.txt
          exit 0

      - name: Upload onboarding diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-localization-diagnostics
          path: |
            onboarding_apply_error.log
            onboarding_apply_status.txt

      - name: Fail when localization did not apply
        shell: bash
        run: test "$(cat onboarding_apply_status.txt)" = "0"
