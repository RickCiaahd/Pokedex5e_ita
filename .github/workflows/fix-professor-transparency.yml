name: Fix professor transparency

on:
  push:
    branches:
      - fix/professor-real-transparency
    paths:
      - '.github/workflows/fix-professor-transparency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/professor-real-transparency
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Remove the baked checkerboard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image, ImageFilter

          path = Path('assets/textures/trainers/onboarding_professor.png')
          image = Image.open(path).convert('RGBA')
          rgba = np.asarray(image)
          rgb = rgba[:, :, :3]
          original_alpha = rgba[:, :, 3]

          print(f'Input: {image.width}x{image.height}, alpha={original_alpha.min()}..{original_alpha.max()}')

          maximum = rgb.max(axis=2)
          minimum = rgb.min(axis=2)
          chroma = maximum - minimum

          # The generated file contains a white/light-grey checkerboard as real
          # pixels. Select its bright neutral tones, then keep only components
          # connected to the outer edge so the ivory coat remains intact.
          candidate_background = (minimum >= 215) & (chroma <= 24)
          _, labels = cv2.connectedComponents(
              candidate_background.astype(np.uint8),
              connectivity=8,
          )
          edge_labels = np.unique(
              np.concatenate(
                  [labels[0, :], labels[-1, :], labels[:, 0], labels[:, -1]]
              )
          )
          background = np.isin(labels, edge_labels) & candidate_background
          foreground = (~background).astype(np.uint8)

          # Retain the main illustrated figure and discard isolated remnants of
          # the artificial checkerboard.
          count, component_labels, stats, _ = cv2.connectedComponentsWithStats(
              foreground,
              connectivity=8,
          )
          if count <= 1:
              raise SystemExit('Non è stato possibile individuare il Professore.')

          areas = stats[:, cv2.CC_STAT_AREA]
          main_label = int(np.argmax(areas[1:]) + 1)
          mask_array = (component_labels == main_label).astype(np.uint8) * 255

          radius = max(0.45, min(image.size) / 2600)
          mask = Image.fromarray(mask_array, mode='L').filter(
              ImageFilter.GaussianBlur(radius=radius)
          )
          corrected = image.copy()
          corrected.putalpha(mask)

          bounds = mask.getbbox()
          if bounds is None:
              raise SystemExit('La maschera trasparente risulta vuota.')

          figure = corrected.crop(bounds)
          side_margin = max(12, round(figure.width * 0.045))
          top_margin = max(12, round(figure.height * 0.025))
          canvas = Image.new(
              'RGBA',
              (figure.width + side_margin * 2, figure.height + top_margin),
              (0, 0, 0, 0),
          )
          canvas.alpha_composite(figure, (side_margin, top_margin))
          canvas.save(path, optimize=True)

          final_alpha = np.asarray(canvas.getchannel('A'))
          transparent = int(np.count_nonzero(final_alpha == 0))
          total = int(final_alpha.size)
          print(
              f'Output: {canvas.width}x{canvas.height}, '
              f'alpha={final_alpha.min()}..{final_alpha.max()}, '
              f'transparent={transparent}/{total}'
          )
          if final_alpha.min() != 0 or transparent < total * 0.20:
              raise SystemExit('La trasparenza ottenuta non è sufficiente.')
          PY

      - name: Commit corrected PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-professor-transparency.yml
          git add assets/textures/trainers/onboarding_professor.png
          git commit -m 'Ritaglia il Professore con trasparenza reale'
          git push origin HEAD:fix/professor-real-transparency
