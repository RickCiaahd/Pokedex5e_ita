name: Export round 2 localization snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-round2-localization-snapshot.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'fix/english-ui-residuals-round2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/english-ui-residuals-round2
          fetch-depth: 0

      - name: Create source snapshot
        run: |
          git archive --format=tar.gz --output=round2-localization-source.tar.gz HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: round2-localization-source
          path: round2-localization-source.tar.gz
          retention-days: 3
