name: One-time cleanup fix

on:
  push:
    branches:
      - chore/project-cleanup
    paths:
      - '.github/workflows/one-time-cleanup-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/project-cleanup

      - name: Apply final cleanup fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          battle = Path('lib/screens/battle/battle_screen.dart')
          text = battle.read_text(encoding='utf-8')
          old = "label: const Text('PROSSIMO'),"
          new = "label: const Text('PROSSIMO TURNO'),"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one compact next-turn label, found {text.count(old)}')
          battle.write_text(text.replace(old, new, 1), encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          old = 'description: "A new Flutter project."'
          new = 'description: "Companion non ufficiale in italiano per campagne Pokémon 5e."'
          if text.count(old) != 1:
              raise SystemExit('Unexpected pubspec description')
          pubspec.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f cleanup-test-diagnostics.txt

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-cleanup-fix.yml
          git add lib/screens/battle/battle_screen.dart pubspec.yaml cleanup-test-diagnostics.txt
          git commit -m 'Completa la pulizia conservativa del progetto'
          git pull --rebase origin chore/project-cleanup
          git push origin chore/project-cleanup
