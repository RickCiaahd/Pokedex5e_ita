name: Diagnose publish v1.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-publish-v1.0.2.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record publish workflow status
        shell: bash
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow publish-multiplatform-v1.0.2.yml \
            --limit 5 \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt > publish-status.json

          {
            echo '# Stato pubblicazione multipiattaforma 1.0.2'
            echo
            echo "Generato il $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo '```json'
            jq . publish-status.json
            echo '```'
          } > docs/publish-v1.0.2-current-status.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-publish-v1.0.2.yml
          git add docs/publish-v1.0.2-current-status.md
          git commit -m 'Registra lo stato della pubblicazione multipiattaforma 1.0.2'
          git push origin HEAD:main
