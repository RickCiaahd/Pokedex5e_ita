name: Move technical reference migration

on:
  push:
    branches:
      - translation/moves-audit

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Mantiene i riferimenti tecnici delle mosse nelle scelte'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/moves-audit
          fetch-depth: 0

      - name: Preserve technical move references
        run: |
          python - <<'PY'
          from pathlib import Path

          edit_path = Path('lib/screens/pokemon/pokemon_edit_screen.dart')
          text = edit_path.read_text(encoding='utf-8')
          replacements = {
              """    for (final move in catalogMoves) {
                moveData[move.id] = move;
                moveData[move.name] = move;
              }
              final catalogMoveNames = _unique(catalogMoves.map((move) => move.name))
          """: """    for (final move in catalogMoves) {
                moveData[move.id] = move;
                moveData[move.name] = move;
                moveData[move.technicalName] = move;
              }
              final catalogMoveNames = _unique(
                catalogMoves.map((move) => move.technicalName),
              )
          """,
              "tmMoveNames.add(move?.name ?? _labelFromId(tm.moveId));":
                  "tmMoveNames.add(move?.technicalName ?? _labelFromId(tm.moveId));",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing pokemon edit snippet: {old!r}')
              text = text.replace(old, new, 1)
          edit_path.write_text(text, encoding='utf-8')

          custom_path = Path('lib/screens/pokemon/custom_pokemon_library_screen.dart')
          text = custom_path.read_text(encoding='utf-8')
          replacements = {
              "MoveData.referenceKey(move.name),":
                  "MoveData.referenceKey(move.technicalName),",
              "values.add(move.name);": "values.add(move.technicalName);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing Fakemon editor snippet: {old!r}')
              text = text.replace(old, new, 1)
          custom_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/pokemon/pokemon_edit_screen.dart lib/screens/pokemon/custom_pokemon_library_screen.dart
          git commit -m "Conserva i riferimenti tecnici delle mosse nei salvataggi"
          git push origin HEAD:translation/moves-audit
