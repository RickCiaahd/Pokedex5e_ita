name: Validate Pokédex dialog layout

on:
  push:
    branches:
      - fix/pokedex-summary-dialog-layout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/pokedex-summary-dialog-layout

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: dart format lib/widgets/pokedex/pokemon_summary_dialog.dart test/pokemon_summary_dialog_layout_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run dialog layout test
        run: flutter test test/pokemon_summary_dialog_layout_test.dart

      - name: Run Pokédex model tests
        run: flutter test test/pokedex_form_entry_test.dart

      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/widgets/pokedex/pokemon_summary_dialog.dart test/pokemon_summary_dialog_layout_test.dart
            git commit -m "Format Pokédex dialog layout fix"
            git push origin fix/pokedex-summary-dialog-layout
          fi
