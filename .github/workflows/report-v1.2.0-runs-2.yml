name: Report v1.2.0 runs 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/report-v1.2.0-runs-2.yml'

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save tag workflow report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          gh run list --limit 100 --json databaseId,workflowName,status,conclusion,headBranch,headSha,event,createdAt,updatedAt,url \
            | jq '[.[] | select(.headBranch == "v1.2.0" or .headSha == "52e8f710a4b2dfa8eda138ea1d0e73dc9808fe85")]' \
            > docs/release-v1.2.0-runs.json

      - name: Commit report and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/report-v1.2.0-runs-2.yml
          git add docs/release-v1.2.0-runs.json
          git commit -m 'Aggiorna lo stato delle build della release 1.2.0'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
