name: Fix detail type and status UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply detail UI fix
        shell: bash
        run: |
          git apply <<'PATCH'
          diff --git a/lib/screens/pokemon/pokemon_detail_screen.dart b/lib/screens/pokemon/pokemon_detail_screen.dart
          --- a/lib/screens/pokemon/pokemon_detail_screen.dart
