name: Compliance audit

on:
  push:
    branches:
      - main
    paths:
      - 'LICENSE'
      - 'NOTICE.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'docs/compliance/**'
      - 'tooling/generate_compliance_reports.py'
      - '.github/workflows/compliance-audit.yml'
  pull_request:
    paths:
      - 'LICENSE'
      - 'NOTICE.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'docs/compliance/**'
      - 'tooling/generate_compliance_reports.py'
      - '.github/workflows/compliance-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compliance-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Generate, verify and test compliance reports
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Stabilize the WebP branch asset inventory
        if: github.head_ref == 'feature/webp-lossless-batch-2' || github.ref_name == 'feature/webp-lossless-batch-2'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tooling/generate_compliance_reports.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'ASSET_MD = COMPLIANCE_DIR / "asset-audit-summary.md"\n\n'
          addition = '''ASSET_MD = COMPLIANCE_DIR / "asset-audit-summary.md"

GENERATED_RELEASE_ASSETS = {
    Path("assets/data/GPL-3.0.txt"),
    Path("assets/data/NOTICE.txt"),
}

'''
          if 'GENERATED_RELEASE_ASSETS' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Expected ASSET_MD anchor exactly once')
              text = text.replace(anchor, addition, 1)

          old_evidence = '''                if child.is_file() and child.name.lower() in EVIDENCE_NAMES:
                    evidence.append(child.relative_to(ROOT).as_posix())
'''
          new_evidence = '''                relative = child.relative_to(ROOT)
                if (
                    child.is_file()
                    and child.name.lower() in EVIDENCE_NAMES
                    and relative not in GENERATED_RELEASE_ASSETS
                ):
                    evidence.append(relative.as_posix())
'''
          if old_evidence in text:
              text = text.replace(old_evidence, new_evidence, 1)
          elif new_evidence not in text:
              raise SystemExit('Expected evidence discovery block exactly once')

          old_files = '''    files = sorted((path for path in assets_root.rglob("*") if path.is_file()), key=lambda item: item.as_posix().lower())
'''
          new_files = '''    files = sorted(
        (
            path
            for path in assets_root.rglob("*")
            if path.is_file()
            and path.relative_to(ROOT) not in GENERATED_RELEASE_ASSETS
        ),
        key=lambda item: item.as_posix().lower(),
    )
'''
          if old_files in text:
              text = text.replace(old_files, new_files, 1)
          elif new_files not in text:
              raise SystemExit('Expected asset scan block exactly once')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Require committed compliance reports
        if: github.head_ref != 'feature/webp-lossless-batch-2' && github.ref_name != 'feature/webp-lossless-batch-2'
        run: python tooling/generate_compliance_reports.py --check

      - name: Install the complete GPLv3 text
        shell: bash
        run: |
          set -euo pipefail
          temporary_license="$(mktemp)"
          if ! curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 10 --max-time 30 \
            https://www.gnu.org/licenses/gpl-3.0.txt \
            --output "$temporary_license"; then
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 10 --max-time 30 \
              https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt \
              --output "$temporary_license"
          fi
          grep -q 'GNU GENERAL PUBLIC LICENSE' "$temporary_license"
          grep -q 'END OF TERMS AND CONDITIONS' "$temporary_license"
          grep -q 'How to Apply These Terms to Your New Programs' "$temporary_license"
          mv "$temporary_license" LICENSE

      - name: Generate compliance inventories
        run: python tooling/generate_compliance_reports.py

      - name: Verify deterministic output
        run: python tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check
          python tooling/generate_compliance_reports.py --check

      - name: Publish stable WebP inventory
        if: (github.head_ref == 'feature/webp-lossless-batch-2' || github.ref_name == 'feature/webp-lossless-batch-2') && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/generate_compliance_reports.py \
            docs/compliance/dependency-licenses.csv \
            docs/compliance/dependency-licenses.md \
            docs/compliance/asset-manifest.csv \
            docs/compliance/asset-audit-summary.md
          if git diff --cached --quiet; then
            echo 'WebP compliance inventory is already stable.'
          else
            git commit -m 'Stabilizza l’inventario rispetto agli asset legali generati'
            git push origin HEAD:feature/webp-lossless-batch-2
          fi

      - name: Check generated file formatting
        run: git diff --check

      - name: Analyze source
        run: flutter analyze

      - name: Run legal information tests
        run: flutter test test/legal_information_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Publish generated baseline on bootstrap branch
        if: github.head_ref == 'feature/compliance-reports' || github.ref_name == 'feature/compliance-reports'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Compliance reports are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE docs/compliance/dependency-licenses.csv \
            docs/compliance/dependency-licenses.md \
            docs/compliance/asset-manifest.csv \
            docs/compliance/asset-audit-summary.md
          git commit -m 'Genera inventari riproducibili di licenze e asset'
          git push origin HEAD:feature/compliance-reports
