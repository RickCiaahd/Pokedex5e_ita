name: Cleanup v1.2.0 branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v1.2.0-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged branch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/fakemon-forms-localization-1.2.0 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-v1.2.0-branch.yml
          git commit -m 'Rimuove il branch temporaneo della release 1.2.0'
          git push origin HEAD:main
