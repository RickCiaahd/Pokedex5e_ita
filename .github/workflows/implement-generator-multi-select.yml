name: Implement generator multi-select

on:
  push:
    branches:
      - feat/pokemon-generator-multi-select
    paths:
      - '.github/workflows/implement-generator-multi-select.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pokemon-generator-multi-select
          fetch-depth: 0

      - name: Apply generator screen update
        run: python3 tool/apply_generator_multi_select_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/pokemon_type_localization.dart \
            lib/services/pokemon_generator_service.dart \
            lib/screens/tools/pokemon_generator_screen.dart \
            lib/widgets/tools/pokemon_generator_candidate_selector.dart \
            lib/widgets/tools/generated_pokemon_batch_card.dart \
            test/pokemon_generator_multi_select_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run generator tests
        run: |
          flutter test test/pokemon_generator_service_test.dart
          flutter test test/pokemon_generator_multi_select_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Remove temporary implementation files
        run: |
          rm -f tool/apply_generator_multi_select_patch.py
          rm -f .github/workflows/implement-generator-multi-select.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add localized multi-select Pokémon generation"
          git push origin feat/pokemon-generator-multi-select
