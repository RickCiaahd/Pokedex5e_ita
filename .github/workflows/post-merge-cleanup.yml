name: Post merge cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/post-merge-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump Android publication build number
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'version: 1.4.0+13\n'
          new = 'version: 1.4.0+14\n'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected version 1.4.0+13 not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit build number
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'Incrementa version code Android a 14'
            git push origin HEAD:main
          fi

      - name: Remove stale merged and helper branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/apply-bag-layout-via-pr'
            'agent/compact-pokemon-detail'
            'agent/item-driven-arceus-silvally-forms'
            'agent/request-compact-apk-build'
            'agent/run-bag-layout'
            'agent/run-fixed-bag-apk-20260807'
            'agent/trigger-bag-bar-fix-build-20260806'
            'agent/trigger-bag-layout'
            'agent/trigger-compact-apk-build-20260806'
            'feature/compact-pokemon-detail-v2'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
