name: Apply move localization bundle

on:
  push:
    branches:
      - translation/moves-251-450
    paths:
      - '.translation-bundle/**'
      - '.github/workflows/apply-move-localization-bundle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/moves-251-450
          fetch-depth: 0

      - name: Apply localization bundle
        shell: bash
        run: |
          set -euo pipefail

          {
            cat .translation-bundle/moves-251-450.part1
            for file in .translation-bundle/moves-251-450.part02-*; do
              grep -v '^#' "$file"
            done
          } | tr -d '\n' > /tmp/moves-251-450.b64

          base64 --decode /tmp/moves-251-450.b64 | tar -xz

          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- localizzate con nomi italiani verificati e descrizioni 5e tradotte le prime 250 delle 830 mosse del catalogo, da Assorbimento ad Adulazione, conservando riferimenti inglesi e valori meccanici;'
          new = '- localizzate con nomi italiani verificati e descrizioni 5e tradotte le prime 450 delle 830 mosse del catalogo, da Assorbimento a Nebbia, conservando riferimenti inglesi e valori meccanici;'
          if old not in text:
              raise SystemExit('Riga del changelog non trovata.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm -rf .translation-bundle
          rm .github/workflows/apply-move-localization-bundle.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Localizza le mosse 251-450'
          git push origin HEAD:translation/moves-251-450
