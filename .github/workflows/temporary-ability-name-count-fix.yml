name: Temporary ability name set fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/ability-names
          fetch-depth: 0
      - name: Align official names with the source catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('assets/data_webapp/abilities.json')
          reference_path = Path('assets/data/ability_names_it_official.json')
          source = json.loads(source_path.read_text(encoding='utf-8'))['items']
          source_by_id = {item['id']: item for item in source}
          reference = json.loads(reference_path.read_text(encoding='utf-8'))
          items = reference['items']

          for stale_id in ('delta-stream', 'parental-bond', 'power-construct'):
              items.pop(stale_id, None)

          additions = {
              'mold-breaker': {
                  'officialNumber': 104,
                  'sourceName': source_by_id['mold-breaker']['name'],
                  'name': 'Rompiforma',
              },
              'sword-of-ruin': {
                  'officialNumber': 285,
                  'sourceName': source_by_id['sword-of-ruin']['name'],
                  'name': 'Spada Nefasta',
              },
          }
          items.update(additions)

          source_ids = set(source_by_id)
          reference_ids = set(items)
          unmatched = source_ids - reference_ids
          expected_unmatched = {
              'air-slash', 'blizzard', 'drifter',
              'form-change-arceus', 'form-change-cherrim',
              'form-change-giratina', 'form-change-hoopa',
              'form-change-keldeo', 'form-change-kyurem',
              'form-change-meloetta', 'form-change-necrozma',
              'form-change-ogerpon', 'form-change-oricorio',
              'form-change-rotom', 'form-change-shaymin',
              'form-change-terapagos', 'form-change-ultra-necrozma',
              'hydro-pump', 'leaf-storm', 'overheat',
              'paper-thin', 'transformer',
          }
          if reference_ids - source_ids:
              raise SystemExit(
                  f'Riferimenti estranei: {sorted(reference_ids - source_ids)}'
              )
          if unmatched != expected_unmatched:
              raise SystemExit(
                  f'Voci senza riferimento inattese: {sorted(unmatched)}'
              )
          if len(items) != 308:
              raise SystemExit(f'Attesi 308 nomi, trovati {len(items)}')

          reference['catalogCount'] = len(source_ids)
          reference['matchedCount'] = len(items)
          reference['unmatchedCount'] = len(unmatched)
          reference_path.write_text(
              json.dumps(reference, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          diagnostic_path = Path(
              'docs/translation/ability-name-set-diagnostic.json'
          )
          if diagnostic_path.exists():
              diagnostic_path.unlink()
          PY
      - name: Commit corrected reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ability_names_it_official.json
          git add -u docs/translation/ability-name-set-diagnostic.json
          git commit -m "Allinea i nomi abilità al catalogo sorgente"
          git push origin HEAD:translation/ability-names
