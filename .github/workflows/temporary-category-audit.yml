name: Temporary category audit

on:
  push:
    branches:
      - translation/category-audit

permissions:
  contents: write

jobs:
  sync-categories:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/category-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Synchronize official Italian categories
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import urllib.request
          from pathlib import Path

          from bs4 import BeautifulSoup

          SOURCE_URL = 'https://wiki.pokemoncentral.it/Categoria'
          MAX_ID = 649

          request = urllib.request.Request(
              SOURCE_URL,
              headers={'User-Agent': 'Pokedex5eITA category audit/1.0'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              html = response.read()

          soup = BeautifulSoup(html, 'html.parser')
          categories: dict[int, dict[str, str]] = {}

          for row in soup.select('table tr'):
              cells = [
                  cell.get_text(' ', strip=True)
                  for cell in row.find_all(['th', 'td'], recursive=False)
              ]
              if not cells:
                  continue

              match = re.fullmatch(r'0*(\d+)', cells[0].replace('\xa0', '').strip())
              if match is None:
                  continue

              pokemon_id = int(match.group(1))
              if pokemon_id < 1 or pokemon_id > MAX_ID or pokemon_id in categories:
                  continue

              category = next(
                  (text for text in reversed(cells) if text.startswith('Pokémon ')),
                  None,
              )
              if category is None:
                  continue

              name = ''
              for text in cells[1:]:
                  if text and not text.startswith('Pokémon ') and 'Forma ' not in text:
                      name = text
              categories[pokemon_id] = {
                  'name': name,
                  'genus': category,
              }

          expected_ids = set(range(1, MAX_ID + 1))
          actual_ids = set(categories)
          if actual_ids != expected_ids:
              missing = sorted(expected_ids - actual_ids)
              extra = sorted(actual_ids - expected_ids)
              raise SystemExit(
                  f'Categorie incomplete. Mancanti: {missing[:20]}; extra: {extra[:20]}'
              )

          checks = {
              9: 'Pokémon Carapace',
              154: 'Pokémon Erbe',
              165: 'Pokémon Pentastra',
              178: 'Pokémon Magico',
              500: 'Pokémon Suincendio',
          }
          for pokemon_id, expected in checks.items():
              actual = categories[pokemon_id]['genus']
              if actual != expected:
                  raise SystemExit(
                      f'Categoria inattesa per #{pokemon_id}: {actual!r}, attesa {expected!r}'
                  )

          changes: list[tuple[int, str, str, str]] = []
          localization_paths = sorted(
              Path('assets/data').glob('pokemon_localization_it_gen[1-5]_*.json')
          )
          if not localization_paths:
              raise SystemExit('Nessun catalogo di localizzazione trovato.')

          localized_ids: set[int] = set()
          for path in localization_paths:
              document = json.loads(path.read_text(encoding='utf-8'))
              items = document.get('items')
              if not isinstance(items, dict):
                  raise SystemExit(f'{path} non contiene una mappa items valida.')

              for raw_id, item in items.items():
                  pokemon_id = int(raw_id)
                  if pokemon_id > MAX_ID:
                      continue
                  if not isinstance(item, dict):
                      raise SystemExit(f'{path}: voce non valida per #{pokemon_id}.')
                  localized_ids.add(pokemon_id)
                  official = categories[pokemon_id]
                  old_genus = str(item.get('genus', '')).strip()
                  new_genus = official['genus']
                  if old_genus != new_genus:
                      changes.append(
                          (pokemon_id, official['name'], old_genus, new_genus)
                      )
                      item['genus'] = new_genus

              path.write_text(
                  json.dumps(document, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          if localized_ids != expected_ids:
              missing = sorted(expected_ids - localized_ids)
              extra = sorted(localized_ids - expected_ids)
              raise SystemExit(
                  f'Cataloghi localizzati incompleti. Mancanti: {missing[:20]}; extra: {extra[:20]}'
              )

          reference = {
              'source': SOURCE_URL,
              'range': {'from': 1, 'to': MAX_ID},
              'items': {str(key): categories[key] for key in sorted(categories)},
          }
          reference_path = Path('docs/translation/pokemon-categories-it-001-649.json')
          reference_path.parent.mkdir(parents=True, exist_ok=True)
          reference_path.write_text(
              json.dumps(reference, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          report_path = Path('docs/translation/category-audit-001-649.md')
          lines = [
              '# Audit delle categorie Pokémon #001–649',
              '',
              f'Fonte di riferimento: {SOURCE_URL}',
              '',
              f'Categorie controllate: **{MAX_ID}**.',
              '',
              f'Categorie corrette rispetto ai cataloghi precedenti: **{len(changes)}**.',
              '',
              '## Correzioni applicate',
              '',
              '| ID | Pokémon | Prima | Categoria ufficiale |',
              '|---:|---|---|---|',
          ]
          for pokemon_id, name, old_genus, new_genus in changes:
              lines.append(
                  f'| #{pokemon_id:03d} | {name} | {old_genus} | {new_genus} |'
              )
          if not changes:
              lines.append('| — | — | Nessuna differenza | Nessuna differenza |')
          lines.extend([
              '',
              'Le descrizioni, gli ID, le statistiche, altezza, peso e gli altri dati tecnici non sono stati modificati.',
              '',
          ])
          report_path.write_text('\n'.join(lines), encoding='utf-8')

          print(f'Controllate {MAX_ID} categorie; corrette {len(changes)} differenze.')
          PY

      - name: Commit synchronized categories
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica da registrare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/pokemon_localization_it_gen*.json docs/translation/
          git commit -m "Corregge le categorie Pokémon ufficiali"
          git push origin HEAD:translation/category-audit

# Trigger aggiornato intenzionalmente per avviare l'audit.
