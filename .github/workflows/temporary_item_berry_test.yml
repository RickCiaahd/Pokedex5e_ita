name: Temporary item berry test

on:
  push:
    branches:
      - translation/item-berries

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Run item test
        continue-on-error: true
        run: flutter test test/item_localization_integrity_test.dart --reporter expanded > item-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-berry-test-log
          path: item-test.log
          retention-days: 2
