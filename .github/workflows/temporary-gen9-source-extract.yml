name: Temporary Gen9 source extract

on:
  push:
    branches:
      - translation/pokemon-gen9

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/pokemon-gen9
          fetch-depth: 0

      - name: Extract generation IX source text and Italian categories
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from pathlib import Path

          catalog = json.loads(Path('assets/data_webapp/pokemon.json').read_text(encoding='utf-8'))
          selected = {}
          for item in catalog.get('items', []):
              number = int(item.get('number') or 0)
              if not 906 <= number <= 1025:
                  continue
              candidate = {
                  'name': str(item.get('name') or '').strip(),
                  'id': str(item.get('id') or '').strip(),
                  'description': str(item.get('description') or '').strip(),
              }
              current = selected.get(number)
              score = (candidate['id'].count('-'), len(candidate['id']))
              if current is None or score < current['_score']:
                  candidate['_score'] = score
                  selected[number] = candidate

          csv_url = 'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species_names.csv'
          with urllib.request.urlopen(csv_url) as response:
              rows = csv.DictReader(io.StringIO(response.read().decode('utf-8')))
              categories = {
                  int(row['pokemon_species_id']): row['genus'].strip()
                  for row in rows
                  if row['local_language_id'] == '8'
                  and 906 <= int(row['pokemon_species_id']) <= 1025
              }

          missing_source = [number for number in range(906, 1026) if number not in selected]
          missing_category = [number for number in range(906, 1026) if not categories.get(number)]
          if missing_source:
              raise SystemExit(f'Missing source Pokémon: {missing_source}')
          if missing_category:
              raise SystemExit(f'Missing Italian categories: {missing_category}')

          items = {}
          for number in range(906, 1026):
              source = selected[number]
              items[str(number)] = {
                  'name': source['name'],
                  'id': source['id'],
                  'description': source['description'],
                  'genus': categories[number],
              }

          output = {
              'source': 'assets/data_webapp/pokemon.json',
              'category_source': 'https://wiki.pokemoncentral.it/Categoria',
              'range': {'from': 906, 'to': 1025},
              'items': items,
          }
          target = Path('docs/translation/gen9-source-extract.json')
          target.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit extracted source data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/translation/gen9-source-extract.json
          git commit -m "Registra le sorgenti temporanee della Gen IX"
          git push origin HEAD:translation/pokemon-gen9
