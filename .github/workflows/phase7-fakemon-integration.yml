              ) {
                final usable = references.where((reference) {
                  final move = moves[reference];
                  return move != null && _maxPpFor(move) > 0;
                });
                if (usable.isEmpty) return false;
                return usable.every(
                  (reference) =>
                      _remainingPp(slot, reference, moves[reference]) <= 0,
