name: One-time Pokédex filter Material fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/pokedex-filter-material
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Material fix
        run: python3 .github/scripts/fix_pokedex_filter_material.py

      - name: Format and validate
        run: |
          dart format lib/screens/pokedex/pokedex_screen.dart
          flutter pub get
          flutter analyze
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_pokedex_filter_material.py
          git add lib/screens/pokedex/pokedex_screen.dart
          git commit -m 'Usa Material nel pannello filtri Pokédex'
          git push origin fix/pokedex-filter-material
