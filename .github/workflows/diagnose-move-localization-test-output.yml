name: Diagnose move localization test output

on:
  push:
    branches:
      - translation/moves-251-450
    paths:
      - '.github/workflows/diagnose-move-localization-test-output.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/moves-251-450
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run localization test and save output
        shell: bash
        run: |
          set -o pipefail
          flutter pub get
          flutter test test/move_localization_integrity_test.dart > docs/translation/move-localization-test-diagnostic.txt 2>&1 || true
          rm .github/workflows/diagnose-move-localization-test-output.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f docs/translation/move-localization-test-diagnostic.txt
          git commit -m 'Registra l’output del test di localizzazione mosse'
          git push origin HEAD:translation/moves-251-450
