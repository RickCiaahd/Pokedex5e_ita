name: Apply localized onboarding

on:
  pull_request:
    branches:
      - main

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out onboarding files
        uses: actions/checkout@v4
        with:
          ref: feature/localized-onboarding
          fetch-depth: 1
          show-progress: false
          sparse-checkout: |
            tooling
            lib/screens/onboarding
            lib/l10n
            test

      - name: Apply onboarding localization
        run: python tooling/apply_localized_onboarding.py
