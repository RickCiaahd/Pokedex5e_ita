name: Temporary Gen6 test cleanup

on:
  push:
    branches:
      - translation/pokemon-gen6

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/pokemon-gen6
          fetch-depth: 0

      - name: Remove unused audit metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/pokemon_localization_integrity_test.dart')
          text = path.read_text(encoding='utf-8')
          line = "        final name = reference['name']?.toString().trim() ?? '';\n"
          if line not in text:
              raise SystemExit('Riga attesa non trovata.')
          path.write_text(text.replace(line, ''), encoding='utf-8')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/pokemon_localization_integrity_test.dart
          git commit -m "Rifinisce il controllo delle categorie Gen VI"
          git push origin HEAD:translation/pokemon-gen6
