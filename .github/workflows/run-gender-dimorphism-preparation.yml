name: Run gender dimorphism preparation

on:
  push:
    paths:
      - '.github/workflows/run-gender-dimorphism-preparation.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Execute preparation script
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/prepare-gender-dimorphism-assets.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = dedent(text[start:end])
          exec(compile(script, str(source), 'exec'))
          PY

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/models/pokemon_gender_appearance.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            lib/screens/pokemon/pokemon_edit_screen.dart \
            test/pokemon_asset_paths_test.dart \
            test/pokemon_gender_appearance_test.dart
          flutter pub get
          flutter analyze
          flutter test test/pokemon_asset_paths_test.dart --reporter expanded
          flutter test test/pokemon_gender_appearance_test.dart --reporter expanded
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/prepare-gender-dimorphism-assets.yml \
            .github/workflows/run-gender-dimorphism-preparation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Predispone le texture maschio e femmina per tutte le specie'
          git push origin HEAD:main
