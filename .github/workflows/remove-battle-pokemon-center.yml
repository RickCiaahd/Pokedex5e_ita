name: Remove Battle Companion Pokemon Center

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/remove_battle_pokemon_center.py
      - .github/workflows/remove-battle-pokemon-center.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Remove Pokemon Center from Battle Companion
        run: python tool/remove_battle_pokemon_center.py

      - name: Format touched files
        run: |
          dart format lib/screens/battle/battle_screen.dart
          dart format lib/widgets/battle/pokemon_battle_attributes_card.dart

      - name: Analyze source
        run: flutter analyze

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/battle/battle_screen.dart lib/widgets/battle/pokemon_battle_attributes_card.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rifinisci il Battle Companion compatto"
          git push origin HEAD:feature/compact-pokemon-detail-v2
