name: Temporary abilities source export

on:
  push:
    branches:
      - translation/abilities

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload abilities source
        uses: actions/upload-artifact@v4
        with:
          name: abilities-source
          path: assets/data_webapp/abilities.json
          if-no-files-found: error
          retention-days: 1
