name: Finalize repaired Pokémon images

on:
  push:
    branches:
      - fix/repair-unreadable-pokemon-images
    paths:
      - 'assets/textures/textures_webapp/pokemon/**'
      - 'docs/compliance/**'
      - 'docs/performance/unreadable-pokemon-images.csv'
      - 'docs/performance/repaired-pokemon-images.csv'
      - 'tooling/repair_unreadable_pokemon_images.py'
      - '.github/workflows/repair-unreadable-pokemon-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-repaired-pokemon-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate repaired PNG files and refresh inventories
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/repair-unreadable-pokemon-images
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Validate every Pokémon image
        run: |
          python -m py_compile tooling/repair_unreadable_pokemon_images.py
          python tooling/repair_unreadable_pokemon_images.py --self-test
          python tooling/repair_unreadable_pokemon_images.py --check-all

      - name: Refresh compliance inventories after binary repairs
        if: github.actor != 'github-actions[bot]'
        run: |
          python tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py --check
          git diff --check

      - name: Commit refreshed compliance reports
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/compliance; then
            echo 'Compliance reports are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/compliance/dependency-licenses.csv \
            docs/compliance/dependency-licenses.md \
            docs/compliance/asset-manifest.csv \
            docs/compliance/asset-audit-summary.md
          git commit -m 'Aggiorna gli inventari dopo la riparazione delle immagini'
          git push origin HEAD:fix/repair-unreadable-pokemon-images
