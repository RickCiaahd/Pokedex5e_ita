name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  apply_postframe_tour_fix:
    name: Apply post-frame tour restoration
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Corregge definitivamente le schermate vuote dopo i tour'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply post-frame restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('lib/widgets/tour/guided_tour.dart')
          text = path.read_text(encoding='utf-8')
          replacement = '''  void _finishTour() {
            if (scrollController.hasClients) {
              try {
                final position = scrollController.position;
                position.jumpTo(position.pixels);
              } catch (error) {
                debugPrint(
                  'Impossibile interrompere lo scorrimento del tour: $error',
                );
              }
            }

            controller.finish();

            WidgetsBinding.instance.addPostFrameCallback((_) {
              _restoreScrollToStart();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _restoreScrollToStart();
              });
            });
          }

          void _restoreScrollToStart() {
            if (!scrollController.hasClients) return;

            final position = scrollController.position;
            if (!position.hasContentDimensions) return;

            final target = position.minScrollExtent;
            if ((position.pixels - target).abs() <= .5) return;

            try {
              position.jumpTo(target);
            } catch (error) {
              debugPrint(
                'Impossibile ripristinare lo scorrimento del tour: $error',
              );
            }
          }

          @override'''

          updated, count = re.subn(
              r'  void _finishTour\(\) \{.*?\n  \}\n\n  @override',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Il metodo _finishTour non è stato sostituito una sola volta.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Strengthen regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('test/guided_tour_scroll_restoration_test.dart')
          text = path.read_text(encoding='utf-8')
          replacement = '''    tourController.start();
            await tester.pump();
            await tester.pump(const Duration(milliseconds: 80));

            expect(find.text('HO CAPITO'), findsOneWidget);

            await tester.tap(find.text('HO CAPITO'));
            await tester.pump();
            await tester.pump();
            await tester.pumpAndSettle();

            expect(tourController.isVisible, isFalse);
            expect(
              scrollController.offset,
              closeTo(scrollController.position.minScrollExtent, .1),
            );'''

          updated, count = re.subn(
              r'    tourController\.start\(\);.*?closeTo\(scrollController\.position\.minScrollExtent, \.1\),\n    \);',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Il blocco del test non è stato sostituito una sola volta.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Remove temporary files
        run: |
          rm -f .github/workflows/fix-guided-tour-postframe-restore.yml
          rm -f .github/postframe-tour-trigger.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: dart format lib/widgets/tour/guided_tour.dart test/guided_tour_scroll_restoration_test.dart

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ripristina lo scroll dopo la chiusura del tour'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
