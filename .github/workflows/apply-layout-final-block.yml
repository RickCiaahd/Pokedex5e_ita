name: Apply layout review final block

on:
  push:
    branches:
      - polish/layout-final-battle-master
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: layout-review-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[layout-final-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: polish/layout-final-battle-master
          fetch-depth: 0

      - name: Apply final layout review
        run: python tool/apply_layout_final_block.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/battle/battle_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            lib/screens/tools/tools_screen.dart \
            test/layout_final_block_integration_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee layout-final-analyze.log

      - name: Upload analyze diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-final-analyze
          path: layout-final-analyze.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Stop on analyze failure
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run final layout integration test
        run: flutter test test/layout_final_block_integration_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit verified final layout review
        run: |
          rm -f tool/apply_layout_final_block.py .github/workflows/apply-layout-final-block.yml layout-final-analyze.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completa la review responsiva pre-release [layout-final-applied]"
          git push origin HEAD:polish/layout-final-battle-master
