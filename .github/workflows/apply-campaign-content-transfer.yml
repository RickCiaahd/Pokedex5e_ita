name: Apply campaign content transfers

on:
  push:
    branches:
      - feature/campaign-content-transfer
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: campaign-content-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/campaign-content-transfer
          fetch-depth: 0

      - name: Correct patch indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_campaign_content_transfer.py')
          text = path.read_text(encoding='utf-8')
          old = "                   onFight: () => _startFight([trainer]),\n                   onDuplicate: () => _duplicateTrainer(trainer),\n"
          new = "                  onFight: () => _startFight([trainer]),\n                  onDuplicate: () => _duplicateTrainer(trainer),\n"
          old_new = "                   onFight: () => _startFight([trainer]),\n                   onExport: () => _exportTrainer(trainer),\n                   onDuplicate: () => _duplicateTrainer(trainer),\n"
          new_new = "                  onFight: () => _startFight([trainer]),\n                  onExport: () => _exportTrainer(trainer),\n                  onDuplicate: () => _duplicateTrainer(trainer),\n"
          if text.count(old) != 1 or text.count(old_new) != 1:
              raise SystemExit('Trainer card patch strings not found exactly once')
          path.write_text(text.replace(old, new).replace(old_new, new_new), encoding='utf-8')
          PY

      - name: Apply UI integration
        run: |
          set +e
          python tool/apply_campaign_content_transfer.py > patch-output.log 2>&1
          code=$?
          echo "$code" > patch-exit-code.txt
          cat patch-output.log
          exit 0

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-transfer-patch-diagnostics
          path: |
            patch-output.log
            patch-exit-code.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on patch failure
        run: |
          code=$(cat patch-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Patch script failed with code $code"
            exit "$code"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/campaign_transfer_bundle.dart \
            lib/services/campaign_transfer_service.dart \
            lib/services/master_fight_summary_service.dart \
            lib/screens/tools/encounter_library_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            test/campaign_transfer_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run transfer tests
        run: flutter test test/campaign_transfer_service_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified campaign transfers
        run: |
          rm -f tool/apply_campaign_content_transfer.py .github/workflows/apply-campaign-content-transfer.yml tool/campaign_transfer_trigger.txt patch-output.log patch-exit-code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge trasferimenti di incontri e Allenatori PNG [campaign-transfer-applied]"
          git push origin HEAD:feature/campaign-content-transfer
