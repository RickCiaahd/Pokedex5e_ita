name: Apply localization foundation

on:
  push:
    branches:
      - feature/app-localization-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/app-localization-foundation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply localization foundation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path('.')

          # Branding and definitive Android identity.
          text_extensions = {
              '.dart', '.md', '.yml', '.yaml', '.xml', '.kts', '.kt', '.cpp',
              '.rc', '.txt', '.json', '.properties', '.html'
          }
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(
                  'io.github.rickciaahd.pokedex5eita',
                  'io.github.rickciaahd.traineratlas',
              ).replace(
                  'Pokédex 5e ITA',
                  'Trainer Atlas 5e',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          old_activity = root / 'android/app/src/main/kotlin/io/github/rickciaahd/pokedex5eita/MainActivity.kt'
          new_activity = root / 'android/app/src/main/kotlin/io/github/rickciaahd/traineratlas/MainActivity.kt'
          if old_activity.exists():
              new_activity.parent.mkdir(parents=True, exist_ok=True)
              activity_text = old_activity.read_text(encoding='utf-8').replace(
                  'package io.github.rickciaahd.pokedex5eita',
                  'package io.github.rickciaahd.traineratlas',
              )
              new_activity.write_text(activity_text, encoding='utf-8')
              old_activity.unlink()
              for directory in [old_activity.parent, old_activity.parent.parent]:
                  try:
                      directory.rmdir()
                  except OSError:
                      pass

          # Flutter localization dependencies and generated sources.
          pubspec = root / 'pubspec.yaml'
          pubspec_text = pubspec.read_text(encoding='utf-8')
          dependency_anchor = "  flutter:\n    sdk: flutter\n"
          dependency_block = (
              dependency_anchor
              + "\n  flutter_localizations:\n    sdk: flutter\n"
              + "  intl: any\n"
          )
          if 'flutter_localizations:' not in pubspec_text:
              if dependency_anchor not in pubspec_text:
                  raise SystemExit('Impossibile trovare il blocco flutter in pubspec.yaml')
              pubspec_text = pubspec_text.replace(
                  dependency_anchor,
                  dependency_block,
                  1,
              )
          if '  generate: true\n' not in pubspec_text:
              pubspec_text = pubspec_text.replace(
                  'flutter:\n\n  uses-material-design: true',
                  'flutter:\n  generate: true\n\n  uses-material-design: true',
                  1,
              )
          pubspec.write_text(pubspec_text, encoding='utf-8')

          (root / 'l10n.yaml').write_text(
              """arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
""",
