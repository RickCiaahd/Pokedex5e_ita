'''
              head, tail = test_text.rsplit('\n}', 1)
              test_file.write_text(head + addition + '\n}\n' + tail, encoding='utf-8')

          Path('test/pokemon_gender_appearance_test.dart').write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:pokedex_5e_ita/models/pokemon.dart';
import 'package:pokedex_5e_ita/models/pokemon_attributes.dart';
import 'package:pokedex_5e_ita/models/pokemon_gender_appearance.dart';
import 'package:pokedex_5e_ita/models/pokemon_moves.dart';

Pokemon pokemon(int id, String name) {
  return Pokemon(
    id: id,
    name: name,
    types: const [],
    armorClass: 0,
    hitPoints: 0,
    size: 'Unknown',
    speed: 0,
    attributes: const PokemonAttributes(
      strength: 0,
      dexterity: 0,
      constitution: 0,
      intelligence: 0,
      wisdom: 0,
      charisma: 0,
    ),
    abilities: const [],
    hiddenAbility: null,
    skills: const [],
    savingThrows: const [],
    moves: const PokemonMoves(startingMoves: [], levelMoves: {}, tmMoves: []),
    hitDice: 0,
    sr: 0,
    minLevelFound: 0,
  );
}

void main() {
  test('catalog contains all 102 visually dimorphic species', () {
    expect(PokemonGenderAppearance.visuallyDimorphicIds, hasLength(102));
  });

  test('well-known visual differences are recognized', () {
    for (final entry in const {
      25: 'Pikachu',
      202: 'Wobbuffet',
      449: 'Hippopotas',
      450: 'Hippowdon',
      668: 'Pyroar',
      678: 'Meowstic',
      876: 'Indeedee',
    }.entries) {
      expect(
        PokemonGenderAppearance.hasVisibleDifference(
          pokemon(entry.key, entry.value),
        ),
        isTrue,
        reason: entry.value,
      );
    }
  });

  test('localized gender aliases produce the expected labels', () {
    expect(PokemonGenderAppearance.isMale('Maschio'), isTrue);
    expect(PokemonGenderAppearance.isFemale('Femmina'), isTrue);
    expect(PokemonGenderAppearance.label('female'), 'Aspetto femmina');
  });
}
""", encoding='utf-8')

          Path('docs/gender-dimorphism-assets.md').write_text("""# Texture maschio e femmina

Il risolutore supporta le differenze estetiche tra maschio e femmina senza
trasformarle in forme separate del Pokédex. Il sesso continua a essere salvato
nel singolo Pokémon della squadra o del PC.

## File da caricare

Non servono nuove cartelle né modifiche al `pubspec.yaml`: aggiungi i file nella
cartella della specie già esistente, per esempio `pokemon/pikachu/`.

| Aspetto | Artwork grande | Sprite | Artwork shiny | Sprite shiny |
|---|---|---|---|---|
| Maschio | `main-m.png` | `sprite-m.png` | `main-shiny-m.png` | `sprite-shiny-m.png` |
| Femmina | `main-f.png` | `sprite-f.png` | `main-shiny-f.png` | `sprite-shiny-f.png` |

Sono accettati anche i nomi estesi `male` e `female`, le varianti con underscore
e le cartelle già esistenti del tipo `indeedee-m/`, `indeedee-f/`,
`meowstic-m/`, `meowstic-f/`, `pyroar-m/` e `pyroar-f/`.

Quando manca una texture shiny del sesso selezionato, l'app preferisce la
texture normale dello stesso sesso rispetto a una silhouette shiny errata.

## Specie predisposte nell'anteprima dell'editor

### Generazione I
Venusaur, Butterfree, Rattata, Raticate, Pikachu, Raichu, Zubat, Golbat,
Gloom, Vileplume, Kadabra, Alakazam, Doduo, Dodrio, Hypno, Rhyhorn, Rhydon,
Goldeen, Seaking, Scyther, Magikarp, Gyarados, Eevee.

### Generazione II
Meganium, Ledyba, Ledian, Xatu, Sudowoodo, Politoed, Aipom, Wooper,
Quagsire, Murkrow, Wobbuffet, Girafarig, Gligar, Steelix, Scizor, Heracross,
Sneasel, Ursaring, Piloswine, Octillery, Houndoom, Donphan.

La differenza si applica anche alla forma di Hisui di Sneasel: in quel caso i
file possono essere inseriti nella cartella della forma regionale.

### Generazione III
Torchic, Combusken, Blaziken, Beautifly, Dustox, Ludicolo, Nuzleaf, Shiftry,
Meditite, Medicham, Roselia, Gulpin, Swalot, Numel, Camerupt, Cacturne,
Milotic, Relicanth.

### Generazione IV
Starly, Staravia, Staraptor, Bidoof, Bibarel, Kricketot, Kricketune, Shinx,
Luxio, Luxray, Roserade, Combee, Pachirisu, Buizel, Floatzel, Ambipom, Gible,
Gabite, Garchomp, Hippopotas, Hippowdon, Croagunk, Toxicroak, Finneon,
Lumineon, Snover, Abomasnow, Weavile, Rhyperior, Tangrowth, Mamoswine.

### Generazione V
Unfezant, Frillish, Jellicent.

### Generazione VI
Pyroar, Meowstic.

### Generazione VIII
Indeedee, Basculegion.

### Generazione IX
Oinkologne.
""", encoding='utf-8')
          PY

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/models/pokemon_gender_appearance.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            lib/screens/pokemon/pokemon_edit_screen.dart \
            test/pokemon_asset_paths_test.dart \
            test/pokemon_gender_appearance_test.dart
          flutter pub get
          flutter analyze
          flutter test test/pokemon_asset_paths_test.dart --reporter expanded
          flutter test test/pokemon_gender_appearance_test.dart --reporter expanded
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-gender-dimorphism-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Predispone le texture maschio e femmina per tutte le specie'
          git push origin HEAD:main
