name: One-time Pokédex filter panel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-pokedex-filter-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace Pokédex screen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = ''''''
          target = Path('lib/screens/pokedex/pokedex_screen.dart')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and analyze
        run: |
          dart format lib/screens/pokedex/pokedex_screen.dart
          flutter pub get
          flutter analyze

      - name: Commit final change
        shell: bash
        run: |
          rm .github/workflows/one-time-pokedex-filter-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/pokedex/pokedex_screen.dart .github/workflows/one-time-pokedex-filter-panel.yml
          git commit -m "Compatta i filtri del Pokédex"
          git push origin main
