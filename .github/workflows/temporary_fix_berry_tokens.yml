name: Temporary fix berry tokens

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/item-berries
      - run: python tool/temporary_fix_berry_tokens.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tool/temporary_fix_berry_tokens.py .github/workflows/temporary_fix_berry_tokens.yml .github/workflows/temporary_item_berry_test.yml
          git add assets/data/item_localization_it_berry_088_115.json
          git commit -m "Conserva i token meccanici nelle descrizioni delle bacche"
          git push origin HEAD:translation/item-berries
