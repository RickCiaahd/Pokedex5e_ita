name: Apply campaign content transfers

on:
  push:
    branches:
      - feature/campaign-content-transfer
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: campaign-content-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/campaign-content-transfer
          fetch-depth: 0

      - name: Align patch sources
        run: |
          python - <<'PY'
          from pathlib import Path

          trainer_path = Path('lib/screens/tools/npc_trainer_library_screen.dart')
          trainer_text = trainer_path.read_text(encoding='utf-8')
          trainer_old = "                  onFight: () => _startFight([trainer]),\n                  onDuplicate: () => _duplicateTrainer(trainer),\n"
          trainer_new = "                   onFight: () => _startFight([trainer]),\n                   onDuplicate: () => _duplicateTrainer(trainer),\n"
          if trainer_text.count(trainer_old) != 1:
              raise SystemExit(
                  f'Trainer source occurrence count: {trainer_text.count(trainer_old)}'
              )
          trainer_path.write_text(
              trainer_text.replace(trainer_old, trainer_new),
              encoding='utf-8',
          )

          readme_path = Path('README.md')
          readme_text = readme_path.read_text(encoding='utf-8')
          readme_old = '- backup completi del profilo e trasferimenti mirati di Pokémon e squadre.\n'
          readme_new = '- backup e ripristino dei dati del profilo.\n'
          if readme_text.count(readme_old) != 1:
              raise SystemExit(
                  f'README source occurrence count: {readme_text.count(readme_old)}'
              )
          readme_path.write_text(
              readme_text.replace(readme_old, readme_new),
              encoding='utf-8',
          )
          PY

      - name: Apply UI integration
        run: |
          set +e
          python tool/apply_campaign_content_transfer.py > patch-output.log 2>&1
          code=$?
          echo "$code" > patch-exit-code.txt
          cat patch-output.log
          exit 0

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-transfer-patch-diagnostics
          path: |
            patch-output.log
            patch-exit-code.txt
          if-no-files-found: error
          retention-days: 2

      - name: Stop on patch failure
        run: |
          code=$(cat patch-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Patch script failed with code $code"
            exit "$code"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/campaign_transfer_bundle.dart \
            lib/services/campaign_transfer_service.dart \
            lib/services/master_fight_summary_service.dart \
            lib/screens/tools/encounter_library_screen.dart \
            lib/screens/tools/npc_trainer_library_screen.dart \
            lib/screens/battle/npc_battle_screen.dart \
            test/campaign_transfer_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run transfer tests
        run: flutter test test/campaign_transfer_service_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Commit verified campaign transfers
        run: |
          rm -f tool/apply_campaign_content_transfer.py .github/workflows/apply-campaign-content-transfer.yml tool/campaign_transfer_trigger.txt patch-output.log patch-exit-code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge trasferimenti di incontri e Allenatori PNG [campaign-transfer-applied]"
          git push origin HEAD:feature/campaign-content-transfer
