name: Scheduled form-aware evolution migration

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: automation
          sparse-checkout: |
            tool/apply_form_aware_evolutions.py
          sparse-checkout-cone-mode: false

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/form-aware-evolutions
          fetch-depth: 0

      - name: Apply migration
        run: python3 automation/tool/apply_form_aware_evolutions.py

      - name: Remove branch-local workflow
        run: rm -f .github/workflows/apply-form-aware-evolutions.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/services/evolution_service.dart \
            lib/screens/pokemon/evolution_selector_sheet.dart \
            lib/screens/pokemon/pokemon_detail_screen.dart \
            lib/widgets/pokemon/pokemon_asset_image.dart \
            test/evolution_form_resolution_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          flutter test \
            test/evolution_form_resolution_test.dart \
            test/pokemon_form_mechanics_test.dart \
            test/pokemon_asset_paths_test.dart

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add form-aware Pokemon evolutions"
          git push origin feat/form-aware-evolutions
