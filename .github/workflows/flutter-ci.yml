name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply requested trainer ability layout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/1.4.0-beta1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/trainer/trainer_sheet_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import '../../widgets/layout/responsive_content.dart';\n"
          if text.count(import_line) != 1:
              raise SystemExit('Expected responsive_content import exactly once.')
          text = text.replace(import_line, '', 1)

          skills_end = "      ...skillProficiencies,\n    ];\n"
          if text.count(skills_end) != 1:
              raise SystemExit('Could not identify the selectedSkills block ending.')
          text = text.replace(
              skills_end,
              skills_end
              + "    final abilityEntries = "
              + "UserProfile.defaultAbilityScores.entries.toList();\n",
              1,
          )

          section_start = text.index(
              "          title: context.uiText('CARATTERISTICHE', 'ABILITY SCORES'),"
          )
          grid_start = text.index('        Wrap(\n', section_start)
          grid_end = text.index('        const SizedBox(height: 16),\n', grid_start)
          old_grid = text[grid_start:grid_end]
          if 'UserProfile.defaultAbilityScores.entries' not in old_grid:
              raise SystemExit('The located Wrap is not the ability score layout.')

          new_grid = """        Column(
            children: [
              for (var row = 0; row < 2; row++) ...[
                Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    for (var column = 0; column < 3; column++) ...[
                      if (column > 0) const SizedBox(width: 8),
                      Expanded(
                        child: _AbilityScoreTile(
                          label: TrainerUiLocalization.abilityAbbreviation(
                            abilityEntries[(row * 3) + column].key,
                          ),
                          score:
                              abilityScores[
                                abilityEntries[(row * 3) + column].key
                              ] ??
                              abilityEntries[(row * 3) + column].value,
                          onDecrease: () => onAbilityScoreChanged(
                            abilityEntries[(row * 3) + column].key,
                            -1,
                          ),
                          onIncrease: () => onAbilityScoreChanged(
                            abilityEntries[(row * 3) + column].key,
                            1,
                          ),
                        ),
                      ),
                    ],
                  ],
                ),
                if (row == 0) const SizedBox(height: 8),
              ],
            ],
          ),
"""
          text = text[:grid_start] + new_grid + text[grid_end:]

          tile_start = text.index('class _AbilityScoreTile extends StatelessWidget')
          tile_end = text.index(
              'class _ManualBulletCard extends StatelessWidget',
              tile_start,
          )
          tile = text[tile_start:tile_end]

          width_start = tile.index('      child: SizedBox(\n')
          padding_start = tile.index('        child: Padding(\n', width_start)
          tile = (
              tile[:width_start]
              + '      child: SizedBox(\n        width: double.infinity,\n'
              + tile[padding_start:]
          )

          old_padding = (
              '          padding: const EdgeInsets.symmetric('
              'horizontal: 4, vertical: 8),\n'
          )
          if tile.count(old_padding) != 1:
              raise SystemExit('Could not identify ability tile padding.')
          tile = tile.replace(
              old_padding,
              '          padding: const EdgeInsets.symmetric('
              'horizontal: 2, vertical: 8),\n',
              1,
          )

          density_line = (
              '                  visualDensity: '
              'Theme.of(context).visualDensity,\n'
          )
          if tile.count(density_line) != 2:
              raise SystemExit('Expected two ability score IconButtons.')
          compact_button = """                  padding: EdgeInsets.zero,
                  constraints: const BoxConstraints.tightFor(
                    width: 36,
                    height: 40,
                  ),
                  visualDensity: VisualDensity.compact,
"""
          tile = tile.replace(density_line, compact_button)
          text = text[:tile_start] + tile + text[tile_end:]

          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/screens/trainer/trainer_sheet_screen.dart
          flutter pub get
          flutter analyze lib/screens/trainer/trainer_sheet_screen.dart

          rm -f .github/workflows/apply-trainer-ability-grid.yml
          rm -f .github/workflows/apply-trainer-ability-grid-v2.yml
          rm -f .github/.ability-grid-trigger
          git fetch origin main
          git show origin/main:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/trainer/trainer_sheet_screen.dart .github/
          git commit -m 'Disponi le caratteristiche su due righe e tre colonne'
          git push origin HEAD:release/1.4.0-beta1

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify compliance reports
        run: python tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: |
          set -o pipefail
          flutter test test/data_integrity_test.dart --reporter expanded 2>&1 | tee data-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-log
          path: data-validation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Measure runtime catalog baseline
        run: |
          set -o pipefail
          flutter test tool/performance/catalog_runtime_benchmark.dart --reporter expanded 2>&1 | tee catalog-performance.log

      - name: Upload runtime catalog baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-performance-log
          path: catalog-performance.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5eITA-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
