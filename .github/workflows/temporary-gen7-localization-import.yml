name: Temporary Gen7 localization import

on:
  push:
    branches:
      - translation/pokemon-gen7

permissions:
  contents: write

jobs:
  import-localization:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/pokemon-gen7
          fetch-depth: 0

      - name: Write localization catalogs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          files = {
              'assets/data/pokemon_localization_it_gen7_722_765.json': '',
              'assets/data/pokemon_localization_it_gen7_766_809.json': '',
              'docs/translation/pokemon-categories-it-722-765.json': '',
              'docs/translation/pokemon-categories-it-766-809.json': '',
          }
          for path, payload in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Commit localization catalogs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/pokemon_localization_it_gen7_*.json
          git add docs/translation/pokemon-categories-it-7*.json
          git commit -m "Aggiunge la localizzazione Pokémon di settima generazione"
          git push origin HEAD:translation/pokemon-gen7
