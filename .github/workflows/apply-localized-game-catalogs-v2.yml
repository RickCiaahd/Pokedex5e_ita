name: Apply localized game catalogs v2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tooling/apply_localized_game_catalogs_v2.py'
      - '.github/workflows/apply-localized-game-catalogs-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/localized-game-catalogs'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4
        with:
          ref: feature/localized-game-catalogs
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply catalog localization changes
        shell: bash
        run: |
          set +e
          python3 tooling/apply_localized_game_catalogs_v2.py 2>&1 | tee /tmp/catalog-patch.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/catalog-patch.log diagnostics/localized-catalog-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/localized-catalog-patch-error.txt
            git commit -m "Aggiorna l'errore dei cataloghi bilingui" || true
            git push origin HEAD:feature/localized-game-catalogs
            exit "$status"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/app.dart \
            lib/localization/game_catalog_locale.dart \
            lib/models/move_data.dart \
            lib/repositories/move_repository.dart \
            lib/repositories/ability_repository.dart \
            lib/repositories/item_repository.dart \
            lib/repositories/pokemon_repository.dart \
            test/game_catalog_locale_test.dart \
            test/localized_game_catalogs_test.dart

      - name: Validate localized catalogs
        shell: bash
        run: |
          set +e
          log=/tmp/catalog-validation.log
          : > "$log"

          run_check() {
            echo "" | tee -a "$log"
            echo "> $*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            return ${PIPESTATUS[0]}
          }

          status=0
          run_check flutter analyze || status=$?
          if [ "$status" -eq 0 ]; then
            run_check flutter test test/game_catalog_locale_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check flutter test test/localized_game_catalogs_test.dart || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check flutter test --reporter expanded || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_check flutter build apk --debug || status=$?
          fi

          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp "$log" diagnostics/localized-catalog-validation-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/localized-catalog-validation-error.txt
            git commit -m "Registra l'errore dei test dei cataloghi bilingui" || true
            git push origin HEAD:feature/localized-game-catalogs
            exit "$status"
          fi

      - name: Publish localized catalogs
        shell: bash
        run: |
          rm -f diagnostics/localized-catalog-patch-error.txt
          rm -f diagnostics/localized-catalog-validation-error.txt
          rm -f tooling/apply_localized_game_catalogs.py
          rm -f tooling/apply_localized_game_catalogs_v2.py
          rm -f .github/workflows/apply-localized-game-catalogs.yml
          rm -f .github/workflows/apply-localized-game-catalogs-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rende i cataloghi di gioco sensibili alla lingua"
          git push origin HEAD:feature/localized-game-catalogs
