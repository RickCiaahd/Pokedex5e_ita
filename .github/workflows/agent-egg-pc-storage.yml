name: Apply egg PC storage and layout

on:
  push:
    branches:
      - agent/egg-pc-storage-and-layout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/egg-pc-storage-and-layout' || github.ref_name == 'agent/egg-pc-storage-and-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/egg-pc-storage-and-layout

      - name: Normalize repeated daycare replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/apply_egg_pc_storage.py')
          text = path.read_text(encoding='utf-8')
          old = '''text = replace_once(
              text,
              \'''      egg.copyWith(isInDayCare: true, carriedEntireIncubation: false),\''',
              \'''      egg.copyWith(
                isInDayCare: true,
                isInPc: false,
                carriedEntireIncubation: false,
              ),\''',
              'move egg to daycare flags',
          )'''
          new = '''old_daycare_copy = \'''      egg.copyWith(isInDayCare: true, carriedEntireIncubation: false),\'''
          new_daycare_copy = \'''      egg.copyWith(
                isInDayCare: true,
                isInPc: false,
                carriedEntireIncubation: false,
              ),\'''
          if text.count(old_daycare_copy) != 2:
              raise RuntimeError(
                  f'move egg to daycare flags: attesi 2 match, trovati {text.count(old_daycare_copy)}'
              )
          text = text.replace(old_daycare_copy, new_daycare_copy)'''
          if old not in text:
              raise RuntimeError('Blocco ripetuto della Pensione non trovato')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply changes
        run: python .github/agent/apply_egg_pc_storage.py

      - name: Commit generated changes
        run: |
          rm .github/agent/apply_egg_pc_storage.py
          rm .github/workflows/agent-egg-pc-storage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge deposito uova nel PC e corregge il layout"
          git push origin HEAD:agent/egg-pc-storage-and-layout
