name: Validate shiny detail artwork

on:
  push:
    branches:
      - fix/shiny-detail-artwork
    paths:
      - '.github/workflows/validate-shiny-detail.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/shiny-detail-artwork

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/screens/pokemon/pokemon_detail_screen.dart \
            test/pokemon_asset_paths_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run asset resolver tests
        run: flutter test test/pokemon_asset_paths_test.dart

      - name: Remove temporary workflow
        run: rm .github/workflows/validate-shiny-detail.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate shiny detail artwork refresh"
          git push origin fix/shiny-detail-artwork
