name: Build system locale fix APK once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - '.github/workflows/temp-build-system-locale-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify locale fix source
        shell: bash
        run: |
          APP_SHA="ece221d560102d465a6c1908e9a4bcdf1c5f8b74"
          git cat-file -e "$APP_SHA^{commit}"
          if ! git diff --quiet "$APP_SHA"..HEAD -- . ':(exclude).github/workflows/temp-build-system-locale-apk.yml'; then
            echo "Application files changed after expected locale fix commit $APP_SHA" >&2
            git diff --stat "$APP_SHA"..HEAD -- . ':(exclude).github/workflows/temp-build-system-locale-apk.yml'
            exit 1
          fi

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format locale fix and commit formatting
        id: source
        shell: bash
        run: |
          dart format lib/app.dart lib/localization/app_locale_controller.dart test/app_locale_controller_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app.dart lib/localization/app_locale_controller.dart test/app_locale_controller_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Formatta il fix della lingua del dispositivo'
            git push origin HEAD:feature/compact-pokemon-detail-v2
          fi
          APP_SHA="$(git rev-parse HEAD)"
          echo "sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${APP_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Analyze locale fix
        run: flutter analyze --no-fatal-infos lib/app.dart lib/localization/app_locale_controller.dart test/app_locale_controller_test.dart

      - name: Run locale regression tests
        run: |
          flutter test test/app_locale_controller_test.dart --reporter expanded
          flutter test test/english_ui_localization_test.dart --reporter expanded

      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "Trainer-Atlas-5e-system-locale-test-${{ steps.source.outputs.short }}.apk"
          ls -lh "Trainer-Atlas-5e-system-locale-test-${{ steps.source.outputs.short }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Atlas-5e-system-locale-test-apk-${{ steps.source.outputs.short }}
          path: Trainer-Atlas-5e-system-locale-test-${{ steps.source.outputs.short }}.apk
          if-no-files-found: error
          retention-days: 14
