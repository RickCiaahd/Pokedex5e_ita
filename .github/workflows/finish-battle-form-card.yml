name: Finish battle form card

on:
  push:
    paths:
      - '.github/workflows/finish-battle-form-card.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused patch
        id: patch
        shell: bash
        run: |
          set +e
          python .github/scripts/finish_battle_forms_2.py > finish-battle-form-card.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.patch.outputs.status }}'
          rm -f .github/workflows/finish-battle-form-card.yml
          rm -f docs/diagnostics/finish-battle-forms.txt
          rmdir docs/diagnostics 2>/dev/null || true
          if [ "$status" = '0' ]; then
            rm -f \
              .github/scripts/fix_battle_forms.py \
              .github/scripts/resume_battle_forms.py \
              .github/scripts/finish_battle_forms.py \
              .github/scripts/finish_battle_forms_2.py \
              finish-battle-form-card.txt
          else
            mkdir -p docs/diagnostics
            mv finish-battle-form-card.txt docs/diagnostics/finish-battle-form-card.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Completa scheda battaglia e PF temporanei (stato $status)"
          git push origin HEAD:main
