name: Move test diagnostic

on:
  push:
    branches:
      - translation/moves-audit

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Raccoglie la seconda diagnostica dei test delle mosse'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/moves-audit
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests and save diagnostic
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/move-tests.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo
            tail -n 800 /tmp/move-tests.log
          } > docs/translation/move-test-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/translation/move-test-diagnostic.txt
          git commit -m "Aggiorna la diagnostica temporanea dei test delle mosse"
          git push origin HEAD:translation/moves-audit
