name: Integrate Trainer Atlas branding

on:
  push:
    branches:
      - agent/trainer-atlas-branding

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/trainer-atlas-branding
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Integrate onboarding logo and launcher icon
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('.')
          onboarding_path = root / 'lib/screens/onboarding/first_launch_onboarding_screen.dart'
          logo_path = root / 'assets/textures/trainers/trainer_atlas_logo.png'
          icon_source_path = root / 'docs/branding/trainer_atlas_app_icon_source.png'
          test_path = root / 'test/widget_test.dart'

          for required in (onboarding_path, logo_path, icon_source_path, test_path):
              if not required.exists():
                  raise SystemExit(f'Missing required file: {required}')

          # Crop the generated transparent logo to its real visible bounds so Flutter
          # does not reserve the large transparent canvas around the artwork.
          logo = Image.open(logo_path).convert('RGBA')
          original_logo = logo.copy()
          alpha = logo.getchannel('A')
          visible_mask = alpha.point(lambda value: 255 if value >= 5 else 0)
          bbox = visible_mask.getbbox()
          if bbox is None:
              raise SystemExit('trainer_atlas_logo.png has no visible pixels')

          padding = 32
          left = max(0, bbox[0] - padding)
          top = max(0, bbox[1] - padding)
          right = min(logo.width, bbox[2] + padding)
          bottom = min(logo.height, bbox[3] + padding)
          logo = logo.crop((left, top, right, bottom))
          clean_alpha = logo.getchannel('A').point(
              lambda value: 0 if value < 5 else value
          )
          logo.putalpha(clean_alpha)
          logo.save(logo_path, optimize=True)

          # Derive the adaptive Android foreground from the emblem portion of the
          # transparent logo, keeping the wordmark out of the launcher icon.
          original_mask = original_logo.getchannel('A').point(
              lambda value: 255 if value >= 5 else 0
          )
          original_bbox = original_mask.getbbox()
          cropped_visible = original_logo.crop(original_bbox)
          cropped_mask = original_mask.crop(original_bbox)
          row_has_pixels = [
              cropped_mask.crop((0, y, cropped_mask.width, y + 1)).getbbox()
              is not None
              for y in range(cropped_mask.height)
          ]
          gaps = []
          gap_start = None
          for y, has_pixels in enumerate(row_has_pixels):
              if not has_pixels and gap_start is None:
                  gap_start = y
              elif has_pixels and gap_start is not None:
                  gaps.append((gap_start, y))
                  gap_start = None
          if gap_start is not None:
              gaps.append((gap_start, cropped_mask.height))

          internal_gaps = [
              gap for gap in gaps
              if gap[0] > cropped_mask.height * 0.35
              and gap[1] < cropped_mask.height * 0.85
          ]
          split_y = max(internal_gaps, key=lambda gap: gap[1] - gap[0])[0] \
              if internal_gaps else int(cropped_visible.height * 0.66)
          emblem = cropped_visible.crop((0, 0, cropped_visible.width, split_y))
          emblem_alpha = emblem.getchannel('A').point(
              lambda value: 255 if value >= 5 else 0
          )
          emblem_bbox = emblem_alpha.getbbox()
          emblem = emblem.crop(emblem_bbox)

          foreground_size = 432
          max_emblem_size = 300
          scale = min(
              max_emblem_size / emblem.width,
              max_emblem_size / emblem.height,
          )
          emblem = emblem.resize(
              (max(1, round(emblem.width * scale)),
               max(1, round(emblem.height * scale))),
              Image.Resampling.LANCZOS,
          )
          foreground = Image.new(
              'RGBA', (foreground_size, foreground_size), (0, 0, 0, 0)
          )
          foreground.alpha_composite(
              emblem,
              ((foreground_size - emblem.width) // 2,
               (foreground_size - emblem.height) // 2),
          )
          foreground_path = (
              root / 'android/app/src/main/res/drawable-xxxhdpi/'
              'trainer_atlas_launcher_foreground.png'
          )
          foreground_path.parent.mkdir(parents=True, exist_ok=True)
          foreground.save(foreground_path, optimize=True)

          # Generate legacy launcher icons from the uploaded square source. The
          # rounded mask removes the black corner canvas from the generated image.
          legacy_source = Image.open(icon_source_path).convert('RGBA')
          rounded_mask = Image.new('L', legacy_source.size, 0)
          mask_draw = ImageDraw.Draw(rounded_mask)
          radius = round(min(legacy_source.size) * 0.16)
          mask_draw.rounded_rectangle(
              (0, 0, legacy_source.width - 1, legacy_source.height - 1),
              radius=radius,
              fill=255,
          )
          legacy_source.putalpha(rounded_mask)

          launcher_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in launcher_sizes.items():
              output = root / 'android/app/src/main/res' / folder / 'ic_launcher.png'
              output.parent.mkdir(parents=True, exist_ok=True)
              resized = legacy_source.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(output, optimize=True)

          foreground_xml = root / 'android/app/src/main/res/drawable/ic_launcher_foreground.xml'
          foreground_xml.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>\n'''
              '''<bitmap xmlns:android="http://schemas.android.com/apk/res/android"\n'''
              '''    android:src="@drawable/trainer_atlas_launcher_foreground"\n'''
              '''    android:gravity="fill"\n'''
              '''    android:filter="true" />\n''',
              encoding='utf-8',
          )

          colors_path = root / 'android/app/src/main/res/values/colors.xml'
          colors = colors_path.read_text(encoding='utf-8')
          colors = colors.replace(
              '<color name="launcher_background">#B71C1C</color>',
              '<color name="launcher_background">#F2B34A</color>',
          )
          colors_path.write_text(colors, encoding='utf-8')

          source = onboarding_path.read_text(encoding='utf-8')
          assets_old = """  static const welcomeBackground =\n      'assets/textures/trainers/onboarding_welcome_background.webp';\n  static const laboratoryBackground =\n"""
          assets_new = """  static const welcomeBackground =\n      'assets/textures/trainers/onboarding_welcome_background.webp';\n  static const trainerAtlasLogo =\n      'assets/textures/trainers/trainer_atlas_logo.png';\n  static const laboratoryBackground =\n"""
          if assets_old not in source:
              raise SystemExit('Could not locate onboarding asset constants')
          source = source.replace(assets_old, assets_new, 1)

          welcome_old = """                Container(\n                  width: 112,\n                  height: 112,\n                  decoration: BoxDecoration(\n                    color: Colors.white.withValues(alpha: .82),\n                    shape: BoxShape.circle,\n                    boxShadow: const [\n                      BoxShadow(\n                        color: Color(0x22000000),\n                        blurRadius: 24,\n                        offset: Offset(0, 10),\n                      ),\n                    ],\n                  ),\n                  child: const Icon(\n                    Icons.catching_pokemon,\n                    size: 72,\n                    color: _OnboardingPalette.rust,\n                  ),\n                ),\n                const SizedBox(height: 20),\n                Text(\n                  'TRAINER ATLAS',\n                  textAlign: TextAlign.center,\n                  style: TextStyle(\n                    color: _OnboardingPalette.text,\n                    fontSize: 34,\n                    fontWeight: FontWeight.w900,\n                    letterSpacing: 1.2,\n                    shadows: [Shadow(color: Color(0x44FFFFFF), blurRadius: 12)],\n                  ),\n                ),\n                const SizedBox(height: 8),\n"""
          welcome_new = """                Flexible(\n                  child: Semantics(\n                    image: true,\n                    label: 'Trainer Atlas 5e',\n                    child: Image.asset(\n                      _OnboardingAssets.trainerAtlasLogo,\n                      width: 360,\n                      fit: BoxFit.contain,\n                      filterQuality: FilterQuality.high,\n                      excludeFromSemantics: true,\n                    ),\n                  ),\n                ),\n                const SizedBox(height: 10),\n"""
          if welcome_old not in source:
              raise SystemExit('Could not locate legacy onboarding branding block')
          source = source.replace(welcome_old, welcome_new, 1)
          onboarding_path.write_text(source, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          marker = """  test('onboarding uses the compact layout when the keyboard is visible', () {\n"""
          branding_test = """  test('Trainer Atlas branding assets are wired into onboarding and Android', () {\n    final onboardingSource = File(\n      'lib/screens/onboarding/first_launch_onboarding_screen.dart',\n    ).readAsStringSync();\n    final adaptiveForeground = File(\n      'android/app/src/main/res/drawable/ic_launcher_foreground.xml',\n    ).readAsStringSync();\n\n    expect(\n      File('assets/textures/trainers/trainer_atlas_logo.png').existsSync(),\n      isTrue,\n    );\n    expect(\n      File('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')\n          .existsSync(),\n      isTrue,\n    );\n    expect(\n      onboardingSource,\n      contains('_OnboardingAssets.trainerAtlasLogo'),\n    );\n    expect(onboardingSource, contains("label: 'Trainer Atlas 5e'"));\n    expect(\n      adaptiveForeground,\n      contains('@drawable/trainer_atlas_launcher_foreground'),\n    );\n  });\n\n"""
          if marker not in tests:
              raise SystemExit('Could not locate widget-test insertion point')
          if 'Trainer Atlas branding assets are wired' not in tests:
              tests = tests.replace(marker, branding_test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/integrate-trainer-atlas-branding.yml

      - name: Commit generated branding integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integra il branding Trainer Atlas"
          git push origin HEAD:agent/trainer-atlas-branding
