name: Codex Apply Patch

on:
  push:
    branches:
      - fix/edit-screen-polish

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and clean bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am .codex/patches/0001-Fix-Pokemon-edit-status-and-loyalty.patch
          git rm .codex/patches/0001-Fix-Pokemon-edit-status-and-loyalty.patch .github/workflows/codex-apply-patch.yml
          git commit -m "Remove Codex patch bootstrap"
          git push
