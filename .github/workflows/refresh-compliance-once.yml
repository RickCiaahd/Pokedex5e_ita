name: Refresh compliance reports once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate compliance reports
        run: python tooling/generate_compliance_reports.py

      - name: Commit refreshed reports when needed
        shell: bash
        run: |
          if git diff --quiet -- docs/compliance; then
            echo "Compliance reports already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/compliance
          git commit -m "Refresh compliance reports for Floette assets"
          git push origin HEAD:feature/compact-pokemon-detail-v2
