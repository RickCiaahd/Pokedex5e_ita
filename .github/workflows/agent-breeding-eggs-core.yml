name: Apply breeding eggs core

on:
  push:
    branches:
      - agent/breeding-eggs-core
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/breeding-eggs-core' || github.ref_name == 'agent/breeding-eggs-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/breeding-eggs-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize source for breeding patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/services/profile_backup_service.dart')
          text = path.read_text(encoding='utf-8')
          pattern = (
              r'(?m)^[ \t]*_masterBattleSessionRepository =\n'
              r'[ \t]*masterBattleSessionRepository \?\? '
              r'MasterBattleSessionRepository\(\);'
          )
          replacement = (
              '        _masterBattleSessionRepository =\n'
              '            masterBattleSessionRepository ?? '
              'MasterBattleSessionRepository();'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise RuntimeError(
                  f'Initializer del backup non trovato o ambiguo: {count}'
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply breeding changes
        run: |
          set -o pipefail
          python .github/agent/apply_breeding_core.py 2>&1 | tee breeding-patch.log

      - name: Fix generated breeding service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/services/breeding_service.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'final firstMoves = {_moveKeys(first.selectedMoves)};',
              'final firstMoves = _moveKeys(first.selectedMoves);',
              1,
          )
          text = text.replace(
              'final secondMoves = {_moveKeys(second.selectedMoves)};',
              'final secondMoves = _moveKeys(second.selectedMoves);',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breeding-patch-log
          path: breeding-patch.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Format Dart files
        run: dart format lib test

      - name: Commit generated changes
        run: |
          rm .github/agent/apply_breeding_core.py
          rm .github/workflows/agent-breeding-eggs-core.yml
          rm -f breeding-patch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge allevamento, uova e incubazione"
          git push origin HEAD:agent/breeding-eggs-core
