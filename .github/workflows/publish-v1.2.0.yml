name: Publish v1.2.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.2.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release commit
        shell: bash
        run: |
          set -euo pipefail
          release_sha='52e8f710a4b2dfa8eda138ea1d0e73dc9808fe85'
          git cat-file -e "$release_sha^{commit}"
          version=$(git show "$release_sha:pubspec.yaml" | awk '/^version:/{print $2}')
          test "$version" = '1.2.0+5'
          if git rev-parse -q --verify refs/tags/v1.2.0 >/dev/null; then
            test "$(git rev-list -n 1 v1.2.0)" = "$release_sha"
          fi

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          release_sha='52e8f710a4b2dfa8eda138ea1d0e73dc9808fe85'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify refs/tags/v1.2.0 >/dev/null; then
            git tag -a v1.2.0 "$release_sha" -m 'Pokédex 5e ITA 1.2.0'
            git push origin v1.2.0
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v1.2.0.yml
          git commit -m 'Rimuove il workflow temporaneo della release 1.2.0'
          git push origin HEAD:main
