name: One-time fix full move catalog

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-full-move-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-move-catalog-impl
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply correction
        run: python3 .github/scripts/fix_full_move_catalog.py

      - name: Format and analyze changed source
        run: |
          dart format lib/screens/pokemon/pokemon_edit_screen.dart
          flutter pub get
          flutter analyze

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-fix-full-move-catalog.yml
          git rm .github/scripts/fix_full_move_catalog.py
          git add lib/screens/pokemon/pokemon_edit_screen.dart
          git commit -m 'Corregge il selettore del catalogo mosse'
          git push origin feature/full-move-catalog-impl

# trigger correction retry
