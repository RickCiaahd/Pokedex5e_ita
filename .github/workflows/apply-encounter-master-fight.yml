name: Apply encounter Master fight integration

on:
  push:
    branches:
      - agent/encounter-master-fight
    paths:
      - tool/apply_encounter_master_fight_patch.py
      - .github/workflows/apply-encounter-master-fight.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/encounter-master-fight
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tool/apply_encounter_master_fight_patch.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect encounters to Master fights"
          git push origin HEAD:agent/encounter-master-fight
