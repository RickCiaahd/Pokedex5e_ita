name: Move status-token migration

on:
  push:
    branches:
      - translation/moves-audit

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Allinea il controllo dello status FLINCHED'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: translation/moves-audit
          fetch-depth: 0

      - name: Recognize source flinch wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/move_localization_integrity_test.dart')
          text = path.read_text(encoding='utf-8')
          old = r'|SR|FLINCHED)\b'
          new = r'|SR|FLINCHED|flinch(?:es|ed)?)\b'
          if old not in text:
              raise SystemExit('Mechanical token expression not found')
          text = text.replace(old, new, 1)
          old_alias = """    'CD': 'DC',
          """
          new_alias = """    'CD': 'DC',
              'FLINCH': 'FLINCHED',
              'FLINCHES': 'FLINCHED',
          """
          if old_alias not in text:
              raise SystemExit('Alias block not found')
          text = text.replace(old_alias, new_alias, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/move_localization_integrity_test.dart
          git commit -m "Riconosce la formulazione sorgente dello status FLINCHED"
          git push origin HEAD:translation/moves-audit
