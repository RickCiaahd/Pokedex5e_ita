name: Regenerate Pokémon form dimensions

on:
  push:
    branches:
      - feat/form-pokedex-metadata
    paths:
      - '.github/workflows/regenerate-form-physical.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/form-pokedex-metadata

      - name: Regenerate metadata
        run: python3 tool/generate_pokemon_physical_metadata.py

      - name: Verify representative forms
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('assets/data_webapp/pokemon_physical.json').read_text(encoding='utf-8'))
          rattata = data['items']['alolan-rattata']
          minior = data['items']['minior-core-form']
          assert (rattata['height'], rattata['weight'], rattata['sourceIdentifier']) == (3, 38, 'rattata-alola'), rattata
          assert minior['sourceIdentifier'] == 'minior-red', minior
          assert data['fallbackCount'] == 0, data['fallbackIds']
          print('generated=', data['generatedCount'])
          print('unmapped=', data['unmappedIds'])
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/regenerate-form-physical.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test form metadata
        run: flutter test test/pokemon_form_mechanics_test.dart

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve physical metadata matching for special forms"
          git push origin feat/form-pokedex-metadata
