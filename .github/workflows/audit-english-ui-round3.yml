name: Audit English UI residuals round 3

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'tooling/audit_english_ui_residuals_round3.py'
      - '.github/workflows/audit-english-ui-round3.yml'

permissions:
  contents: write

concurrency:
  group: audit-english-ui-round3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.head_ref == 'fix/english-ui-residuals-round3'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/english-ui-residuals-round3
          fetch-depth: 0

      - name: Run targeted source audit
        run: python tooling/audit_english_ui_residuals_round3.py

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/english-ui-residuals-round3.json diagnostics/english-ui-residuals-round3.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
            exit 0
          fi
          git commit -m "Registra audit residui italiani UI inglese round 3"
          git push origin HEAD:fix/english-ui-residuals-round3
