name: Fix WebP history after Minior dedup

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - '.github/workflows/fix-webp-history-after-dedup.yml'

permissions:
  contents: write

jobs:
  fix-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Remove retired Minior aliases from WebP conversion history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('docs/performance/webp-lossless-conversions.csv')
          colors = ('red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet')
          retired = {
              f'assets/textures/textures_webapp/pokemon/minior-core/main-{color}-shiny.webp'
              for color in colors
          }
          retired.add('assets/textures/textures_webapp/pokemon/minior-core/main-red.webp')
          for color in colors:
              retired.add(f'assets/textures/textures_webapp/pokemon/minior-core-{color}/main.webp')
              retired.add(f'assets/textures/textures_webapp/pokemon/minior-core-{color}/main-shiny.webp')

          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
              fieldnames = list(rows[0].keys()) if rows else []

          removed = [row for row in rows if row['webp_path'] in retired]
          if len(removed) != 22:
              raise SystemExit(f'Expected 22 retired WebP history rows, found {len(removed)}')
          found = {row['webp_path'] for row in removed}
          if found != retired:
              missing = sorted(retired - found)
              unexpected = sorted(found - retired)
              raise SystemExit(f'History mismatch; missing={missing}, unexpected={unexpected}')

          for webp in sorted(retired):
              if Path(webp).exists():
                  raise SystemExit(f'Retired duplicate still exists: {webp}')

          kept = [row for row in rows if row['webp_path'] not in retired]
          with path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(kept)
          print(f'Removed {len(removed)} retired Minior conversion-history rows.')
          PY

      - name: Refresh WebP inventories against current assets
        run: |
          python tooling/manage_webp_lossless_batches.py --refresh
          python tooling/manage_webp_lossless_batches.py --check

      - name: Verify every Pokémon image is readable
        run: python tooling/repair_unreadable_pokemon_images.py --check-all

      - name: Check repository diff
        run: git diff --check

      - name: Commit corrected inventories and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-webp-history-after-dedup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Allinea gli inventari WebP alla deduplicazione di Minior'
          git push origin HEAD:feature/compact-pokemon-detail-v2
