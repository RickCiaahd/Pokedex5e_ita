name: Bundle all Pokémon artwork directories

on:
  push:
    branches:
      - fix/bundle-all-shiny-assets
    paths:
      - '.github/workflows/bundle-all-pokemon-assets.yml'

permissions:
  contents: write

jobs:
  bundle-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/bundle-all-shiny-assets

      - name: Add every Pokémon asset directory to pubspec
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          pokemon_root = Path('assets/textures/textures_webapp/pokemon')
          base_entry = '    - assets/textures/textures_webapp/pokemon/\n'
          transforms_entry = (
              '    - assets/textures/textures_webapp/pokemon_transforms/\n'
          )
          child_prefix = '    - assets/textures/textures_webapp/pokemon/'

          folders = sorted(
              path.name
              for path in pokemon_root.iterdir()
              if path.is_dir() and any(path.glob('*.png'))
          )
          if 'abomasnow' not in folders:
              raise SystemExit('La cartella shiny di Abomasnow non è stata trovata.')

          lines = pubspec.read_text(encoding='utf-8').splitlines(keepends=True)
          cleaned = [
              line
              for line in lines
              if line == base_entry or not line.startswith(child_prefix)
          ]

          try:
              insert_at = cleaned.index(base_entry) + 1
          except ValueError as error:
              raise SystemExit('Voce base degli asset Pokémon non trovata.') from error

          if insert_at < len(cleaned) and cleaned[insert_at] == transforms_entry:
              insert_at += 1

          entries = [
              f'    - assets/textures/textures_webapp/pokemon/{name}/\n'
              for name in folders
          ]
          cleaned[insert_at:insert_at] = entries
          pubspec.write_text(''.join(cleaned), encoding='utf-8')

          print(f'Aggiunte {len(entries)} cartelle Pokémon al bundle Flutter.')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format test
        run: dart format test/pokemon_asset_paths_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Verify shiny resolver and asset bundle
        run: flutter test test/pokemon_asset_paths_test.dart

      - name: Remove temporary workflow
        run: rm .github/workflows/bundle-all-pokemon-assets.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bundle all Pokémon shiny artwork"
          git push origin fix/bundle-all-shiny-assets
