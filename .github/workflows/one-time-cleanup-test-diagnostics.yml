name: One-time cleanup test diagnostics

on:
  push:
    branches:
      - chore/project-cleanup
    paths:
      - '.github/workflows/one-time-cleanup-test-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/project-cleanup

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests and capture result
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > cleanup-test-full.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo
            tail -n 220 cleanup-test-full.log
          } > cleanup-test-diagnostics.txt
          exit 0

      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-cleanup-test-diagnostics.yml
          git add cleanup-test-diagnostics.txt
          git commit -m 'Registra diagnostica temporanea dei test'
          git pull --rebase origin chore/project-cleanup
          git push origin chore/project-cleanup
