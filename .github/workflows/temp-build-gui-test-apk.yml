name: Build GUI test APK once

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - .github/workflows/temp-build-gui-test-apk.yml

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Build GUI test APK')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze revised GUI screens
        run: >-
          flutter analyze
          lib/screens/home/home_screen.dart
          lib/screens/pokedex/pokedex_screen.dart
          lib/screens/team/team_selection_screen.dart
          lib/screens/battle/battle_screen.dart

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Prepare artifact
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/Pokedex5e-gui-test-${SHORT_SHA}.apk"
          {
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Flutter: 3.44.4"
            echo "Build: debug APK"
          } > dist/BUILD-INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex5e-gui-test-apk
          path: dist/
          retention-days: 30
