name: Fix Minior and gender-only forms

on:
  push:
    paths:
      - '.github/workflows/fix-minior-and-gender-forms.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch assets and form handling
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Register the folders that actually exist after the texture upload.
          replace_once(
              'pubspec.yaml',
              """    - assets/textures/textures_webapp/pokemon/minior-core/
    - assets/textures/textures_webapp/pokemon/minior-meteor-form/
""",
              """    - assets/textures/textures_webapp/pokemon/minior/
    - assets/textures/textures_webapp/pokemon/minior-core-red/
    - assets/textures/textures_webapp/pokemon/minior-core-orange/
    - assets/textures/textures_webapp/pokemon/minior-core-yellow/
    - assets/textures/textures_webapp/pokemon/minior-core-green/
    - assets/textures/textures_webapp/pokemon/minior-core-blue/
    - assets/textures/textures_webapp/pokemon/minior-core-indigo/
    - assets/textures/textures_webapp/pokemon/minior-core-violet/
""",
          )

          # Do not turn main-f.png, sprite-m.png or their shiny equivalents into
          # fake Pokémon forms.
          replace_once(
              'lib/widgets/pokemon/pokemon_asset_image_legacy.dart',
              """  static String _formFromFileName(String fileName) {
    return fileName
        .replaceFirst(RegExp(r'\\.png$'), '')
        .replaceFirst(
          RegExp(r'^(main|sprite)[-_\\s]+', caseSensitive: false),
          '',
        )
        .replaceFirst(
          RegExp(r'[-_\\s]+(main|sprite)$', caseSensitive: false),
          '',
        )
        .replaceFirst(RegExp(r'[-_\\s]*shiny$', caseSensitive: false), '')
        .trim();
  }
""",
              """  static String _formFromFileName(String fileName) {
    final stem = fileName.replaceFirst(RegExp(r'\\.png$'), '').trim();
    final genderAssetPattern = RegExp(
      r'^(main|sprite)(?:[-_\\s]+(?:shiny|m|male|f|female))*$',
      caseSensitive: false,
    );
    if (genderAssetPattern.hasMatch(stem)) return '';

    return stem
        .replaceFirst(
          RegExp(r'^(main|sprite)[-_\\s]+', caseSensitive: false),
          '',
        )
        .replaceFirst(
          RegExp(r'[-_\\s]+(main|sprite)$', caseSensitive: false),
          '',
        )
        .replaceFirst(RegExp(r'[-_\\s]*shiny$', caseSensitive: false), '')
        .trim();
  }
""",
          )

          # Every coloured Minior core is mechanically the same Core Form.
          replace_once(
              'lib/models/pokemon.dart',
              """  Pokemon resolveVariant({String? formName, String? gender}) {
    final requestedForm = formReferenceKey(formName ?? '', name);
    final requestedGender = normalizeGenderValue(gender);

    PokemonFormDefinition? match;
""",
              """  Pokemon resolveVariant({String? formName, String? gender}) {
    var requestedForm = formReferenceKey(formName ?? '', name);
    final requestedGender = normalizeGenderValue(gender);

    if (name == 'Minior' &&
        (requestedForm == 'core' || requestedForm.startsWith('core-'))) {
      requestedForm = 'core';
    }

    PokemonFormDefinition? match;
""",
          )

          service = 'lib/services/battle_form_change_service.dart'
          replace_once(
              service,
              """      case 'Minior':
        if (raw == 'base' || raw == 'meteor') return 'meteor';
        return raw;
""",
              """      case 'Minior':
        if (raw == 'base' || raw == 'meteor' || raw == 'meteor-form') {
          return 'meteor';
        }
        if (raw == 'core' || raw == 'core-form') return 'core-red';
        if (raw.startsWith('core-')) return raw;
        return raw;
""",
          )
          replace_once(
              service,
              """      case 'Minior':
        order = const ['meteor', 'core'];
        break;
""",
              """      case 'Minior':
        order = const [
          'meteor',
          'core-red',
          'core-orange',
          'core-yellow',
          'core-green',
          'core-blue',
          'core-indigo',
          'core-violet',
        ];
        break;
""",
          )
          replace_once(
              service,
              """      case 'Minior':
        return key == 'core' ? 'Forma Nucleo' : 'Forma Meteora';
""",
              """      case 'Minior':
        return switch (key) {
          'core-red' => 'Nucleo Rosso',
          'core-orange' => 'Nucleo Arancione',
          'core-yellow' => 'Nucleo Giallo',
          'core-green' => 'Nucleo Verde',
          'core-blue' => 'Nucleo Azzurro',
          'core-indigo' => 'Nucleo Indaco',
          'core-violet' => 'Nucleo Violetto',
          _ => 'Forma Meteora',
        };
""",
          )

          # When the generic artwork was renamed to -m, keep a sensible default
          # image in Pokédex lists where no sex has been selected yet.
          image_file = 'lib/widgets/pokemon/pokemon_asset_image.dart'
          replace_once(
              image_file,
              "import '../../models/pokemon.dart';\n",
              "import '../../models/pokemon.dart';\nimport '../../models/pokemon_gender_appearance.dart';\n",
          )
          replace_once(
              image_file,
              """    final genderCandidates = PokemonGenderAssetPaths.candidates(
      pokemon: effectivePokemon,
      useLargeArtwork: useLargeArtwork,
      formName: effectiveFormName,
      gender: gender,
      isShiny: isShiny ?? false,
    );
""",
              """    final assetGender = gender ??
        (PokemonGenderAppearance.hasVisibleDifference(effectivePokemon)
            ? 'male'
            : null);
    final genderCandidates = PokemonGenderAssetPaths.candidates(
      pokemon: effectivePokemon,
      useLargeArtwork: useLargeArtwork,
      formName: effectiveFormName,
      gender: assetGender,
      isShiny: isShiny ?? false,
    );
""",
          )

          # Regression tests for both reported problems.
          asset_test = Path('test/pokemon_asset_paths_test.dart')
          text = asset_test.read_text(encoding='utf-8')
          addition = r'''

  testWidgets('gender texture filenames do not create fake form choices', (
    tester,
  ) async {
    final choices = await PokemonAssetPaths.formChoices(
      _pokemon(25, 'Pikachu'),
    );

    expect(choices, isEmpty);
  });
'''
          if 'gender texture filenames do not create fake form choices' not in text:
              head, tail = text.rsplit('\n}', 1)
              asset_test.write_text(head + addition + '\n}\n' + tail, encoding='utf-8')

          battle_test = Path('test/battle_form_change_service_test.dart')
          text = battle_test.read_text(encoding='utf-8')
          addition = r'''

  test('Minior exposes seven aesthetic cores with shared core statistics', () async {
    final pokemon = await PokemonRepository().getAllPokemon();
    final minior = pokemon.firstWhere((entry) => entry.id == 774);

    expect(BattleFormChangeService.formLabel(minior, 'Base'), 'Forma Meteora');

    const forms = {
      'core-red': 'Nucleo Rosso',
      'core-orange': 'Nucleo Arancione',
      'core-yellow': 'Nucleo Giallo',
      'core-green': 'Nucleo Verde',
      'core-blue': 'Nucleo Azzurro',
      'core-indigo': 'Nucleo Indaco',
      'core-violet': 'Nucleo Violetto',
    };

    for (final entry in forms.entries) {
      expect(BattleFormChangeService.formLabel(minior, entry.key), entry.value);
      final core = minior.resolveVariant(formName: entry.key);
      expect(core.armorClass, 14, reason: entry.key);
      expect(core.attributes.dexterity, 18, reason: entry.key);
    }

    final meteor = minior.resolveVariant(formName: 'Base');
    expect(meteor.armorClass, 18);
    expect(meteor.attributes.dexterity, 12);
  });
'''
          if 'Minior exposes seven aesthetic cores' not in text:
              head, tail = text.rsplit('\n}', 1)
              battle_test.write_text(head + addition + '\n}\n' + tail, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/models/pokemon.dart \
            lib/services/battle_form_change_service.dart \
            lib/widgets/pokemon/pokemon_asset_image.dart \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            test/pokemon_asset_paths_test.dart \
            test/battle_form_change_service_test.dart
          flutter pub get
          flutter analyze
          flutter test test/pokemon_asset_paths_test.dart --reporter expanded
          flutter test test/battle_form_change_service_test.dart --reporter expanded
          flutter test test/pokemon_gender_asset_paths_test.dart --reporter expanded
          flutter test test/data_integrity_test.dart --reporter expanded

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-minior-and-gender-forms.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corregge Minior e nasconde le false forme di genere'
          git push origin HEAD:main
