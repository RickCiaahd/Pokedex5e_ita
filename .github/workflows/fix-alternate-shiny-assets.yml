name: Fix alternate form shiny artwork

on:
  push:
    branches:
      - fix/shiny-alternate-forms
    paths:
      - '.github/workflows/fix-alternate-shiny-assets.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/shiny-alternate-forms

      - name: Apply alternate shiny fix
        run: python3 tool/apply_alternate_shiny_fix.py

      - name: Remove temporary files
        run: |
          rm tool/apply_alternate_shiny_fix.py
          rm .github/workflows/fix-alternate-shiny-assets.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed files
        run: |
          dart format \
            lib/widgets/pokemon/pokemon_asset_image_legacy.dart \
            test/pokemon_asset_paths_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run shiny resolver tests
        run: flutter test test/pokemon_asset_paths_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix shiny artwork for alternate Pokémon forms"
          git push origin fix/shiny-alternate-forms
