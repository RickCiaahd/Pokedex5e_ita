name: Apply guided submenu tours

on:
  push:
    branches:
      - feature/guided-submenu-tours
    paths:
      - '.github/workflows/apply-guided-submenu-tours.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/guided-submenu-tours
          fetch-depth: 0

      - name: Apply submenu tour integration
        run: python3 tooling/apply_guided_submenu_tours.py

      - name: Format Dart sources
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run formatter
        run: dart format lib test

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aggiunge i tour guidati ai principali sottomenu'
          git push origin HEAD:feature/guided-submenu-tours
