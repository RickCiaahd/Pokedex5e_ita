name: Apply localized onboarding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out onboarding branch
        uses: actions/checkout@v4
        with:
          ref: feature/localized-onboarding
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair onboarding transformation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tooling/apply_localized_onboarding.py')
          text = path.read_text(encoding='utf-8')
          old = '''    "            FilledButton(onPressed: onRetry, child: const Text('RIPROVA')),
          ",
          '''
          new = '''    "            FilledButton(onPressed: onRetry, child: const Text('RIPROVA')),\\n",
          '''
          if old not in text:
              raise RuntimeError('Frammento sintattico da correggere non trovato')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply onboarding localization
        run: python tooling/apply_localized_onboarding.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format changed Dart files
        run: dart format lib/screens/onboarding/first_launch_onboarding_screen.dart lib/l10n test/onboarding_localization_test.dart

      - name: Analyze source
        run: flutter analyze

      - name: Run onboarding localization test
        run: flutter test test/onboarding_localization_test.dart

      - name: Capture complete test suite
        shell: bash
        run: |
          set +e
          flutter test > onboarding_full_test.log 2>&1
          echo "$?" > onboarding_full_test_status.txt
          exit 0

      - name: Upload complete test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-full-test-diagnostics
          path: |
            onboarding_full_test.log
            onboarding_full_test_status.txt

      - name: Fail when the suite did not pass
        shell: bash
        run: test "$(cat onboarding_full_test_status.txt)" = "0"
