name: Finalize Italian form names

on:
  push:
    paths:
      - '.github/workflows/finalize-italian-form-names.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply official labels and asset-safe names
        shell: python
        run: |
          from pathlib import Path

          service = Path('lib/services/battle_form_change_service.dart')
          text = service.read_text(encoding='utf-8')

          old = """  static String normalizedChoiceName(Pokemon pokemon, String? formName) {
              final key = canonicalFormKey(pokemon, formName);
              return key == _defaultFormKey(pokemon) ? 'Base' : key;
            }
          """
          new = """  static String normalizedChoiceName(Pokemon pokemon, String? formName) {
              final key = canonicalFormKey(pokemon, formName);
              if (key == _defaultFormKey(pokemon)) return 'Base';
              if (pokemon.name == 'Darmanitan') {
                if (key == 'galarian-standard') return 'galar-standard';
                if (key == 'galarian-zen') return 'galar-zen';
              }
              return key;
            }
          """
          if text.count(old) != 1:
              raise SystemExit('normalizedChoiceName block not found exactly once')
          text = text.replace(old, new, 1)
          text = text.replace(
              "return key == 'noice-face' ? 'Faccia Liquida' : 'Faccia Gelata';",
              "return key == 'noice-face' ? 'Forma Liquefaccia' : 'Forma Gelofaccia';",
          )
          text = text.replace(
              "return key == 'hangry' ? 'Motivo Pancia Vuota' : 'Motivo Panciapiena';",
              "return key == 'hangry' ? 'Motivo Panciavuota' : 'Motivo Panciapiena';",
          )
          text = text.replace(
              "l’abilità Modalità Zen.",
              "l’abilità Stato Zen.",
          )
          service.write_text(text, encoding='utf-8')

          test = Path('test/battle_form_change_service_test.dart')
          test_text = test.read_text(encoding='utf-8')
          anchor = """    expect(
              BattleFormChangeService.canonicalFormKey(
                darmanitan,
                'Forma di Galar · Stato Zen',
              ),
              'galarian-zen',
            );
          """
          addition = anchor + """    expect(
              BattleFormChangeService.normalizedChoiceName(
                darmanitan,
                'Galarian Zen',
              ),
              'galar-zen',
            );
          """
          if test_text.count(anchor) != 1:
              raise SystemExit('Darmanitan test anchor not found exactly once')
          test_text = test_text.replace(anchor, addition, 1)

          zygarde_anchor = """  test(
              'Zygarde uses Forma 50% as base and keeps all three stat profiles',
          """
          official_test = """  test('official Italian labels cover Eiscue and Morpeko forms', () async {
              final pokemon = await PokemonRepository().getAllPokemon();
              final eiscue = pokemon.firstWhere((entry) => entry.id == 875);
              final morpeko = pokemon.firstWhere((entry) => entry.id == 877);

              expect(
                BattleFormChangeService.formLabel(eiscue, 'Ice Face'),
                'Forma Gelofaccia',
              );
              expect(
                BattleFormChangeService.formLabel(eiscue, 'Noice Face'),
                'Forma Liquefaccia',
              );
              expect(
                BattleFormChangeService.formLabel(morpeko, 'Full Belly'),
                'Motivo Panciapiena',
              );
              expect(
                BattleFormChangeService.formLabel(morpeko, 'Hangry'),
                'Motivo Panciavuota',
              );
            });

          """
          if test_text.count(zygarde_anchor) != 1:
              raise SystemExit('Zygarde test anchor not found exactly once')
          test_text = test_text.replace(
              zygarde_anchor,
              official_test + zygarde_anchor,
              1,
          )
          test.write_text(test_text, encoding='utf-8')

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate
        id: checks
        shell: bash
        run: |
          set +e
          log='official-form-names-validation.txt'
          : > "$log"
          {
            dart format \
              lib/services/battle_form_change_service.dart \
              test/battle_form_change_service_test.dart
            flutter pub get
            flutter analyze
            flutter test test/battle_form_change_service_test.dart --reporter expanded
            flutter test test/battle_temporary_hp_service_test.dart --reporter expanded
          } >> "$log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.checks.outputs.status }}'
          rm -f .github/workflows/finalize-italian-form-names.yml
          if [ "$status" = '0' ]; then
            rm -f official-form-names-validation.txt
          else
            mkdir -p docs/diagnostics
            mv official-form-names-validation.txt docs/diagnostics/official-form-names-validation.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Finalizza nomi italiani delle forme (stato $status)"
          git push origin HEAD:main
