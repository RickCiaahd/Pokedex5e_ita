# Rerun marker: non-const narrative text formatters
name: Apply narrative background and inventory cart

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/apply_narrative_background_and_inventory_cart.py
      - .github/workflows/apply-narrative-background-and-inventory-cart.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Apply implementation
        run: python tool/apply_narrative_background_and_inventory_cart.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/models/trainer_starting_equipment.dart \
            lib/repositories/bag_inventory_repository.dart \
            lib/repositories/item_repository.dart \
            lib/services/profile_creation_service.dart \
            lib/screens/onboarding/first_launch_onboarding_screen.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/screens/trainer/trainer_sheet_mobile.dart \
            lib/screens/bag/bag_screen.dart \
            test/trainer_manual_identity_fields_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Targeted tests
        run: |
          flutter test test/trainer_manual_identity_fields_test.dart
          flutter test test/battle_quick_item_service_test.dart

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/build-compact-test-apk.yml \
            lib/models/trainer_starting_equipment.dart \
            lib/repositories/bag_inventory_repository.dart \
            lib/repositories/item_repository.dart \
            lib/services/profile_creation_service.dart \
            lib/screens/onboarding/first_launch_onboarding_screen.dart \
            lib/screens/trainer/trainer_sheet_screen.dart \
            lib/screens/trainer/trainer_sheet_mobile.dart \
            lib/screens/bag/bag_screen.dart \
            test/trainer_manual_identity_fields_test.dart
          git commit -m "Aggiungi background narrativo e carrello dello zaino"
          git push origin HEAD:feature/compact-pokemon-detail-v2
