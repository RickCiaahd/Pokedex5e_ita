name: One-time beta version bump

on:
  push:
    branches:
      - release/1.4.0-beta1
    paths:
      - '.github/workflows/one-time-bump-1.4.0-beta1.yml'

permissions:
  contents: write

jobs:
  bump-version:
    name: Set pubspec version to 1.4.0+9
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.4.0-beta1

      - name: Update pubspec version safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          old = 'version: 1.3.2+8'
          new = 'version: 1.4.0+9'

          if new in text:
              print('pubspec.yaml is already at 1.4.0+9')
          else:
              occurrences = text.count(old)
              if occurrences != 1:
                  raise SystemExit(
                      f'Expected exactly one {old!r}, found {occurrences}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Updated pubspec.yaml to 1.4.0+9')
          PY

      - name: Commit version change
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- pubspec.yaml; then
            echo 'No version change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m 'Aggiorna la versione a 1.4.0+9'
          git push origin HEAD:release/1.4.0-beta1
