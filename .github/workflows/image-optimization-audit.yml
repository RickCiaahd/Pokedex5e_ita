name: Image optimization audit

on:
  pull_request:
    paths:
      - 'assets/textures/textures_webapp/pokemon/**'
      - 'docs/performance/webp-lossless-pilot.*'
      - 'docs/performance/webp-lossless-candidates.csv'
      - 'docs/performance/webp-lossless-conversions.csv'
      - 'docs/performance/webp-lossless-migration.md'
      - 'tooling/audit_pokemon_images.py'
      - 'tooling/repair_unreadable_pokemon_images.py'
      - 'tooling/apply_webp_lossless_pilot.py'
      - 'tooling/manage_webp_lossless_batches.py'
      - 'tooling/stabilize_compliance_asset_inventory.py'
      - '.github/workflows/image-optimization-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/textures/textures_webapp/pokemon/**'
      - 'docs/performance/webp-lossless-pilot.*'
      - 'docs/performance/webp-lossless-candidates.csv'
      - 'docs/performance/webp-lossless-conversions.csv'
      - 'docs/performance/webp-lossless-migration.md'
      - 'tooling/audit_pokemon_images.py'
      - 'tooling/repair_unreadable_pokemon_images.py'
      - 'tooling/apply_webp_lossless_pilot.py'
      - 'tooling/manage_webp_lossless_batches.py'
      - 'tooling/stabilize_compliance_asset_inventory.py'
      - '.github/workflows/image-optimization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-optimization-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Inspect complete Pokémon artwork bundle
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install Pillow==11.3.0

      - name: Set up Flutter for the WebP inventory refresh
        if: github.head_ref == 'feature/webp-lossless-batch-2' || github.ref_name == 'feature/webp-lossless-batch-2'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install Flutter dependencies for the WebP inventory refresh
        if: github.head_ref == 'feature/webp-lossless-batch-2' || github.ref_name == 'feature/webp-lossless-batch-2'
        run: flutter pub get

      - name: Refresh stable compliance inventories
        if: github.head_ref == 'feature/webp-lossless-batch-2' || github.ref_name == 'feature/webp-lossless-batch-2'
        run: |
          python tooling/stabilize_compliance_asset_inventory.py
          python -m py_compile tooling/generate_compliance_reports.py
          python tooling/generate_compliance_reports.py
          python tooling/generate_asset_duplicates.py
          python tooling/generate_compliance_reports.py --check
          python tooling/generate_asset_duplicates.py --check
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check
          python tooling/generate_compliance_reports.py --check
          git diff --check

      - name: Commit stable WebP inventory
        if: github.head_ref == 'feature/webp-lossless-batch-2' || github.ref_name == 'feature/webp-lossless-batch-2'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/generate_compliance_reports.py \
            docs/compliance/dependency-licenses.csv \
            docs/compliance/dependency-licenses.md \
            docs/compliance/asset-manifest.csv \
            docs/compliance/asset-audit-summary.md \
            docs/performance/asset-duplicates.csv
          if git diff --cached --quiet; then
            echo 'WebP inventory is already stable.'
          else
            git commit -m 'Stabilizza l’inventario rispetto agli asset legali generati'
            git push origin HEAD:feature/webp-lossless-batch-2
          fi

      - name: Validate image tools
        run: |
          python -m py_compile \
            tooling/audit_pokemon_images.py \
            tooling/repair_unreadable_pokemon_images.py \
            tooling/apply_webp_lossless_pilot.py \
            tooling/manage_webp_lossless_batches.py
          python tooling/repair_unreadable_pokemon_images.py --self-test
          python tooling/apply_webp_lossless_pilot.py --self-test
          python tooling/manage_webp_lossless_batches.py --self-test

      - name: Require every bundled Pokémon image to be readable
        run: python tooling/repair_unreadable_pokemon_images.py --check-all

      - name: Verify lossless WebP invariants
        run: |
          python tooling/apply_webp_lossless_pilot.py --check
          python tooling/manage_webp_lossless_batches.py --check

      - name: Generate non-destructive optimization audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports/image-optimization-audit
          python tooling/audit_pokemon_images.py \
            --self-test \
            --sample-limit 30 \
            2>&1 | tee build/reports/image-optimization-audit/execution.log

      - name: Verify that no source image changed
        run: git diff --exit-code -- assets/textures/textures_webapp/pokemon

      - name: Upload audit reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Atlas-image-optimization-audit
          path: build/reports/image-optimization-audit/
          if-no-files-found: error
          retention-days: 30
