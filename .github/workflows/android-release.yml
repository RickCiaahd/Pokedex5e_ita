name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  build:
    name: Build, sign and verify APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_trainerAtlasEnableReleaseShrinking: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 non configurato" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "ANDROID_STORE_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD non configurato" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS non configurato" && exit 1)

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Verify compliance reports
        run: python tooling/generate_compliance_reports.py --check

      - name: Prepare embedded GPL and NOTICE
        run: |
          python tooling/prepare_release_legal_assets.py
          python tooling/prepare_release_legal_assets.py --check

      - name: Analyze source
        run: flutter analyze

      - name: Validate application data
        run: flutter test test/data_integrity_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          test -n "$VERSION_NAME"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          echo "full=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist verification/apks verification/extracted-apks
          BASENAME="TrainerAtlas5e-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${BASENAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${BASENAME}.aab"
          cp LICENSE dist/LICENSE
          cp NOTICE.md dist/NOTICE.md

          cat > dist/RELEASE-METADATA.txt <<EOF
          App: Trainer Atlas 5e
          Application ID: io.github.rickciaahd.traineratlas
          Version: ${{ steps.version.outputs.name }}
          Version code: ${{ steps.version.outputs.code }}
          Commit: ${{ github.sha }}
          Release shrinking: enabled (R8 + resource shrinking)
          EOF

      - name: Download pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" version

      - name: Verify AAB signature and certificate
        shell: bash
        env:
          BASENAME: ${{ steps.artifacts.outputs.basename }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          AAB="dist/${BASENAME}.aab"

          keytool -printcert -jarfile "$AAB" > dist/SIGNING-CERTIFICATE.txt
          jarsigner -verify "$AAB" > dist/JARSIGNER-VERIFICATION.txt 2>&1

          KEYSTORE_SHA256=$(
            keytool -list -v \
              -keystore android/upload-keystore.jks \
              -storepass:env ANDROID_STORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print toupper($2); exit}'
          )
          AAB_SHA256=$(
            keytool -printcert -jarfile "$AAB" \
              | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print toupper($2); exit}'
          )

          test -n "$KEYSTORE_SHA256"
          test -n "$AAB_SHA256"
          test "$KEYSTORE_SHA256" = "$AAB_SHA256"

          cat > dist/SIGNING-VERIFICATION.txt <<EOF
          AAB signature verification: passed
          Upload keystore certificate matches AAB certificate: yes
          Certificate SHA-256: $AAB_SHA256
          Alias expected by workflow: configured
          EOF

      - name: Validate AAB metadata and 16 KiB configuration
        shell: bash
        env:
          BASENAME: ${{ steps.artifacts.outputs.basename }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          AAB="dist/${BASENAME}.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle="$AAB" --module=base > dist/BUNDLE-MANIFEST.xml
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config \
            --bundle="$AAB" > dist/BUNDLE-CONFIG.txt

          grep -q 'package="io.github.rickciaahd.traineratlas"' dist/BUNDLE-MANIFEST.xml
          grep -Eq 'targetSdkVersion="36"|targetSdkVersion="0x24"' dist/BUNDLE-MANIFEST.xml
          grep -Fq "versionName=\"$VERSION_NAME\"" dist/BUNDLE-MANIFEST.xml

          VERSION_CODE_HEX=$(printf '%x' "$VERSION_CODE")
          grep -Eq "versionCode=\"$VERSION_CODE\"|versionCode=\"0x${VERSION_CODE_HEX}\"" \
            dist/BUNDLE-MANIFEST.xml
          grep -q 'PAGE_ALIGNMENT_16K' dist/BUNDLE-CONFIG.txt

      - name: Recreate Play delivery and measure download size
        shell: bash
        env:
          BASENAME: ${{ steps.artifacts.outputs.basename }}
        run: |
          set -euo pipefail
          AAB="dist/${BASENAME}.aab"
          cat > verification/device-spec-api36-arm64.json <<'EOF'
          {
            "supportedAbis": ["arm64-v8a"],
            "supportedLocales": ["it", "en"],
            "screenDensity": 420,
            "sdkVersion": 36
          }
          EOF

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$AAB" \
            --output=verification/apks/api36-arm64.apks \
            --device-spec=verification/device-spec-api36-arm64.json \
            --ks=android/upload-keystore.jks \
            --ks-pass=pass:"$ANDROID_STORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD" \
            --overwrite

          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total \
            --apks=verification/apks/api36-arm64.apks \
            --device-spec=verification/device-spec-api36-arm64.json \
            > dist/BUNDLETOOL-DEVICE-SIZE.txt

      - name: Verify 16 KiB ZIP alignment of delivered APKs
        shell: bash
        run: |
          set -euo pipefail
          unzip -q verification/apks/api36-arm64.apks -d verification/extracted-apks
          ZIPALIGN_PATH=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -x "$ZIPALIGN_PATH"
          while IFS= read -r APK; do
            "$ZIPALIGN_PATH" -c -P 16 -v 4 "$APK"
          done < <(find verification/extracted-apks -type f -name '*.apk' | sort)
          echo 'All delivered APKs passed zipalign -P 16.' > dist/ZIPALIGN-16K-VERIFICATION.txt

      - name: Write verification summary and checksums
        shell: bash
        env:
          BASENAME: ${{ steps.artifacts.outputs.basename }}
        run: |
          set -euo pipefail
          APK_BYTES=$(stat -c '%s' "dist/${BASENAME}.apk")
          AAB_BYTES=$(stat -c '%s' "dist/${BASENAME}.aab")
          DEVICE_SIZE=$(tr '\n' ' ' < dist/BUNDLETOOL-DEVICE-SIZE.txt | sed 's/[[:space:]]\+$//')

          cat > dist/ANDROID-VERIFICATION.txt <<EOF
          bundletool version: $BUNDLETOOL_VERSION
          Bundle validation: passed
          Application ID: io.github.rickciaahd.traineratlas
          Version: ${{ steps.version.outputs.name }}
          Version code: ${{ steps.version.outputs.code }}
          Target SDK: 36
          Bundle page alignment: PAGE_ALIGNMENT_16K
          Delivered APK ZIP alignment: passed with zipalign -P 16
          APK bytes: $APK_BYTES
          AAB bytes: $AAB_BYTES
          bundletool API 36 arm64 device size: $DEVICE_SIZE
          AAB certificate matches upload keystore: yes
          EOF

          find dist -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS.txt
          cat dist/ANDROID-VERIFICATION.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrainerAtlas5e-Android-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f android/upload-keystore.jks android/key.properties
