name: Apply localization foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/app-localization-foundation-run.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/app-localization-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/app-localization-foundation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply prepared patch
        shell: bash
        run: |
          set +e
          python3 <<'PY' > /tmp/localization-foundation.log 2>&1
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/app-localization-foundation-patch.yml')
          text = workflow.read_text(encoding='utf-8')
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          start = text.index(marker_start) + len(marker_start)
          end = text.index(marker_end, start)
          raw_lines = text[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_lines
          ) + '\n'

          old = """if old_tour not in home_text:
    raise SystemExit('Blocco tour Home non trovato')
home_text = home_text.replace(old_tour, new_tour, 1)
"""
          new = """tour_start = home_text.index(
    '  List<HomeTourStepData> get _tourSteps'
)
tour_end = home_text.index('\n\n  @override', tour_start)
home_text = (
    home_text[:tour_start]
    + new_tour.rstrip()
    + home_text[tour_end:]
)
"""
          if old not in script:
              raise SystemExit('Sezione di patch del tour non trovata nello script')
          script = script.replace(old, new, 1)

          patch = Path('/tmp/apply_localization_foundation.py')
          patch.write_text(script, encoding='utf-8')
          subprocess.run(['python3', str(patch)], check=True)
          PY
          status=$?
          cat /tmp/localization-foundation.log
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/localization-foundation.log diagnostics/localization-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/localization-patch-error.txt
            git commit -m "Registra l'errore della base bilingue" || true
            git push origin HEAD:feature/app-localization-foundation
            exit "$status"
          fi
          rm -f .github/workflows/app-localization-foundation-patch.yml
          rm -f .github/workflows/app-localization-foundation-run.yml

      - name: Resolve dependencies and generate localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/app.dart \
            lib/main.dart \
            lib/localization/app_locale_controller.dart \
            lib/services/app_locale_service.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/home/home_screen.dart \
            lib/widgets/tour/professor_tour_panel.dart \
            lib/l10n/app_localizations.dart \
            lib/l10n/app_localizations_en.dart \
            lib/l10n/app_localizations_it.dart \
            test/app_locale_controller_test.dart \
            test/localization_assets_test.dart \
            test/android_release_config_test.dart

      - name: Validate localization foundation
        run: |
          flutter analyze
          flutter test test/app_locale_controller_test.dart
          flutter test test/localization_assets_test.dart
          flutter test test/android_release_config_test.dart

      - name: Commit generated foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Introduce la base bilingue di Trainer Atlas 5e"
          git push origin HEAD:feature/app-localization-foundation
