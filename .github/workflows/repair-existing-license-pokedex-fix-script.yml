name: Repair existing license pokedex fix script

on:
  push:
    branches:
      - feature/compact-pokemon-detail-v2
    paths:
      - tool/repair_existing_license_pokedex_fix_script.py
      - .github/workflows/repair-existing-license-pokedex-fix-script.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-pokemon-detail-v2
          fetch-depth: 0
      - run: python tool/repair_existing_license_pokedex_fix_script.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/fix_existing_license_pokedex_and_discard.py
          git commit -m "Correggi il test nello script Licenza e Pokédex"
          git push origin HEAD:feature/compact-pokemon-detail-v2
