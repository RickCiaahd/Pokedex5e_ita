name: Temporary form-aware Pokédex validator

on:
  push:
    branches:
      - 'feat/form-aware-pokedex-v2'
    paths:
      - 'tool/run_form_pokedex_validation.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/form-aware-pokedex-v2

      - name: Apply migrations
        run: |
          set +e
          python3 tool/apply_form_pokedex_screen.py > /tmp/screen.log 2>&1
          screen_status=$?
          python3 tool/apply_form_pokedex_followups.py > /tmp/followups.log 2>&1
          followups_status=$?
          cat /tmp/screen.log
          cat /tmp/followups.log
          if [ "$screen_status" -ne 0 ] || [ "$followups_status" -ne 0 ]; then
            {
              echo 'SCREEN MIGRATION:'
              cat /tmp/screen.log
              echo
              echo 'FOLLOW-UP MIGRATION:'
              cat /tmp/followups.log
            } > tool/form_pokedex_migration_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tool/form_pokedex_migration_error.txt
            git commit -m "Record Pokédex migration failure"
            git push origin feat/form-aware-pokedex-v2
            exit 1
          fi
          rm tool/apply_form_pokedex_screen.py
          rm tool/apply_form_pokedex_followups.py
          rm tool/run_form_pokedex_validation.txt
          rm -f .github/workflows/validate-form-aware-pokedex.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: |
          dart format \
            lib/models/pokedex_entry.dart \
            lib/repositories/pokedex_repositry.dart \
            lib/repositories/team_repository.dart \
            lib/repositories/pokemon_pc_repository.dart \
            lib/screens/capture/capture_pokemon_screen.dart \
            lib/screens/pokedex/pokedex_screen.dart \
            lib/widgets/pokedex/pokemon_summary_dialog.dart \
            lib/widgets/pokedex/pokemon_tile.dart \
            test/pokedex_form_entry_test.dart

      - name: Check diff
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: |
          flutter test test/pokedex_form_entry_test.dart
          flutter test test/pokemon_asset_paths_test.dart

      - name: Full test suite
        run: flutter test

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement form-aware automatic Pokédex tracking"
          git push origin feat/form-aware-pokedex-v2
